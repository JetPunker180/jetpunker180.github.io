    <script data-scope="mobile-nav" id="ifz1ty">
      (function() {
        const toggleBtn = document.querySelector('[data-js="hamburger"]');
        const nav = document.getElementById('i32qq');
        if (!toggleBtn || !nav) return;

        function toggleMenu() {
          const isOpen = nav.classList.toggle('open');
          toggleBtn.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
        }
        toggleBtn.addEventListener('click', toggleMenu);
        // Close menu when clicking outside on mobile
        document.addEventListener('click', (e) => {
          const withinHeader = e.target.closest('#is0gk');
          if (!withinHeader && nav.classList.contains('open')) {
            nav.classList.remove('open');
            toggleBtn.setAttribute('aria-expanded', 'false');
          }
        });
        // Close on Esc
        document.addEventListener('keydown', (e) => {
          if (e.key === 'Escape' && nav.classList.contains('open')) {
            nav.classList.remove('open');
            toggleBtn.setAttribute('aria-expanded', 'false');
            toggleBtn.focus();
          }
        });
      })();
    </script>
    <script data-scope="mobile-images" id="itb5y5">
      (function() {
        const imgs = document.querySelectorAll('img[data-mobile-src]');
        if (!imgs.length) return;

        function swapForViewport() {
          const isMobile = window.matchMedia('(max-width: 480px)').matches;
          imgs.forEach(img => {
            const desktop = img.getAttribute('data-desktop-src');
            const mobile = img.getAttribute('data-mobile-src');
            if (!desktop || !mobile) return;
            // Keep desktop unchanged; swap only on mobile
            const current = img.getAttribute('src') || '';
            if (isMobile) {
              if (current !== mobile) img.setAttribute('src', mobile);
              // Ensure below-the-fold images stay lazy on mobile
              if (!img.hasAttribute('loading')) img.setAttribute('loading', 'lazy');
            } else {
              if (current !== desktop) img.setAttribute('src', desktop);
              // Restore fetchpriority for hero if present
              if (img.id === 'izhe1') {
                img.setAttribute('fetchpriority', 'high');
                img.removeAttribute('loading');
              }
            }
          });
        }
        // Initialize and update on resize
        swapForViewport();
        let rAF;
        window.addEventListener('resize', () => {
          cancelAnimationFrame(rAF);
          rAF = requestAnimationFrame(swapForViewport);
        });
      })();
    </script>
