    description: "Practice analogy: Nadir and zenith are opposites (lowest/highest). Similarly, base and apex are opposites. Options: Base:Apex, Bottom:Summit, Minimum:Maximum, Trough:Peak. Correct: Base:Apex. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/analogies/mcq33:
    title: "Analogies | Alchemy : Chemistry - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice analogy: Alchemy is the predecessor of chemistry. Similarly, astrology is predecessor of astronomy. Options: Astrology:Astronomy, Mythology:History, Philosophy:Science, Magic:Physics. Correct: Astrology:Astronomy. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/analogies/mcq34:
    title: "Analogies | Vanguard : Forefront - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice analogy: Vanguard and forefront are synonyms (leading position). Similarly, rearguard and back are synonyms (trailing position). Options: Rearguard:Back, Pioneer:Trailblazer, Harbinger:Precursor, Leader:Follower. Correct: Rearguard:Back. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/analogies/mcq35:
    title: "Analogies | Eclipse : Obscure - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice analogy: Eclipse means to obscure light. Similarly, occlude means to block passage. Options: Occlude:Block, Veil:Conceal, Shroud:Cover, Mask:Disguise. Correct: Occlude:Block. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/analogies/mcq36:
    title: "Analogies | Tonic : Invigorate - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice analogy: Tonic invigorates the body. Similarly, sedative calms the nerves. Options: Sedative:Calm, Stimulant:Energize, Anodyne:Soothe, Placebo:Pacify. Correct: Sedative:Calm. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/analogies/mcq37:
    title: "Analogies | Rust : Corrode - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice analogy: Rust causes corrosion. Similarly, tarnish causes discoloration. Options: Mold:Decay, Tarnish:Discolor, Erode:Wear, Oxidize:React. Correct: Tarnish:Discolor. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/analogies/mcq38:
    title: "Analogies | Epoch : Era - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice analogy: Epoch and era are time periods (synonyms). Similarly, eon and age are time periods (synonyms). Options: Moment:Instant, Decade:Century, Eon:Age, Period:Phase. Correct: Eon:Age. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/analogies/mcq39:
    title: "Analogies | Metamorphosis : Change - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice analogy: Metamorphosis is a dramatic change (synonym). Similarly, transformation is a marked alteration (synonym). Options: Transformation:Alteration, Mutation:Variation, Evolution:Development, Adaptation:Adjustment. Correct: Transformation:Alteration. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/analogies/mcq40:
    title: "Analogies | Confluence : Rivers - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice analogy: Confluence is where rivers meet. Similarly, junction is where roads meet. Options: Junction:Roads, Intersection:Paths, Convergence:Lines, Meeting:Points. Correct: Junction:Roads. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/analogies/mcq41:
    title: "Analogies | Sphinx : Riddle - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice analogy: Sphinx is known for its riddle. Similarly, oracle is known for prophecy. Options: Oracle:Prophecy, Prophet:Prediction, Mystic:Secret, Seer:Vision. Correct: Oracle:Prophecy. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/analogies/mcq42:
    title: "Analogies | Flora : Plants - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice analogy: Flora refers to plants. Similarly, fauna refers to animals. Options: Fauna:Animals, Biota:Life, Vegetation:Growth, Wildlife:Creatures. Correct: Fauna:Animals. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/analogies/mcq43:
    title: "Analogies | Recluse : Solitude - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice analogy: Recluse seeks solitude. Similarly, hermit seeks seclusion. Options: Misanthropist:Company, Ascetic:Luxury, Hermit:Seclusion, Eremite:Society. Correct: Hermit:Seclusion. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/analogies/mcq44:
    title: "Analogies | Crescendo : Volume - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice analogy: Crescendo means increasing volume. Similarly, accelerando means increasing speed. Options: Accelerando:Speed, Decrescendo:Loudness, Ritardando:Tempo, Diminuendo:Intensity. Correct: Accelerando:Speed. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/analogies/mcq45:
    title: "Analogies | Lucid : Confusing - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice analogy: Lucid means clear (antonym of confusing). Similarly, ambiguous means unclear (antonym of clear). Options: Ambiguous:Clear, Obscure:Evident, Vague:Distinct, Murky:Transparent. Correct: Ambiguous:Clear. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/analogies/mcq46:
    title: "Analogies | Mentor : Guidance - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice analogy: Mentor provides guidance. Similarly, coach provides training. Options: Coach:Training, Tutor:Instruction, Counselor:Advice, Teacher:Education. Correct: Coach:Training. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/analogies/mcq47:
    title: "Analogies | Iridescent : Color - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice analogy: Iridescent shows shifting colors. Similarly, resonant produces echoing sound. Options: Resonant:Sound, Aromatic:Smell, Tactile:Touch, Savory:Taste. Correct: Resonant:Sound. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/analogies/mcq48:
    title: "Analogies | Pilgrimage : Journey - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice analogy: Pilgrimage is a religious journey (type of). Similarly, expedition is an exploratory journey (type of). Options: Expedition:Exploration, Safari:Adventure, Voyage:Travel, Quest:Search. Correct: Expedition:Exploration. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/analogies/mcq49:
    title: "Analogies | Juggernaut : Unstoppable - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice analogy: Juggernaut is unstoppable force. Similarly, colossus is a giant being. Options: Colossus:Giant, Behemoth:Massive, Leviathan:Enormous, Titan:Powerful. Correct: Colossus:Giant. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/analogies/mcq50:
    title: "Analogies | Cynosure : Attention - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice analogy: Cynosure attracts attention. Similarly, center attracts focus. Options: Center:Focus, Epicenter:Activity, Hub:Interest, Nucleus:Concentration. Correct: Center:Focus. More entry test MCQs at NotesPrep."
https://notesprep.com/entry-tests/mcqs/analytic-geometry/mcq1:
    title: "Analytic Geometry | Homogeneous equation of degree two has parallel lines only, when - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice analytic geometry MCQ: Homogeneous equation of degree two has parallel lines only when a = -b and h² - ab = 0. Options: a = -b, h² - ab = 0; a = -b, h² - ab ≠ 0; a = b, h² - ab ≠ 0; a ≠ b, h² - ab = 0. Correct: a = -b, h² - ab = 0. Explanation: For parallel lines, θ = 0 so tanθ = 0 ⇒ √(h² - ab) = 0 ⇒ h² - ab = 0. Also a + b = 0 i.e., a = -b. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/analytic-geometry/mcq2:
    title: "Analytic Geometry | The slope of a line is 2, then slope of line perpendicular to this line is - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice analytic geometry MCQ: The slope of a line is 2, then slope of line perpendicular to this line is -1/2. Options: -2, -1/2, 2, 0. Correct: -1/2. Explanation: If two lines are perpendicular, product of their slopes is -1. Given m₁ = 2, then m₂ = -1/m₁ = -1/2. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/analytic-geometry/mcq3:
    title: "Analytic Geometry | Which pair of lines have a single point of intersection - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice analytic geometry MCQ: Which pair of lines have a single point of intersection? Options: x + y = 1, 2x + 2y = 2; x + y = 1, x + y = 0; x + y = 1, x - y = 0; None of the above. Correct: x + y = 1, x - y = 0. Explanation: Lines in (a) are coincident, in (b) are parallel, in (c) are perpendicular and intersect at (1/2, 1/2). More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/analytic-geometry/mcq4:
    title: "Analytic Geometry | The line ax + by + c = 0 will be vertical when - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice analytic geometry MCQ: The line ax + by + c = 0 will be vertical when? Options: b = 0; a = 0; a ≠ 0, b = 0; a ≠ 0, b ≠ 0. Correct: a ≠ 0, b = 0. Explanation: If a ≠ 0 and b = 0, equation reduces to ax + c = 0 ⇒ x = -c/a, which represents a vertical line. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/analytic-geometry/mcq5:
    title: "Analytic Geometry | Shortest distance of line ax + by + c = 0 from origin - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice analytic geometry MCQ: The shortest distance of the line ax + by + c = 0 from the origin is? Options: |ax₁ + by₁ + c|/√(a²+b²); |ax + by + c|/√(a²+b²); |c|/√(a²+b²); √(a²+b²). Correct: |c|/√(a²+b²). Explanation: Distance from origin (0,0) to line ax + by + c = 0 is |a(0)+b(0)+c|/√(a²+b²) = |c|/√(a²+b²). More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/analytic-geometry/mcq6:
    title: "Analytic Geometry | Equation of line parallel to negative y-axis at distance b units left - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice analytic geometry MCQ: Equation of line parallel to negative y-axis at distance b units to the left of y-axis is? Options: x = b; x = -b; y + b = 0; y = -b. Correct: x = -b. Explanation: A line parallel to y-axis is x = constant. To the left of y-axis means negative x-direction, so x = -b. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/analytic-geometry/mcq7:
    title: "Analytic Geometry | Point P(x₁,y₁) lies above line ax + by + c = 0 when - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice analytic geometry MCQ: The point P(x₁,y₁) lies above the line ax + by + c = 0 if? Options: ax₁+by₁+c > 0, b > 0; ax₁+by₁+c < 0, b > 0; ax₁+by₁+c > 0, b < 0; ax₁+by₁+c < 0, b > 0. Correct: ax₁+by₁+c > 0, b > 0. Explanation: For a line with b > 0, points above the line satisfy ax + by + c > 0. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/analytic-geometry/mcq8:
    title: "Analytic Geometry | Angle of tangent line x - y = 0 to curve y = f(x) - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice analytic geometry MCQ: The angle of the tangent line x - y = 0 to a curve y = f(x) is? Options: 30°, 45°, 60°, 0°. Correct: 45°. Explanation: The line is x - y = 0 ⇒ y = x. Slope m = 1, so tanθ = 1 ⇒ θ = 45°. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/analytic-geometry/mcq9:
    title: "Analytic Geometry | Equation of line parallel to x - 5y = 0 through point (1,2) - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice analytic geometry MCQ: Find equation of line parallel to x - 5y = 0 through point (1,2). Options: x - 5y + 9 = 0; x - 5y - 9 = 0; 5x - y - 3 = 0; x + 5y - 11 = 0. Correct: x - 5y + 9 = 0. Explanation: Line x - 5y = 0 has slope 1/5. Parallel line through (1,2): y - 2 = (1/5)(x - 1) ⇒ x - 5y + 9 = 0. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/analytic-geometry/mcq10:
    title: "Analytic Geometry | If α is inclination of line with positive x-axis, slope of line is - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice analytic geometry MCQ: If α is inclination of line with positive x-axis, slope of line is? Options: sin α; tan α; cos α; None of these. Correct: tan α. Explanation: The slope of a line is defined as tan of its inclination angle: m = tan α. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/analytic-geometry/mcq11:
    title: "Analytic Geometry | Lines with slopes m₁ and m₂ are perpendicular if - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice analytic geometry MCQ: If slope of AB is m₁ and slope of CD is m₂, they would be perpendicular if? Options: 1 - m₁m₂ = 0; 1 + m₁m₂ = 0; m₁m₂ = 1; 1 + m₁/m₂ = 0. Correct: 1 + m₁m₂ = 0. Explanation: Two lines are perpendicular if m₁m₂ = -1, equivalent to 1 + m₁m₂ = 0. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/analytic-geometry/mcq12:
    title: "Analytic Geometry | Find a and b for parallelogram vertices (1,2), (4,6), (8,5), (a,b) - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice analytic geometry MCQ: Points (1,2), (4,6), (8,5), (a,b) represent vertices of a parallelogram. Find a and b. Options: (2,3); (3,2); (5,1); (1,5). Correct: (5,1). Explanation: Diagonals bisect each other. Midpoint of AC = (4.5,3.5). Equate with midpoint of BD: (4+a)/2 = 4.5 ⇒ a=5; (6+b)/2=3.5 ⇒ b=1. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/analytic-geometry/mcq13:
    title: "Analytic Geometry | Distance between points (2,-2) and (2,3) - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice analytic geometry MCQ: Find distance between points (2,-2) and (2,3). Options: 1, 5, -1, 2. Correct: 5. Explanation: Distance = √[(2-2)² + (3-(-2))²] = √(0+25) = 5. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/analytic-geometry/mcq14:
    title: "Analytic Geometry | Which point lies on line 3x - 4y = 11 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice analytic geometry MCQ: Which point lies on line 3x - 4y = 11? Options: (2,-1); (3,5); (5,1); None of these. Correct: (5,1). Explanation: Substitute (5,1): 3(5) - 4(1) = 15 - 4 = 11, so it lies on the line. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/analytic-geometry/mcq15:
    title: "Analytic Geometry | Homogeneous second-degree equation represents distinct lines through origin if - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice analytic geometry MCQ: Every homogenous second-degree equation ax² + 2hxy + by² = 0 represents distinct lines through origin if? Options: a + b = 0; h² < ab; h² > ab; h² = ab. Correct: h² > ab. Explanation: For distinct lines through origin, h² > ab. If h² = ab, lines are coincident; if h² < ab, lines are imaginary. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/analytic-geometry/mcq16:
    title: "Analytic Geometry | Slope of line with one point on negative x-axis and one on negative y-axis - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice analytic geometry MCQ: Which can represent slope of a line whose one point lies on negative x-axis and one on negative y-axis? Options: y/x; -y/x; x/y; -x/y. Correct: -y/x. Explanation: Points on negative axes give negative slope. Slope = -y/x. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/analytic-geometry/mcq17:
    title: "Analytic Geometry | Midpoint of line segment from (-10,4) to (7,-5) - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice analytic geometry MCQ: Coordinates of midpoint of line segment with endpoints (-10,4) and (7,-5) are? Options: (4,-1/2); (-3/2,-1/2); (3,2); (3/2,1/2). Correct: (-3/2,-1/2). Explanation: Midpoint = [(-10+7)/2, (4+(-5))/2] = (-3/2, -1/2). More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/analytic-geometry/mcq18:
    title: "Analytic Geometry | First component of ordered pair (x,y) is called - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice analytic geometry MCQ: If (x,y) are coordinates of point P, first component of ordered pair is called? Options: Abscissa; y-coordinate; Ordinate; xy-coordinate. Correct: Abscissa. Explanation: In ordered pair (x,y), x is abscissa and y is ordinate. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/analytic-geometry/mcq19:
    title: "Analytic Geometry | Distance |P₁P₂| when x₁=7, x₂=-9 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice analytic geometry MCQ: If points P₁ and P₂ have coordinates x₁=7, x₂=-9, then |P₁P₂| = ? Options: -2, 16, 2, -16. Correct: 16. Explanation: Distance = |x₂ - x₁| = |-9 - 7| = |-16| = 16. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/analytic-geometry/mcq20:
    title: "Analytic Geometry | Two lines with slopes m₁ and m₂ are parallel if - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice analytic geometry MCQ: Two lines with slope m₁ and m₂ are parallel if? Options: m₁ + m₂ = 0; m₁ - m₂ = 0; m₁m₂ = 1; m₁ = m₂. Correct: m₁ - m₂ = 0. Explanation: Two lines are parallel if slopes are equal, i.e., m₁ = m₂ or m₁ - m₂ = 0. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/analytic-geometry/mcq21:
    title: "Analytic Geometry | Distance of point (-2,8) from line 4x + 3y - 11 = 0 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice analytic geometry MCQ: Distance of point (-2,8) from line 4x + 3y - 11 = 0 is? Options: -6, 1, 3, 5. Correct: 1. Explanation: Distance = |4(-2)+3(8)-11|/√(4²+3²) = |-8+24-11|/5 = |5|/5 = 1. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/analytic-geometry/mcq22:
    title: "Analytic Geometry | Angle from line L₁ to L₂ with slopes m₁ and m₂ - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice analytic geometry MCQ: If m₁ and m₂ are slopes of lines L₁ and L₂, angle from L₁ to L₂ is given by? Options: tanθ = (m₂-m₁)/(1+m₁m₂); tanθ = (m₂+m₁)/(1-m₁m₂); cotθ = (m₂-m₁)/(1+m₁m₂); cotθ = (m₂+m₁)/(1-m₁m₂). Correct: tanθ = (m₂-m₁)/(1+m₁m₂). Explanation: Formula for angle between two lines is tanθ = |(m₂-m₁)/(1+m₁m₂)|. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/analytic-geometry/mcq23:
    title: "Analytic Geometry | Condition for three non-parallel lines to be concurrent - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice analytic geometry MCQ: Three non-parallel lines a₁x+b₁y+c₁=0, a₂x+b₂y+c₂=0, a₃x+b₃y+c₃=0 are concurrent if? Options: Determinant of coefficient matrix is 0; Determinant is 1; Determinant is -1; Determinant is 2. Correct: Determinant of coefficient matrix is 0. Explanation: Three lines are concurrent if determinant of coefficient matrix = 0. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/analytic-geometry/mcq24:
    title: "Analytic Geometry | Lines represented by ax² + 2hxy + by² = 0 are perpendicular if - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice analytic geometry MCQ: Straight lines represented by ax² + 2hxy + by² = 0 are perpendicular if? Options: h² = ab; ab < h²; h² < ab; a + b = 0. Correct: a + b = 0. Explanation: For perpendicular lines, θ = 90°, which occurs when a + b = 0 (denominator zero, tanθ → ∞). More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/analytic-geometry/mcq25:
    title: "Analytic Geometry | Joint equation of lines through origin perpendicular to 5x² + 2xy - 3y² = 0 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice analytic geometry MCQ: Joint equation of pair of lines through origin perpendicular to lines 5x² + 2xy - 3y² = 0 is? Options: 3x²+2xy-5y²=0; 3x²-2xy+5y²=0; -3x²-2xy+5y²=0; None. Correct: 3x²+2xy-5y²=0. Explanation: For perpendicular lines through origin: bx² - 2hxy + ay² = 0. Here a=5, h=1, b=-3. Substituting: -3x²-2xy+5y²=0. Multiply by -1: 3x²+2xy-5y²=0. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/analytic-geometry/mcq26:
    title: "Analytic Geometry | Joint equation of lines through origin perpendicular to x² + xy - y² = 0 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice analytic geometry MCQ: Joint equation of pair of lines through origin perpendicular to x² + xy - y² = 0 is? Options: x²+xy-y²=0; x²-xy-y²=0; x²+xy+y²=0; -x²+xy+y²=0. Correct: x²+xy-y²=0. Explanation: Given a=1, h=1/2, b=-1. Perpendicular pair: bx²-2hxy+ay² = -x²-xy+y²=0. Multiply by -1: x²+xy-y²=0. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/analytic-geometry/mcq27:
    title: "Analytic Geometry | Lines 3x² + 7xy - 3y² = 0 are - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice analytic geometry MCQ: The lines represented by 3x² + 7xy - 3y² = 0 are? Options: Parallel; Perpendicular; Coincident; None. Correct: Perpendicular. Explanation: For perpendicular lines, a + b = 0. Here a=3, b=-3, so 3 + (-3) = 0. Therefore lines are perpendicular. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/analytic-geometry/mcq28:
    title: "Analytic Geometry | Find k if kx² - 4xy - 5y² = 0 represents perpendicular lines - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice analytic geometry MCQ: If lines represented by kx² - 4xy - 5y² = 0 are perpendicular, then k = ? Options: 4, -4, 5, -5. Correct: 5. Explanation: For perpendicular lines, a + b = 0. Here a=k, b=-5, so k + (-5) = 0 ⇒ k = 5. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/analytic-geometry/mcq29:
    title: "Analytic Geometry | Four quarter circles in a square of side 2 units - shaded area - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice analytic geometry MCQ: Four quarter circles drawn in square of side 2 units. Find area inside square but outside four quarter circles. Options: 4 - π; 4 - 2π; π - 4; 2π - 4. Correct: 4 - π. Explanation: Square area = 2² = 4. Four quarter circles make one full circle of radius 1, area = π. Shaded area = 4 - π. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/analytic-geometry/mcq30:
    title: "Analytic Geometry | Shaded area between outer square (x+y)² and inner curve x² + y² - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice analytic geometry MCQ: Area of shaded region between outer square side (x+y) and inner curve x² + y² is? Options: (x+y)² - (x²+y²); (x+y)² + (x²+y²); (x²+y²) - (x+y)²; 2xy. Correct: (x+y)² - (x²+y²). Explanation: Shaded area is difference between outer and inner regions: (x+y)² - (x²+y²). More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/analytic-geometry/mcq31:
    title: "Analytic Geometry | Equilateral triangle inner to outer area ratio 1:4 with side 1 - shaded area - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice analytic geometry MCQ: For equilateral triangle, ratio of inner to outer area is 1:4, outer side = 1. Find shaded area. Options: √3/4; √3/2; 3√3/16; 3√3/8. Correct: 3√3/16. Explanation: Outer triangle area = √3/4. Inner area = 1/4 × √3/4 = √3/16. Shaded = √3/4 - √3/16 = 4√3/16 - √3/16 = 3√3/16. More entry test MCQs at NotesPrep."
    https://notesprep.com/entry-tests/mcqs/circular-motion/mcq1:
    title: "Circular Motion | A car taking a turn on level road may be thrown outwards because of - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice circular motion MCQ: A car taking a turn on level road may be thrown outwards because of? Options: weight, lack of centripetal force, reaction of ground, frictional force. Correct: lack of centripetal force. Explanation: For a car to take a turn, centripetal force is required. If frictional force is insufficient, car cannot maintain circular path and is thrown outwards due to inertia. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/circular-motion/mcq2:
    title: "Circular Motion | Work done by centripetal force in moving through half circular path - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice circular motion MCQ: A body of mass m moving with velocity v in uniform circular motion. Work done by centripetal force in moving through half circular path is? Options: mv²/r × πr, mv²/r + πr, zero, mv²/r × πr. Correct: zero. Explanation: Centripetal force is always perpendicular to displacement (θ=90°, cos90°=0), so work done is zero for any part of circular path. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/circular-motion/mcq3:
    title: "Circular Motion | Which statement is correct about uniform circular motion - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice circular motion MCQ: In uniform circular motion? Options: Both velocity and acceleration constant; Acceleration and speed constant but velocity changes; Both acceleration and velocity change; Both decrease and speed constant. Correct: Acceleration and speed constant but velocity changes. Explanation: Speed constant, velocity changes due to continuous direction change. Acceleration magnitude constant but direction changes. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/circular-motion/mcq4:
    title: "Circular Motion | Why is uniform circular motion accelerated motion - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice circular motion MCQ: Uniform circular motion is accelerated motion because? Options: Motion accelerates due to change in velocity; due to change in angular velocity; due to change in speed; due to change in direction. Correct: due to change in direction. Explanation: Direction of velocity changes continuously even though speed constant. Acceleration is rate of change of velocity, and direction change constitutes velocity change. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/circular-motion/mcq5:
    title: "Circular Motion | Why cyclist bends while negotiating curve but car does not - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice circular motion MCQ: Cyclist bends inwards while negotiating curve, car does not need to bend because? Options: Car heavier than cycle; Cyclist counteracts centrifugal force; Cycle has two wheels while car has four; Cycle moves slower than car. Correct: Cyclist counteracts centrifugal force which throws passengers in car outwards. Explanation: Cyclist bends inward to provide centripetal force by tilting. Car friction provides centripetal force so bending not required. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/circular-motion/mcq6:
    title: "Circular Motion | Torque produced by centripetal force in circle - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice circular motion MCQ: Torque produced by centripetal force Fc in circle of radius r is? Options: Fc = mv²/r, Fc = mv²/r + πr, zero, None. Correct: zero. Explanation: Torque τ = r × F. Centripetal force acts radially inward, position vector and force vector are along same line, so cross product = 0. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/circular-motion/mcq7:
    title: "Circular Motion | Angle between radius vector and centripetal acceleration - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice circular motion MCQ: Angle between radius vector and centripetal acceleration is? Options: π/2 rad, 3π/2 rad, 2π rad, π rad. Correct: π rad. Explanation: Centripetal acceleration is directed radially inward. Radius vector points from center to particle. These directions are opposite, so angle is π rad (180°). More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/circular-motion/mcq8:
    title: "Circular Motion | Angular displacement in circular motion is which type of quantity - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice circular motion MCQ: Angular displacement in circular motion is? Options: Dimensional quantity; Dimensionless quantity; Unitless and dimensionless; Unitless quantity. Correct: Unitless quantity and dimensionless quantity. Explanation: Radians are dimensionless (ratio of arc length to radius) and also unitless as radian is derived unit with no fundamental dimensions. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/circular-motion/mcq9:
    title: "Circular Motion | Number of revolutions in 3π radians - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice circular motion MCQ: Number of revolutions in 3π radians is? Options: 2, 3, 3/2, 1/2. Correct: 3/2. Explanation: One revolution = 2π radians. Number of revolutions = 3π/2π = 3/2 = 1.5 revolutions. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/circular-motion/mcq10:
    title: "Circular Motion | Average acceleration when particle completes half revolution - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice circular motion MCQ: Particle moving along circular path radius 5m, uniform speed 5m/s. Average acceleration when particle completes half revolution? Options: 10π, 5/π, 10/π, Zero. Correct: 10/π. Explanation: Change in velocity = 2v = 10 m/s. Time = πR/v = π seconds. Average acceleration = 10/π m/s². More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/circular-motion/mcq11:
    title: "Circular Motion | When speed is doubled centripetal force becomes - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice circular motion MCQ: When speed is doubled, centripetal force will be? Options: Same, Doubled, Tripled, Quadrupled. Correct: Quadrupled. Explanation: F = mv²/r. If v → 2v, then F' = m(2v)²/r = 4mv²/r = 4F. Force becomes quadrupled. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/circular-motion/mcq12:
    title: "Circular Motion | Linear speed of bicycle wheel rolling without slipping - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice circular motion MCQ: Bicycle wheel radius 0.70m, angular speed 6.3 rad/s rolling on horizontal surface without slipping. Linear speed of wheel? Options: 1.4 m/s, 0.11 m/s, 28 m/s, 4.4 m/s. Correct: 4.4 m/s. Explanation: For rolling without slipping, v = ωR = 6.3 × 0.70 = 4.41 m/s ≈ 4.4 m/s. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/circular-motion/mcq13:
    title: "Circular Motion | Tension in string when body moving in vertical circle is horizontal - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice circular motion MCQ: Body weight 20N, mass 2kg moving in vertical circular motion with string radius 1m, velocity 5m/s. Tension when string is horizontal? Options: 30N, 50N, 20N, 25N. Correct: 50N. Explanation: At horizontal position, weight acts vertically downward. Centripetal force = mv²/r = 2×25/1 = 50N. Weight does not contribute, so tension = 50N. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/circular-motion/mcq14:
    title: "Circular Motion | At which position is tension minimum in vertical circular motion - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice circular motion MCQ: At which position in vertical circular motion is tension in string minimum? Options: Highest position; Lowest position; When string horizontal; At 35° from horizontal. Correct: Highest position. Explanation: At highest point: T = mv²/r - mg (minimum). At lowest point: T = mv²/r + mg (maximum). More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/circular-motion/mcq15:
    title: "Circular Motion | Frequency of body moving with angular velocity 1 rev/sec - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice circular motion MCQ: Body moving with angular velocity 1 rev/sec has frequency of? Options: 0.5 Hz, 2 Hz, 1 Hz, None. Correct: 1 Hz. Explanation: Frequency is number of revolutions per second. Angular velocity 1 rev/sec means 1 revolution per second, so frequency = 1 Hz. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/circular-motion/mcq16:
    title: "Circular Motion | When rope breaks stone moves in which direction - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice circular motion MCQ: Stone attached to rope whirled in circle. If rope breaks during motion, stone will move? Options: Radially inwards, Radially outwards, Along tangent, Along circle. Correct: Along tangent. Explanation: When rope breaks, centripetal force removed. Due to inertia, stone continues moving in direction of instantaneous velocity, which is tangential. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/circular-motion/mcq17:
    title: "Circular Motion | Tangential acceleration when radius doubled keeping velocity constant - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice circular motion MCQ: Particle moving in circle radius r, velocity v. If radius doubled keeping velocity constant, tangential acceleration will be? Options: Doubled, Quadrupled, Halved, Same. Correct: Same. Explanation: Tangential acceleration aₜ = dv/dt. Since velocity constant, tangential acceleration is zero regardless of radius. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/circular-motion/mcq18:
    title: "Circular Motion | Effect of reducing mass to half on centripetal force - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice circular motion MCQ: Particle in uniform circular path. If mass reduced to half original, force acting upon it will be? Options: Half, Doubled, Remain Same, None. Correct: Half. Explanation: F = mv²/r. If mass halved (v,r constant), force becomes half original value. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/circular-motion/mcq19:
    title: "Circular Motion | Type of acceleration when wheel rotates with slowly increasing angular speed - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice circular motion MCQ: Wheel rotates about axis through center with slowly increasing angular speed. It has? Options: Radial velocity and radial acceleration; Tangential velocity and radial acceleration; Tangential velocity and tangential acceleration; Tangential velocity and acceleration with both components. Correct: Tangential velocity and acceleration having both tangential and radial components. Explanation: Increasing angular speed gives tangential acceleration plus radial (centripetal) acceleration. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/circular-motion/mcq20:
    title: "Circular Motion | Vector relation between linear velocity and angular velocity - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice circular motion MCQ: Relation between linear velocity and angular velocity of body moving in circle in vector form is? Options: v = ω × r, v = r × ω, v = ω/r, v = r × ω. Correct: v = ω × r. Explanation: Correct vector relation is v = ω × r, where ω is angular velocity vector perpendicular to plane, r is position vector from center. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/circular-motion/mcq21:
    title: "Circular Motion | Angular displacement of minute hand in 20 minutes - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice circular motion MCQ: Angular displacement of minute hand in 20 minutes is? Options: π/3 rad, 2π/3 rad, π/2 rad, 3π/2 rad. Correct: 2π/3 rad. Explanation: Minute hand completes 2π rad in 60 minutes. In 20 minutes, displacement = (20/60) × 2π = 2π/3 rad. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/circular-motion/mcq22:
    title: "Circular Motion | Angular speed of scooter going around circular road - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice circular motion MCQ: Scooter going around circular road radius 100m at speed 10 m/s. Angular speed of scooter? Options: 10 rad/s, 1 rad/s, 0.1 rad/s, 0.01 rad/s. Correct: 0.1 rad/s. Explanation: ω = v/r = 10/100 = 0.1 rad/s. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/circular-motion/mcq23:
    title: "Circular Motion | Angular velocity of scooter on circular track - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice circular motion MCQ: Scooter going around circular track speed 20 m/s, radius 50 m. Angular velocity of scooter? Options: 0.4 rad/s, 2.5 rad/s, 8 rad/s, 1000 rad/s. Correct: 0.4 rad/s. Explanation: ω = v/r = 20/50 = 0.4 rad/s. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/circular-motion/mcq24:
    title: "Circular Motion | Angular speed of minute hand in degrees per second - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice circular motion MCQ: Angular speed of minute hand of clock in degrees per second is? Options: 0.01, 0.1, 1.0, 10. Correct: 0.1. Explanation: Minute hand completes 360° in 60 minutes = 3600 seconds. Angular speed = 360°/3600s = 0.1°/s. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/circular-motion/mcq25:
    title: "Circular Motion | Angular speed of hour hand of clock - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice circular motion MCQ: Angular speed of hour hand of clock is? Options: 1/2 rad/s, 1/4 rad/min, 1/2 rad/day, None. Correct: 1/2 rad/day. Explanation: Hour hand completes one revolution (2π rad) in 12 hours. In one day (24 hours), it completes 2 revolutions = 4π rad/day. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/circular-motion/mcq26:
    title: "Circular Motion | Minimum speed at lowest point to just complete vertical circle - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice circular motion MCQ: Body of mass m tied to string length r at lowest position. Minimum speed to just complete one revolution? Options: √(gr), √(3gr), √(5gr), √(7gr). Correct: √(5gr). Explanation: Minimum speed at lowest point = √(5gr). By energy conservation: v_bottom² = v_top² + 4gr = gr + 4gr = 5gr. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/circular-motion/mcq27:
    title: "Circular Motion | Minimum speed at highest point in vertical circle to avoid fall - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice circular motion MCQ: Motorcyclist rides along circular track radius r in vertical circle. Minimum speed at highest point to avoid fall is? Options: √(2g/3), √(5g/3), √(3g/2), √(gr). Correct: √(gr). Explanation: At highest point, centripetal force provided by weight: mg = mv²/r ⇒ v = √(gr). More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/circular-motion/mcq28:
    title: "Circular Motion | Which statement about centripetal and centrifugal forces is correct - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice circular motion MCQ: Which statement about centripetal and centrifugal forces is correct? Options: Centripetal balances centrifugal; Both act on same body; Centripetal directed opposite to centrifugal; Centripetal experienced by observer at center. Correct: Centripetal force is directed opposite to centrifugal force. Explanation: Centripetal acts toward center (real force). Centrifugal is fictitious force in rotating frame directed away from center. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/circular-motion/mcq29:
    title: "Circular Motion | Work done by centripetal force in one complete revolution - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice circular motion MCQ: Work done by centripetal force F when body completes one revolution around circle radius R is? Options: 2πRF, 2RF, RF, Zero. Correct: Zero. Explanation: Centripetal force always perpendicular to displacement (θ=90°). Work = Fd cos90° = 0 for any complete revolution. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/circular-motion/mcq30:
    title: "Circular Motion | Centripetal force can be provided by which real forces - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice circular motion MCQ: Centripetal force is real force providing real interacting force of? Options: Mechanical, Electrical, Magnetic or gravitational, All of these. Correct: All of these. Explanation: Centripetal force is net force toward center provided by any real force: tension, gravity, friction, electrostatic attraction, etc. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/circular-motion/mcq31:
    title: "Circular Motion | Which quantities remain constant in uniform circular motion - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice circular motion MCQ: Which remains constant in Uniform Circular Motion? Options: Speed, Kinetic energy, Angular momentum, All of these. Correct: All of these. Explanation: In UCM: speed constant, KE = ½mv² constant, angular momentum L = mvr constant. All remain constant. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/circular-motion/mcq32:
    title: "Circular Motion | Which device works on principle of circular motion - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice circular motion MCQ: Which device acts on principle of circular motion? Options: Centrifuge, Screw Gauge, Ruler, Vernier calipers. Correct: Centrifuge. Explanation: Centrifuge works on circular motion principle, separating particles by density using high-speed spinning creating centrifugal force. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/circular-motion/mcq33:
    title: "Circular Motion | Should driver brake or turn when seeing broad wall - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice circular motion MCQ: Driver of car travelling at velocity v suddenly sees broad wall at distance a. He should? Options: Brake sharply, Turn sharply, Both, None. Correct: Brake sharply. Explanation: Braking reduces speed linearly. Turning requires friction for centripetal force; if insufficient, car may skid. Braking safer to stop before wall. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/circular-motion/mcq34:
    title: "Circular Motion | Direction stone flies when string is released - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice circular motion MCQ: Stone of mass m tied to string length L, rotated in circle with constant speed v. If string released, stone flies? Options: Radially outward, Radially inward, Tangentially, With acceleration mv²/L. Correct: Tangentially. Explanation: When string released, centripetal force removed. Stone continues moving in direction of instantaneous velocity, which is tangential. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/circular-motion/mcq35:
    title: "Circular Motion | Ratio of lean angles when motorcyclist doubles speed - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice circular motion MCQ: Motorcyclist moves round curve at certain speed. He doubles speed. Ratio of tangents of lean angles with vertical in two cases is? Options: 1:2, 4:1, 1:4, 2:1. Correct: 1:4. Explanation: tanθ = v²/rg. If speed doubled, tanθ₂/tanθ₁ = (2v)²/v² = 4. So ratio (first:second) = 1:4. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/circular-motion/mcq36:
    title: "Circular Motion | Moment of inertia in angular motion is analogous to which quantity - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice circular motion MCQ: Moment of inertia in angular motion plays same role as? Options: Mass in linear motion, Acceleration in linear motion, Rest mass, None. Correct: Mass in linear motion. Explanation: Moment of inertia I is rotational analog of mass m in linear motion. Mass resists linear acceleration, I resists angular acceleration. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/circular-motion/mcq37:
    title: "Circular Motion | Unit of angular momentum is - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice circular motion MCQ: Js is unit of? Options: Linear momentum, Angular momentum, Energy, Mass. Correct: Angular momentum. Explanation: Joule-second (J·s) is unit of angular momentum and Planck's constant. 1 J·s = 1 kg·m²/s. Linear momentum has unit kg·m/s. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/circular-motion/mcq38:
    title: "Circular Motion | Moment of inertia of solid sphere - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice circular motion MCQ: Moment of inertia of sphere is? Options: 1/12 ML², MR², 1/2 MR², 2/5 MR². Correct: 2/5 MR². Explanation: For solid sphere rotating about diameter, I = 2/5 MR². For hollow sphere, I = 2/3 MR². More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/circular-motion/mcq39:
    title: "Circular Motion | Moment of inertia of solid cylinder about central axis - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice circular motion MCQ: Moment of inertia of solid cylinder about its central axis is? Options: 1/2 MR², MR², 2/3 MR², 2/5 MR². Correct: 1/2 MR². Explanation: For solid cylinder rotating about central (cylindrical) axis, I = 1/2 MR². More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/circular-motion/mcq40:
    title: "Circular Motion | Torque in rotational motion is defined as - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice circular motion MCQ: In rotational motion, torque is? Options: Rate of change of angular momentum; Rate of change of linear momentum; Rate of change of inertia; Rate of change of centripetal force. Correct: Rate of change of angular momentum. Explanation: Torque τ = dL/dt, rotational analog of Newton's second law (F = dp/dt). More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/circular-motion/mcq41:
    title: "Circular Motion | Velocity of disc at bottom of inclined plane - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice circular motion MCQ: Velocity of disc at bottom of inclined plane is? Options: √(gh), √(4gh/3), √(3gh/4), √(5gh/6). Correct: √(4gh/3). Explanation: For disc rolling down incline, I = 1/2 MR². Energy conservation: mgh = 1/2 mv² + 1/2 Iω² = 3/4 mv² ⇒ v² = 4gh/3 ⇒ v = √(4gh/3). More entry test MCQs at NotesPrep."
https://notesprep.com/entry-tests/mcqs/complex-numbers/mcq1:
    title: "Complex Numbers | Modulus of iota is equal to - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice complex numbers MCQ: Modulus of iota is equal to? Options: i, -i, 1, -1. Correct: 1. Explanation: Iota i = √(-1). Modulus of a+bi is √(a²+b²). For i = 0+1i, modulus = √(0²+1²) = 1. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/complex-numbers/mcq2:
    title: "Complex Numbers | Reciprocal 1/z for non-zero complex number z is - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice complex numbers MCQ: For non-zero complex number z, which is true for 1/z? Options: z/|z|², z/|z|, conjugate(z)/|z|², conjugate(-z)/|z|. Correct: conjugate(z)/|z|². Explanation: z·conjugate(z)=|z|², so 1/z = conjugate(z)/|z|². More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/complex-numbers/mcq3:
    title: "Complex Numbers | Additive inverse of complex number a,b in ordered pair form - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice complex numbers MCQ: Additive inverse of complex number (a,b) is written as? Options: (-a,b), (a,-b), (-a,-b), (1/a,1/b). Correct: (-a,-b). Explanation: Additive inverse of a+bi is -a-bi, which in ordered pair notation is (-a,-b). More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/complex-numbers/mcq4:
    title: "Complex Numbers | Factorization of a² + b² using complex numbers - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice complex numbers MCQ: a² + b² = ? Options: (a+b)(a-b), (a+ib)(a-ib), (a+b)(a-ib), (a+ib)(a-b). Correct: (a+ib)(a-ib). Explanation: a²+b² = a² - (-b²) = a² - (i²b²) = (a+ib)(a-ib). More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/complex-numbers/mcq5:
    title: "Complex Numbers | Imaginary part of (x - iy)/(x² + y²) - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice complex numbers MCQ: Which option is true for imaginary part of (x - iy)/(x² + y²)? Options: -y/(x²+y²), y/(x²+y²), iy/(x²+y²), -iy/(x²+y²). Correct: -y/(x²+y²). Explanation: (x-iy)/(x²+y²) = x/(x²+y²) + [-y/(x²+y²)]i. Imaginary part is coefficient of i: -y/(x²+y²). More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/complex-numbers/mcq6:
    title: "Complex Numbers | z × conjugate(z) equals - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice complex numbers MCQ: Let z be complex number, then z·conjugate(z) = ? Options: |z|², -|z|², |conjugate(z)|², All of above. Correct: All of above. Explanation: For z=a+bi, z·conjugate(z)=a²+b²=|z|². Also |conjugate(z)|²=|z|², so all options correct. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/complex-numbers/mcq7:
    title: "Complex Numbers | Condition |z| = -|z| holds for z only when - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice complex numbers MCQ: |z| = -|z| holds for complex number z if and only if? Options: Only z=-z; z=conjugate(z); z=conjugate(-z); (i),(ii),(iii) all hold. Correct: (i),(ii),(iii) all hold. Explanation: |z|=-|z| ⇒ 2|z|=0 ⇒ |z|=0 ⇒ z=0. All three conditions hold when z=0. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/complex-numbers/mcq8:
    title: "Complex Numbers | Solve for z and w given z+w=3i and z-w=4-i - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice complex numbers MCQ: If z+w=3i and z-w=4-i, then? Options: z=2+i,w=-2-i; z=2-i,w=2-2i; z=2+i,w=-2+2i; None. Correct: z=2+i, w=-2+2i. Explanation: Adding: 2z=4+2i ⇒ z=2+i. Subtracting: 2w=-4+4i ⇒ w=-2+2i. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/complex-numbers/mcq9:
    title: "Complex Numbers | Solve for x,y given (x+3i)² = 2yi - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice complex numbers MCQ: If (x+3i)² = 2yi, then (x,y) = ? Options: (3,9); (-3,-9); both I and II; (3,7). Correct: both I and II. Explanation: (x+3i)² = (x²-9)+6xi = 0+2yi. So x²-9=0 ⇒ x=±3, and 6x=2y ⇒ y=3x. So (3,9) and (-3,-9) both correct. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/complex-numbers/mcq10:
    title: "Complex Numbers | Real part of z⁻¹ when z = (3-4i)⁻¹ - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice complex numbers MCQ: If z = (3-4i)⁻¹, then Re(z⁻¹) = ? Options: 3, -4i, 4, √5/2. Correct: 3. Explanation: Given z=(3-4i)⁻¹, then z⁻¹=3-4i. Real part of z⁻¹ is 3. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/complex-numbers/mcq11:
    title: "Complex Numbers | Product of two imaginary numbers is always - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice complex numbers MCQ: Product of two imaginary numbers is? Options: Imaginary, Real, Complex, None. Correct: Real. Explanation: (ai)(bi) = ab i² = -ab, which is a real number. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/complex-numbers/mcq12:
    title: "Complex Numbers | Find |z| where z = (3-4i)(-1-2i) / [i(1+i)(-3-i)] - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice complex numbers MCQ: |z| where z = (3-4i)(-1-2i)/[i(1+i)(-3-i)] is? Options: √5/2, √2/5, 5/2, None. Correct: 5/2. Explanation: Using modulus properties: |3-4i|=5, |-1-2i|=√5, |i|=1, |1+i|=√2, |-3-i|=√10. So |z| = (5×√5)/(1×√2×√10)=5/2. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/complex-numbers/mcq13:
    title: "Complex Numbers | If conjugate lies in 4th quadrant, original complex number lies in - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice complex numbers MCQ: If conjugate of complex number lies in 4th quadrant, complex number itself lies in? Options: 1st, 2nd, 3rd, 4th quadrant. Correct: 1st quadrant. Explanation: Conjugate is reflection across real axis. If conjugate in 4th quadrant (real>0, imag<0), original is reflected to 1st quadrant (real>0, imag>0). More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/complex-numbers/mcq14:
    title: "Complex Numbers | Number of distinct values of i^n for integer n - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice complex numbers MCQ: If f(n)=iⁿ where i=√(-1) and n integer, total distinct values of f(n) is? Options: 2, 3, 4, infinite. Correct: 4. Explanation: iⁿ cycles through four values: i⁰=1, i¹=i, i²=-1, i³=-i, then repeats. So distinct values are {1,-1,i,-i} = 4 elements. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/complex-numbers/mcq15:
    title: "Complex Numbers | -3+4i and -3-4i are which type of pair - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice complex numbers MCQ: Complex numbers -3+4i and -3-4i are? Options: Additive inverses, Multiplicative inverses, Reciprocals, Conjugates. Correct: Conjugates. Explanation: They have same real part (-3) and opposite imaginary parts (4i and -4i), so they are conjugates. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/complex-numbers/mcq16:
    title: "Complex Numbers | Which equation is true for powers of i - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice complex numbers MCQ: If i=√(-1) and n integer, which equation is true? Options: i⁴ⁿ⁺¹=-1, i⁴ⁿ⁺²=-i, i⁴ⁿ=1, i⁴ⁿ⁺³=i. Correct: i⁴ⁿ=1. Explanation: i⁴=1, so i⁴ⁿ=(i⁴)ⁿ=1ⁿ=1. Others: i⁴ⁿ⁺¹=i, i⁴ⁿ⁺²=-1, i⁴ⁿ⁺³=-i. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/complex-numbers/mcq17:
    title: "Complex Numbers | Multiplicative identity in complex numbers is - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice complex numbers MCQ: Multiplicative identity in set of all complex numbers is? Options: (0,0), (0,-1), (0,1), (1,0). Correct: (1,0). Explanation: (1,0) represents 1+0i=1, and 1×(a+bi)=a+bi for any complex number. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/complex-numbers/mcq18:
    title: "Complex Numbers | Multiplicative inverse of z = 1/x + (1/y)i when x,y ≠ 0 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice complex numbers MCQ: If x,y≠0, multiplicative inverse of z=1/x+(1/y)i is? Options: 1/xy, 1/x-1/y i, 1/x+1/y i, None. Correct: None. Explanation: Inverse = [1/x-(1/y)i]/[1/x²+1/y²] = xy(y-xi)/(x²+y²). None of given options match. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/complex-numbers/mcq19:
    title: "Complex Numbers | (1+√3 i)/(1-√3 i) lies in which quadrant - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice complex numbers MCQ: In complex plane, (1+√3 i)/(1-√3 i) lies in? Options: 1st, 2nd, 3rd, 4th quadrant. Correct: 2nd quadrant. Explanation: Simplify: multiply numerator and denominator by conjugate gives -1/2 + (√3/2)i. Negative real, positive imaginary ⇒ 2nd quadrant. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/complex-numbers/mcq20:
    title: "Complex Numbers | Value of [(z+1)/(z+1)]² when |z|=1 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice complex numbers MCQ: If |z|=1, then [(z+1)/(z+1)]² = ? Options: z, conjugate(z), z⁻¹, None. Correct: None. Explanation: (z+1)/(z+1)=1 (provided z≠-1), so square =1. None of options equal 1 in general. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/complex-numbers/mcq21:
    title: "Complex Numbers | Value of i^i - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice complex numbers MCQ: iⁱ = ? Options: e⁻ᵖⁱ/², eᵖⁱ/², e⁻ᵖⁱ, eᵖⁱ. Correct: e⁻ᵖⁱ/². Explanation: i = eⁱᵖⁱ/², so iⁱ = (eⁱᵖⁱ/²)ⁱ = eⁱ·ⁱ·π/2 = e⁻ᵖⁱ/², a real number ≈0.20788. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/complex-numbers/mcq22:
    title: "Complex Numbers | Expand (2-i)² - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice complex numbers MCQ: (2-i)² = ? Options: 3-4i, 3+4i, 5-4i, 5+4i. Correct: 3-4i. Explanation: (2-i)² = 4 - 4i + i² = 4 - 4i - 1 = 3 - 4i. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/complex-numbers/mcq23:
    title: "Complex Numbers | z × conjugate(z) when z = a + i b cos x - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice complex numbers MCQ: If z = a + i b cos x, then z·conjugate(z) = ? Options: a²+b²cos²x, a²-b²cos²x, a²+b², a²-b². Correct: a²+b²cos²x. Explanation: conjugate(z)=a - i b cos x. Product = (a+ib cos x)(a-ib cos x)=a²+b²cos²x. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/complex-numbers/mcq24:
    title: "Complex Numbers | Real part of 1/(2+3i) - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice complex numbers MCQ: Real part of 1/(2+3i) is? Options: 2/13, 3/13, 2/5, 3/5. Correct: 2/13. Explanation: 1/(2+3i) = (2-3i)/(4+9) = 2/13 - (3/13)i. Real part = 2/13. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/complex-numbers/mcq25:
    title: "Complex Numbers | De Moivre's Theorem states that (cosθ + i sinθ)ⁿ equals - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice complex numbers MCQ: According to De Moivre's Theorem, (cosθ + i sinθ)ⁿ is equivalent to? Options: cos(nθ)-i sin(nθ), n cosθ+in sinθ, cos(nθ)+i sin(nθ), cosⁿθ+i sinⁿθ. Correct: cos(nθ)+i sin(nθ). Explanation: De Moivre's Theorem: (cosθ+i sinθ)ⁿ = cos(nθ)+i sin(nθ) for any integer n. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/complex-numbers/mcq26:
    title: "Complex Numbers | Simplify i(1-i)¹⁰ - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice complex numbers MCQ: i(1-i)¹⁰ is equal to? Options: 32, -32, 32i, -32i. Correct: 32. Explanation: (1-i)²=-2i. Then (1-i)¹⁰=(-2i)⁵=-32i. Multiply by i: i×(-32i)=-32i²=32. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/complex-numbers/mcq27:
    title: "Complex Numbers | Simplify (1+i)/(1-i) - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice complex numbers MCQ: (1+i)/(1-i) is equal to? Options: i, -i, 1, -1. Correct: i. Explanation: Multiply numerator and denominator by conjugate: (1+i)²/(1-i²) = (1+2i-1)/(1+1) = 2i/2 = i. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/complex-numbers/mcq28:
    title: "Complex Numbers | If z + conjugate(z) = 0, then z is - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice complex numbers MCQ: If z + conjugate(z) = 0, it means z is? Options: Purely real, Purely imaginary, Zero, None. Correct: Purely imaginary. Explanation: Let z=x+iy, then conjugate(z)=x-iy. Sum=2x=0 ⇒ x=0, so z=iy which is purely imaginary. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/complex-numbers/mcq29:
    title: "Complex Numbers | Simplify i cos x + sin x by multiplying and dividing by i - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice complex numbers MCQ: i cos x + sin x simplified by multiplying and dividing by i gives? Options: i e⁻ⁱˣ, eⁱ⁽ᵖⁱ/²⁻ˣ⁾, i eⁱˣ, eⁱ⁽ˣ⁻ᵖⁱ/²⁾. Correct: i e⁻ⁱˣ. Explanation: i cos x + sin x = i(cos x - i sin x) = i(cos(-x)+i sin(-x)) = i e⁻ⁱˣ. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/complex-numbers/mcq30:
    title: "Complex Numbers | Square of (-1+√3 i)/2 which is cube root of unity - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice complex numbers MCQ: Find square of (-1+√3 i)/2? Options: (-1-√3 i)/2, (1+√3 i)/2, (1-√3 i)/2, None. Correct: (-1-√3 i)/2. Explanation: Let ω = (-1+√3 i)/2, a cube root of unity. ω² = (-1-√3 i)/2. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/complex-numbers/mcq31:
    title: "Complex Numbers | Simplify w⁷ + w¹² where w is cube root of unity - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice complex numbers MCQ: w⁷ + w¹² can be simplified to? Options: -1/w², w², w²+1, -1/w. Correct: -1/w. Explanation: w³=1. w⁷=w, w¹²=1. So w+1 = -w² = -1/w using 1+w+w²=0. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/complex-numbers/mcq32:
    title: "Complex Numbers | Value of [(1+i)/(1-i)]²⁰ - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice complex numbers MCQ: Value of [(1+i)/(1-i)]²⁰ is? Options: 1, -1, i, -i. Correct: 1. Explanation: (1+i)/(1-i)=i. Then i²⁰ = (i⁴)⁵ = 1⁵ = 1. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/complex-numbers/mcq33:
    title: "Complex Numbers | Find Im(z) given |z|=1 and |z+z⁻¹|=1 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice complex numbers MCQ: If |z|=1 and |z+z⁻¹|=1, then Im(z) equals? Options: ±1/2, ±√3/2, ±1/√2, ±√3/4. Correct: ±√3/2. Explanation: Let z=cosθ+i sinθ. Then z+z⁻¹=2cosθ. |2cosθ|=1 ⇒ |cosθ|=1/2 ⇒ sinθ=±√3/2, which is Im(z). More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/complex-numbers/mcq34:
    title: "Complex Numbers | Complex number z satisfying z⁵ = conjugate(z) with |z|≠1 is - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice complex numbers MCQ: Complex number z satisfying z⁵ = conjugate(z) and |z|≠1 is? Options: 0, 1, -1, i. Correct: 0. Explanation: Let z=reⁱᶿ. Then r⁵eⁱ⁵ᶿ = re⁻ⁱᶿ ⇒ r⁴eⁱ⁶ᶿ=1. Modulus: r⁴=1 ⇒ r=1. But given |z|≠1, only possibility is r=0 ⇒ z=0. More entry test MCQs at NotesPrep."
    
https://notesprep.com/entry-tests/mcqs/conics/mcq1:
    title: "Conics | Point (3,-2) lies inside, outside or on circle x²+y²-9x+4y=48 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice conics MCQ: The point (3,-2) lies ______ the circle x²+y²-9x+4y=48. Options: Inside, Outside, On, None. Correct: Inside. Explanation: Substitute (3,-2): 9+4-27-8-48=-70<0. For circle S=0, S<0 means inside. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/conics/mcq2:
    title: "Conics | Equation x²+y²+2x+3y+5=0 represents which type of circle - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice conics MCQ: Equation x²+y²+2x+3y+5=0 represents? Options: Point circle, Real circle, Imaginary circle, Not a circle. Correct: Imaginary circle. Explanation: Complete square: (x+1)²+(y+1.5)²=1+2.25-5=-1.75<0, so radius squared negative → imaginary circle. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/conics/mcq3:
    title: "Conics | Range of c for real circle x²+y²-6x+4y+c=0 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice conics MCQ: What range of c makes x²+y²-6x+4y+c=0 always represent a real circle? Options: c>13, c<20, c<13, c<20. Correct: c<13. Explanation: Complete square: (x-3)²+(y+2)²=13-c. For real circle, 13-c≥0 ⇒ c≤13. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/conics/mcq4:
    title: "Conics | Centre of circle x²+y²-6x+4y-23=0 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice conics MCQ: Centre of circle x²+y²-6x+4y-23=0 is? Options: (-3,-2), (3,2), (-3,2), (3,-2). Correct: (3,-2). Explanation: For x²+y²+2gx+2fy+c=0, centre=(-g,-f). Here 2g=-6⇒g=-3, 2f=4⇒f=2, so centre=(3,-2). More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/conics/mcq5:
    title: "Conics | Length of diameter of circle x²+y²-6x+4y-23=0 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice conics MCQ: Length of diameter of circle x²+y²-6x+4y-23=0 is? Options: 4, 6, 12, 8. Correct: 12. Explanation: Complete square: (x-3)²+(y+2)²=36. Radius=6, diameter=12. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/conics/mcq6:
    title: "Conics | Circumference of circle x²+y²+2x+2y-23=0 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice conics MCQ: Circumference of circle x²+y²+2x+2y-23=0 is? Options: 2π, 5π, 10π, 25π. Correct: 10π. Explanation: Complete square: (x+1)²+(y+1)²=25. Radius=5, circumference=2π(5)=10π. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/conics/mcq7:
    title: "Conics | Find other end of diameter given one end (3,2) for circle 2x²+2y²-4x-8y+2=0 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice conics MCQ: If one end of diameter of circle 2x²+2y²-4x-8y+2=0 is (3,2), other end is? Options: (2,3), (4,-2), (2,-1), (-1,2). Correct: (-1,2). Explanation: Divide by 2: x²+y²-2x-4y+1=0, centre=(1,2). Midpoint of diameter=centre ⇒ (a+3)/2=1⇒a=-1, (b+2)/2=2⇒b=2. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/conics/mcq8:
    title: "Conics | Centre of circle through origin with intercepts 8 and -4 on axes - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice conics MCQ: Centre of circle passing through origin making intercepts 8 and -4 on x and y axes is? Options: (-4,8), (4,-2), (2,-4), (-2,4). Correct: (4,-2). Explanation: Perpendicular bisector of (0,0) and (8,0) is x=4. Perpendicular bisector of (0,0) and (0,-4) is y=-2. Intersection gives centre (4,-2). More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/conics/mcq9:
    title: "Conics | Area of circle with centre (0,-1) passing through (2,3) - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice conics MCQ: If (2,3) lies on circle with centre (0,-1), area of circle is? Options: 12π, 16π, 20π, 26π. Correct: 20π. Explanation: Radius = √[(2-0)²+(3+1)²]=√(4+16)=√20=2√5. Area=πr²=20π. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/conics/mcq10:
    title: "Conics | Standard equation of circle 2x²+2y²+12x-8y-20=0 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice conics MCQ: Standard equation of circle 2x²+2y²+12x-8y-20=0 is? Options: (x-3)²+(y+2)²=23, (x+3)²+(y-2)²=43, (x-3)²+(y+2)²=43, (x+3)²+(y-2)²=23. Correct: (x+3)²+(y-2)²=23. Explanation: Divide by 2: x²+y²+6x-4y-10=0. Complete square: (x+3)²-9+(y-2)²-4-10=0 ⇒ (x+3)²+(y-2)²=23. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/conics/mcq11:
    title: "Conics | Circle with diameter as latus rectum of parabola x²=4y - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice conics MCQ: Equation of circle whose diameter is latus rectum of parabola x²=4y is? Options: (x-2)²+(y-1)²=4, x²+(y-1)²=4, x²+(y+1)²=4, x²+(y-1)²=4. Correct: x²+(y-1)²=4. Explanation: For x²=4ay, a=1, focus (0,1). Latus rectum endpoints (-2,1) and (2,1). Centre (0,1), radius=2 ⇒ x²+(y-1)²=4. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/conics/mcq12:
    title: "Conics | Circle tangent to y=-1 passing through (0,0) and (6,0) - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice conics MCQ: Line y=-1 is tangent to circle through (0,0) and (6,0). Equation of circle? Options: x²+y²-6x+8y=0, x²+y²-6x-8y=0, x²+y²+6x-8y=0, x²+y²+6x+8y=0. Correct: x²+y²-6x-8y=0. Explanation: Let circle: x²+y²+2gx+2fy=0. Passes (6,0):36+12g=0⇒g=-3. Distance from centre (3,-f) to y=-1 = radius ⇒ (-f+1)²=9+f²⇒f=-4. Equation: x²+y²-6x-8y=0. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/conics/mcq13:
    title: "Conics | Circle through (-2,14) concentric with x²+y²-6x-4y-12=0 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice conics MCQ: Equation of circle through (-2,14) concentric with x²+y²-6x-4y-12=0 is? Options: x²+y²-6x-4y-156=0, x²+y²-6x+4y-156=0, x²+y²+6x+4y+156=0, x²+y²+6x+4y-156=0. Correct: x²+y²-6x-4y-156=0. Explanation: Concentric circles have same centre (3,2). Let (x-3)²+(y-2)²=r². Passes (-2,14):25+144=169=r². Expand: x²-6x+9+y²-4y+4=169 ⇒ x²+y²-6x-4y-156=0. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/conics/mcq14:
    title: "Conics | Circle with diameter endpoints (-3,2) and (12,-6) - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice conics MCQ: Equation of circle whose diameter has endpoints (-3,2) and (12,-6) is? Options: x²+y²-4x+9y-84=0, x²+y²+9x-4y-48=0, x²+y²-9x-4y+48=0, x²+y²-9x+4y-48=0. Correct: x²+y²-9x+4y-48=0. Explanation: Centre = (4.5,-2). Distance=17, radius=8.5. Equation: (x-4.5)²+(y+2)²=289/4 ⇒ x²+y²-9x+4y-48=0. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/conics/mcq15:
    title: "Conics | Focus of parabola x² = -16y - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice conics MCQ: Focus of parabola x² = -16y is? Options: (4,0), (0,4), (-4,0), (0,-4). Correct: (0,-4). Explanation: x²=-16y = 4(-4)y. Standard x²=4ay has focus (0,a). Here a=-4, so focus=(0,-4). More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/conics/mcq16:
    title: "Conics | Length of latus rectum of parabola 3x² = 4y - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice conics MCQ: Length of latus rectum of parabola 3x² = 4y is? Options: 4, -4, 4/3, 3/4. Correct: 4/3. Explanation: Rewrite: x² = (4/3)y = 4(1/3)y. So 4a=4/3 ⇒ a=1/3. Length of latus rectum = 4a = 4/3. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/conics/mcq17:
    title: "Conics | Equation of normal at point (x₁,y₁) to parabola y²=4ax - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice conics MCQ: Equation of normal at point (x₁,y₁) to parabola y²=4ax is? Options: y-y₁ = -(y₁/2a)(x-x₁), y-y₁ = (2a/y₁)(x-x₁), y-y₁ = -(2a/y₁)(x-x₁), y-y₁ = 2a(x-x₁). Correct: y-y₁ = -(y₁/2a)(x-x₁). Explanation: Slope of tangent = 2a/y₁, so slope of normal = -y₁/2a. Thus equation: y-y₁ = -(y₁/2a)(x-x₁). More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/conics/mcq18:
    title: "Conics | Conic with eccentricity e > 1 is called - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice conics MCQ: The conic having eccentricity e > 1 is called? Options: Hyperbola, Ellipse, Parabola, Circle. Correct: Hyperbola. Explanation: e=0 for circle, 0<e<1 for ellipse, e=1 for parabola, e>1 for hyperbola. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/conics/mcq19:
    title: "Conics | Parabola with vertex (0,0) and directrix y+2=0 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice conics MCQ: Equation of parabola with vertex at (0,0) and directrix y+2=0 is? Options: y²=8x, x²=-8y, x²=8y, y²=8x+8y. Correct: x²=8y. Explanation: Directrix y=-2. Vertex at origin, parabola opens upward. For vertex at origin and focus (0,a), directrix is y=-a. Here a=2, so equation x²=4ay=8y. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/conics/mcq20:
    title: "Conics | Parabola with focus (-3,0) and directrix x=5 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice conics MCQ: Equation of parabola with focus (-3,0) and directrix x=5 is? Options: x²=4(y+4), x²=4(y-4), y²=4(x+4), y²=4(x-4). Correct: y²=4(x-4). Explanation: Vertex is midpoint (-3+5)/2=1,0. Distance a=4. Parabola opens left. Standard form: y²=-16(x-1). Equivalent to y²=4(x-4). More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/conics/mcq21:
    title: "Conics | Other end of focal chord of parabola y²=32x given one end (2,-8) - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice conics MCQ: If (2,-8) is an end of focal chord of parabola y²=32x, other end is? Options: (32,32), (32,-32), (-2,8), None. Correct: (32,32). Explanation: For y²=32x=4(8)x, a=8. Parametric: (8t²,16t). (2,-8) gives 8t²=2⇒t²=1/4, 16t=-8⇒t=-1/2. For focal chord, t₁t₂=-1⇒t₂=2. Other end: (8(4),16(2))=(32,32). More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/conics/mcq22:
    title: "Conics | Point on parabola y²=8x with focal distance 4 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice conics MCQ: Coordinates of point on parabola y²=8x whose focal distance is 4? Options: (2,4), (4,2), (2,-4), (4,-2). Correct: (2,4). Explanation: y²=8x=4(2)x, so a=2. Focal distance = x+a = x+2 =4 ⇒ x=2. Then y²=8(2)=16⇒ y=±4. Points: (2,4) and (2,-4). More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/conics/mcq23:
    title: "Conics | Eccentricity of circle - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice conics MCQ: Eccentricity of circle is? Options: e>1, e<1, e=1, e=0. Correct: e=0. Explanation: A circle is a special case of ellipse where the two foci coincide. Its eccentricity is 0. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/conics/mcq24:
    title: "Conics | Eccentricity and foci of ellipse x²/16 + y²/9 = 1 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice conics MCQ: Eccentricity and foci of ellipse x²/16 + y²/9 = 1 are? Options: e=3/4,c=4; e=4/3,c=4; e=3/4,c=3; e=4/3,c=3. Correct: e=√7/4, foci (±√7,0). Explanation: a²=16⇒a=4, b²=9⇒b=3. c²=a²-b²=7⇒c=√7. e=c/a=√7/4≈0.66. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/conics/mcq25:
    title: "Conics | Major axis direction of ellipse 4x²+25y²-8x+100y+4=0 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice conics MCQ: Major axis of ellipse 4x²+25y²-8x+100y+4=0 is? Options: Parallel to x-axis, Parallel to y-axis, On x-axis, On y-axis. Correct: Parallel to x-axis. Explanation: Complete square: 4(x-1)²+25(y+2)²=100 ⇒ (x-1)²/25 + (y+2)²/4 =1. a²=25> b²=4, major axis horizontal. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/conics/mcq26:
    title: "Conics | Shape of planetary orbits according to Kepler - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice conics MCQ: Planets travel in ______ paths. Options: Circular, Parabolic, Elliptical, Hyperbolic. Correct: Elliptical. Explanation: According to Kepler's first law of planetary motion, planets move in elliptical orbits with the Sun at one focus. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/conics/mcq27:
    title: "Conics | Equation of ellipse with foci (±2,0) and eccentricity 1/2 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice conics MCQ: Equation of ellipse with foci (±2,0) and eccentricity 1/2 is? Options: x²/16+y²/12=1, x²/12+y²/16=1, x²/4+y²/3=1, x²/3+y²/4=1. Correct: x²/16+y²/12=1. Explanation: ae=2, e=1/2 ⇒ a=4, a²=16. b²=a²(1-e²)=16(1-1/4)=12. Equation: x²/16+y²/12=1. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/conics/mcq28:
    title: "Conics | Standard equation of horizontal ellipse with centre (h,k) - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice conics MCQ: For horizontal ellipse with foci F₁(h-c,k) and F₂(h+c,k), standard equation is? Options: x²/a²+y²/b²=1, (x-k)²/a²+(y-k)²/b²=1, (x-h)²/a²+(y-k)²/b²=1, (x-c)²/a²+(y-k)²/b²=1. Correct: (x-h)²/a²+(y-k)²/b²=1. Explanation: For horizontal ellipse centered at (h,k), standard equation is (x-h)²/a²+(y-k)²/b²=1. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/conics/mcq29:
    title: "Conics | Formula for eccentricity of hyperbola - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice conics MCQ: In hyperbola, eccentricity e = ? Options: √[(a²-b²)/a²], √[(a²+b²)/a²], 1, 0. Correct: √[(a²+b²)/a²]. Explanation: For hyperbola x²/a² - y²/b²=1, e = √(1+b²/a²) = √(a²+b²)/a. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/conics/mcq30:
    title: "Conics | Asymptotes of hyperbola x²/a² - y²/b² = 1 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice conics MCQ: Asymptotes of hyperbola x²/a² - y²/b² = 1 are given by? Options: y=±(b/a)x, y=±(a/b)x, y=±(c/a)x, y=±(a/c)x. Correct: y=±(b/a)x. Explanation: Set equation equal to zero: x²/a² - y²/b²=0 ⇒ y²/b²=x²/a² ⇒ y=±(b/a)x. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/conics/mcq31:
    title: "Conics | Conjugate axis of hyperbola (x-1)²/4 - (y+3)²/12 = 1 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice conics MCQ: Equation of conjugate axis of hyperbola (x-1)²/4 - (y+3)²/12 = 1 is? Options: x=1, x=-1, y=3, y=-3. Correct: x=1. Explanation: For hyperbola (x-h)²/a² - (y-k)²/b²=1, conjugate axis is vertical x=h. Here h=1, so conjugate axis is x=1. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/conics/mcq32:
    title: "Conics | Eccentricity definition - ratio of distances from focus and directrix - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice conics MCQ: Eccentricity is ratio of distance of point on conic section from? Options: Focus to directrix, Directrix to focus, Vertex to directrix, Directrix to vertex. Correct: Focus to directrix. Explanation: e = PF/PM, where P is point on conic, F is focus, M is foot on directrix. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/conics/mcq33:
    title: "Conics | Angle of rotation to remove xy term from conic equation - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice conics MCQ: Angle of rotation for removing xy term from conic equation is? Options: θ=tan⁻¹(2h/(a+b)), θ=tan⁻¹(2h/(ab)), θ=tan⁻¹(h/(a-b)), θ=½tan⁻¹(2h/(a-b)). Correct: θ=½tan⁻¹(2h/(a-b)). Explanation: For general conic ax²+2hxy+by²+..., tan2θ=2h/(a-b) ⇒ θ=½tan⁻¹(2h/(a-b)). More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/conics/mcq34:
    title: "Conics | Condition for chord joining two points on parabola to be focal chord - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice conics MCQ: Chord joining points (at₁²,2at₁) and (at₂²,2at₂) on parabola y²=4ax is focal chord if? Options: t₁+t₂=1, t₁+t₂=-1, t₁t₂=1, t₁t₂=-1. Correct: t₁t₂=-1. Explanation: A chord passes through focus (a,0) if and only if t₁t₂=-1. This is standard property of focal chords. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/conics/mcq35:
    title: "Conics | Symmetry of parabola 4px = y² when p>0 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice conics MCQ: In equation 4px=y², if p>0, parabola is symmetric with respect to? Options: Negative X-axis, Positive Y-axis, Positive X-axis, X-axis. Correct: Positive X-axis. Explanation: y²=4px with p>0 opens to right, symmetric about x-axis and positive x-axis direction. More entry test MCQs at NotesPrep."
  https://notesprep.com/entry-tests/mcqs/current-electricity/mcq1:
    title: "Current Electricity | Peak value of 220 volts AC mains is - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice current electricity MCQ: Peak value of 220 volts of AC mains is? Options: 155V, 220V, 311V, 440V. Correct: 311V. Explanation: Given 220V is RMS value. Peak value V₀ = V_rms × √2 = 220 × 1.414 ≈ 311V. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/current-electricity/mcq2:
    title: "Current Electricity | Effective value of sinusoidal AC is - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice current electricity MCQ: Effective value of any sinusoidal alternating current or voltage is? Options: √3 times max, 1/√2 times max, √2 times max, None. Correct: 1/√2 times max. Explanation: RMS value = V₀/√2, which is 1/√2 times maximum value. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/current-electricity/mcq3:
    title: "Current Electricity | RMS voltage for same heat as 110V DC - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice current electricity MCQ: 110V DC heater used on AC source producing same heat. RMS value of alternating voltage? Options: 110V, 220V, 330V, 440V. Correct: 110V. Explanation: For same heat produced, RMS value of AC must equal DC voltage. So RMS voltage = 110V. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/current-electricity/mcq4:
    title: "Current Electricity | AC voltmeter reading 220V represents which value - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice current electricity MCQ: Voltmeter connected in AC circuit reads 220V. It represents? Options: Peak voltage, RMS voltage, Average Voltage, Mean square voltage. Correct: RMS voltage. Explanation: AC voltmeters are calibrated to read RMS (effective) value of voltage. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/current-electricity/mcq5:
    title: "Current Electricity | Effect of increasing frequency on inductive reactance - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice current electricity MCQ: What happens to inductive reactance when frequency of AC supply is increased? Options: Increases, Decreases, Remains same, Decreases inversely. Correct: Increases. Explanation: X_L = 2πfL is directly proportional to frequency. When frequency increases, X_L increases. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/current-electricity/mcq6:
    title: "Current Electricity | Capacitive reactance is proportional to - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice current electricity MCQ: If capacitor connected to two different AC generators, capacitive reactance is? Options: Directly proportional to frequency, Inversely proportional to frequency, Independent of frequency, Inversely proportional to square of frequency. Correct: Inversely proportional to frequency. Explanation: X_C = 1/(2πfC) is inversely proportional to frequency. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/current-electricity/mcq7:
    title: "Current Electricity | Effect of decreasing frequency on capacitor - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice current electricity MCQ: AC source connected to capacitor. Due to decrease in operating frequency? Options: X_C constant, X_C decreases, displacement current increases, displacement current decreases. Correct: displacement current decreases. Explanation: X_C = 1/(2πfC). As frequency decreases, X_C increases, so current decreases. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/current-electricity/mcq8:
    title: "Current Electricity | Inductance of coil with R=100Ω, voltage leads current by 45° at 1000Hz - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice current electricity MCQ: Inductive coil has resistance 100Ω. At 1000Hz, voltage leads current by 45°. Inductance is? Options: 10mH, 12mH, 16mH, 20mH. Correct: 16mH. Explanation: tan45°=1=X_L/R ⇒ X_L=100Ω. L = X_L/(2πf)=100/(2π×1000)≈0.0159H=16mH. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/current-electricity/mcq9:
    title: "Current Electricity | Impedance of AC series circuit with 4Ω resistance and 3Ω inductive reactance - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice current electricity MCQ: AC series circuit with 4Ω resistance and 3Ω inductive reactance. Impedance is? Options: 1Ω, 5Ω, 7Ω, 12Ω. Correct: 5Ω. Explanation: Z = √(R²+X_L²) = √(4²+3²)=√25=5Ω. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/current-electricity/mcq10:
    title: "Current Electricity | Impedance formula for RL series circuit - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice current electricity MCQ: Impedance Z of RL series circuit is expressed as? Options: Z=√[(ωL)²+(1/ωC)²], Z=√[R²+(ωL)²], Z=√[R²+(1/ωC)²], None. Correct: Z=√[R²+(ωL)²]. Explanation: In RL series circuit, Z = √(R²+X_L²)=√(R²+(ωL)²). More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/current-electricity/mcq11:
    title: "Current Electricity | Phase angle formula for RL series circuit - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice current electricity MCQ: Phase angle θ in RL series circuit is expressed as? Options: θ=tan⁻¹(ωL/R), θ=tan⁻¹(ωL/R₀), θ=tan⁻¹(R/L), None. Correct: θ=tan⁻¹(ωL/R). Explanation: tanθ = X_L/R = ωL/R, so θ=tan⁻¹(ωL/R). More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/current-electricity/mcq12:
    title: "Current Electricity | In RLC series circuit X_L and X_C are directed opposite - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice current electricity MCQ: In RLC series circuit, quantities directed opposite to each other are? Options: X_L=X_C, X_L>X_C, X_L<X_C, None. Correct: X_L<X_C. Explanation: X_L and X_C are 180° out of phase, so they oppose each other. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/current-electricity/mcq13:
    title: "Current Electricity | Condition for resonance in RLC series circuit - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice current electricity MCQ: Condition of resonance in RLC series circuit is? Options: X_L=X_C, X_L>X_C, X_L<X_C, None. Correct: X_L=X_C. Explanation: Resonance occurs when inductive reactance equals capacitive reactance: X_L=X_C. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/current-electricity/mcq14:
    title: "Current Electricity | Equation satisfying resonance condition - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice current electricity MCQ: Equation which satisfies resonance condition is? Options: X_L=X_C, f=1/(2π√LC), ω=1/√LC, All of above. Correct: All of above. Explanation: At resonance, X_L=X_C ⇒ ωL=1/ωC ⇒ ω=1/√LC ⇒ f=1/(2π√LC). All three are equivalent. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/current-electricity/mcq15:
    title: "Current Electricity | Impedance of RLC series circuit at resonance frequency - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice current electricity MCQ: At resonance frequency, impedance of RLC series circuit is? Options: Minimum, Zero, Maximum, None. Correct: Minimum. Explanation: At resonance, X_L=X_C, so Z=R, which is minimum possible impedance. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/current-electricity/mcq16:
    title: "Current Electricity | V_L and V_C at resonance in RLC series circuit - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice current electricity MCQ: At resonance frequency in RLC series circuit, V_L and V_C are? Options: Greater than source voltage, Smaller than source voltage, Equal to source voltage, None. Correct: Greater than source voltage. Explanation: At resonance, V_L=V_C and can be much larger than source voltage, known as voltage magnification. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/current-electricity/mcq17:
    title: "Current Electricity | Effect of increasing resistance on phase angle in series LCR circuit - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice current electricity MCQ: When resistance is increased in series LCR circuit? Options: Impedance decreases, Reactance increases, Phase angle increases, Phase angle decreases. Correct: Phase angle decreases. Explanation: tanφ = (X_L-X_C)/R. As R increases, tanφ decreases, so phase angle φ decreases. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/current-electricity/mcq18:
    title: "Current Electricity | Impedance of pure anti-resonant circuit at resonance - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice current electricity MCQ: Impedance of pure anti-resonant circuit at resonance is? Options: 0, 1/2, 1, ∞. Correct: ∞. Explanation: In parallel LC circuit at resonance, impedance becomes theoretically infinite (maximum). More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/current-electricity/mcq19:
    title: "Current Electricity | Effect of increasing resistance on quality factor Q of LCR circuit - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice current electricity MCQ: What happens to quality factor of LCR circuit if resistance is increased? Options: Increases, Decreases, Remains same, None. Correct: Decreases. Explanation: Q = ωL/R or 1/(ωCR). Q is inversely proportional to resistance. Increasing R decreases Q. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/current-electricity/mcq20:
    title: "Current Electricity | Phase relationship when AC voltage applied to inductor - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice current electricity MCQ: When AC voltage is applied to inductor? Options: Voltage leads current by 90°, Current leads voltage by 90°, Voltage and current in phase, None. Correct: Voltage leads current by 90°. Explanation: In purely inductive AC circuit, voltage leads current by 90° (π/2 radians). More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/current-electricity/mcq21:
    title: "Current Electricity | Phase angle between voltage and current in pure resistive AC circuit - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice current electricity MCQ: Phase angle between voltage and current in AC circuit consisting of resistance is? Options: Zero, 45°, 90°, 180°. Correct: Zero. Explanation: In purely resistive AC circuit, voltage and current are in phase, so phase angle is zero. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/current-electricity/mcq22:
    title: "Current Electricity | Assertion Reason: Average power zero in pure capacitor AC circuit - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice current electricity MCQ: Assertion: AC circuit with only capacitor has average power zero. Reason: Phase difference between current and voltage is 90°. Options: Both true and R explains A, Both true but R not correct explanation, A true R false, A false R true. Correct: Both true and R explains A. Explanation: Average power = V_rms I_rms cosφ. For φ=90°, cosφ=0, so power=0. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/current-electricity/mcq23:
    title: "Current Electricity | Phase diagram for inductor shows which relationship - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice current electricity MCQ: Phase diagram for inductor shows? Options: Voltage leads current, Current leads voltage, Voltage and current in phase, Voltage lags current. Correct: Voltage leads current. Explanation: In inductor, voltage leads current by 90°. Phasor diagram shows voltage on y-axis, current on x-axis. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/current-electricity/mcq24:
    title: "Current Electricity | Phase diagram for capacitor shows which relationship - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice current electricity MCQ: Phase diagram for capacitor shows? Options: Voltage leads current, Current leads voltage, Voltage and current in phase, Current lags voltage. Correct: Current leads voltage. Explanation: In capacitor, current leads voltage by 90°. Phasor diagram shows current on y-axis, voltage on x-axis. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/current-electricity/mcq25:
    title: "Current Electricity | Power factor is defined as - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice current electricity MCQ: Power factor is defined by? Options: cosθ, sinθ, tanθ, secθ. Correct: cosθ. Explanation: Power factor is cosine of phase angle between voltage and current: pf = cosθ = R/Z. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/current-electricity/mcq26:
    title: "Current Electricity | Voltage relationship in LCR series circuit - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice current electricity MCQ: In LCR series circuit, if V is effective applied voltage, V_R across R, V_L across L, V_C across C, then? Options: V=V_R+V_L+V_C, V²=V_R²+V_L²+V_C², V²=V_R²+(V_L-V_C)², V²=V_L²+(V_R-V_C)². Correct: V²=V_R²+(V_L-V_C)². Explanation: V_L and V_C are 180° out of phase, so they subtract: V²=V_R²+(V_L-V_C)². More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/current-electricity/mcq27:
    title: "Current Electricity | Maximum current in capacitor circuit with V=100 sin(10t), C=100µF - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice current electricity MCQ: Pure capacitor 100µF connected to AC voltage V=100 sin(10t). Maximum current is? Options: 10A, 1A, 0.1A, None. Correct: 0.1A. Explanation: X_C=1/(ωC)=1/(10×10⁻⁴)=1000Ω. I₀=V₀/X_C=100/1000=0.1A. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/current-electricity/mcq28:
    title: "Current Electricity | Capacitor is perfect insulator for which type of current - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice current electricity MCQ: Capacitor is perfect insulator for? Options: Direct current, Alternating current, Both, None. Correct: Direct current. Explanation: Capacitor blocks DC (acts as open circuit) but allows AC to pass. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/current-electricity/mcq29:
    title: "Current Electricity | Inductor stores energy in which field - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice current electricity MCQ: Inductor stores energy in its? Options: Magnetic field, Electric field, Coil, None. Correct: Magnetic field. Explanation: Inductor stores energy in magnetic field: U = ½LI². More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/current-electricity/mcq30:
    title: "Current Electricity | AC circuits are controlled by which components - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice current electricity MCQ: In AC circuits, current and voltage are controlled by? Options: Inductor L, Resistance R, Capacitance C, All of above. Correct: All of above. Explanation: All three components affect AC circuits: R opposes current, L opposes changes in current, C opposes changes in voltage. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/current-electricity/mcq31:
    title: "Current Electricity | Process of combining low frequency waves with high frequency is called - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice current electricity MCQ: Process of combining low frequency waves with high frequency is called? Options: Rectification, Amplification, Modulation, Magnification. Correct: Modulation. Explanation: Modulation combines low frequency information signal with high frequency carrier wave for transmission. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/current-electricity/mcq32:
    title: "Current Electricity | Electric and magnetic fields in electromagnetic waves are - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice current electricity MCQ: In electromagnetic waves, electric and magnetic fields are? Options: Perpendicular, Parallel, Antiparallel, At 45°. Correct: Perpendicular. Explanation: Electric field and magnetic field are perpendicular to each other and to direction of propagation. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/current-electricity/mcq33:
    title: "Current Electricity | Which circuit exhibits maximum power dissipation - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice current electricity MCQ: Which circuit exhibits maximum power dissipation? Options: Pure Inductive, Pure Capacitive, Pure Resistive, None. Correct: Pure Resistive. Explanation: In pure resistive circuit, all power is dissipated as heat. In purely reactive circuits, average power is zero. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/current-electricity/mcq34:
    title: "Current Electricity | Comparison of AC and DC transmission losses - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice current electricity MCQ: In comparison to DC, transmission losses in AC are? Options: Low, High, Negligible, None. Correct: Low. Explanation: AC transmission losses lower because voltage can be stepped up using transformers, reducing current and I²R losses. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/current-electricity/mcq35:
    title: "Current Electricity | Average power dissipated per cycle when V=V₀ cos ωt applied across resistor R - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice current electricity MCQ: Voltage V=V₀ cos ωt applied across resistor R. Average power dissipated per cycle is? Options: V₀²/2R, V₀²/R, V₀²/√2R, 2V₀²/R. Correct: V₀²/2R. Explanation: P_avg = V_rms²/R = (V₀/√2)²/R = V₀²/2R. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/current-electricity/mcq36:
    title: "Current Electricity | Capacitor blocks DC and offers easy path to AC - statements analysis - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice current electricity MCQ: Statement-I: Capacitor blocks DC and offers easy path to AC. Statement-II: Capacitive reactance inversely proportional to frequency. Options: Both correct, I correct II incorrect, II incorrect I correct, Both incorrect. Correct: Both correct. Explanation: Capacitor blocks DC (X_C=∞ at f=0) and allows AC (X_C decreases as frequency increases). More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/current-electricity/mcq37:
    title: "Current Electricity | AC instruments indicate which values - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice current electricity MCQ: In AC circuits, AC instruments indicate? Options: Peak values, Square of peak values, Square root of peak values, Virtual (RMS) values. Correct: Virtual (RMS) values. Explanation: AC instruments are calibrated to measure RMS (virtual) value, effective value equivalent to DC for power calculations. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/current-electricity/mcq38:
    title: "Current Electricity | Instrument that measures potential without drawing current - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice current electricity MCQ: Instrument which can measure potential without drawing any current is? Options: Voltmeter, Galvanometer, Cathode ray oscilloscope (CRO), Ammeter. Correct: Cathode ray oscilloscope (CRO). Explanation: CRO has very high input impedance and draws negligible current, ideal for measuring potential without loading circuit. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/current-electricity/mcq39:
    title: "Current Electricity | Form factor for sine wave is - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice current electricity MCQ: For sine wave, form factor is given by? Options: π/(2√2), π/2, √(2π), 2√2π. Correct: π/(2√2). Explanation: Form factor = RMS/Average = (V₀/√2)/(2V₀/π) = π/(2√2). More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/current-electricity/mcq40:
    title: "Current Electricity | AC to DC conversion device - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice current electricity MCQ: Alternating current is converted to direct current by? Options: Dynamo, Motor, Transformer, Rectifier. Correct: Rectifier. Explanation: Rectifier converts AC to DC. Dynamo produces AC, motor converts electrical to mechanical, transformer changes voltage levels. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/current-electricity/mcq41:
    title: "Current Electricity | Peak current in inductor with 1H across 220V 50Hz supply - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice current electricity MCQ: Inductor of 1H connected across 220V, 50Hz supply. Peak current is approximately? Options: 0.5A, 0.7A, 1A, 1.4A. Correct: 1A. Explanation: X_L=2πfL=100π≈314Ω. I_rms=220/314≈0.7A. I₀=√2×I_rms≈1.414×0.7≈1A. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/current-electricity/mcq42:
    title: "Current Electricity | Two coaxial loops approaching each other - current change - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice current electricity MCQ: Two identical coaxial circular loops carry equal currents in same direction. If loops approach each other, current in? Options: Each increases, Each decreases, Remains same, One increases other decreases. Correct: Each decreases. Explanation: When loops approach, magnetic flux increases. By Lenz's law, induced current opposes change, so current decreases. More entry test MCQs at NotesPrep."  
    https://notesprep.com/entry-tests/mcqs/derivatives-and-integration/mcq1:
    title: "Derivatives and Integration | Slope of tangent to curve y = x³ + 5 at point (1,2) - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice derivatives and integration MCQ: Slope of tangent to curve y = x³ + 5 at point (1,2) is? Options: 6, 2, 5, 3. Correct: 3. Explanation: dy/dx = 3x². At (1,2), slope = 3(1)² = 3. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/derivatives-and-integration/mcq2:
    title: "Derivatives and Integration | Differentiate sin(2x) with respect to x - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice derivatives and integration MCQ: Differentiate sin(2x) with respect to x. Options: 2cos(2x), 2sin(2x), 2(1-sin²x), Both a and c. Correct: 2cos(2x). Explanation: Using chain rule: d/dx[sin(2x)] = cos(2x) × d/dx(2x) = 2cos(2x). More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/derivatives-and-integration/mcq3:
    title: "Derivatives and Integration | Derivative of 3²ˣ - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice derivatives and integration MCQ: Find derivative of 3²ˣ. Options: 2ln3×3²ˣ, ln3×3²ˣ, 2x×3²ˣ, ln2×3²ˣ. Correct: 2ln3×3²ˣ. Explanation: Let y=3²ˣ. ln y = 2x ln3. Differentiate: (1/y)dy/dx = 2ln3 ⇒ dy/dx = 2ln3·y = 2ln3·3²ˣ. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/derivatives-and-integration/mcq4:
    title: "Derivatives and Integration | Differentiate ln(e) with respect to x - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice derivatives and integration MCQ: Differentiate ln(e) with respect to x. Options: 1/e, 0, 1/x, e. Correct: 0. Explanation: ln(e)=1 (constant). Derivative of constant with respect to x is 0. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/derivatives-and-integration/mcq5:
    title: "Derivatives and Integration | Derivative of csc⁻¹ x - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice derivatives and integration MCQ: Derivative of csc⁻¹ x is? Options: -1/(|x|√(x²-1)), -1/(|x|√(x²+1)), 1/(|x|√(x²-1)), -1/√(x²-1). Correct: -1/(|x|√(x²-1)). Explanation: Derivative of csc⁻¹ x is -1/(|x|√(x²-1)) for |x|>1. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/derivatives-and-integration/mcq6:
    title: "Derivatives and Integration | Derivative of tan(√x) - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice derivatives and integration MCQ: Derivative of tan(√x) is? Options: sec²(√x), (1/√2)sec²(√x), sec²(√x)/(2√x), sec²(√x)tan(1/(2√x)). Correct: sec²(√x)/(2√x). Explanation: Chain rule: d/dx[tan(√x)] = sec²(√x) × d/dx(√x) = sec²(√x) × 1/(2√x). More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/derivatives-and-integration/mcq7:
    title: "Derivatives and Integration | Fourth derivative of f(x) = 8⁴ˣ - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice derivatives and integration MCQ: Fourth derivative of f(x)=8⁴ˣ is? Options: 64·8⁴ˣ(ln8), 256·8⁴ˣ(ln8)⁴, 256·8⁴ˣ(ln8), 64·8⁴ˣ(ln8)⁴. Correct: 256·8⁴ˣ(ln8)⁴. Explanation: d/dx(8⁴ˣ)=8⁴ˣ·4ln8. Fourth derivative = 8⁴ˣ·(4ln8)⁴ = 8⁴ˣ·256(ln8)⁴. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/derivatives-and-integration/mcq8:
    title: "Derivatives and Integration | Find d²y/dx² given x=2at², y=at⁴ - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice derivatives and integration MCQ: If x=2at², y=at⁴, then d²y/dx² = ? Options: t², 2a, 1/(2a), t/(2a). Correct: 1/(2a). Explanation: dy/dx = (dy/dt)/(dx/dt) = (4at³)/(4at)=t². d²y/dx² = d/dt(t²)·dt/dx = 2t·1/(4at)=1/(2a). More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/derivatives-and-integration/mcq9:
    title: "Derivatives and Integration | nth order derivative of (ax+b)ⁿ - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice derivatives and integration MCQ: nth order derivative of (ax+b)ⁿ is? Options: (n-1)!aⁿ⁻¹, (-1)ⁿn!aⁿ(ax+b), n!aⁿ, 0. Correct: n!aⁿ. Explanation: y=(ax+b)ⁿ. y'=n(ax+b)ⁿ⁻¹·a, y''=n(n-1)(ax+b)ⁿ⁻²·a². nth derivative = n!aⁿ. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/derivatives-and-integration/mcq10:
    title: "Derivatives and Integration | nth derivative of y = ln x - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice derivatives and integration MCQ: If y=ln x (x>0), then dⁿy/dxⁿ = ? Options: (n-1)!x⁻ⁿ, n!x⁻ⁿ, (-1)ⁿn!x⁻ⁿ, (-1)ⁿ⁻¹(n-1)!x⁻ⁿ. Correct: (-1)ⁿ⁻¹(n-1)!x⁻ⁿ. Explanation: y'=x⁻¹, y''=-x⁻², y'''=2x⁻³, y⁽⁴⁾=-6x⁻⁴. Pattern: y⁽ⁿ⁾=(-1)ⁿ⁻¹(n-1)!x⁻ⁿ. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/derivatives-and-integration/mcq11:
    title: "Derivatives and Integration | Method to differentiate f(x,y)=c - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice derivatives and integration MCQ: Function of form f(x,y)=c can be differentiated using? Options: Chain Rule, Implicit differentiation, Product Rule, Newton's method. Correct: Implicit differentiation. Explanation: Equations where x and y not easily separated are differentiated using implicit differentiation, treating y as function of x. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/derivatives-and-integration/mcq12:
    title: "Derivatives and Integration | Find dy/dx if xʸ = eˣ⁻ʸ - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice derivatives and integration MCQ: If xʸ = eˣ⁻ʸ, then dy/dx = ? Options: x/(1+lnx), (1-lnx)/(1+lnx), eˣ/(1+lnx), lnx/(1+lnx). Correct: (1-lnx)/(1+lnx). Explanation: Taking ln: y lnx = x-y ⇒ y(lnx+1)=x ⇒ y=x/(1+lnx). Differentiating gives dy/dx = lnx/(1+lnx)² which simplifies to (1-lnx)/(1+lnx). More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/derivatives-and-integration/mcq13:
    title: "Derivatives and Integration | Value of dy/dx at (2,1) for curve x²+xy+y²=2 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice derivatives and integration MCQ: Value of dy/dx at (2,1) for curve x²+xy+y²=2 is? Options: 4/5, -5/4, 1/2, 2. Correct: -5/4. Explanation: Differentiate: 2x+y+x(dy/dx)+2y(dy/dx)=0 ⇒ dy/dx(x+2y)=-2x-y ⇒ dy/dx=(-2x-y)/(x+2y). At (2,1): (-4-1)/(2+2)=-5/4. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/derivatives-and-integration/mcq14:
    title: "Derivatives and Integration | If f'(c)=0 and f''(c)>0 then which is true - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice derivatives and integration MCQ: Let f'(x) be such that f'(c)=0. If f''(c)>0, then? Options: Relative min concave down, Relative max concave up, Relative max concave down, Relative min concave up. Correct: Relative min concave up. Explanation: f'(c)=0 and f''(c)>0 means function has relative minimum at x=c and is concave up. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/derivatives-and-integration/mcq15:
    title: "Derivatives and Integration | Condition for neither maxima nor minima at x=a when f'(a)=0 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice derivatives and integration MCQ: Function f has neither maxima nor minima at x=a if f'(a)=0 and? Options: f''(a)<0, f''(a)>0, f''(a)=0, None. Correct: f''(a)=0. Explanation: If f'(a)=0 and f''(a)=0, test is inconclusive and function may have point of inflection, neither max nor min. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/derivatives-and-integration/mcq16:
    title: "Derivatives and Integration | Abscissa where tangents parallel to x-axis for y=x³-3x²-9x+5 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice derivatives and integration MCQ: Abscissa of points where tangents to curve y=x³-3x²-9x+5 are parallel to x-axis are? Options: x=-1,3; x=-3,1; x=1,-1; x=3,-3. Correct: x=-1,3. Explanation: Tangents parallel to x-axis have slope 0. f'(x)=3x²-6x-9=0 ⇒ x²-2x-3=0 ⇒ (x-3)(x+1)=0 ⇒ x=-1,3. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/derivatives-and-integration/mcq17:
    title: "Derivatives and Integration | Interval where y = x²e⁻ˣ increases strictly - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice derivatives and integration MCQ: Let y=x²e⁻ˣ, interval in which y increases strictly with respect to x is? Options: (-∞,∞), (0,2), (-∞,e), (0,1/e). Correct: (0,2). Explanation: y'=2xe⁻ˣ-x²e⁻ˣ=xe⁻ˣ(2-x). For increasing, y'>0 ⇒ x(2-x)>0 ⇒ 0<x<2. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/derivatives-and-integration/mcq18:
    title: "Derivatives and Integration | f(x)=ln x/x has which type of point at x=e - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice derivatives and integration MCQ: If f(x)=ln x/x has ______ at x=e. Options: Maximum point, Minimum point, Point of inflection, None. Correct: Maximum point. Explanation: f'(x)=(1-lnx)/x². Setting f'(x)=0 ⇒ lnx=1 ⇒ x=e. f''(e)=-1/e³<0, so maximum. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/derivatives-and-integration/mcq19:
    title: "Derivatives and Integration | Rate of change of area of rectangle - length decreasing 3cm/s, width increasing 2cm/s - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice derivatives and integration MCQ: Length x decreasing at 3cm/s, width y increasing at 2cm/s. Rate of change of area at x=10cm, y=6cm? Options: 1, 2, 3, 2.5 cm²/sec. Correct: 2 cm²/sec. Explanation: dA/dt = x(dy/dt)+y(dx/dt) = 10(2)+6(-3)=20-18=2 cm²/sec. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/derivatives-and-integration/mcq20:
    title: "Derivatives and Integration | Approximate error in sphere volume when radius measured as 5cm with error 0.01cm - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice derivatives and integration MCQ: Radius of sphere measured as 5cm with error 0.01cm. Approximate error in volume is? Options: π, 2π, 1.5π, 2.5π cm³. Correct: π cm³. Explanation: V=4/3πr³, dV=4πr²dr=4π(25)(0.01)=π cm³. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/derivatives-and-integration/mcq21:
    title: "Derivatives and Integration | Integrate x/(x²+1) dx - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice derivatives and integration MCQ: ∫ x/(x²+1) dx = ? Options: ln|x²+1|+c, ½ln|x²+1|+c, -ln|x²+1|+c, -½ln|x²+1|+c. Correct: ½ln|x²+1|+c. Explanation: Let u=x²+1, du=2xdx ⇒ xdx=du/2. Integral = ½∫ du/u = ½ln|u|+c = ½ln|x²+1|+c. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/derivatives-and-integration/mcq22:
    title: "Derivatives and Integration | Definite integral ∫₀¹ 1/(x²+1) dx - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice derivatives and integration MCQ: ∫₀¹ 1/(x²+1) dx = ? Options: π/2, 2π, π/4, -2π. Correct: π/4. Explanation: ∫ dx/(x²+1)=tan⁻¹x. From 0 to 1: tan⁻¹(1)-tan⁻¹(0)=π/4-0=π/4. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/derivatives-and-integration/mcq23:
    title: "Derivatives and Integration | Integral of aˣ dx - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice derivatives and integration MCQ: ∫ aˣ dx = ? Options: aˣ/k + c, aˣ/ln a + c, aᵏ ln a + c, (ln a/k)aᵏ + c. Correct: aˣ/ln a + c. Explanation: Derivative of aˣ/ln a is aˣ, so ∫ aˣ dx = aˣ/ln a + c. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/derivatives-and-integration/mcq24:
    title: "Derivatives and Integration | Integrate √(sin x) cos x dx - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice derivatives and integration MCQ: ∫ √(sin x) cos x dx = ? Options: ln|sin x|+C, ⅔ sin³/² x+C, sin²x+C, -cos x+C. Correct: ⅔ sin³/² x+C. Explanation: Let u=sin x, du=cos x dx. ∫√u du = ∫u¹/² du = ⅔ u³/² + C = ⅔ sin³/² x + C. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/derivatives-and-integration/mcq25:
    title: "Derivatives and Integration | Integral of dx/x - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice derivatives and integration MCQ: ∫ dx/x is equal to? Options: ln|x|+c, log₁₀ x+c, x²/2+c, None. Correct: ln|x|+c. Explanation: Integral of 1/x with respect to x is ln|x|+c. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/derivatives-and-integration/mcq26:
    title: "Derivatives and Integration | Integrate xeˣ dx by parts - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice derivatives and integration MCQ: ∫ xeˣ dx = ? Options: xeˣ-eˣ+c, xeˣ+eˣ+c, eˣ+ex+c, xeˣ+c. Correct: xeˣ-eˣ+c. Explanation: Using integration by parts with u=x, dv=eˣdx: ∫xeˣdx = xeˣ - ∫eˣdx = xeˣ-eˣ+c. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/derivatives-and-integration/mcq27:
    title: "Derivatives and Integration | Integral of dx/√(a²-x²) - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice derivatives and integration MCQ: ∫ dx/√(a²-x²) = ? Options: cos⁻¹(x/a)+c, sin⁻¹(x/a)+c, sin⁻¹(x/a)+c, sin⁻¹x+c. Correct: sin⁻¹(x/a)+c. Explanation: Standard integral: ∫ dx/√(a²-x²) = sin⁻¹(x/a)+c. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/derivatives-and-integration/mcq28:
    title: "Derivatives and Integration | Substitution to convert ∫ eˣ/(1+e²ˣ) dx to ∫ du/(1+u²) - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice derivatives and integration MCQ: Which substitution would convert ∫ eˣ/(1+e²ˣ) dx into ∫ 1/(1+u²) du? Options: u=e²ˣ, u=eˣ, u=1+e²ˣ, u=ln x. Correct: u=eˣ. Explanation: Let u=eˣ, du=eˣdx. Integral becomes ∫ du/(1+u²). More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/derivatives-and-integration/mcq29:
    title: "Derivatives and Integration | Substitution for ∫ x² cos(x³+8) dx - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice derivatives and integration MCQ: Which matches integrand ∫ x² cos(x³+8) dx to its substituted form? Options: ∫ cos t dt, ∫ ⅓ cos t dt, ∫ cos(x³) dt, ∫ cos(x²) dt. Correct: ∫ ⅓ cos t dt. Explanation: Let t=x³+8, dt=3x²dx ⇒ x²dx=⅓dt. Integral becomes ⅓∫ cos t dt. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/derivatives-and-integration/mcq30:
    title: "Derivatives and Integration | Evaluate ∫ sec²(5x) dx using substitution - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice derivatives and integration MCQ: Evaluate ∫ sec²(5x) dx using substitution. Options: tan(5x)+C, ⅕ tan(5x)+C, 5 tan(5x)+C, tan x+C. Correct: ⅕ tan(5x)+C. Explanation: Let u=5x, du=5dx ⇒ dx=du/5. ∫ sec²u·du/5 = ⅕ tan u + C = ⅕ tan(5x)+C. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/derivatives-and-integration/mcq31:
    title: "Derivatives and Integration | Appropriate substitution for ∫ √(x²-a²) dx - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice derivatives and integration MCQ: Appropriate substitution for ∫ √(x²-a²) dx is? Options: x=a sinθ, x=a tanθ, x=a secθ, x=a cosθ. Correct: x=a secθ. Explanation: For integrals involving √(x²-a²), substitution x=a secθ gives √(x²-a²)=a tanθ. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/derivatives-and-integration/mcq32:
    title: "Derivatives and Integration | Expanded form of ∫ (2+x)√x dx - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice derivatives and integration MCQ: Match ∫ (2+x)√x dx to its expanded form. Options: ∫ (2x√x+x²√x)dx, ∫ (2x+x²)dx, ∫ (2√x+x)dx, ∫ √u du. Correct: ∫ (2x√x+x²√x)dx. Explanation: (2+x)√x = 2√x + x√x = 2x¹/² + x³/² = 2x√x + x²√x. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/derivatives-and-integration/mcq33:
    title: "Derivatives and Integration | Integrate ∫ xeˣ/(x+1)² dx - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice derivatives and integration MCQ: ∫ xeˣ/(x+1)² dx is equal to? Options: eˣ/(x+1)+c, eˣ(x+1)+c, -eˣ/(x+1)+c, eˣ/(x²+1)+c. Correct: eˣ/(x+1)+c. Explanation: x/(x+1)² = 1/(x+1)-1/(x+1)². Using ∫eˣ[f(x)+f'(x)]dx=eˣf(x)+c with f(x)=1/(x+1). More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/derivatives-and-integration/mcq34:
    title: "Derivatives and Integration | Integrate sin 2x cos 3x dx - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice derivatives and integration MCQ: ∫ sin 2x cos 3x dx = ? Options: ½ cos x - 1/10 cos 5x + c, 1/10 cos x + ½ cos 5x + c, ½ sin x - 1/10 sin 5x + c, None. Correct: ½ sin x - 1/10 sin 5x + c. Explanation: Using 2sinAcosB = sin(A+B)+sin(A-B): sin2x cos3x = ½[sin5x - sinx]. Integrating gives -1/10 cos5x + ½ cosx + c. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/derivatives-and-integration/mcq35:
    title: "Derivatives and Integration | Integrate sin⁻¹ x dx - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice derivatives and integration MCQ: ∫ sin⁻¹ x dx = ? Options: x sin⁻¹ x + √(1-x²)+c, x sin⁻¹ x - √(1-x²)+c, x sin x + sin⁻¹√(1-x²)+c, Not possible. Correct: x sin⁻¹ x + √(1-x²)+c. Explanation: Integration by parts: u=sin⁻¹x, dv=dx. ∫ sin⁻¹x dx = x sin⁻¹x - ∫ x/√(1-x²)dx = x sin⁻¹x + √(1-x²)+c. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/derivatives-and-integration/mcq36:
    title: "Derivatives and Integration | Find f(x) if ∫ f(x) dx = cosh⁻¹ x + c - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice derivatives and integration MCQ: If ∫ f(x) dx = cosh⁻¹ x + c, then f(x)=? Options: -1/√(1-x²), 1/√(x²-1), 1/√(1+x²), 1/(1+x²). Correct: 1/√(x²-1). Explanation: Derivative of cosh⁻¹ x is 1/√(x²-1) for x>1. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/derivatives-and-integration/mcq37:
    title: "Derivatives and Integration | Find f(x) if ∫ f(x) dx = ln|csc x - cot x| + C - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice derivatives and integration MCQ: If ∫ f(x) dx = ln|csc x - cot x| + C, then f(x) is? Options: sec x, csc x, tan x, None. Correct: csc x. Explanation: Derivative of ln|csc x - cot x| is csc x. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/derivatives-and-integration/mcq38:
    title: "Derivatives and Integration | Improper integral ∫₀^∞ 1/(x²+1) dx - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice derivatives and integration MCQ: ∫₀^∞ 1/(x²+1) dx = ? Options: π/2, -π/2, 0, π/3. Correct: π/2. Explanation: ∫ dx/(x²+1)=tan⁻¹x. As x→∞, tan⁻¹x→π/2. So from 0 to ∞: π/2-0=π/2. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/derivatives-and-integration/mcq39:
    title: "Derivatives and Integration | Area of circle radius a by integration - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice derivatives and integration MCQ: Area of circle centre at origin radius a is given by integral? Options: ∫₀ᵃ √(a²-x²)dx, ∫₀²ᵖⁱ √(a²-x²)dx, 4∫₀ᵃ √(a²-x²)dx, 2∫₀ᵃ √(a²-x²)dx. Correct: 4∫₀ᵃ √(a²-x²)dx. Explanation: Circle equation x²+y²=a². In first quadrant y=√(a²-x²). Area in first quadrant=∫₀ᵃ√(a²-x²)dx. Total area=4× this. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/derivatives-and-integration/mcq40:
    title: "Derivatives and Integration | Integrate (3x+1)/(x²-x-6) by partial fractions - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice derivatives and integration MCQ: ∫ (3x+1)/(x²-x-6) dx = ? Options: ln|x+3|+2ln|x-2|+C, 2ln|x-3|+ln|x+2|+C, ln|x-3|+ln|x-2|+C, 2ln|x-3|+ln|x+2|+C. Correct: 2ln|x-3|+ln|x+2|+C. Explanation: Factor: x²-x-6=(x-3)(x+2). Partial fractions give A=2, B=1. Integrate: 2ln|x-3|+ln|x+2|+C. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/derivatives-and-integration/mcq41:
    title: "Derivatives and Integration | Partial fractions decomposition of 1/(x³-1) - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice derivatives and integration MCQ: Partial fractions decomposition of 1/(x³-1) is? Options: A/(x-1)+B/(x-1)²+C/(x-1)³, A/(x-1)+(Bx+C)/(x²+x+1), A/(x-1)+B/(x²+x), None. Correct: A/(x-1)+(Bx+C)/(x²+x+1). Explanation: x³-1=(x-1)(x²+x+1). x²+x+1 irreducible, so decomposition is A/(x-1)+(Bx+C)/(x²+x+1). More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/derivatives-and-integration/mcq42:
    title: "Derivatives and Integration | Integrate xˣ(1+ln x) dx - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice derivatives and integration MCQ: ∫ xˣ(1+ln x) dx = ? Options: xˣ+c, xˣ ln x+c, eˣˣ+c, None. Correct: xˣ+c. Explanation: Let t=xˣ. ln t = x ln x. Differentiating: (1/t)dt/dx = ln x+1 ⇒ dt = xˣ(1+ln x)dx. So ∫ xˣ(1+ln x)dx = ∫ dt = t+c = xˣ+c. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/derivatives-and-integration/mcq43:
    title: "Derivatives and Integration | Integrate eᶠ⁽ˣ⁾ f'(x) dx - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice derivatives and integration MCQ: ∫ eᶠ⁽ˣ⁾ f'(x) dx = ? Options: ln|f(x)|+c, f'(x)+c, eᶠ⁽ˣ⁾+c, f(x)eᶠ⁽ˣ⁾+c. Correct: eᶠ⁽ˣ⁾+c. Explanation: Let u=f(x), du=f'(x)dx. Then ∫ eᵘ du = eᵘ+c = eᶠ⁽ˣ⁾+c. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/derivatives-and-integration/mcq44:
    title: "Derivatives and Integration | Integrate sin(tan⁻¹x)/(1+x²) dx - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice derivatives and integration MCQ: ∫ sin(tan⁻¹x)/(1+x²) dx = ? Options: sin(tan⁻¹x)+c, tan(sin⁻¹x)+c, -cos(tan⁻¹x)+c, Not possible. Correct: -cos(tan⁻¹x)+c. Explanation: Let t=tan⁻¹x, dt=dx/(1+x²). Integral = ∫ sin t dt = -cos t + c = -cos(tan⁻¹x)+c. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/derivatives-and-integration/mcq45:
    title: "Derivatives and Integration | Integrate dx/(sin²x cos²x) - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice derivatives and integration MCQ: ∫ dx/(sin²x·cos²x) = ? Options: tan x+cot x+c, tan x-cot x+c, tan x cot x+c, tan x-cot 2x+c. Correct: tan x-cot x+c. Explanation: 1/(sin²x cos²x) = (sin²x+cos²x)/(sin²x cos²x)=sec²x+csc²x. Integrating gives tan x - cot x + c. More entry test MCQs at NotesPrep."
    
    https://notesprep.com/entry-tests/mcqs/differential-equations/mcq1:
    title: "Differential Equations | Equation involving derivatives of dependent variables w.r.t one independent variable is called - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice differential equations MCQ: Equation involving derivatives of dependent variables w.r.t one independent variable is called? Options: Ordinary differential equation, Partial differential equation, Integral equation, Partial integral-differential equation. Correct: Ordinary differential equation. Explanation: ODE involves derivatives with respect to a single independent variable. PDE involves derivatives with respect to multiple independent variables. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/differential-equations/mcq2:
    title: "Differential Equations | An ordinary differential equation has - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice differential equations MCQ: An ordinary differential equation has? Options: Only one dependent and one independent variable; One dependent and multiple independent variables; One independent and one or more dependent variables; Multiple independent and dependent variables. Correct: Only one dependent and one independent variable. Explanation: ODE involves derivatives of dependent variables with respect to a single independent variable. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/differential-equations/mcq3:
    title: "Differential Equations | Order of a differential equation is always - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice differential equations MCQ: The order of a differential equation is always? Options: Natural number, Whole number, Positive integer, Undefined. Correct: Positive integer. Explanation: Order is the highest order derivative present in the equation. It is always a positive integer (1,2,3,...). More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/differential-equations/mcq4:
    title: "Differential Equations | Power of highest derivative appearing is called - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice differential equations MCQ: Power of the highest derivative appearing in a differential equation is called its? Options: Degree, Order, Power, Index. Correct: Degree. Explanation: Degree is defined as the power (exponent) of the highest order derivative, provided the equation is a polynomial in its derivatives. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/differential-equations/mcq5:
    title: "Differential Equations | Degree of (dy/dx)⁵ + (d²y/dx²)² + y = 3 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice differential equations MCQ: Degree of equation (dy/dx)⁵ + (d²y/dx²)² + y = 3 is? Options: 5, 2, 3, 1. Correct: 2. Explanation: Degree is the power of the highest order derivative. Highest order derivative is d²y/dx² (order 2), its power is 2. Therefore degree is 2. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/differential-equations/mcq6:
    title: "Differential Equations | When is a differential equation linear - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice differential equations MCQ: A differential equation is linear if? Options: Dependent variable and all derivatives occur to first degree; No product terms involving dependent variable and its derivatives; No transcendental functions of derivatives; All of the above. Correct: All of the above. Explanation: Linear DE must satisfy all three conditions: first degree only, no products, no transcendental functions of dependent variable or derivatives. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/differential-equations/mcq7:
    title: "Differential Equations | Identify linearity of 2 dy/dx + x²y = x + 2 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice differential equations MCQ: The differential equation 2 dy/dx + x²y = x + 2 is? Options: Linear, Non-linear, Linear with fixed constant, Undetermined. Correct: Linear. Explanation: Equation can be written as dy/dx + (x²/2)y = x/2 + 1, which is of the form dy/dx + P(x)y = Q(x), the standard form of first-order linear DE. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/differential-equations/mcq8:
    title: "Differential Equations | Identify which ordinary differential equation is non-linear - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice differential equations MCQ: Which ordinary differential equation is non-linear? Options: d²y/dx²+2x dy/dx+y=3; d²y/dx²+4y(dy/dx)²+2y=cos x; dy/dt=-32; d²y/dx²+3 dy/dx+11y=3x. Correct: d²y/dx²+4y(dy/dx)²+2y=cos x. Explanation: Non-linear if it contains products of dependent variable and its derivatives or derivative power other than 1. Option b contains term 4y(dy/dx)², product of y and square of derivative. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/differential-equations/mcq9:
    title: "Differential Equations | Classify a dy + b sin x dx = 0 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice differential equations MCQ: The differential equation a dy + b sin x dx = 0 is? Options: Linear & Separable, Homogeneous, Separable, Non-separable. Correct: Linear & Separable. Explanation: Rewrite as dy = -(b/a) sin x dx, which is separable. Also linear (P(x)=0). Therefore both linear and separable. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/differential-equations/mcq10:
    title: "Differential Equations | Classify d²y/dx² + 3y = x²y - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice differential equations MCQ: The differential equation d²y/dx² + 3y = x²y is? Options: Separable and linear; Separable but not linear; Linear but not separable; Neither separable nor linear. Correct: Linear but not separable. Explanation: Rewrite as d²y/dx² + (3-x²)y = 0. Linear because y and derivatives appear to first degree with no products. Not separable because cannot be written as product of function of x and function of y. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/differential-equations/mcq11:
    title: "Differential Equations | Classify eˣ dy/dx + 3y = x²y - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice differential equations MCQ: The differential equation eˣ dy/dx + 3y = x²y is? Options: Separable but not linear; Linear but not separable; Separable and linear; Neither separable nor linear. Correct: Linear but not separable. Explanation: Rewrite as eˣ dy/dx + (3-x²)y = 0. Linear because y and derivative appear to first degree. Not separable due to term (3-x²)y mixing x and y. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/differential-equations/mcq12:
    title: "Differential Equations | Classify x dy/dx = x + y - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice differential equations MCQ: The differential equation x dy/dx = x + y is? Options: Non-linear, Linear, Homogeneous, None. Correct: Homogeneous. Explanation: Rewrite as dy/dx = 1 + y/x. Right-hand side is function of y/x, so it is homogeneous. Also linear (x dy/dx - y = x). More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/differential-equations/mcq13:
    title: "Differential Equations | Differential equation of curve y = a sin(x - b) - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice differential equations MCQ: Differential equation of curve y = a sin(x - b) is? Options: d²y/dx² - y = 0; dy/dx = cos x = 0; d²y/dx² + y = 0; None. Correct: d²y/dx² + y = 0. Explanation: y = a sin(x-b). dy/dx = a cos(x-b). d²y/dx² = -a sin(x-b) = -y. Therefore d²y/dx² + y = 0. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/differential-equations/mcq14:
    title: "Differential Equations | Differential equation of family of parabolas with vertex at origin and focus at (a,0) - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice differential equations MCQ: Differential equation of family of parabolas with vertex at origin and focus at (a,0) is? Options: x dx - 2y dy = 0; y dx + 2x dy = 0; y dx - 2x dy = 0; x dx + 2y dy = 0. Correct: y dx - 2x dy = 0. Explanation: Parabola equation y²=4ax. Differentiate: 2y dy/dx = 4a. From original, 4a = y²/x. Substitute: 2y dy/dx = y²/x ⇒ 2x dy = y dx ⇒ y dx - 2x dy = 0. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/differential-equations/mcq15:
    title: "Differential Equations | General solution of y' = y sec x - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice differential equations MCQ: General solution of y' = y sec x is? Options: y = C sec x tan x; y = C(sec x - tan x); y = C sec x/tan x; y = C(sec x + tan x). Correct: y = C(sec x + tan x). Explanation: Separable: dy/y = sec x dx. Integrate: ln|y| = ln|sec x + tan x| + C ⇒ y = C(sec x + tan x). More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/differential-equations/mcq16:
    title: "Differential Equations | General solution of d²y/dx² = 1 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice differential equations MCQ: General solution of d²y/dx² = 1 is? Options: y = x² + c₁x + c₂; y = ½x² + c₁x + c₂; y = x² + c₁x¹/² + c₂; y = x² + c₁x¹/² + c₂. Correct: y = ½x² + c₁x + c₂. Explanation: Integrate once: dy/dx = x + c₁. Integrate again: y = ½x² + c₁x + c₂. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/differential-equations/mcq17:
    title: "Differential Equations | General solution of dy/dx = e⁻ˣ⁻ʸ - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice differential equations MCQ: General solution of dy/dx = e⁻ˣ⁻ʸ is? Options: eˣ + eʸ = C; eˣ - eʸ = C; eʸ + e⁻ˣ = C; eˣ + e⁻ʸ = C. Correct: eʸ + e⁻ˣ = C. Explanation: dy/dx = e⁻ˣe⁻ʸ ⇒ eʸ dy = e⁻ˣ dx. Integrate: eʸ = -e⁻ˣ + C ⇒ eʸ + e⁻ˣ = C. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/differential-equations/mcq18:
    title: "Differential Equations | General solution of sec²x tan y dx + sec²y tan x dy = 0 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice differential equations MCQ: General solution of sec²x tan y dx + sec²y tan x dy = 0 is? Options: tan x·tan y = c; tan x + tan y = c; tan x - tan y = c; tan x/tan y = c. Correct: tan x·tan y = c. Explanation: Separate: (sec²x/tan x)dx + (sec²y/tan y)dy = 0. Integrate: ln|tan x| + ln|tan y| = ln|C| ⇒ tan x·tan y = C. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/differential-equations/mcq19:
    title: "Differential Equations | Curve with slope (x+y) passing through origin - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice differential equations MCQ: Slope of tangent at every point of curve is (x+y). If curve passes through origin, its equation is? Options: y = eˣ - x - 1; y = -eˣ + x + 1; y = x; y = 2eˣ + x - 2. Correct: y = eˣ - x - 1. Explanation: dy/dx = x+y ⇒ dy/dx - y = x. Integrating factor e⁻ˣ. Solution: ye⁻ˣ = ∫xe⁻ˣdx = -xe⁻ˣ - e⁻ˣ + C ⇒ y = -x-1+Ceˣ. Using y(0)=0 ⇒ C=1 ⇒ y = eˣ - x - 1. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/differential-equations/mcq20:
    title: "Differential Equations | Solution domain for initial value problem dy/dx = (1-x)/y, y(-1)=1 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice differential equations MCQ: Solution of dy/dx = (1-x)/y, y(-1)=1 is defined for? Options: x<0, x>0, |x|<5, All real x. Correct: |x|<5. Explanation: Separate: y dy = (1-x)dx ⇒ y²/2 = x - x²/2 + C. Using y(-1)=1: 1 = -2 - 1/2 + C? Actually solve: y² = 2x - x² + 2C. With y(-1)=1: 1 = -2 -1 + 2C ⇒ 2C=4 ⇒ C=2. So y² = 2x - x² + 4 = 5 - (x-1)². Need 5-(x-1)² ≥ 0 ⇒ |x-1| ≤ √5 ≈2.236. This interval is contained in |x|<5. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/differential-equations/mcq21:
    title: "Differential Equations | Orthogonal trajectories of y = x² + c - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice differential equations MCQ: For y = x² + c, equation of orthogonal trajectories is? Options: 2y = ln(c/√x); y = ln(c√x); y = ln(c/√x); y = ln(√x/c). Correct: y = ln(c/√x). Explanation: dy/dx = 2x. Replace dy/dx with -dx/dy: -dx/dy = 2x ⇒ dx/x = -2 dy. Integrate: ln|x| = -2y + C ⇒ 2y = -ln|x| + C ⇒ y = ln(c/√x). More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/differential-equations/mcq22:
    title: "Differential Equations | Homogeneous function f(x,y) of degree n can be written as - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice differential equations MCQ: f(x,y) is homogeneous function of degree n if? Options: f(x,y)=yⁿg(y/x); f(x,y)=xⁿg(y/x); f(x,y)=xⁿg(y/x); All of these. Correct: f(x,y)=xⁿg(y/x). Explanation: Homogeneous of degree n if f(tx,ty)=tⁿf(x,y). Can be written as f(x,y)=xⁿg(y/x) or f(x,y)=yⁿh(x/y). More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/differential-equations/mcq23:
    title: "Differential Equations | Degree of homogeneous function f(x,y) = (√x + √y)/(x+y) - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice differential equations MCQ: Degree of homogeneous function f(x,y) = (√x + √y)/(x+y) is? Options: 1, 0, 1/2, -1/2. Correct: -1/2. Explanation: f(λx,λy) = (√λ√x+√λ√y)/(λx+λy) = √λ(√x+√y)/[λ(x+y)] = λ⁻¹/²·(√x+√y)/(x+y) = λ⁻¹/² f(x,y). Therefore degree = -1/2. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/differential-equations/mcq24:
    title: "Differential Equations | Euler's theorem: x ∂z/∂x + y ∂z/∂y for z = xy f(y/x) - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice differential equations MCQ: If z = xy f(y/x), then x ∂z/∂x + y ∂z/∂y = ? Options: z/2, 2z, z, -2z. Correct: 2z. Explanation: z = xy f(y/x) is homogeneous of degree 2 (xy is degree 2, f(y/x) is degree 0). By Euler's theorem, x ∂z/∂x + y ∂z/∂y = nz = 2z. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/differential-equations/mcq25:
    title: "Differential Equations | Euler's theorem: x ∂z/∂x + y ∂z/∂y for z = (√x+√y)/(x+y) - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice differential equations MCQ: If z = (√x+√y)/(x+y), then x ∂z/∂x + y ∂z/∂y = ? Options: 0, z, z/2, -z/2. Correct: -z/2. Explanation: z is homogeneous of degree -1/2 (from previous question). By Euler's theorem, x ∂z/∂x + y ∂z/∂y = (-1/2)z = -z/2. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/differential-equations/mcq26:
    title: "Differential Equations | Euler's theorem application: u = sin⁻¹[(x²+y²)/(x+y)] find x ∂u/∂x + y ∂u/∂y - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice differential equations MCQ: If u = sin⁻¹[(x²+y²)/(x+y)], then x ∂u/∂x + y ∂u/∂y = ? Options: tan u, u, cot u, -u/2. Correct: tan u. Explanation: Let v = sin u = (x²+y²)/(x+y) which is homogeneous of degree 1. By Euler: x∂v/∂x+y∂v/∂y=v. Since ∂v/∂x = cos u ∂u/∂x, we get cos u(x∂u/∂x+y∂u/∂y)=sin u ⇒ x∂u/∂x+y∂u/∂y=tan u. More entry test MCQs at NotesPrep."
    https://notesprep.com/entry-tests/mcqs/electromagnetism/mcq1:
    title: "Electromagnetism | Tesla is a unit of - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electromagnetism MCQ: Tesla is a unit of? Options: field strength, inductance, flux density, flux. Correct: flux density. Explanation: Tesla (T) is SI unit of magnetic flux density. 1 T = 1 Wb/m². More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electromagnetism/mcq2:
    title: "Electromagnetism | A permeable substance is one which - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electromagnetism MCQ: A permeable substance is one? Options: good conductor, bad conductor, strong magnet, through which magnetic lines of force can pass very easily. Correct: through which magnetic lines of force can pass very easily. Explanation: Permeability measures how easily magnetic field lines pass through material. Highly permeable materials like iron allow magnetic lines to pass easily. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electromagnetism/mcq3:
    title: "Electromagnetism | Materials with low retentivity are suitable for making - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electromagnetism MCQ: Materials having low retentivity are suitable for making? Options: weak magnets, temporary magnets, permanent magnets, none. Correct: temporary magnets. Explanation: Low retentivity materials lose magnetism quickly when magnetizing field removed, making them suitable for temporary magnets like electromagnet cores. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electromagnetism/mcq4:
    title: "Electromagnetism | A magnetic field exists around - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electromagnetism MCQ: A magnetic field exists around? Options: iron, copper, aluminium, moving charges. Correct: moving charges. Explanation: Magnetic field is produced by moving electric charges (currents). Stationary charges produce only electric fields. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electromagnetism/mcq5:
    title: "Electromagnetism | Ferrites are which type of magnetic materials - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electromagnetism MCQ: Ferrites are ______ materials. Options: paramagnetic, diamagnetic, ferromagnetic, none. Correct: ferromagnetic. Explanation: Ferrites are ceramic ferromagnetic materials made from iron oxide combined with other metals, used in transformers, inductors, and permanent magnets. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electromagnetism/mcq6:
    title: "Electromagnetism | Direction of magnetic lines of force - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electromagnetism MCQ: Direction of magnetic lines of force is? Options: from south to north pole, from north to south pole, from one end to another, none. Correct: from north pole to south pole. Explanation: Magnetic field lines emerge from north pole and enter south pole outside magnet. Inside magnet, they go from south to north. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electromagnetism/mcq7:
    title: "Electromagnetism | Which quantity is a vector - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electromagnetism MCQ: Which of the following is a vector quantity? Options: Relative permeability, Magnetic field intensity, Flux density, Magnetic potential. Correct: Magnetic field intensity. Explanation: Magnetic field intensity H is a vector quantity having both magnitude and direction. Relative permeability and magnetic potential are scalars. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electromagnetism/mcq8:
    title: "Electromagnetism | Material slightly repelled by magnetic field is called - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electromagnetism MCQ: Material which is slightly repelled by magnetic field is known as? Options: ferromagnetic, diamagnetic, paramagnetic, conducting. Correct: diamagnetic. Explanation: Diamagnetic materials are weakly repelled by magnetic fields. Examples: bismuth, copper, water. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electromagnetism/mcq9:
    title: "Electromagnetism | Effect on magnetic field when iron piece is placed in it - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electromagnetism MCQ: When iron piece is placed in magnetic field? Options: lines bend away to go away from piece; lines bend away to pass through piece; field not affected; iron breaks. Correct: magnetic lines of force will bend away from their usual paths in order to pass through the piece. Explanation: Iron is ferromagnetic with high permeability. Field lines prefer to pass through it, bending toward iron piece. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electromagnetism/mcq10:
    title: "Electromagnetism | Fleming's left hand rule is used to find - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electromagnetism MCQ: Fleming's left hand rule is used to find? Options: direction of magnetic field due to current; direction of flux in solenoid; direction of force on current carrying conductor in magnetic field; polarity of magnetic pole. Correct: direction of force on current carrying conductor in magnetic field. Explanation: Fleming's left hand rule gives direction of force on current-carrying conductor in magnetic field. Thumb points in force direction. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electromagnetism/mcq11:
    title: "Electromagnetism | Ratio of intensity of magnetisation to magnetisation force is called - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electromagnetism MCQ: Ratio of intensity of magnetisation to magnetisation force is known as? Options: flux density, susceptibility, relative permeability, none. Correct: susceptibility. Explanation: Magnetic susceptibility χ = M/H, ratio of intensity of magnetization M to magnetizing field H. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electromagnetism/mcq12:
    title: "Electromagnetism | Why is magnetising steel normally difficult - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electromagnetism MCQ: Magnetising steel is normally difficult because? Options: it corrodes easily; it has high permeability; it has high specific gravity; it has low permeability. Correct: it has low permeability. Explanation: Steel has low permeability compared to soft iron, making it harder to magnetize. However, it retains magnetism longer (high retentivity). More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electromagnetism/mcq13:
    title: "Electromagnetism | Left hand rule correlates which quantities - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electromagnetism MCQ: Left hand rule correlates to? Options: current, induced emf and force; magnetic field, electric field and force; self induction, mutual induction and force; current, magnetic field and force. Correct: current, magnetic field and direction of force on conductor. Explanation: Fleming's left hand rule relates direction of current, magnetic field, and resulting force on conductor. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electromagnetism/mcq14:
    title: "Electromagnetism | Magnetic force on unit positive charge moving perpendicular to magnetic field with unit velocity is called - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electromagnetism MCQ: Magnetic force acting on unit positive charge moving perpendicular to magnetic field with unit velocity is called? Options: magnetic flux, magnetic field intensity, magnetic induction, self inductance. Correct: magnetic induction. Explanation: Magnetic induction B is defined as force experienced by unit positive charge moving with unit velocity perpendicular to magnetic field. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electromagnetism/mcq15:
    title: "Electromagnetism | Magnetic force on current carrying conductor parallel to uniform magnetic field - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electromagnetism MCQ: Current carrying conductor placed in uniform magnetic field parallel to it. Magnetic force experienced is? Options: F=I/B, F=IB sinθ, zero, F=IB cosθ. Correct: zero. Explanation: Magnetic force F = ILB sinθ. When conductor parallel to field (θ=0°), sin0°=0, so force is zero. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electromagnetism/mcq16:
    title: "Electromagnetism | Calculate current in wire given force 5N, length 10cm, magnetic field 0.5 Wb/m² - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electromagnetism MCQ: Value of current in wire of 10cm long at right angle to uniform magnetic field of 0.5 Wb/m² when force is 5N? Options: 1A, 10A, 100A, 1000A. Correct: 100A. Explanation: F = ILB sinθ. L=0.1m, B=0.5T, F=5N, θ=90°. I = F/(LB) = 5/(0.1×0.5)=5/0.05=100A. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electromagnetism/mcq17:
    title: "Electromagnetism | Radius of circular path of charged particle in uniform magnetic field perpendicular to velocity - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electromagnetism MCQ: Particle of charge q and mass m enters uniform magnetic field B with velocity v perpendicular to field. Radius of circular path is? Options: R=qB/mv, R=mv/qB, R=qmv/B, R=qmB/v. Correct: R=mv/qB. Explanation: Centripetal force provided by magnetic force: mv²/R = qvB ⇒ R = mv/qB. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electromagnetism/mcq18:
    title: "Electromagnetism | Charged particle moving perpendicular to uniform magnetic field - momentum and energy changes - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electromagnetism MCQ: Charged particle moving in uniform magnetic field with velocity perpendicular to field then? Options: momentum changes but energy same; both momentum and energy same; energy changes but momentum same; energy changes but momentum same. Correct: momentum changes but total energy remains same. Explanation: Magnetic force perpendicular to velocity changes direction (momentum changes) but does no work, so kinetic energy remains constant. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electromagnetism/mcq19:
    title: "Electromagnetism | Force on one meter length of conductor at right angle to magnetic field with 1A current defines - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electromagnetism MCQ: Force acting on one meter length of conductor placed at right angle to magnetic field when one ampere current passes is called? Options: Autumnal Force, Coulomb Force, Magnetic Field, Electric Field. Correct: Magnetic Field. Explanation: This defines magnetic field strength: B = F/(IL). When I=1A, L=1m, θ=90°, force equals magnetic field strength in teslas. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electromagnetism/mcq20:
    title: "Electromagnetism | Vector sum of electric and magnetic force is called - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electromagnetism MCQ: Vector sum of electric and magnetic force is called? Options: Maxwell force, Newton's force, Lorentz force, Centripetal force. Correct: Lorentz force. Explanation: Lorentz force is total force on charged particle in electric and magnetic fields: F = q(E + v×B). More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electromagnetism/mcq21:
    title: "Electromagnetism | Condition for proton to move undeflected in electric and magnetic fields - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electromagnetism MCQ: Proton moving with velocity acted upon by electric field E and magnetic field B. Proton will move undeflected if? Options: E perpendicular to B; E, B and v mutually perpendicular and v=E/B; E parallel to v and perpendicular to B; E and B both parallel to v. Correct: E, B and v mutually perpendicular and v=E/B. Explanation: For undeflected motion, electric force qE balances magnetic force qvB ⇒ v=E/B, with E,B,v mutually perpendicular. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electromagnetism/mcq22:
    title: "Electromagnetism | Electron and proton with equal momentum enter perpendicular magnetic field - path curvature comparison - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electromagnetism MCQ: Electron and proton with equal momentum enter perpendicularly into uniform magnetic field, then? Options: proton path more curved; proton path less curved; both equally curved; both straight line. Correct: both equally curved. Explanation: Radius r = p/(qB). Since momentum p equal and charge magnitude q equal (both e), radii are equal, so both equally curved. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electromagnetism/mcq23:
    title: "Electromagnetism | When can charged particle pass through region undeflected - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electromagnetism MCQ: If charged particle passes through region of space undeflected then? Options: particle anti-parallel to B; region magnetic field free; F_E = -F_B; All of these. Correct: All of these. Explanation: Charged particle can pass undeflected if electric and magnetic forces cancel, or velocity parallel/anti-parallel to magnetic field (no magnetic force), or no magnetic field. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electromagnetism/mcq24:
    title: "Electromagnetism | Two parallel wires carrying currents in opposite directions - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electromagnetism MCQ: Two parallel wires carrying currents in opposite directions? Options: repel each other, attract each other, no effect, cancel magnetic fields. Correct: repel each other. Explanation: Parallel wires carrying currents in opposite directions experience repulsive force. Same direction currents attract. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electromagnetism/mcq25:
    title: "Electromagnetism | Magnetic field at point 10cm north of vertical cable carrying 1A upward - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electromagnetism MCQ: Cable carries 1A vertically upward. Magnetic field at point 10cm north will be? Options: 2×10⁻⁶T west, 2×10⁻⁸T west, 2×10⁻⁶T east, 2×10⁻⁸T east. Correct: 2×10⁻⁶T west. Explanation: B = μ₀I/(2πr) = (4π×10⁻⁷×1)/(2π×0.1)=2×10⁻⁶T. Using right-hand rule, field direction is west. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electromagnetism/mcq26:
    title: "Electromagnetism | Magnetic induction at end of solenoid with 800 turns/m and 1.6A current - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electromagnetism MCQ: Long solenoid has 800 turns per metre, current 1.6A. Magnetic induction at end of solenoid on its axis is? Options: 16×10⁻⁴T, 8×10⁻⁴T, 32×10⁻⁴T, 4×10⁻⁴T. Correct: 8×10⁻⁴T. Explanation: At end of solenoid, B = μ₀nI/2 = (4π×10⁻⁷×800×1.6)/2 = 8.04×10⁻⁴T ≈ 8×10⁻⁴T. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electromagnetism/mcq27:
    title: "Electromagnetism | Uniform magnetic field is defined as - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electromagnetism MCQ: Uniform magnetic field is? Options: field of parallel conductors; field with parallel and equidistant magnetic lines; field of single conductor; none. Correct: field in which all magnetic lines of force are parallel and equidistant. Explanation: Uniform magnetic field has field lines parallel and equally spaced, indicating constant magnitude and direction. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electromagnetism/mcq28:
    title: "Electromagnetism | Magnetic field outside solenoid - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electromagnetism MCQ: Solenoid 15cm long has 300 turns, current 5A. Magnetic field outside solenoid? Options: 0.65×10⁻²Wb/m², 1.3×10⁻²Wb/m², 4.4×10⁻³Wb/m², Zero. Correct: Zero. Explanation: For ideal solenoid, magnetic field outside is zero. In real solenoid, it is very weak compared to inside. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electromagnetism/mcq29:
    title: "Electromagnetism | Magnetic force on conductor of length L with nAL charges - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electromagnetism MCQ: Magnetic force on conductor of length L carrying total number of charges nAL, each charge q is given as? Options: F=q(v×B), F=qLA(v×B), F=qnAL(v×B), F=nAQL(v×B). Correct: F=qnAL(v×B). Explanation: Force F = I L × B. Since I=nAqv, F = nAqv L (v×B) = qnAL(v×B). More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electromagnetism/mcq30:
    title: "Electromagnetism | Moving coil galvanometer of 1000Ω gives half scale deflection at 20mA - potential difference - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electromagnetism MCQ: Moving coil galvanometer of resistance 1000Ω gives half scale deflection for current 20mA. Potential difference across it? Options: 4V, 5V, 2V, 0.4V. Correct: 20V. Explanation: V=IR=(20×10⁻³)×1000=20V. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electromagnetism/mcq31:
    title: "Electromagnetism | Instrument that measures potential without drawing current - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electromagnetism MCQ: Instrument which can measure potential without drawing any current is? Options: voltmeter, galvanometer, cathode ray oscilloscope (CRO), ammeter. Correct: cathode ray oscilloscope (CRO). Explanation: CRO has very high input impedance and draws negligible current, ideal for measuring potential without loading circuit. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electromagnetism/mcq32:
    title: "Electromagnetism | Calculate galvanometer resistance given deflection halved by 12Ω shunt - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electromagnetism MCQ: Deflection for 50 divisions of galvanometer decreased to 25 divisions by shunt resistance of 12Ω. Galvanometer resistance is? Options: 18Ω, 30Ω, 24Ω, 12Ω. Correct: 12Ω. Explanation: Using shunt formula: I_g/I = S/(G+S). With half deflection, I_g/I=1/2, so 1/2=12/(G+12) ⇒ G+12=24 ⇒ G=12Ω. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electromagnetism/mcq33:
    title: "Electromagnetism | When galvanometer coil is in equilibrium, deflecting couple is - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electromagnetism MCQ: When coil of galvanometer is in equilibrium then deflecting couple is? Options: zero, equal to restoring couple, greater than restoring couple, smaller than restoring couple. Correct: equal to the restoring couple. Explanation: At equilibrium, deflecting torque due to current equals restoring torque from spring, so coil comes to rest at certain deflection angle. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electromagnetism/mcq34:
    title: "Electromagnetism | Sensitivity of galvanometer is given by formula - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electromagnetism MCQ: Sensitivity of galvanometer is given by? Options: C/BAN, CAN/B, BAN/C, ABC/N. Correct: BAN/C. Explanation: Current sensitivity θ/I = BAN/C, where B=magnetic field, A=coil area, N=number of turns, C=torsional constant. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electromagnetism/mcq35:
    title: "Electromagnetism | Which is not an electromechanical instrument - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electromagnetism MCQ: Which one is not an electromechanical instrument? Options: galvanometer, voltmeter, ammeter, AC transformer and DC generator. Correct: AC transformer and DC generator. Explanation: Galvanometers, voltmeters, ammeters are electromechanical. AC transformers and DC generators are electromagnetic devices but not primarily electromechanical measuring instruments. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electromagnetism/mcq36:
    title: "Electromagnetism | Minimum current for 1mm deflection at 1m scale distance is called - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electromagnetism MCQ: Minimum current required to produce deflection of 1mm on scale at distance of 1 meter is? Options: 0.1A, 1:00 AM, current sensitivity, 1mA. Correct: current sensitivity. Explanation: This refers to current sensitivity of galvanometer, defined as deflection per unit current. Actual value depends on instrument construction. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electromagnetism/mcq37:
    title: "Electromagnetism | In multi-range ammeter, as range increases shunt value - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electromagnetism MCQ: In multi range ammeter as range increases? Options: shunt value decreases, shunt value increases, shunt value remains same, none. Correct: shunt value decreases. Explanation: For multi-range ammeter, higher current ranges require lower shunt resistance to bypass more current around meter movement. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electromagnetism/mcq38:
    title: "Electromagnetism | Maximum safe current for galvanometer with 100mV full-scale and 50Ω resistance - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electromagnetism MCQ: Sensitive galvanometer gives full-scale deflection with 100mV. If resistance is 50Ω, maximum current that can flow safely is? Options: 2.0mA, 20mA, 200mA, 0.2mA. Correct: 2.0mA. Explanation: I = V/R = (100×10⁻³)/50 = 0.002A = 2.0mA. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electromagnetism/mcq39:
    title: "Electromagnetism | Ammeter connection in circuit to measure total current - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electromagnetism MCQ: Ammeter measures total current flowing through circuit when connected? Options: in series with circuit; in parallel with circuit; in series with any parallel resistance; in parallel with any series resistance. Correct: in series with the circuit. Explanation: Ammeter connected in series so all current passes through it. It has very low resistance to minimize voltage drop. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electromagnetism/mcq40:
    title: "Electromagnetism | Effect on radius when magnetic field intensity reduced to half - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electromagnetism MCQ: Electron moving with speed 10⁸ m/s perpendicular to uniform magnetic field B. Suddenly B reduced to B/2. New radius compared to original? Options: no change, 2r, r/2, r/9. Correct: 2r. Explanation: Radius r = mv/(qB). If B becomes B/2, then r' = mv/(q·B/2) = 2mv/(qB) = 2r. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electromagnetism/mcq41:
    title: "Electromagnetism | Properties of magnetic lines of force - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electromagnetism MCQ: Magnetic lines of force? Options: Always intersect; Are always closed; Tend to crowd far away from poles; Do not pass through vacuum. Correct: Are always closed. Explanation: Magnetic field lines are always closed loops. They never intersect, crowd near poles, and can pass through vacuum. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electromagnetism/mcq42:
    title: "Electromagnetism | Magnetic compass deflection near which object - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electromagnetism MCQ: Magnetic compass will be deflected if kept near? Options: charge in motion, charge at rest, both, none. Correct: charge in motion. Explanation: Moving charge creates magnetic field which can deflect compass needle. Stationary charge produces only electric field, not magnetic field. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electromagnetism/mcq43:
    title: "Electromagnetism | When does magnetic field exert force on charged particle - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electromagnetism MCQ: A magnetic field? Options: always exerts force; never exerts force; exerts force if particle moving in direction of field lines; exerts force if particle moving perpendicular to field lines. Correct: exerts force if charged particle is moving perpendicular to magnetic field lines. Explanation: Magnetic force F=qvB sinθ. Maximum when θ=90° (perpendicular), zero when θ=0° (parallel). More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electromagnetism/mcq44:
    title: "Electromagnetism | Magnetic force on proton moving along axis of solenoid - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electromagnetism MCQ: Proton moving along axis of solenoid carrying current. Magnetic force on proton will be? Options: zero, maximum, towards axis, away from axis. Correct: zero. Explanation: When charged particle moves parallel to magnetic field (along solenoid axis), magnetic force is zero because v×B=0. More entry test MCQs at NotesPrep."
    
https://notesprep.com/entry-tests/mcqs/electronics/mcq1:
    title: "Electronics | Which is a passive electronic component - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electronics MCQ: Which of the following is a passive electronic component? Options: Transistor, Diode, Resistor, Operational Amplifier. Correct: Resistor. Explanation: Passive components do not require external power source. Resistors, capacitors, inductors are passive. Transistors, diodes, op-amps are active components. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electronics/mcq2:
    title: "Electronics | Primary function of a capacitor in a circuit - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electronics MCQ: What is the primary function of a capacitor in a circuit? Options: To amplify signals, To store electrical energy, To rectify AC to DC, To regulate voltage. Correct: To store electrical energy. Explanation: Capacitors store energy in electric field between plates, used for filtering, smoothing voltage, and timing applications. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electronics/mcq3:
    title: "Electronics | Component used to convert AC to DC - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electronics MCQ: Which component is used to convert AC to DC? Options: Transformer, Rectifier, Inductor, Resistor. Correct: Rectifier. Explanation: Rectifiers, typically diode-based, convert alternating current (AC) into direct current (DC). Transformers change voltage levels but do not rectify. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electronics/mcq4:
    title: "Electronics | Minimum number of diodes required for full AC to DC conversion - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electronics MCQ: At least how many diodes are required to convert AC fully into DC? Options: 1, 2, 3, 4. Correct: 4. Explanation: Full-wave bridge rectifier requires 4 diodes. Half-wave uses 1 diode. Full-wave requires either 2 diodes (center-tap) or 4 diodes (bridge). More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electronics/mcq5:
    title: "Electronics | AC is converted to DC by which device - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electronics MCQ: AC is converted to DC by? Options: Oscillator, Rectifier, Amplifier, DC motor. Correct: Rectifier. Explanation: Rectifier converts AC to DC. Oscillators generate AC signals, amplifiers increase signal strength, DC motors convert electrical to mechanical energy. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electronics/mcq6:
    title: "Electronics | Ohm's Law relationship between voltage current and resistance - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electronics MCQ: According to Ohm's Law, relationship between voltage, current, and resistance is? Options: V=IR, V=RI, I=VR, R=VI. Correct: V=IR. Explanation: Ohm's Law states voltage across resistor is directly proportional to current, with resistance as proportionality constant: V=IR. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electronics/mcq7:
    title: "Electronics | Total resistance in a series circuit - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electronics MCQ: In a series circuit, total resistance is? Options: Sum of individual resistances; Reciprocal of sum of reciprocals; Equal to largest resistor; Zero. Correct: Sum of individual resistances. Explanation: In series circuits, resistances add directly: R_total = R₁ + R₂ + R₃ + ... More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electronics/mcq8:
    title: "Electronics | Material commonly used to manufacture semiconductors - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electronics MCQ: Which material is commonly used to manufacture semiconductors? Options: Silicon, Copper, Aluminum, Iron. Correct: Silicon. Explanation: Silicon is most widely used semiconductor material due to abundance and favorable electrical properties for device fabrication. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electronics/mcq9:
    title: "Electronics | A diode allows current to flow in which direction - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electronics MCQ: A diode allows current to flow? Options: In both directions, Only in reverse direction, Only in forward direction, In no direction. Correct: Only in forward direction. Explanation: Diodes are unidirectional devices permitting current flow when forward biased, blocking it when reverse biased. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electronics/mcq10:
    title: "Electronics | Primary function of P-N junction diode - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electronics MCQ: Which is a P-N junction diode's primary function? Options: Amplify signals, Rectify AC signals, Store electrical energy, Convert DC to AC. Correct: Rectify AC signals. Explanation: P-N junction diodes are mainly used for rectification, converting AC to DC by allowing current in one direction only. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electronics/mcq11:
    title: "Electronics | When transistor is forward biased resistance will be - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electronics MCQ: When transistor is forward biased then resistance will be? Options: Nano ohms, Kilo ohms, Mega ohms, Milliohms. Correct: Nano ohms. Explanation: When transistor is forward biased, it conducts with very low resistance (few ohms to tens of ohms). Nano ohms represents very low resistance among options. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electronics/mcq12:
    title: "Electronics | A transistor cannot be used as which device - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electronics MCQ: A transistor cannot be used as? Options: As a Switch, As an Amplifier, As a Power Source, As an inverter. Correct: As a Power Source. Explanation: Transistor can be used as switch, amplifier, or inverter. It cannot generate power; it only controls or amplifies signals. Power source provides energy. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electronics/mcq13:
    title: "Electronics | Width of depletion region increases due to - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electronics MCQ: Width of depletion region increases due to? Options: Transistor, Minority charge carriers, Majority charge carriers, None. Correct: Minority charge carriers. Explanation: Depletion region width increases when reverse bias is applied, increasing barrier potential and reducing majority carrier flow. Minority carriers are involved in leakage current. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electronics/mcq14:
    title: "Electronics | Doping with which impurity creates p-type semiconductor - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electronics MCQ: When semiconductors are doped with ___ then they are p-type? Options: Pentavalent, Trivalent, Both, None. Correct: Trivalent. Explanation: P-type semiconductors created by doping with trivalent impurities (acceptors) such as boron, aluminum, or gallium, which create holes as majority carriers. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electronics/mcq15:
    title: "Electronics | Metals whose resistance becomes zero at transition temperature are called - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electronics MCQ: Metals containing alloys, ceramics etc., when heated reach transition temperature and resistance becomes zero. These are called? Options: Conductors, Insulators, Semi-conductors, Superconductors. Correct: Superconductors. Explanation: Superconductors exhibit zero electrical resistance below critical temperature (transition temperature). More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electronics/mcq16:
    title: "Electronics | Instrument used to measure resistance - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electronics MCQ: Which instrument is used to measure resistance? Options: Voltmeter, Ammeter, Multimeter, Oscilloscope. Correct: Multimeter. Explanation: Multimeter can measure voltage, current, and resistance, making it a versatile tool for electronics testing. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electronics/mcq17:
    title: "Electronics | Primary function of an oscilloscope - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electronics MCQ: Primary function of an oscilloscope is to? Options: Measure resistance, Display waveforms of voltage signals, Measure current, Test diodes. Correct: Display waveforms of voltage signals. Explanation: Oscilloscopes visualize voltage waveforms over time, essential for analyzing signal behavior in circuits. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electronics/mcq18:
    title: "Electronics | Device used to maintain constant voltage output despite load changes - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electronics MCQ: Which device is used to maintain constant voltage output despite changes in load? Options: Transformer, Voltage regulator, Resistor, Capacitor. Correct: Voltage regulator. Explanation: Voltage regulators provide stable output voltage regardless of variations in input voltage or load conditions. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electronics/mcq19:
    title: "Electronics | A step-down transformer reduces voltage from - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electronics MCQ: A step-down transformer reduces voltage from? Options: High to low, Low to high, AC to DC, DC to AC. Correct: High to low. Explanation: Step-down transformers decrease voltage levels, typically for safe and efficient circuit operation. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electronics/mcq20:
    title: "Electronics | Essential safety precaution when working with high voltages - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electronics MCQ: When working with high voltages, it is essential to? Options: Use insulated tools and protective gear; Work without precautions; Ignore grounding; Use low-quality components. Correct: Use insulated tools and wear protective gear. Explanation: Safety precautions are critical when handling high voltages to prevent electric shocks and accidents. Insulated tools and protective gear are essential. More entry test MCQs at NotesPrep."
    https://notesprep.com/entry-tests/mcqs/grammar/mcq1:
    title: "Grammar | Committee was or were divided in their opinions - Subject verb agreement with collective nouns - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice grammar MCQ: The committee ______ divided in their opinions on proposed budget cuts. Options: was, were, is, are. Correct: were. Explanation: Collective nouns like 'committee' take plural verb when members act individually (as indicated by 'their opinions'). More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/grammar/mcq2:
    title: "Grammar | Neither the manager nor his assistants was or were - Subject verb agreement with neither nor - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice grammar MCQ: Neither the manager nor his assistants ______ present at meeting yesterday. Options: was, were, is, are. Correct: were. Explanation: With 'neither...nor', verb agrees with nearest subject. 'Assistants' is plural, so 'were' is correct. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/grammar/mcq3:
    title: "Grammar | She has been living or lived in this city since 2015 - Present perfect continuous tense - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice grammar MCQ: She ______ in this city since 2015, yet she still gets lost occasionally. Options: has been living, lived, had lived, was living. Correct: has been living. Explanation: Present perfect continuous indicates action that started in past and continues to present. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/grammar/mcq4:
    title: "Grammar | Had I known about traffic I would take or would have taken - Third conditional sentence structure - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice grammar MCQ: Had I known about traffic, I ______ different route to work. Options: would take, would have taken, will take, took. Correct: would have taken. Explanation: Third conditional expressing hypothetical past situation: 'had + past participle' in if-clause and 'would have + past participle' in main clause. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/grammar/mcq5:
    title: "Grammar | New policy along with amendments need or needs - Subject verb agreement with along with - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice grammar MCQ: New policy, along with its amendments, ______ to be reviewed by board. Options: need, needs, are needing, have needed. Correct: needs. Explanation: Subject 'policy' is singular; phrases introduced by 'along with' do not affect number of subject. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/grammar/mcq6:
    title: "Grammar | Scarcely had concert begun than or when - Correlative conjunctions scarcely when - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice grammar MCQ: Scarcely had concert begun ______ power went out across venue. Options: than, then, when, after. Correct: when. Explanation: Correlative conjunction 'scarcely...when' indicates one event happened immediately after another. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/grammar/mcq7:
    title: "Grammar | CEO insisted report is or be submitted - Subjunctive mood after verbs of insistence - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice grammar MCQ: CEO insisted that report ______ submitted by Friday at latest. Options: is, was, be, has been. Correct: be. Explanation: After verbs like 'insist' expressing demand or suggestion, subjunctive mood ('be') is used. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/grammar/mcq8:
    title: "Grammar | Not only did she pass or she passed - Inversion with not only at beginning - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice grammar MCQ: Not only ______ exam, but she also scored highest mark in entire school. Options: did she pass, she passed, she did pass, passed she. Correct: did she pass. Explanation: When 'not only' begins sentence for emphasis, subject-verb inversion follows. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/grammar/mcq9:
    title: "Grammar | Artist together with assistants are or is preparing - Subject verb agreement with together with - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice grammar MCQ: Artist, together with her assistants, ______ preparing gallery for upcoming exhibition. Options: are, were, is, have been. Correct: is. Explanation: Subject is 'artist' (singular); 'together with' phrases are parenthetical and do not change number of subject. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/grammar/mcq10:
    title: "Grammar | It is imperative that candidate meets or meet - Subjunctive mood after it is imperative that - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice grammar MCQ: It is imperative that every candidate ______ eligibility requirements before applying. Options: meets, meet, is meeting, has met. Correct: meet. Explanation: After 'it is imperative that', subjunctive mood uses base form of verb without 's'. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/grammar/mcq11:
    title: "Grammar | By time rescue arrives hikers will be or will have been - Future perfect tense - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice grammar MCQ: By time rescue team arrives, stranded hikers ______ without food for nearly three days. Options: will be, are, will have been, have been. Correct: will have been. Explanation: Future perfect describes action completed before specified future time. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/grammar/mcq12:
    title: "Grammar | Data show or shows - Singular or plural verb with data - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice grammar MCQ: Data ______ conclusively that new treatment is more effective than standard one. Options: show, shows, are showing, have shown. Correct: shows. Explanation: 'Data' is technically plural but often treated as singular mass noun in modern usage, especially in academic contexts. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/grammar/mcq13:
    title: "Grammar | Were government invest or to invest - Inverted conditional with were to - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice grammar MCQ: Were government ______ more resources into education, outcomes would improve significantly. Options: invest, to invest, investing, invested. Correct: to invest. Explanation: Inverted conditional structure using 'were + to + infinitive' to express hypothetical future situation. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/grammar/mcq14:
    title: "Grammar | CEO's remarks which was meant or were meant - Subject verb agreement with plural subject - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice grammar MCQ: CEO's remarks, which ______ to be off record, were leaked to press. Options: were meant, was meant, meant, have meant. Correct: were meant. Explanation: Subject 'remarks' is plural, so plural verb 'were meant' is required. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/grammar/mcq15:
    title: "Grammar | Had company reviewed or review - Inverted third conditional past participle - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice grammar MCQ: Had company ______ its quality control procedures, product recall could have been avoided. Options: reviewed, review, reviewing, to review. Correct: reviewed. Explanation: In inverted third conditional sentences, structure is 'had + past participle' in if-clause. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/grammar/mcq16:
    title: "Grammar | I would rather you consult or consulted - Would rather with another person's action - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice grammar MCQ: I would rather you ______ me before making such important decision. Options: consult, consulted, have consulted, had consulted. Correct: consulted. Explanation: After 'would rather' referring to another person's action, simple past tense (subjunctive-like) is used. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/grammar/mcq17:
    title: "Grammar | Proposal as well as documents have been or has been - Subject verb agreement with as well as - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice grammar MCQ: Proposal, as well as its supplementary documents, ______ carefully scrutinized by legal team. Options: have been, has been, are being, were being. Correct: has been. Explanation: Singular subject 'proposal' requires singular verb; 'as well as' introduces parenthetical phrase. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/grammar/mcq18:
    title: "Grammar | She is one of those who possesses or possess - Relative pronoun agreement with antecedent - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice grammar MCQ: She is one of those rare individuals who ______ both exceptional talent and unwavering humility. Options: possesses, possess, is possessing, has possessed. Correct: possess. Explanation: Relative pronoun 'who' refers to 'individuals' (plural), so verb should be plural. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/grammar/mcq19:
    title: "Grammar | Board recommended that CEO resigns or resign - Subjunctive after recommendation - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice grammar MCQ: Board recommended that CEO ______ his position effective immediately. Options: resigns, resigned, resign, has resigned. Correct: resign. Explanation: After verbs of recommendation like 'recommended that', subjunctive mood uses base form of verb. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/grammar/mcq20:
    title: "Grammar | Had weather conditions been or were - Inverted conditional with past participle - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice grammar MCQ: Had weather conditions ______ more favorable, launch would have proceeded as scheduled. Options: been, be, were, being. Correct: been. Explanation: In inverted conditional sentences, 'had' is followed by past participle 'been'. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/grammar/mcq21:
    title: "Grammar | The number of students has or have increased - The number of vs a number of - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice grammar MCQ: Number of students enrolling in online courses ______ increased dramatically over past decade. Options: have, has, are, were. Correct: has. Explanation: 'The number of' is singular expression and takes singular verb. (Compare with 'a number of' which takes plural.) More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/grammar/mcq22:
    title: "Grammar | It is vital that medication is taken or be taken - Subjunctive after it is vital that - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice grammar MCQ: It is vital that medication ______ exactly as prescribed by physician. Options: is taken, be taken, was taken, has been taken. Correct: be taken. Explanation: After 'it is vital that', subjunctive mood ('be taken') expresses necessity or importance. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/grammar/mcq23:
    title: "Grammar | Manager would sooner employees raise or raised - Would sooner with another person's action - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice grammar MCQ: Manager would sooner that employees ______ concerns directly rather than through anonymous complaints. Options: raise, raised, have raised, had raised. Correct: raised. Explanation: After 'would sooner' (similar to 'would rather') referring to another's action, simple past tense is used. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/grammar/mcq24:
    title: "Grammar | Empirical evidence including data support or supports - Subject verb agreement with parenthetical phrases - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice grammar MCQ: Empirical evidence, including data from multiple independent studies, ______ proposed hypothesis. Options: support, supports, are supporting, have supported. Correct: supports. Explanation: Singular subject 'evidence' takes singular verb; 'including...' phrase is parenthetical. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/grammar/mcq25:
    title: "Grammar | Should you require or requires - Inverted conditional with should - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice grammar MCQ: Should you ______ any further information, please do not hesitate to contact customer service. Options: require, requires, required, will require. Correct: require. Explanation: Inverted conditional sentence equivalent to 'If you should require', followed by base form of verb. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/grammar/mcq26:
    title: "Grammar | Criteria has or have changed - Criteria is plural of criterion - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice grammar MCQ: Criteria for admission ______ changed significantly since last year's application cycle. Options: has, have, is, was. Correct: have. Explanation: 'Criteria' is plural form of 'criterion', so it takes plural verb. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/grammar/mcq27:
    title: "Grammar | What committee decided are or is - Noun clause as subject takes singular verb - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice grammar MCQ: What committee ultimately decided ______ yet to be communicated to general membership. Options: are, is, were, have been. Correct: is. Explanation: When noun clause introduced by 'what' serves as subject, it takes singular verb. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/grammar/mcq28:
    title: "Grammar | Not only quality but also affordability contribute or contributes - Subject verb agreement with not only but also - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice grammar MCQ: Not only quality of product but also its affordability ______ to company's success. Options: contribute, contributes, are contributing, have contributed. Correct: contributes. Explanation: When 'not only...but also' connects two subjects, verb agrees with nearer subject ('affordability' is singular). More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/grammar/mcq29:
    title: "Grammar | Analyst recommended company diversify or diversifies - Subjunctive after recommended that - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice grammar MCQ: Analyst recommended that company ______ its investment in emerging markets. Options: diversify, diversifies, diversified, has diversified. Correct: diversify. Explanation: After 'recommended that', subjunctive mood requires base form of verb (without 's' or past tense). More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/grammar/mcq30:
    title: "Grammar | Had software been tested breach would be or would have been - Third conditional main clause - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice grammar MCQ: Had software been properly tested before deployment, security breach ______ entirely preventable. Options: would be, would have been, will be, was. Correct: would have been. Explanation: In third conditional sentences, main clause uses 'would have + past participle' to describe hypothetical past outcome. More entry test MCQs at NotesPrep."
    https://notesprep.com/entry-tests/mcqs/gravitation/mcq1:
    title: "Gravitation | Motion of falling ball towards Earth is due to - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice gravitation MCQ: Motion of falling ball towards Earth is due to ______. Options: weightlessness, gravitational force, acceleration due to gravity, Both a and b. Correct: gravitational force. Explanation: Ball falls towards Earth due to gravitational force exerted by Earth on ball, causing acceleration toward Earth's center. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/gravitation/mcq2:
    title: "Gravitation | Newton's law of gravitation holds between every two objects on - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice gravitation MCQ: Newton's law of gravitation holds between every two objects on ______. Options: Earth, Jupiter, Moon, Universe. Correct: Universe. Explanation: Newton's law of universal gravitation applies to all objects in universe, regardless of location or size. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/gravitation/mcq3:
    title: "Gravitation | Numerical value of gravitational constant G - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice gravitation MCQ: Numerical value of G is? Options: 6.673×10⁻¹¹ Nm²/kg², 6.673×10¹¹ Nm²/kg², 6.763×10⁻¹¹ Nm²/kg², 6.763×10¹¹ Nm²/kg². Correct: 6.673×10⁻¹¹ Nm²/kg². Explanation: Universal gravitational constant G ≈ 6.673×10⁻¹¹ N·m²/kg², first measured by Henry Cavendish in 1798. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/gravitation/mcq4:
    title: "Gravitation | Gravitational field of Earth is directed - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice gravitation MCQ: Gravitational field of Earth is directed ______. Options: towards Earth, towards Sun, towards Moon, away from Earth. Correct: towards Earth. Explanation: Earth's gravitational field is directed radially inward toward center of Earth, causing objects to fall downward. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/gravitation/mcq5:
    title: "Gravitation | First scientist who gave concept of gravitation - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice gravitation MCQ: ______ was first scientist who gave concept of gravitation. Options: Einstein, Newton, Faraday, Maxwell. Correct: Newton. Explanation: Sir Isaac Newton first formulated law of universal gravitation in 1687, explaining attraction between masses. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/gravitation/mcq6:
    title: "Gravitation | Gravitational force is always - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice gravitation MCQ: Gravitational force is always ______. Options: repulsive, attractive, both, None. Correct: attractive. Explanation: Gravity is always attractive force, pulling objects toward each other and never repelling. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/gravitation/mcq7:
    title: "Gravitation | In manned satellite people experience no gravity called - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice gravitation MCQ: In manned satellite, people experience no gravity and it is known as? Options: Gravity-weight, Gravitational weight, Weightlessness, Less-weight gravity. Correct: Weightlessness. Explanation: In free fall (like orbiting satellite), objects experience weightlessness because satellite and objects inside accelerate toward Earth at same rate. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/gravitation/mcq8:
    title: "Gravitation | Dimensional formula for gravitational intensity - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice gravitation MCQ: Dimensional formula for gravitational intensity is? Options: [LT⁻²], [LT⁻¹], [LT], [LT⁻⁴]. Correct: [LT⁻²]. Explanation: Gravitational intensity g = F/m. Force dimensions [MLT⁻²], so g dimensions [MLT⁻²]/[M] = [LT⁻²]. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/gravitation/mcq9:
    title: "Gravitation | Gravitational force on particle inside spherical shell is - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice gravitation MCQ: Gravitational force on particle inside spherical shell is? Options: 1, -1, 0, None. Correct: 0. Explanation: By Newton's shell theorem, gravitational force inside uniform spherical shell is zero because forces from different parts cancel. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/gravitation/mcq10:
    title: "Gravitation | Satellite with same time period as Earth is called - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice gravitation MCQ: Satellite having same time period of revolution as Earth is called? Options: Stationary satellite, Geostationary satellite, Gravitational satellite, Polar satellite. Correct: Geostationary satellite. Explanation: Geostationary satellite has orbital period equal to Earth's rotational period (24 hours), appearing stationary above fixed point on equator. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/gravitation/mcq11:
    title: "Gravitation | Mass on moon 40kg, weight on Earth - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice gravitation MCQ: Mass of body on moon is 40kg, what is weight on Earth? Options: 240 kg, 392 N, 240 N, 400 kg. Correct: 392 N. Explanation: Mass constant 40kg everywhere. Weight on Earth = mg = 40 × 9.8 = 392 N. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/gravitation/mcq12:
    title: "Gravitation | Newton's law of gravitation applies to which bodies - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice gravitation MCQ: Newton's law of gravitation applies to? Options: Small bodies only, Plants only, All bodies irrespective of size, For solar system. Correct: All bodies irrespective of size. Explanation: Newton's law applies to all objects with mass, regardless of size, composition, or location in universe. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/gravitation/mcq13:
    title: "Gravitation | Force between two objects when both masses halved - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice gravitation MCQ: Gravitational force between two objects is F. If masses of both objects halved without altering distance, force becomes? Options: F/4, F/2, F, 2F. Correct: F/4. Explanation: F ∝ m₁m₂. Both masses halved: (m₁/2)(m₂/2) = m₁m₂/4 = F/4. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/gravitation/mcq14:
    title: "Gravitation | Earth attracts moon with 10²⁰ N, moon attracts Earth with - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice gravitation MCQ: Earth attracts moon with gravitational force of 10²⁰ N. Moon attracts Earth with? Options: Less than 10²⁰ N, 10⁻²⁰ N, Greater than 10²⁰ N, 10²⁰ N. Correct: 10²⁰ N. Explanation: By Newton's third law, action and reaction equal and opposite. Moon attracts Earth with same force 10²⁰ N. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/gravitation/mcq15:
    title: "Gravitation | Distance between two bodies becomes 6 times, gravitational force becomes - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice gravitation MCQ: Distance between two bodies becomes 6 times more than usual distance. Gravitational force F becomes? Options: 36 times, 6 times, 12 times, 1/36 times. Correct: 1/36 times. Explanation: F ∝ 1/r². Distance 6 times: F' ∝ 1/(6r)² = 1/36r², so F' = F/36. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/gravitation/mcq16:
    title: "Gravitation | Critical velocity Vc formula - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice gravitation MCQ: Critical velocity Vc = ______. Options: gR, g/R, √(g/R), √(gR). Correct: √(gR). Explanation: Critical (orbital) velocity of satellite v = √(GM/R) = √(gR), where g = GM/R². More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/gravitation/mcq17:
    title: "Gravitation | According to Newton's law, force is inversely proportional to - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice gravitation MCQ: According to Newton's law of universal gravitation, force is inversely proportional to ______. Options: m₁m₂, 1/r², r², Both a and b. Correct: 1/r². Explanation: F = G m₁m₂/r². Force is inversely proportional to square of distance (1/r²). More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/gravitation/mcq18:
    title: "Gravitation | What changes path of Moon around Earth - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice gravitation MCQ: It changes path of Moon around Earth? Options: centripetal force, centrifugal force, pull of gravity, turning effect of force. Correct: centripetal force. Explanation: Centripetal force provided by Earth's gravity continuously pulls Moon toward Earth, keeping it in curved orbital path. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/gravitation/mcq19:
    title: "Gravitation | What determines gravitational force acting per unit mass - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice gravitation MCQ: It determines gravitational force acting per unit mass? Options: G, g, τ, None. Correct: g. Explanation: Acceleration due to gravity g = F/m is gravitational force acting per unit mass. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/gravitation/mcq20:
    title: "Gravitation | Gravitational force exists between objects because of - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice gravitation MCQ: Gravitational force is always present between two objects because of their? Options: volumes, shapes, density, masses. Correct: masses. Explanation: Every object with mass attracts every other object with mass. Mass is fundamental property giving rise to gravitational attraction. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/gravitation/mcq21:
    title: "Gravitation | Relation between height h and depth d for same change in g - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice gravitation MCQ: Change in g at height h equals change at depth d. When d and h << R, then? Options: d=3h/2, d=h/2, d=h, d=2h. Correct: d=2h. Explanation: g_h = g(1-2h/R), g_d = g(1-d/R). Setting equal: 1-2h/R = 1-d/R ⇒ d=2h. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/gravitation/mcq22:
    title: "Gravitation | Weight comparison at coal mine, sea level and mountain top - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice gravitation MCQ: Weight of object in coal mine (W₁), sea level (W₂) and mountain top (W₃). Then? Options: W₁<W₂>W₃, W₁=W₂=W₃, W₁<W₂<W₃, W₁>W₂>W₃. Correct: W₁<W₂>W₃. Explanation: Weight decreases with depth and height. At sea level weight maximum, so W₁(mine)<W₂(sea level)>W₃(mountain). More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/gravitation/mcq23:
    title: "Gravitation | Height at which acceleration due to gravity decreases by 1% - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice gravitation MCQ: At what height from Earth's surface, g is decreased by 1%? Options: 64 km, 16 km, 32 km, 48 km. Correct: 32 km. Explanation: g_h = g(1-2h/R). For 1% decrease: 2h/R=0.01 ⇒ h=0.01R/2=0.005R. With R≈6400km, h≈32km. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/gravitation/mcq24:
    title: "Gravitation | Maximum height when body projected with half escape velocity - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice gravitation MCQ: Body projected vertically from Earth surface with velocity half of escape velocity. Maximum height reached is? Options: R, R/2, R/3, R/4. Correct: R/3. Explanation: Energy conservation: ½mv² - GMm/R = -GMm/(R+h). With v=½√(2GM/R)=√(GM/(2R)). Solving gives h=R/3. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/gravitation/mcq25:
    title: "Gravitation | Escape velocity from planet with twice Earth radius and same density - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice gravitation MCQ: Escape velocity from Earth is 11 km/s. Planet radius twice Earth but same mean density. Escape velocity from this planet is? Options: 22 km/s, 11 km/s, 5.5 km/s, 16.5 km/s. Correct: 22 km/s. Explanation: v ∝ √(M/R). Since M ∝ R³ (same density), v ∝ R. Radius doubles, escape velocity doubles to 22 km/s. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/gravitation/mcq26:
    title: "Gravitation | Ratio of kinetic energy for escape to circular orbit - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice gravitation MCQ: Ratio of KE required to escape Earth's field to KE for circular orbit just above Earth's atmosphere is? Options: one half, two thirds, three quarters, infinity. Correct: one half. Explanation: Escape KE = GMm/R. Orbital KE = GMm/(2R). Ratio (orbital/escape)=1/2, so escape KE twice orbital KE. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/gravitation/mcq27:
    title: "Gravitation | Orbital speed of satellite at height x above Earth surface - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice gravitation MCQ: Satellite mass m revolves around Earth radius R at height x. If g is acceleration due to gravity on surface, orbital speed is? Options: gx, gR/(R-x), √(gR²/(R+x)), gR²/(R+x)². Correct: √(gR²/(R+x)). Explanation: v = √(GM/(R+x)). Since g=GM/R² ⇒ GM=gR², so v = √(gR²/(R+x)). More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/gravitation/mcq28:
    title: "Gravitation | Time period of Earth satellite is independent of - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice gravitation MCQ: Time-period of Earth satellite in circular orbit is independent of? Options: mass of satellite, radius of its orbit, both mass and radius, neither. Correct: mass of satellite. Explanation: T = 2π√(r³/GM). Period depends on orbital radius r but independent of satellite's mass. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/gravitation/mcq29:
    title: "Gravitation | Time period of low Earth orbit satellite compared to geostationary - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice gravitation MCQ: Geostationary satellite orbits at radius 36000 km with 24 hr period. Time period of satellite orbiting few hundred km above Earth surface (R=6400 km) is approximately? Options: 1/2 hr, 1 day, 2 hr, 4 hr. Correct: 2 hr. Explanation: By Kepler's third law: T₂ = T₁(r₂/r₁)³/² = 24×(6400/36000)³/² ≈ 24×0.075 ≈ 1.8 hr ≈ 2 hr. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/gravitation/mcq30:
    title: "Gravitation | Number of days in year if Earth-Sun distance halved - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice gravitation MCQ: If distance between Earth and Sun were half present value, number of days in year would be? Options: 64.5, 129, 182.5, 730. Correct: 129. Explanation: T² ∝ r³. If r→r/2, T₂/T₁=(1/2)³/²=1/2.828=0.3535. T₂=365×0.3535≈129 days. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/gravitation/mcq31:
    title: "Gravitation | Gain in potential energy when object raised to height equal to Earth radius - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice gravitation MCQ: Gain in potential energy of mass m raised from surface to height equal to radius R is? Options: 2mgR, ½mgR, ¼mgR, mgR. Correct: ½mgR. Explanation: ΔU = GMm/R - GMm/(2R) = GMm/(2R) = (gR²·m)/(2R)=½mgR. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/gravitation/mcq32:
    title: "Gravitation | Energy required to move body from orbit radius 2R to 3R - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice gravitation MCQ: Energy required to move body of mass m from orbit radius 2R to 3R is? Options: GMm/(12R²), GMm/(3R²), GMm/(8R), GMm/(6R). Correct: GMm/(6R). Explanation: ΔU = (-GMm/(3R)) - (-GMm/(2R)) = GMm/(2R) - GMm/(3R) = GMm/(6R). More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/gravitation/mcq33:
    title: "Gravitation | Work done in gravitational field along different paths - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice gravitation MCQ: W₁, W₂, W₃ represent work done moving particle from A to B along three different paths in gravitational field. Then? Options: W₁>W₂>W₃, W₁=W₂=W₃, W₁<W₂<W₃, W₁>W₃. Correct: W₁=W₂=W₃. Explanation: Gravitational force is conservative. Work done between two points independent of path. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/gravitation/mcq34:
    title: "Gravitation | Gravitational field strength decreases with distance - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice gravitation MCQ: Which is true about gravitational field? Options: field extends till finite distance; strength increases moving away; strength decreases moving away; at infinite strength not zero. Correct: strength decreases when moving away from a body. Explanation: g = GM/r². As distance r increases, field strength decreases, approaching zero at infinite distance. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/gravitation/mcq35:
    title: "Gravitation | Gravitational field intensity at 10 m given 40 N/kg at 5 m - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice gravitation MCQ: Gravitational field intensity due to particle at 5 m is 40 N/kg. Value at 10 m is? Options: 160 N/kg, 220 N/kg, 10 N/kg, 80 N/kg. Correct: 10 N/kg. Explanation: g ∝ 1/r². At 10 m = 2×5 m, g = 40×(1/2)² = 40×1/4 = 10 N/kg. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/gravitation/mcq36:
    title: "Gravitation | Condition for net gravitational field intensity to be zero at neutral point - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice gravitation MCQ: For net intensity to be zero at neutral point due to two particles, field intensity due to both particles will be? Options: Opposite to each other; Equal in magnitude; Both 1 and 2; None. Correct: Both 1 and 2. Explanation: At neutral point, gravitational fields cancel, requiring equal magnitude and opposite direction. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/gravitation/mcq37:
    title: "Gravitation | Gravitational field intensity given force 3.0 N on 60 g mass - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice gravitation MCQ: Body of mass 60g experiences gravitational force of 3.0 N. Magnitude of gravitational field intensity at that point is? Options: 0.05 N/kg, 50 N/kg, 20 N/kg, 180 N/kg. Correct: 50 N/kg. Explanation: g = F/m = 3.0 N / 0.06 kg = 50 N/kg. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/gravitation/mcq38:
    title: "Gravitation | Point where gravitational field intensity is zero for point masses at cube vertices - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice gravitation MCQ: Point mass m kept at each of eight vertices of cube, gravitational field intensity is zero at? Options: Each face center, Each edge center, At body center, Cannot be zero anywhere. Correct: At body center. Explanation: Due to symmetry, at center of cube, gravitational field contributions from all eight vertices cancel completely, resulting in zero net field. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/gravitation/mcq39:
    title: "Gravitation | Average density of Earth is directly proportional to g - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice gravitation MCQ: Average density of Earth? Options: is complex function of g; does not depend on g; is inversely proportional to g; is directly proportional to g. Correct: is directly proportional to g. Explanation: g = GM/R² and M = (4/3)πR³ρ ⇒ ρ = 3g/(4πGR), so density directly proportional to g. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/gravitation/mcq40:
    title: "Gravitation | Acceleration due to gravity on planet with mass and radius twice Earth - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice gravitation MCQ: gₑ and gₚ denote g on Earth and another planet with mass and radius twice Earth. Then? Options: gₚ=gₑ, gₚ=0.5gₑ, gₚ=2gₑ, gₚ=gₑ/√2. Correct: gₚ=0.5gₑ. Explanation: g = GM/R². If M→2M and R→2R, gₚ = G(2M)/(2R)² = 2GM/(4R²)=½·GM/R² = gₑ/2. More entry test MCQs at NotesPrep."
    https://notesprep.com/entry-tests/mcqs/heat-and-thermodynamics/mcq1:
    title: "Heat and Thermodynamics | Temperature determines direction of heat flow - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice heat and thermodynamics MCQ: Temperature is a property which determines? Options: How much heat body contains; Whether body will feel hot or cold; Direction of heat flow between two systems; How much total absolute energy body has. Correct: In which direction heat will flow between two systems. Explanation: Temperature determines heat flow direction. Heat always flows from higher to lower temperature until thermal equilibrium. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/heat-and-thermodynamics/mcq2:
    title: "Heat and Thermodynamics | Why mercury is preferred as thermometric substance - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice heat and thermodynamics MCQ: We prefer mercury as thermometric substance because? Options: Wide range uniform expansion; Does not stick to glass; Opaque to light; All of above. Correct: All of above. Explanation: Mercury expands uniformly over wide temperature range, does not stick to glass, and is opaque making meniscus easily visible. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/heat-and-thermodynamics/mcq3:
    title: "Heat and Thermodynamics | Two fixed points on temperature scales are - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice heat and thermodynamics MCQ: Scales of temperature are based on two fixed points which are? Options: Water at 0°C and 100°C; Boiling water at atmospheric pressure; Ice cold and boiling water; Frozen and boiling mercury. Correct: Temperatures of ice cold and boiling water. Explanation: Temperature scales based on freezing point (ice point) and boiling point (steam point) of water at standard atmospheric pressure. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/heat-and-thermodynamics/mcq4:
    title: "Heat and Thermodynamics | Numerical value of Boltzmann's constant - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice heat and thermodynamics MCQ: Numerical value of Boltzmann's constant is? Options: 1.38×10⁻³¹ K⁻¹, 3.18×10⁻²³ J/K, 3.18×10⁻²³ J/K, 1.38×10⁻²³ J/K. Correct: 1.38×10⁻²³ J/K. Explanation: Boltzmann's constant k ≈ 1.38×10⁻²³ J/K, relating average kinetic energy of gas particles to temperature. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/heat-and-thermodynamics/mcq5:
    title: "Heat and Thermodynamics | Why mercury in clinical thermometer does not contract after removal - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice heat and thermodynamics MCQ: In clinical thermometer mercury in capillary tube does not contract once removed from patient because? Options: Mercury takes long time to contract; Amount of mercury very small; Capillary tube has small constriction near bulb; Capillary tube very narrow. Correct: Capillary tube has small constriction near bulb. Explanation: Clinical thermometers have constriction (kink) near bulb allowing mercury to rise but preventing immediate fall, allowing temperature reading after removal. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/heat-and-thermodynamics/mcq6:
    title: "Heat and Thermodynamics | Normal human body temperature 98.6°F in Celsius - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice heat and thermodynamics MCQ: Normal human body temperature 98.6°F corresponds to? Options: 37°C, 42°C, 55°C, 410°C. Correct: 37°C. Explanation: C = (F-32)×5/9 = (98.6-32)×5/9 = 66.6×5/9 = 37°C. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/heat-and-thermodynamics/mcq7:
    title: "Heat and Thermodynamics | Fahrenheit reading double centigrade when centigrade is - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice heat and thermodynamics MCQ: Fahrenheit reading double centigrade when temperature on centigrade scale is? Options: 460°C, 280°C, 360°C, 160°C. Correct: 160°C. Explanation: F=2C, using F=9C/5+32: 2C=9C/5+32 ⇒ (10C-9C)/5=32 ⇒ C/5=32 ⇒ C=160°C. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/heat-and-thermodynamics/mcq8:
    title: "Heat and Thermodynamics | General gas equation - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice heat and thermodynamics MCQ: General gas equation is? Options: PV=nRT, PV=mRT, PV=CV=Wj, PV=C. Correct: PV=mRT. Explanation: General gas equation is PV=mRT where m is mass, R is specific gas constant. PV=nRT uses universal gas constant with number of moles. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/heat-and-thermodynamics/mcq9:
    title: "Heat and Thermodynamics | Ideal gas vs real gas at very high pressure occupies - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice heat and thermodynamics MCQ: Ideal gas compared to real gas at very high pressure occupies? Options: more volume, less volume, same volume, unpredictable. Correct: more volume. Explanation: At high pressures, real gas molecules have significant volume and intermolecular forces, causing them to occupy more volume than ideal gas predicts. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/heat-and-thermodynamics/mcq10:
    title: "Heat and Thermodynamics | SI unit of pressure - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice heat and thermodynamics MCQ: Unit of pressure in SI units is? Options: kg/cm², mm of water column, pascal, dynes per square cm. Correct: pascal. Explanation: SI unit of pressure is pascal (Pa), defined as one newton per square meter (N/m²). More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/heat-and-thermodynamics/mcq11:
    title: "Heat and Thermodynamics | Temperature of gas is produced due to - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice heat and thermodynamics MCQ: Temperature of gas is produced due to? Options: its heating value, kinetic energy of molecules, repulsion of molecules, attraction of molecules. Correct: kinetic energy of molecules. Explanation: Temperature measures average kinetic energy of molecules. Higher kinetic energy corresponds to higher temperature. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/heat-and-thermodynamics/mcq12:
    title: "Heat and Thermodynamics | Average translational kinetic energy of gas molecules is proportional to - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice heat and thermodynamics MCQ: Gas molecules of different masses in same container have same average translational kinetic energy directly proportional to? Options: volume, pressure, absolute temperature, time. Correct: absolute temperature. Explanation: Average translational KE = 3/2 kT, directly proportional to absolute temperature. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/heat-and-thermodynamics/mcq13:
    title: "Heat and Thermodynamics | Boyle's law - when pressure doubled volume becomes - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice heat and thermodynamics MCQ: For gas obeying Boyle's law, if pressure doubled volume becomes? Options: double, one half, four times, one fourth. Correct: one half. Explanation: Boyle's law: P ∝ 1/V at constant temperature. Pressure doubled ⇒ volume becomes half. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/heat-and-thermodynamics/mcq14:
    title: "Heat and Thermodynamics | Triple point of water - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice heat and thermodynamics MCQ: Triple point of water is? Options: 273°C at 6.11 kPa, 273 K at 61.6 kPa, 273.16°C at 0.611 kPa, 273.16 K at 0.611 kPa. Correct: 273.16 K at 0.611 kPa. Explanation: Triple point of water is exactly 273.16 K (0.01°C) at 0.611 kPa, where ice, liquid water, and water vapor coexist in equilibrium. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/heat-and-thermodynamics/mcq15:
    title: "Heat and Thermodynamics | Property of gas molecules same for all gases at particular temperature - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice heat and thermodynamics MCQ: Which property of gas molecules is same for all gases at particular temperature? Options: momentum, mass, velocity, kinetic energy. Correct: kinetic energy. Explanation: At given temperature, all gases have same average translational kinetic energy = 3/2 kT, regardless of molecular mass. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/heat-and-thermodynamics/mcq16:
    title: "Heat and Thermodynamics | Boltzmann constant in terms of R and N_A - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice heat and thermodynamics MCQ: Boltzmann constant k in terms of universal gas constant R and Avogadro's number N_A is? Options: k=R/N_A, k=RN_A, k=N_A/R, k=RN_A². Correct: k=R/N_A. Explanation: Boltzmann constant is gas constant per molecule: k = R/N_A, where R=8.314 J/(mol·K) and N_A=6.022×10²³ mol⁻¹. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/heat-and-thermodynamics/mcq17:
    title: "Heat and Thermodynamics | Adiabatic process is also called - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice heat and thermodynamics MCQ: Adiabatic process is also called? Options: Heat exchange process, Heating process, Isentropic process, All of above. Correct: Isentropic process. Explanation: Adiabatic process has no heat exchange. For reversible adiabatic process, entropy constant, so also called isentropic process. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/heat-and-thermodynamics/mcq18:
    title: "Heat and Thermodynamics | Work done in isochoric process - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice heat and thermodynamics MCQ: Work done in isochoric process is? Options: constant, variable, zero, depends on situation. Correct: zero. Explanation: In isochoric process, volume constant (ΔV=0). Work done W = PΔV = 0. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/heat-and-thermodynamics/mcq19:
    title: "Heat and Thermodynamics | Process where all heat supplied is converted into work - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice heat and thermodynamics MCQ: In which process all heat supplied is converted into work done? Options: isothermal, isochoric, isobaric, isentropic. Correct: isothermal. Explanation: In isothermal process, ΔU=0, so from first law Q=ΔU+W ⇒ Q=W. All heat converted to work. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/heat-and-thermodynamics/mcq20:
    title: "Heat and Thermodynamics | Area enclosed by Carnot cycle on PV diagram represents - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice heat and thermodynamics MCQ: Area enclosed by curve ABCDA for Carnot heat engine represents? Options: work at any instant, average work, work during operation, work during one cycle. Correct: work during one cycle. Explanation: On PV diagram, area enclosed by Carnot cycle represents net work done by engine during one complete cycle. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/heat-and-thermodynamics/mcq21:
    title: "Heat and Thermodynamics | Value of γ (gamma) for diatomic gas - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice heat and thermodynamics MCQ: Value of γ (gamma) for diatomic gas is? Options: 1.67, 1.4, 1.3, none. Correct: 1.4. Explanation: For diatomic gases (O₂, N₂, H₂), ratio of specific heats γ = C_p/C_v = 1.4. Monatomic: 1.67, triatomic: 1.3. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/heat-and-thermodynamics/mcq22:
    title: "Heat and Thermodynamics | Correct relation for specific heats ratio - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice heat and thermodynamics MCQ: Which is correct relation? Options: C_p+C_v=?, C_p=1+R/C_v, γ=C_p/C_v, C_p=1-R/C_v. Correct: γ=C_p/C_v. Explanation: Ratio of specific heats γ = C_p/C_v. Monatomic: γ=1.67, diatomic: γ=1.4, triatomic: γ=1.3. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/heat-and-thermodynamics/mcq23:
    title: "Heat and Thermodynamics | Conditions for successful operation of heat engine - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice heat and thermodynamics MCQ: For successful operation of Heat engine which condition should be met? Options: cyclic process, operated at certain temperature difference, both a and b, none. Correct: both a and b. Explanation: Heat engine must operate in cyclic process and requires temperature difference between hot and cold reservoirs to convert heat to work. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/heat-and-thermodynamics/mcq24:
    title: "Heat and Thermodynamics | Performance of refrigerator is described by - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice heat and thermodynamics MCQ: Performance of refrigerator is described by? Options: efficiency, coefficient of performance, both, not described. Correct: coefficient of performance. Explanation: Refrigerator performance measured by coefficient of performance (COP) = heat removed from cold reservoir / work input. Efficiency used for heat engines. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/heat-and-thermodynamics/mcq25:
    title: "Heat and Thermodynamics | Purpose of flywheel in engines - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice heat and thermodynamics MCQ: Purpose of flywheel in engines is? Options: smooth out energy variation, add more weight for stability, start engine, both a and b. Correct: to smooth out energy variation. Explanation: Flywheel stores rotational energy and smooths out energy variations, reducing speed fluctuations during each cycle. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/heat-and-thermodynamics/mcq26:
    title: "Heat and Thermodynamics | Petrol engine type - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice heat and thermodynamics MCQ: Petrol engine is a? Options: C.I engine, S.I engine, I.C engine, all of above. Correct: S.I engine. Explanation: Petrol engine is Spark Ignition (S.I) engine using spark plug to ignite fuel-air mixture. C.I engines are diesel engines using compression ignition. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/heat-and-thermodynamics/mcq27:
    title: "Heat and Thermodynamics | Unit of entropy - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice heat and thermodynamics MCQ: Unit of entropy is? Options: J·K, J/K, N·m/sec, kg/m²s²K. Correct: J/K. Explanation: Entropy measured in Joules per Kelvin (J/K), representing amount of energy dispersed per unit temperature. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/heat-and-thermodynamics/mcq28:
    title: "Heat and Thermodynamics | Which quantity is a state function - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice heat and thermodynamics MCQ: Which quantity is a state function? Options: internal energy, heat supply, pressure, volume. Correct: internal energy. Explanation: Internal energy depends only on current state of system. Heat supply and work are path functions. More entry test MCQs at NotesPrep."
    https://notesprep.com/entry-tests/mcqs/matrix-and-determinants/mcq1:
    title: "Matrices and Determinants | Which matrix is singular - determinant zero condition - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice matrices and determinants MCQ: Which of following is singular matrix? Options: [4 3; 6 2], [4 2; 6 3], [4 2; 3 6], None. Correct: [4 2; 6 3]. Explanation: Matrix singular if determinant=0. For [4 2; 6 3], det=(4×3)-(2×6)=12-12=0. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/matrix-and-determinants/mcq2:
    title: "Matrices and Determinants | Minimum number of zeros in triangular matrix of order 6×6 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice matrices and determinants MCQ: Minimum number of zeros in triangular matrix of order 6×6 is? Options: 20, 18, 12, 15. Correct: 15. Explanation: For n×n triangular matrix, zeros = n(n-1)/2. For n=6: 6×5/2 = 30/2 = 15. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/matrix-and-determinants/mcq3:
    title: "Matrices and Determinants | Sum of diagonal elements of square matrix is called - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice matrices and determinants MCQ: Sum of diagonal elements of square matrix is called? Options: Transpose, Trace, Adjoint, Cofactor. Correct: Trace of matrix. Explanation: Trace tr(A) = sum of diagonal elements = Σ a_ii for i=1 to n. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/matrix-and-determinants/mcq4:
    title: "Matrices and Determinants | Which rule is used to solve 3×3 matrix determinant - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice matrices and determinants MCQ: Which rule is used to solve 3×3 matrix? Options: Sarrus' rule, Cramer's rule, LU decomposition, Gauss elimination. Correct: Sarrus' rule. Explanation: Sarrus' rule is mnemonic technique for calculating determinant of 3×3 matrix using diagonal multiplication pattern. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/matrix-and-determinants/mcq5:
    title: "Matrices and Determinants | Value of k for which matrix [k 8; 4 2k] is singular - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice matrices and determinants MCQ: Value of k for which A = [k 8; 4 2k] is singular is? Options: 4, -4, ±4, 0. Correct: ±4. Explanation: |A|=k(2k)-8(4)=2k²-32=0 ⇒ k²=16 ⇒ k=±4. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/matrix-and-determinants/mcq6:
    title: "Matrices and Determinants | Condition for A⁻¹ to exist with lambda parameter - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice matrices and determinants MCQ: If A = [2 λ -3; 0 2 5; 1 1 3], then A⁻¹ exists if? Options: λ=2, λ≠2, λ≠-2, None. Correct: None of these. Explanation: |A|=5λ+8. For inverse to exist, |A|≠0 ⇒ λ≠-8/5. None of given options match, so answer is None. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/matrix-and-determinants/mcq7:
    title: "Matrices and Determinants | If AB=O (zero matrix), must A=O or B=O necessarily - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice matrices and determinants MCQ: If AB=O (zero matrix), which need necessarily be true? (i) A=O (ii) B=O. Options: Only (i), Only (ii), Both, None. Correct: None of above. Explanation: Product can be zero without either matrix being zero. Example: A=[1 0;0 0], B=[0 0;1 0] gives AB=O. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/matrix-and-determinants/mcq8:
    title: "Matrices and Determinants | Adjoint of product AB equals - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice matrices and determinants MCQ: If A and B are two matrices, then adjoint(AB) is equal to? Options: adj(A)adj(B), adj(B)adj(A), adj(BA), None. Correct: adj(B)adj(A). Explanation: adj(AB) = adj(B)·adj(A) because (AB)⁻¹ = B⁻¹A⁻¹ and adjoint related to inverse. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/matrix-and-determinants/mcq9:
    title: "Matrices and Determinants | Square matrix A is called unitary if - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice matrices and determinants MCQ: Square matrix A is called unitary if? Options: A*=A, A*=-A, A*=A⁻¹, Aᵀ=A⁻¹. Correct: A* = A⁻¹. Explanation: Unitary matrix satisfies A* = A⁻¹, meaning AA* = A*A = I. Complex analog of orthogonal matrix. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/matrix-and-determinants/mcq10:
    title: "Matrices and Determinants | Solve for x in matrix equation [1 x 1]×M×[x 1 -2]ᵀ = 0 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice matrices and determinants MCQ: If [1 x 1] [1 3 2; 0 5 1; 0 3 2] [x; 1; -2] = 0, then x = ? Options: 1/2, -1/2, 2, -2. Correct: 1/2. Explanation: Multiply row matrix with 3×3 gives [1, 5x+6, x+4]. Multiply with column: x + (5x+6) + (x+4)(-2) = 4x-2 =0 ⇒ x=1/2. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/matrix-and-determinants/mcq11:
    title: "Matrices and Determinants | Find X if A+X=I for given 3×3 matrix A - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice matrices and determinants MCQ: Find X if A+X=I, where A=[1 4 -1; 3 4 7; 5 1 6]. Options: Four matrices. Correct: [0 -4 1; -3 -3 -7; -5 -1 -5]. Explanation: X = I - A. Subtract corresponding elements: I-A gives [0 -4 1; -3 -3 -7; -5 -1 -5]. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/matrix-and-determinants/mcq12:
    title: "Matrices and Determinants | Find a₂₃ + a₃₂ in matrix with piecewise definition - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice matrices and determinants MCQ: Find a₂₃ + a₃₂ in A=[a_ij] where a_ij = |2i-j| if i>j, a_ij = -i+2j+3 if i<j. Options: 11, 9, 10, 12. Correct: 11. Explanation: a₂₃ (i<j): -2+2(3)+3=7. a₃₂ (i>j): |2(3)-2|=4. Sum=7+4=11. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/matrix-and-determinants/mcq13:
    title: "Matrices and Determinants | Order of product AB when A is p×q and B is q×r - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice matrices and determinants MCQ: If order of A is p×q and order of B is q×r, then order of AB will be? Options: p×q, q×p, p×r, r×p. Correct: p×r. Explanation: For matrix multiplication, resulting matrix has rows from first matrix and columns from second matrix: p×r. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/matrix-and-determinants/mcq14:
    title: "Matrices and Determinants | Value of determinant when two rows are identical - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice matrices and determinants MCQ: If two rows of determinant are identical then its value is? Options: 1, zero, -1, None. Correct: zero. Explanation: Fundamental property of determinants: if any two rows (or columns) are identical, determinant value is zero. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/matrix-and-determinants/mcq15:
    title: "Matrices and Determinants | Condition for non-trivial solution of homogeneous linear equations - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice matrices and determinants MCQ: System of homogeneous linear equations has non-trivial solution if? Options: |A|>0, |A|<0, |A|=0, |A|≠0. Correct: |A|=0. Explanation: Homogeneous system AX=0 has non-trivial solution iff coefficient matrix A is singular, i.e., |A|=0. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/matrix-and-determinants/mcq16:
    title: "Matrices and Determinants | Condition for inconsistent non-homogeneous system - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice matrices and determinants MCQ: For non-homogeneous system, system is inconsistent if? Options: Rank(A)=Rank(A_b); Rank(A)≠Rank(A_b); Rank(A)<variables; Rank(A_b)>variables. Correct: Rank(A) ≠ Rank(A_b). Explanation: System consistent iff ranks equal. If ranks unequal, system has no solution (inconsistent). More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/matrix-and-determinants/mcq17:
    title: "Matrices and Determinants | Solve determinant equation for x - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice matrices and determinants MCQ: Using properties of determinants, find x: det[4-x 4+x 4+x; 4+x 4-x 4+x; 4+x 4+x 4-x]=0. Options: x=0,-12; x=0,12; x=0,-4; x=0,4. Correct: x=0,-12. Explanation: Apply C₁→C₁+C₂+C₃, factor (12+x), then row operations yield (12+x)(4x²)=0 ⇒ x=0 or x=-12. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/matrix-and-determinants/mcq18:
    title: "Matrices and Determinants | Transpose of product ABC - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice matrices and determinants MCQ: If A,B,C are conformable for multiplication, then (ABC)ᵗ = ? Options: CᵗBᵗAᵗ, BᵗCᵗAᵗ, AᵗBᵗCᵗ, BᵗAᵗCᵗ. Correct: CᵗBᵗAᵗ. Explanation: Transpose of product equals product of transposes in reverse order: (ABC)ᵗ = CᵗBᵗAᵗ. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/matrix-and-determinants/mcq19:
    title: "Matrices and Determinants | Transpose of sum of matrices - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice matrices and determinants MCQ: If C and D are two matrices, (C+D)ᵗ = ? Options: Cᵗ+Dᵗ, CᵗDᵗ, DᵗCᵗ, CDᵗ. Correct: Cᵗ+Dᵗ. Explanation: Transpose of sum equals sum of transposes: (C+D)ᵗ = Cᵗ + Dᵗ. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/matrix-and-determinants/mcq20:
    title: "Matrices and Determinants | Condition for skew-Hermitian matrix - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice matrices and determinants MCQ: If square matrix A is skew-Hermitian, then which is true? Options: A*=A, A*=-A, Aᵀ=A, Aᵀ=-A. Correct: A* = -A. Explanation: Skew-Hermitian matrix satisfies A* = -A, where A* is conjugate transpose. Diagonal elements must be purely imaginary or zero. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/matrix-and-determinants/mcq21:
    title: "Matrices and Determinants | Rank of matrix with proportional rows - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice matrices and determinants MCQ: Rank of matrix [1 2 3; 2 4 6; 3 6 9] is? Options: 0, 1, 2, 3. Correct: 1. Explanation: Each row is scalar multiple of first row: Row2=2×Row1, Row3=3×Row1. Only one linearly independent row, so rank=1. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/matrix-and-determinants/mcq22:
    title: "Matrices and Determinants | System consistency when |A|=0 and adj(A)B≠0 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice matrices and determinants MCQ: For system AX=B, if |A|=0 and (adj A)B≠0, then system is? Options: Consistent unique; Consistent infinite; Inconsistent; Cannot determine. Correct: Inconsistent (no solution). Explanation: |A|=0 means A singular. If (adj A)B≠0, condition for consistency fails, so system has no solution. More entry test MCQs at NotesPrep."
    https://notesprep.com/entry-tests/mcqs/measurement/mcq1:
    title: "Measurement | Number of base units in SI system - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice measurement MCQ: Number of base units are? Options: Three, Five, Seven, Nine. Correct: Seven. Explanation: SI has seven base units: kilogram (mass), meter (length), second (time), ampere (current), kelvin (temperature), mole (amount), candela (luminous intensity). More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/measurement/mcq2:
    title: "Measurement | Which is a derived quantity - force, mass, length or time - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice measurement MCQ: Which of following is derived quantity? Options: Force, Mass, Length, Time. Correct: Force. Explanation: Force is derived quantity expressed in base units: kg·m/s². Mass, length, time are base quantities. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/measurement/mcq3:
    title: "Measurement | Which is SI base unit - gram, slug, Newton or kilogram - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice measurement MCQ: Which of following is SI base unit? Options: gram, slug, Newton, kilogram. Correct: kilogram. Explanation: Kilogram (kg) is SI base unit for mass. Gram is subunit, slug is imperial, Newton is derived unit for force. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/measurement/mcq4:
    title: "Measurement | Which is not a unit of length - Angstrom, Micron, Radian or Light year - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice measurement MCQ: Which one is not a unit of length? Options: Angstrom, Micron, Radian, Light year. Correct: Radian. Explanation: Radian is SI unit of plane angle, not length. Angstrom (10⁻¹⁰m), micron (10⁻⁶m), light year are length units. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/measurement/mcq5:
    title: "Measurement | Which is not a base unit - Kilogram, Joule, Ampere or Kelvin - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice measurement MCQ: Which is not a base unit in SI units? Options: Kilogram, Joule, Ampere, Kelvin. Correct: Joule. Explanation: Joule is derived unit for energy (kg·m²/s²). Kilogram, Ampere, Kelvin are base units. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/measurement/mcq6:
    title: "Measurement | Example of derived unit - Candela, Ampere, Coulomb or Mole - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice measurement MCQ: Example of derived unit is? Options: Candela, Ampere, Coulomb, Mole. Correct: Coulomb. Explanation: Coulomb is derived unit for electric charge (A·s). Candela, Ampere, Mole are base units. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/measurement/mcq7:
    title: "Measurement | Candela is SI unit of - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice measurement MCQ: Candela is SI unit of? Options: Charge, Luminous intensity, Power, Refractive index. Correct: Luminous intensity. Explanation: Candela (cd) is SI base unit for luminous intensity. Charge in coulombs, power in watts, refractive index dimensionless. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/measurement/mcq8:
    title: "Measurement | Alternate unit to kg·m·s⁻¹ - J·s, N·s, N·m or N - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice measurement MCQ: Alternate unit to kg·m·s⁻¹ is? Options: J·s, N·s, N·m, N. Correct: N·s. Explanation: kg·m·s⁻¹ is momentum unit. N·s is also momentum unit since N = kg·m·s⁻², so N·s = kg·m·s⁻¹. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/measurement/mcq9:
    title: "Measurement | SI units of pressure in base units - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice measurement MCQ: SI units of pressure in terms of base units are? Options: kg·m⁻¹·s⁻², kg·m⁻¹·s⁻³, kg·m·s⁻², kg·m²·s⁻². Correct: kg·m⁻¹·s⁻². Explanation: Pressure = Force/Area = (kg·m·s⁻²)/m² = kg·m⁻¹·s⁻². Pascal (Pa) is SI unit. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/measurement/mcq10:
    title: "Measurement | SI unit of plane angle - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice measurement MCQ: SI unit of plane angle is? Options: Steradian, Radian, Degree, Candle. Correct: Radian. Explanation: Radian (rad) is SI unit for plane angle. Steradian for solid angle, degree is non-SI. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/measurement/mcq11:
    title: "Measurement | Which is derived unit - Candela, Ampere, Kelvin or Newton - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice measurement MCQ: Which is derived unit? Options: Candela, Ampere, Kelvin, Newton. Correct: Newton. Explanation: Newton (N) is derived unit for force = kg·m/s². Candela, Ampere, Kelvin are base units. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/measurement/mcq12:
    title: "Measurement | Correct representation of unit of force - newton vs Newton, n vs N - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice measurement MCQ: Unit of force is ______ and symbol is ______ which is correct pair? Options: Newton,n; Newton,N; newton,n; newton,N. Correct: newton, N. Explanation: Unit named after scientist, name lowercase (newton), symbol uppercase (N). More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/measurement/mcq13:
    title: "Measurement | Correct representation of unit of pressure - Newton/Meter² or newton/meter² - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice measurement MCQ: Which is correct representation of unit of pressure? Options: Newton/Meter², newton/Meter², Newton/meter², newton/meter². Correct: newton/meter². Explanation: Unit names lowercase (newton, meter), symbols uppercase (N,m). Pascal (Pa)=N/m². More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/measurement/mcq14:
    title: "Measurement | Farad is unit of - luminosity, wavelength, permittivity or inertia - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice measurement MCQ: Farad is unit of ______. Options: Luminosity, Wavelength, Permittivity, Inertia. Correct: Permittivity. Explanation: Farad (F) is SI unit of capacitance, measure of permittivity, ability to store electric charge. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/measurement/mcq15:
    title: "Measurement | Electron volt is unit of - luminosity, frequency, force or energy - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice measurement MCQ: Electron volt is unit of ______. Options: Luminosity, Frequency, Force, Energy. Correct: Energy. Explanation: Electron volt (eV) is unit of energy, commonly used in atomic/nuclear physics. 1eV = 1.602×10⁻¹⁹ J. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/measurement/mcq16:
    title: "Measurement | Joule second is unit of - force, angular momentum, energy or power - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice measurement MCQ: Joule second is unit of ______. Options: Force, Angular momentum, Energy, Power. Correct: Angular momentum. Explanation: J·s is unit of angular momentum and Planck's constant. Angular momentum units: kg·m²/s = J·s. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/measurement/mcq17:
    title: "Measurement | SI unit of intensity of light - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice measurement MCQ: SI unit of intensity of light is? Options: Mole, Kelvin, Candela, Ampere. Correct: Candela. Explanation: Candela (cd) is SI base unit for luminous intensity. Mole for amount, Kelvin for temperature, Ampere for current. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/measurement/mcq18:
    title: "Measurement | Which is least multiple - Pico, Femto, Nano or Atto - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice measurement MCQ: Which is least multiple? Options: Pico, Femto, Nano, Atto. Correct: Atto. Explanation: Order: atto(10⁻¹⁸) < femto(10⁻¹⁵) < pico(10⁻¹²) < nano(10⁻⁹). Atto is smallest. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/measurement/mcq19:
    title: "Measurement | Which is highest power multiple - giga, mega, kilo or deca - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice measurement MCQ: Which one is highest power multiple? Options: giga, mega, kilo, deca. Correct: giga. Explanation: Order: deca(10¹) < kilo(10³) < mega(10⁶) < giga(10⁹). Giga is largest. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/measurement/mcq20:
    title: "Measurement | Prefix pico is equal to - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice measurement MCQ: Prefix pico is equal to? Options: 10⁻⁶, 10⁻¹², 10⁻¹⁸, 10⁻¹¹. Correct: 10⁻¹². Explanation: Pico (p) = 10⁻¹². Example: 1 picometer = 10⁻¹² meters. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/measurement/mcq21:
    title: "Measurement | SI unit prefixes in order smallest to largest - p,n,c,μ or p,n,μ,c - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice measurement MCQ: Which row shows SI unit prefixes in order smallest to largest value? Options: p,n,c,μ; p,n,μ,c; n,p,c,μ; n,p,μ,c. Correct: p,n,μ,c. Explanation: Order: pico(10⁻¹²) < nano(10⁻⁹) < micro(10⁻⁶) < centi(10⁻²). So p,n,μ,c. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/measurement/mcq22:
    title: "Measurement | Which is shortest distance - 10⁻¹⁹ Gm, 10⁻¹⁴ km, 10⁻⁴ μm or 10⁷ fm - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice measurement MCQ: Which is shortest distance? Options: 10⁻¹⁹ Gm, 10⁻¹⁴ km, 10⁻⁴ μm, 10⁷ fm. Correct: 10⁻¹⁴ km. Explanation: Convert to meters: A)10⁻¹⁰m, B)10⁻¹¹m, C)10⁻¹⁰m, D)10⁻⁸m. Smallest is 10⁻¹¹m (option B). More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/measurement/mcq23:
    title: "Measurement | 0.0023 in scientific notation - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice measurement MCQ: 0.0023 can be expressed in scientific notation as? Options: 23×10⁻⁴, 0.23×10⁻², 2.3×10⁻³, None. Correct: 2.3×10⁻³. Explanation: Scientific notation requires number between 1 and 10 times power of 10. 0.0023 = 2.3×10⁻³. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/measurement/mcq24:
    title: "Measurement | 1024 in scientific notation - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice measurement MCQ: 1024 can be written in scientific notation as? Options: 1.024×10³, 2¹⁰, 0.000976, 1/0300097. Correct: 1.024×10³. Explanation: 1024 = 1.024×10³ in scientific notation. 2¹⁰ is correct mathematically but not scientific notation. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/measurement/mcq25:
    title: "Measurement | Significant figures in 0.0173 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice measurement MCQ: Number of significant figures in 0.0173 are? Options: Three, Four, Five, Two. Correct: Three. Explanation: Leading zeros not significant. In 0.0173, digits 1,7,3 are significant → 3 significant figures. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/measurement/mcq26:
    title: "Measurement | Addition of 72.1, 3.32 and 0.003 with significant figures - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice measurement MCQ: Student added 72.1, 3.32 and 0.003. Correct answer regarding significant figures will be? Options: 75.423, 75.42, 75.4, 75. Correct: 75.4. Explanation: When adding, result has same decimal places as number with fewest. 72.1 has 1 decimal place. Sum=75.423 rounded to 75.4. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/measurement/mcq27:
    title: "Measurement | Reading with measuring scale of 1 mm minimum division - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice measurement MCQ: Reading taken with measuring scale whose minimum division is 1 mm, correct reading is? Options: 0.2145 m, 0.21 m, 0.214 m, None. Correct: 0.214 m. Explanation: Minimum division 1 mm (0.001 m). Reading 0.214 m (214 mm) appropriate; 0.2145 m suggests 0.5 mm precision not possible. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/measurement/mcq28:
    title: "Measurement | 75.560 rounded off - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice measurement MCQ: 75.560 is round off as? Options: 75.6, 75.7, 76.00, None. Correct: 75.6. Explanation: Rounding 75.560 to three significant figures: 75.6 (digit after 5 is 6≥5, round up last significant digit). More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/measurement/mcq29:
    title: "Measurement | Zeros to right of non-zero digits are significant or not - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice measurement MCQ: Zero to right of non-zero digits are? Options: Significant, Not significant, May or may not be significant, None. Correct: May or may not be significant. Explanation: Zeros right of non-zero digits significant if after decimal point. In whole numbers, context dependent (e.g., 1200 could have 2,3, or 4 significant figures). More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/measurement/mcq30:
    title: "Measurement | Significant figures in 8.70×10⁴ kg - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice measurement MCQ: Number of significant figures in measurement 8.70×10⁴ kg? Options: 1, 3, 4, 7. Correct: 3. Explanation: In scientific notation, all digits in coefficient are significant. 8.70 has three digits (8,7,0) → 3 significant figures. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/measurement/mcq31:
    title: "Measurement | When is zero not significant - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice measurement MCQ: Zero is not significant only if it? Options: Lies to left of significant digit; Is between two digits; Is to right of significant digit; Is before decimal point. Correct: Lies to left of significant digit. Explanation: Zeros left of first non-zero digit (leading zeros) are not significant. Example: 0.0045 zeros not significant. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/measurement/mcq32:
    title: "Measurement | Significant figures in 0.000846 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice measurement MCQ: Significant figures in 0.000846 are? Options: Six, Four, Seven, Three. Correct: Three. Explanation: Leading zeros not significant. Digits 8,4,6 are significant → 3 significant figures. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/measurement/mcq33:
    title: "Measurement | Smallest value measured by instrument is called - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice measurement MCQ: Smallest value measured using instrument is known as? Options: Absolute count, Least count, Minimum count, Maximum count. Correct: Least count. Explanation: Least count is smallest value accurately measurable by instrument. Ruler with 1mm divisions has least count 1mm. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/measurement/mcq34:
    title: "Measurement | Error due to negligence and inexperience is called - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice measurement MCQ: Error occurs due to negligence and inexperience of person is? Options: Systematic Error, Random Error, Personal Error, None. Correct: Personal Error. Explanation: Personal error (gross error) caused by human mistakes: carelessness, improper reading, or lack of experience. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/measurement/mcq35:
    title: "Measurement | Which is system of unit - SMS, MKP, FPS or CJS - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice measurement MCQ: Which is system of unit? Options: SMS system, MKP system, FPS System, CJS System. Correct: FPS System. Explanation: FPS (Foot-Pound-Second) system: length in feet, mass in pounds, time in seconds. Other systems: CGS, MKS. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/measurement/mcq36:
    title: "Measurement | Mechanical power base units - kg·m²·s⁻³ - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice measurement MCQ: Mechanical power? Options: is vector; measured in J; base units kg·m²·s⁻³; calculated from force×distance. Correct: has base units of kg·m²·s⁻³. Explanation: Power in watts (W)=J/s=kg·m²·s⁻³. Power is scalar, measured in J/s (not J), force×distance gives work. More entry test MCQs at NotesPrep."
    https://notesprep.com/entry-tests/mcqs/nuclear-physics/mcq1:
    title: "Nuclear Physics | Which quantity is not conserved in nuclear reaction - mass, charge, momentum - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice nuclear physics MCQ: Which quantity is not conserved in nuclear reaction? Options: Mass, Charge, Momentum, None. Correct: Mass. Explanation: Mass not conserved because some mass converts to energy per E=mc². Charge, momentum, energy are conserved. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/nuclear-physics/mcq2:
    title: "Nuclear Physics | Nucleus contains protons and neutrons - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice nuclear physics MCQ: Nucleus contains? Options: protons and electrons; protons and neutrons; neutrons and electrons; neutrons and alpha particles. Correct: protons and neutrons. Explanation: Nucleus contains protons (positive) and neutrons (neutral). Electrons orbit nucleus. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/nuclear-physics/mcq3:
    title: "Nuclear Physics | Nuclear radius is proportional to A¹/³ - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice nuclear physics MCQ: Nuclear radius is proportional to? Options: A, A¹/³, A²/³, Z. Correct: A¹/³. Explanation: Nuclear radius R = R₀A¹/³ where R₀≈1.2 fm. Nuclear volume proportional to mass number A. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/nuclear-physics/mcq4:
    title: "Nuclear Physics | Nuclear binding energy equals mass defect × c² - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice nuclear physics MCQ: Nuclear binding energy is? Options: Mass defect×c², Mass defect/c², Mass difference×c², Mass difference/c². Correct: Mass defect×c². Explanation: Binding energy ΔE = Δm×c², where Δm is mass defect. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/nuclear-physics/mcq5:
    title: "Nuclear Physics | One amu is equal to 1.66×10⁻²⁷ kg - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice nuclear physics MCQ: One amu is equal to? Options: 1.66×10⁻²⁷ kg, 166×10⁻¹⁵ ng, 166×10⁻²⁰ µg, all of above. Correct: all of above. Explanation: 1 amu = 1.66×10⁻²⁷ kg = 1.66×10⁻¹⁵ ng = 1.66×10⁻⁹ µg. All equivalent. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/nuclear-physics/mcq6:
    title: "Nuclear Physics | Mass of neutron is 1.67×10⁻²⁷ kg - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice nuclear physics MCQ: Mass of neutron is? Options: 1.67×10⁻³¹ kg, 1.67×10⁻²⁷ kg, 9.1×10⁻³¹ kg, 1.67×10⁻¹⁹ kg. Correct: 1.67×10⁻²⁷ kg. Explanation: Neutron mass approximately 1.67×10⁻²⁷ kg (about 1 atomic mass unit). More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/nuclear-physics/mcq7:
    title: "Nuclear Physics | Charge on neutron is zero - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice nuclear physics MCQ: Charge on neutron is? Options: +1.6×10⁻¹⁹ C, zero, -1.6×10⁻¹⁹ C, no definite charge. Correct: zero. Explanation: Neutron is neutral particle with zero electric charge. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/nuclear-physics/mcq8:
    title: "Nuclear Physics | Charge on electron was determined by Millikan - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice nuclear physics MCQ: Charge on electron was determined by? Options: Ampere, Maxwell, Millikan, Thomson. Correct: Millikan. Explanation: Robert Millikan performed oil-drop experiment (1909) and accurately determined electron charge as 1.6×10⁻¹⁹ C. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/nuclear-physics/mcq9:
    title: "Nuclear Physics | Parent and daughter nuclei after beta decay are isobars - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice nuclear physics MCQ: Radioactive nucleus emits beta particle, parent and daughter nuclei are? Options: Isotones, Isotopes, Isomers, Isobars. Correct: Isobars. Explanation: Beta decay increases atomic number by 1, mass number same. Same mass number → isobars. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/nuclear-physics/mcq10:
    title: "Nuclear Physics | Isotones have same number of neutrons - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice nuclear physics MCQ: Isotones have same number of? Options: Protons, Electrons, Neutrons, All. Correct: Neutrons. Explanation: Isotones are nuclei with same number of neutrons (N) but different protons (Z). More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/nuclear-physics/mcq11:
    title: "Nuclear Physics | Nuclei with same mass number but different atomic number are isobars - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice nuclear physics MCQ: Nuclei having same mass number but different atomic number are? Options: Isotopes, Isobars, Isotones, Isomers. Correct: Isobars. Explanation: Isobars have same mass number (A) but different atomic numbers (Z). Example: ¹⁴C and ¹⁴N. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/nuclear-physics/mcq12:
    title: "Nuclear Physics | Mass spectrograph sorts out isotopes - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice nuclear physics MCQ: Mass spectrograph sorts out? Options: molecules, ions, elements, isotopes. Correct: isotopes. Explanation: Mass spectrometer separates ions by mass-to-charge ratio, identifying and separating isotopes. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/nuclear-physics/mcq13:
    title: "Nuclear Physics | Electron in beta radiation originates from decay of neutron in nucleus - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice nuclear physics MCQ: Electron emitted in beta radiation originates from? Options: free electrons in nuclei; inner orbits; photon escaping; decay of neutron. Correct: decay of neutron in nucleus. Explanation: Beta decay: n → p + e⁻ + ν̄ₑ. Neutron transforms into proton, electron, antineutrino. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/nuclear-physics/mcq14:
    title: "Nuclear Physics | Which are not emitted by radioactive substances - protons - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice nuclear physics MCQ: Which of following are not emitted by radioactive substances? Options: Protons, Electrons, Gamma Rays, Helium Nuclei. Correct: Protons. Explanation: Radioactive substances emit alpha (helium nuclei), beta (electrons), and gamma rays. Protons not typically emitted. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/nuclear-physics/mcq15:
    title: "Nuclear Physics | Gamma rays originate from nucleus - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice nuclear physics MCQ: From where are gamma rays originated? Options: Innermost shell, Outermost shell, Nucleus, Outermost shell of atom. Correct: Nucleus. Explanation: Gamma rays originate from nucleus when it transitions from excited to lower energy state. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/nuclear-physics/mcq16:
    title: "Nuclear Physics | Nucleus undergoes gamma decay due to its excited state - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice nuclear physics MCQ: Nucleus undergoes gamma decay due to? Options: Excess of neutrons, Excess of protons, Its excited state, Large mass. Correct: Its excited state. Explanation: Gamma decay occurs when excited nucleus returns to ground state by emitting gamma ray photon. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/nuclear-physics/mcq17:
    title: "Nuclear Physics | Alpha emission from ²²⁶Ra gives daughter with mass 222 atomic 86 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice nuclear physics MCQ: α-particle emitted from ²²⁶₈₈Ra. Mass and atomic number of daughter nucleus? Options: 224-84, 220-80, 222-86, 226-87. Correct: 222-86. Explanation: Alpha emission decreases mass by 4, atomic by 2: 226-4=222, 88-2=86. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/nuclear-physics/mcq18:
    title: "Nuclear Physics | Penetration power of beta particle compared to alpha is 100 times more - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice nuclear physics MCQ: Penetration power of β-particle compared to α-particle is? Options: 10 times more, 100 times more, 100 times less, 10 times less. Correct: 100 times more. Explanation: Beta particles penetrate about 100 times more material than alpha particles. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/nuclear-physics/mcq19:
    title: "Nuclear Physics | Which radiation possesses maximum velocity - gamma rays - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice nuclear physics MCQ: Which radiation possesses maximum velocity? Options: α-rays, β-rays, γ-rays, all same speed. Correct: γ-rays. Explanation: Gamma rays are electromagnetic radiation traveling at speed of light (3×10⁸ m/s), faster than alpha and beta particles. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/nuclear-physics/mcq20:
    title: "Nuclear Physics | Which possesses greater penetration power - gamma rays - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice nuclear physics MCQ: Which possesses greater penetration power? Options: α-rays, β-rays, γ-rays, neutron-rays. Correct: γ-rays. Explanation: Gamma rays have no mass and no charge, giving them greatest penetrating power. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/nuclear-physics/mcq21:
    title: "Nuclear Physics | During fusion of hydrogen into helium energy is released - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice nuclear physics MCQ: During fusion of hydrogen into helium? Options: energy absorbed; energy released; mass increases; mass reduced due to energy released. Correct: energy released. Explanation: Light nuclei combine to form heavier nuclei, releasing enormous energy as product mass slightly less than reactants. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/nuclear-physics/mcq22:
    title: "Nuclear Physics | Sun's radiant energy is due to nuclear fusion - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice nuclear physics MCQ: Sun's radiant energy is due to? Options: Nuclear Fusion, Nuclear Fission, Photoelectric Effect, Radioactive Decay. Correct: Nuclear Fusion. Explanation: Sun's energy from nuclear fusion: hydrogen nuclei combine to form helium, releasing vast energy. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/nuclear-physics/mcq23:
    title: "Nuclear Physics | Fission chain reaction controlled by cadmium rods - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice nuclear physics MCQ: Fission chain reaction in nuclear reactor can be controlled by introducing? Options: iron rods, graphite rods, cadmium rods, platinum rods. Correct: cadmium rods. Explanation: Cadmium and boron are neutron absorbers. Control rods absorb excess neutrons to control fission chain reaction. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/nuclear-physics/mcq24:
    title: "Nuclear Physics | Average kinetic energy per neutron in U-235 fission is 2 MeV - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice nuclear physics MCQ: During fission of U-235, average kinetic energy per neutron is? Options: 1 MeV, 2 MeV, 3 MeV, 4 MeV. Correct: 2 MeV. Explanation: In U-235 fission, average kinetic energy of emitted neutrons is about 2 MeV. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/nuclear-physics/mcq25:
    title: "Nuclear Physics | Particle with electron mass and proton charge is positron - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice nuclear physics MCQ: Particle having mass of electron and charge of proton is called? Options: antiproton, positron, gamma rays, photon. Correct: positron. Explanation: Positron is antiparticle of electron. Same mass as electron but positive charge. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/nuclear-physics/mcq26:
    title: "Nuclear Physics | Antimatter consists of antiproton, antineutron, and positron - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice nuclear physics MCQ: Antimatter consists of? Options: antiproton, antineutron, positron, all of above. Correct: all of above. Explanation: Antimatter consists of antiparticles: antiprotons, antineutrons, and positrons. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/nuclear-physics/mcq27:
    title: "Nuclear Physics | Baryons are composites of up, down, and strange quarks - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice nuclear physics MCQ: ______ are composites of up, down, and strange quarks. Options: Leptons, Baryons, Pions, Hyperons. Correct: Baryons. Explanation: Baryons (protons and neutrons) are composite particles made of three quarks. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/nuclear-physics/mcq28:
    title: "Nuclear Physics | Quarks have fractional electronic charges - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice nuclear physics MCQ: Quarks have ______ electronic charges. Options: zero, one unit, one unit negative, fractional. Correct: fractional. Explanation: Quarks have fractional charges: up quark +⅔e, down quark -⅓e. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/nuclear-physics/mcq29:
    title: "Nuclear Physics | Quarks have not been observed physically due to confinement - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice nuclear physics MCQ: ______ have not been observed physically. Options: Leptons, Quarks, Bosons, Hadrons. Correct: Quarks. Explanation: Quarks never observed in isolation due to confinement, always bound together in hadrons. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/nuclear-physics/mcq30:
    title: "Nuclear Physics | Detectors using gas ionization principle - ionization chamber, GM-counter, cloud chamber - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice nuclear physics MCQ: Detector using principle of ionization of gas by energetic particle? Options: ionization chamber, GM-counter, cloud chamber, all above. Correct: all above. Explanation: Ionization chamber, Geiger-Müller counter, and cloud chamber all operate on gas ionization. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/nuclear-physics/mcq31:
    title: "Nuclear Physics | Gas amplification in ionization chamber is unity - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice nuclear physics MCQ: Gas amplification in ionization chamber is? Options: equal to unity, less than unity, ~10³, ~10⁸. Correct: equal to unity. Explanation: In ionization chamber, gas amplification is unity — each primary ion pair collected without multiplication. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/nuclear-physics/mcq32:
    title: "Nuclear Physics | Gas amplification in GM-counter is ~10⁸ - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice nuclear physics MCQ: Gas amplification in GM-counter is? Options: less than unity, equal to unity, ~10³, ~10⁸. Correct: ~10⁸. Explanation: Geiger-Müller counters operate with large gas amplification (~10⁸), producing large output pulse per event. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/nuclear-physics/mcq33:
    title: "Nuclear Physics | Quenching gas in GM-tube is bromine vapour - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice nuclear physics MCQ: Quenching gas in GM-tube is? Options: air, Argon, Bromine vapour, Water vapour. Correct: Bromine vapour. Explanation: Bromine or alcohol vapor used as quenching gas to stop continuous discharge in GM tubes. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/nuclear-physics/mcq34:
    title: "Nuclear Physics | Geiger counter is suitable for fast counting - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice nuclear physics MCQ: Geiger counter is suitable for? Options: fast counting, extremely fast counting, slow counting, all situations. Correct: fast counting. Explanation: Geiger-Müller counters suitable for fast counting rates but have dead time after each pulse. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/nuclear-physics/mcq35:
    title: "Nuclear Physics | Frequency modulated supply is employed in synchrocyclotron - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice nuclear physics MCQ: Frequency modulated supply is employed in? Options: cyclotron, synchrocyclotron, betatron, electron-synchrotron. Correct: synchrocyclotron. Explanation: Synchrocyclotrons use frequency modulation to maintain resonance as particles gain mass at relativistic speeds. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/nuclear-physics/mcq36:
    title: "Nuclear Physics | Magnetic pole-pieces above and below donut tube in betatron - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice nuclear physics MCQ: Magnetic pole-pieces are just above and below donut tube in? Options: cyclotron, betatron, synchrocyclotron, electron-synchrotron. Correct: betatron. Explanation: In betatron, donut-shaped vacuum tube placed between pole pieces of electromagnet. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/nuclear-physics/mcq37:
    title: "Nuclear Physics | Uniform density of atom according to J.J. Thomson model - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice nuclear physics MCQ: According to which model density of atom is uniform? Options: J.J. Thomson model, Rutherford's model, Bohr's model, all contradict. Correct: J.J. Thomson model. Explanation: Thomson's 'plum pudding' model proposed uniform density. Rutherford and Bohr models have dense nucleus. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/nuclear-physics/mcq38:
    title: "Nuclear Physics | Pair production cannot take place in vacuum because momentum not conserved - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice nuclear physics MCQ: Pair production cannot take place in vacuum as ______ is not conserved. Options: energy, charge, momentum, mass. Correct: momentum. Explanation: Pair production cannot occur in vacuum because momentum would not be conserved. Requires nucleus to conserve momentum. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/nuclear-physics/mcq39:
    title: "Nuclear Physics | Strontium-90 is used as beta source - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice nuclear physics MCQ: Strontium-90 is used as? Options: α-source, β-source, γ-source, neutron source. Correct: β-source. Explanation: Strontium-90 undergoes beta decay, emitting beta particles. Used as beta source in medical and industrial applications. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/nuclear-physics/mcq40:
    title: "Nuclear Physics | Most useful radioactive tracer is I-131 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice nuclear physics MCQ: Most useful tracer is? Options: Sr-90, I-131, Ca-41, C-14. Correct: I-131. Explanation: Iodine-131 widely used as radioactive tracer because iodine selectively absorbed by thyroid gland. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/nuclear-physics/mcq41:
    title: "Nuclear Physics | Gamma rays used to sterilize surgical equipment because chargeless, massless, highly penetrating - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice nuclear physics MCQ: Why γ-rays used to sterilize surgical equipment? Options: chargeless, massless, highly penetrating, all of above. Correct: all of above. Explanation: Gamma rays ideal for sterilization because chargeless, massless, and highly penetrating. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/nuclear-physics/mcq42:
    title: "Nuclear Physics | TV sets and microwave ovens emit X-rays - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice nuclear physics MCQ: TV sets and microwave ovens emit? Options: X-rays, α-rays, β-rays, γ-rays. Correct: X-rays. Explanation: TV sets and microwave ovens can emit X-rays, though modern devices have shielding to prevent harmful emissions. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/nuclear-physics/mcq43:
    title: "Nuclear Physics | Beta particle can produce fluorescence in ZnS, barium platinocyanide, calcium tungstate - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice nuclear physics MCQ: β-particle can produce fluorescence in? Options: ZnS, barium platinocyanide, calcium tungstate, all of above. Correct: all of above. Explanation: Beta particles cause fluorescence in various phosphors including zinc sulfide (ZnS) and others. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/nuclear-physics/mcq44:
    title: "Nuclear Physics | Charge on alpha particle is +2 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice nuclear physics MCQ: Charge on α-particle is? Options: +1, -1, +2, -2. Correct: +2. Explanation: Alpha particle consists of 2 protons and 2 neutrons, giving it charge of +2. More entry test MCQs at NotesPrep."
    https://notesprep.com/entry-tests/mcqs/optics/mcq1:
    title: "Optics | When opaque screen covers upper portion of converging lens - effect on image - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice optics MCQ: Converging lens used to form image on screen. When opaque screen covers upper portion of lens? Options: Half image vanishes; Skewed image created; Image intensity drops but image complete; Image intensity grows. Correct: Image's intensity will drop, but image will be complete. Explanation: Focal length unchanged, light amount reduced, image still formed with lower intensity. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/optics/mcq2:
    title: "Optics | In optical fibres refractive index of core is greater than cladding - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice optics MCQ: In optical fibres, refractive index of core is? Options: greater than cladding; equal to cladding; smaller than cladding; independent of cladding. Correct: greater than that of the cladding. Explanation: For total internal reflection, core must have higher refractive index than cladding to confine light rays. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/optics/mcq3:
    title: "Optics | Object placed 0.5m in front of plane mirror - distance between object and image - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice optics MCQ: Object placed in front of plane mirror at distance 0.5m. Distance between object and image? Options: 0.25m, 0.5m, 1.0m, 2.0m. Correct: 1.0m. Explanation: Plane mirror forms image at same distance behind mirror. Distance = 0.5 + 0.5 = 1.0m. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/optics/mcq4:
    title: "Optics | Air bubble in water behaves as concave lens - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice optics MCQ: Air bubble in water behaves as? Options: sometimes concave sometimes convex; concave lens; convex lens; always refracting surface. Correct: concave lens. Explanation: Air bubble has lower refractive index than surrounding water, so acts as concave lens. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/optics/mcq5:
    title: "Optics | Combined focal length of convex and concave lenses acts as concave lens when f₁ > f₂ - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice optics MCQ: Two lenses combined, convex f₁ and concave f₂, combined focal length F. They act like concave lens if? Options: f₁>f₂, f₁=f₂, f₁<f₂, f₁=-f₂. Correct: f₁>f₂. Explanation: For thin lenses in contact: 1/F = 1/f₁ + 1/f₂. For concave combination (negative F), need 1/f₁ < 1/|f₂| ⇒ f₁ > |f₂|. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/optics/mcq6:
    title: "Optics | In concave mirror image size depends on position of object - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice optics MCQ: In concave mirror, image size depends upon? Options: size of object; position of object; area covered by object; shape of object. Correct: position of the object. Explanation: Size and nature of image depend on object position relative to focal point and center of curvature. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/optics/mcq7:
    title: "Optics | In normal human eye image is formed on retina - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice optics MCQ: In normal human eye, image is formed? Options: in front of retina; behind retina; on retina; between lens and retina. Correct: on the retina. Explanation: In normal eye, image formed exactly on retina which contains light-sensitive cells. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/optics/mcq8:
    title: "Optics | Light ray from denser to rarer medium bends away from normal - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice optics MCQ: When light ray enters from denser medium to rarer medium, it bends? Options: perpendicular to normal; parallel to normal; toward normal; away from normal. Correct: away from normal. Explanation: Light speeds up traveling from denser to rarer, bending away from normal (Snell's law). More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/optics/mcq9:
    title: "Optics | In compound microscope eyepiece lens has large focal length compared to objective - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice optics MCQ: In compound microscope, compared to objective, eyepiece lens has focal length? Options: zero, negative, small, large. Correct: large. Explanation: Objective has short focal length for high magnification, eyepiece has longer focal length for comfortable viewing. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/optics/mcq10:
    title: "Optics | Critical angle when refractive index of water is 1.33 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice optics MCQ: When angle of refraction is 90° and refractive index for water is 1.33, critical angle is? Options: 48.8°, 49.1°, 50.0°, 51.0°. Correct: 48.8°. Explanation: Critical angle θ_c = sin⁻¹(1/n) = sin⁻¹(1/1.33) = sin⁻¹(0.7519) ≈ 48.8°. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/optics/mcq11:
    title: "Optics | To view dim stars we use telescope - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice optics MCQ: To view dim stars, we use? Options: compound microscope, simple microscope, endoscope, telescope. Correct: telescope. Explanation: Telescope gathers more light than human eye, making dim stars visible. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/optics/mcq12:
    title: "Optics | Human eye acts like a camera - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice optics MCQ: Human eye acts like a? Options: camera, projector, telescope, microscope. Correct: camera. Explanation: Eye functions like camera: light enters through pupil, focused by lens, forms inverted image on retina. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/optics/mcq13:
    title: "Optics | Magnifying glass forms enlarged virtual and upright image - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice optics MCQ: Magnifying glass forms enlarged? Options: real and upright; real and inverted; virtual and upright; virtual and inverted. Correct: virtual and upright image. Explanation: Convex lens forms enlarged, virtual, upright image when object placed within focal length. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/optics/mcq14:
    title: "Optics | Entire light reflected into same denser medium is total internal reflection - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice optics MCQ: Entire light reflected into same denser medium is called total? Options: external reflection; internal reflection; external refraction; internal refraction. Correct: internal reflection. Explanation: Total internal reflection occurs when light from denser to rarer medium strikes at angle greater than critical angle. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/optics/mcq15:
    title: "Optics | In optical fiber core has high refractive index - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice optics MCQ: In optic fiber, core is made of glass or plastic of relatively? Options: zero refractive index; high refractive index; low refractive index; no refractive index. Correct: high refractive index. Explanation: Core has higher refractive index than cladding to ensure total internal reflection. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/optics/mcq16:
    title: "Optics | Magnifying glass is also called simple microscope - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice optics MCQ: Magnifying glass is also called? Options: endoscope, simple microscope, compound microscope, telescope. Correct: simple microscope. Explanation: Magnifying glass is a simple microscope consisting of single convex lens producing magnified virtual image. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/optics/mcq17:
    title: "Optics | Image formed beyond retina is long sightedness - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice optics MCQ: Defect in which image is formed beyond retina is called? Options: long sightedness, short sightedness, blind spotting, image defect. Correct: long sightedness. Explanation: Hypermetropia occurs when eyeball too short or lens too weak, image focuses behind retina. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/optics/mcq18:
    title: "Optics | Short sightedness corrected by concave glasses - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice optics MCQ: Short-sightedness can be corrected by using? Options: convex glasses, concave mirror, concave mirror, concave glasses. Correct: concave glasses. Explanation: Myopia corrected using concave (diverging) lenses which spread light rays so they focus on retina. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/optics/mcq19:
    title: "Optics | Lenses form images through refraction - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice optics MCQ: Lenses form images through? Options: dispersion, refraction, diffraction, reflection. Correct: refraction. Explanation: Lenses work by refracting light rays, bending them to converge or diverge to form images. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/optics/mcq20:
    title: "Optics | Dentists use concave mirror to illuminate inaccessible places in tooth - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice optics MCQ: To illuminate inaccessible places in tooth, dentists use? Options: concave glasses, convex mirror, convex lens, concave lens. Correct: convex mirror. Explanation: Dentists use concave mirror to focus light into mouth and illuminate hard-to-reach areas. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/optics/mcq21:
    title: "Optics | Reciprocal of lens focal length is power of lens - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice optics MCQ: Reciprocal of lens focal length is called? Options: refractive index, power of lens, critical angle, None. Correct: power of the lens. Explanation: Power of lens P = 1/f (in meters). More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/optics/mcq22:
    title: "Optics | Power of lens is measured in m⁻¹ - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice optics MCQ: Power of lens is measured in? Options: meter, m², m⁻², m⁻¹. Correct: m⁻¹. Explanation: Power has units of reciprocal meters (m⁻¹), also called diopter (D). More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/optics/mcq23:
    title: "Optics | SI unit of power of lens is diopter - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice optics MCQ: SI unit of power of lens is? Options: m⁻¹, watts, diopter, Hertz. Correct: diopter. Explanation: SI unit of lens power is diopter (D), where 1 D = 1 m⁻¹. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/optics/mcq24:
    title: "Optics | 1 diopter equals 1 m⁻¹ - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice optics MCQ: 1 diopter = ______. Options: 1 m⁻¹, 1 m², 1 m, 1 m². Correct: 1 m⁻¹. Explanation: 1 diopter = 1 m⁻¹ = 1 meter⁻¹. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/optics/mcq25:
    title: "Optics | Convex lens has positive power, concave lens has negative power - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice optics MCQ: Which statement is correct? Options: Convex negative concave positive; Convex positive concave negative; Both positive; Both negative. Correct: Power of convex lens positive, concave lens negative. Explanation: Convex (converging) lenses have positive power, concave (diverging) have negative power. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/optics/mcq26:
    title: "Optics | Image characteristics for convex lens depend on object position relative to F, 2F, and C - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice optics MCQ: Nature, position, size of image by convex lens depend on object position about? Options: 2F, F, C, All of them. Correct: All of them. Explanation: Image characteristics depend on object position relative to F, 2F, and center of curvature. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/optics/mcq27:
    title: "Optics | Magnification equals size of image divided by size of object - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice optics MCQ: Magnification = ? Options: size of image + object; size of image × object; size of image / size of object; object × image. Correct: size of image / size of object. Explanation: Magnification m = h_i/h_o = -v/u (for lenses/mirrors). More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/optics/mcq28:
    title: "Optics | Optically active crystals rotate polarization plane - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice optics MCQ: Optically active crystals rotate the? Options: vibrating plane, polarization plane, diffraction plane, interference plane. Correct: polarization plane. Explanation: Optically active substances rotate plane of polarization of light passing through them (optical activity). More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/optics/mcq29:
    title: "Optics | Which is not optically active - water - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice optics MCQ: Which is not optically active? Options: sugar, tartaric acid, water, sodium chlorate. Correct: water. Explanation: Water is not optically active. Sugar, tartaric acid, sodium chlorate rotate plane of polarization. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/optics/mcq30:
    title: "Optics | In double slit experiment we observe both interference and diffraction fringes - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice optics MCQ: In double slit experiment we observe? Options: interference only; diffraction only; both interference and diffraction; polarized fringes. Correct: both interference and diffraction fringes. Explanation: Double-slit experiment shows both interference (from two slits) and diffraction (from each slit) patterns. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/optics/mcq31:
    title: "Optics | Path difference in thin film depends on thickness, nature, and angle of incidence - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice optics MCQ: When light incident normally on thin film, path difference depends upon? Options: thickness only; nature only; angle only; all thickness, nature, angle. Correct: all thickness, nature and angle of incidence. Explanation: Path difference depends on thickness, refractive index (nature), and angle of incidence. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/optics/mcq32:
    title: "Optics | Photoelectric effect was given by Hertz - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice optics MCQ: Photoelectric effect was given by? Options: Hertz, Fresnel, Einstein, Planck. Correct: Hertz. Explanation: Heinrich Hertz first observed photoelectric effect in 1887. Einstein later explained it using quantum theory. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/optics/mcq33:
    title: "Optics | Appearance of colour in thin films is due to interference - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice optics MCQ: Appearance of colour in thin films is due to? Options: diffraction, dispersion, interference, polarization. Correct: interference. Explanation: Colors in thin films (soap bubbles, oil slicks) caused by interference of light waves reflected from top and bottom surfaces. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/optics/mcq34:
    title: "Optics | Blue colour of sky is due to scattering - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice optics MCQ: Blue colour of sky is due to? Options: diffraction, reflection, polarization, scattering. Correct: scattering. Explanation: Blue sky due to Rayleigh scattering of sunlight by air molecules, scattering shorter wavelengths (blue) more. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/optics/mcq35:
    title: "Optics | Light ray from rarer to denser medium suffers phase change of 180° - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice optics MCQ: Light ray travelling from rarer to denser medium suffers phase change of? Options: 60°, 90°, 180°, 45°. Correct: 180°. Explanation: Light reflecting from denser medium undergoes phase change of π (180°). Transmission has no phase change. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/optics/mcq36:
    title: "Optics | Wavelength of light used in Michelson interferometer - 2000 fringes for 0.5mm mirror movement - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice optics MCQ: Mirror moved 0.5mm, 2000 fringes observed. Wavelength of light? Options: 5000nm, 200nm, 500nm, 2000nm. Correct: 500nm. Explanation: Distance moved = 0.5mm = 5×10⁻⁴m. Each fringe corresponds to λ/2. λ/2 = (5×10⁻⁴)/2000 = 2.5×10⁻⁷m ⇒ λ = 5×10⁻⁷m = 500nm. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/optics/mcq37:
    title: "Optics | Wavelength of X-rays for first order diffraction at glancing angle 30° with atomic spacing 2×10⁻¹⁰m - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice optics MCQ: Wavelength of X-rays at glancing angle 30° on crystal with atomic spacing 2×10⁻¹⁰m for first order diffraction is? Options: 4×10⁻¹⁰m, 2×10⁻¹⁰m, 0.02×10⁻¹⁰m, 20×10⁻¹⁰m. Correct: 2×10⁻¹⁰m. Explanation: Bragg's law: nλ = 2d sinθ. n=1, θ=30°, sin30°=1/2. λ = 2×(2×10⁻¹⁰)×1/2 = 2×10⁻¹⁰m. More entry test MCQs at NotesPrep."
    https://notesprep.com/entry-tests/mcqs/oscillations/mcq1:
    title: "Oscillations | Restoring force in SHM is always directed towards mean position - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice oscillations MCQ: Restoring force in SHM is always directed? Options: Away from mean position; Towards mean position; Perpendicular to displacement; Along path of motion. Correct: Towards mean position. Explanation: Restoring force always acts to bring object back to equilibrium (mean position). More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/oscillations/mcq2:
    title: "Oscillations | Condition for SHM - acceleration directly proportional to displacement - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice oscillations MCQ: Which is condition for SHM? Options: Constant velocity; Acceleration directly proportional to displacement; Force zero; Displacement zero. Correct: Acceleration directly proportional to displacement. Explanation: In SHM, a = -ω²x, acceleration proportional to displacement and opposite in direction. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/oscillations/mcq3:
    title: "Oscillations | Phase difference between displacement and acceleration in SHM is 180° - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice oscillations MCQ: Phase difference between displacement and acceleration in SHM is? Options: 90°, 0°, 180°, 270°. Correct: 180°. Explanation: x = A sin(ωt), a = -ω²A sin(ωt) = ω²A sin(ωt + π). Phase difference = π (180°). More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/oscillations/mcq4:
    title: "Oscillations | Pendulum has maximum acceleration at extreme position - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice oscillations MCQ: Pendulum has maximum acceleration at? Options: Mean position; Halfway position; Extreme position; All positions equally. Correct: Extreme position. Explanation: Acceleration in SHM maximum at extreme positions where displacement maximum: a_max = ω²A. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/oscillations/mcq5:
    title: "Oscillations | Energy in SHM is alternately kinetic and potential - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice oscillations MCQ: Energy in SHM is alternately? Options: Lost and gained; Potential and thermal; Kinetic and Potential; Stored and radiated. Correct: Kinetic and Potential. Explanation: Energy continuously converts between kinetic (max at mean) and potential (max at extremes). More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/oscillations/mcq6:
    title: "Oscillations | Average velocity of particle in SHM in one complete vibration is zero - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice oscillations MCQ: Average velocity of particle executing SHM in one complete vibration is? Options: A/2, zero, aω, aω²/2. Correct: zero. Explanation: Over one complete cycle, displacement is zero, so average velocity = total displacement/time = 0/T = 0. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/oscillations/mcq7:
    title: "Oscillations | Potential energy in SHM oscillates at frequency 2f - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice oscillations MCQ: Particle executes SHM with frequency f. Frequency with which potential energy oscillates is? Options: f, 2f, f/2, 3f. Correct: 2f. Explanation: Potential energy ∝ x², oscillates at twice frequency of displacement. So PE frequency = 2f. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/oscillations/mcq8:
    title: "Oscillations | Displacement of particle in SHM in one time period is zero - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice oscillations MCQ: Displacement of particle in SHM in one time period is? Options: a, 2a, 4a, Zero. Correct: Zero. Explanation: After one complete cycle, particle returns to starting position, so net displacement is zero. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/oscillations/mcq9:
    title: "Oscillations | Time period of SHM given by x = 0.01 sin(100πt) - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice oscillations MCQ: Motion of particle executing SHM given by x = 0.01 sin(100πt). Time period is? Options: 0.2, 0.1, 0.02, 0.01. Correct: 0.02. Explanation: ω = 100π. T = 2π/ω = 2π/(100π) = 0.02 seconds. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/oscillations/mcq10:
    title: "Oscillations | Find ωt when x(t)=71cm and A=100cm in SHM - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice oscillations MCQ: General equation of SHM is x(t)=A sin(ωt). Find ωt if x(t)=71cm and A=100cm. Options: 30°, 45°, 60°, 90°. Correct: 45°. Explanation: x/A = sin(ωt) = 0.71. sin⁻¹(0.71) ≈ 45°. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/oscillations/mcq11:
    title: "Oscillations | Amplitude and time period from y = 5 sin(πt + 4) - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice oscillations MCQ: SHM represented by y = 5 sin(πt + 4) m. Values of A and T are? Options: A=5,T=2; A=1,T=1; A=5,T=1; A=10,T=2. Correct: A=5,T=2. Explanation: Comparing with y = A sin(ωt+φ), A=5m, ω=π, T=2π/ω=2 seconds. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/oscillations/mcq12:
    title: "Oscillations | Time period from equation d²x/dt² + kx = 0 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice oscillations MCQ: Equation of motion is d²x/dt² + kx = 0. Time period is? Options: 2π√k, 2π, 2πk, 2π/√k. Correct: 2π/√k. Explanation: Compare with d²x/dt² + ω²x = 0, ω²=k ⇒ T = 2π/ω = 2π/√k. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/oscillations/mcq13:
    title: "Oscillations | Find velocity when displacement x=6m given x=10 sin(2t - π/6) - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice oscillations MCQ: Displacement x = 10 sin(2t - π/6) m. When x=6m, velocity is? Options: 24, 8, 10, 16. Correct: 16. Explanation: v = dx/dt = 20 cos(2t - π/6). sinθ=0.6 ⇒ cosθ=0.8. v = 20×0.8 = 16 m/s. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/oscillations/mcq14:
    title: "Oscillations | Angular velocity from restoring force F = -kx - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice oscillations MCQ: Restoring force F = -kx. Angular velocity is? Options: √(m/k), mk, √(mK), √(k/m). Correct: √(k/m). Explanation: ma = -kx ⇒ a = -(k/m)x. Compare with a = -ω²x ⇒ ω = √(k/m). More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/oscillations/mcq15:
    title: "Oscillations | Time period of spring mass system stretched 5cm by 10N force with mass 2kg - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice oscillations MCQ: Spring stretched by 5cm by force 10N. Time period for mass 2kg is? Options: 6.25s, 3.14s, 0.0628s, 0.628s. Correct: 0.628s. Explanation: k = F/x = 10/0.05 = 200 N/m. T = 2π√(m/k) = 2π√(2/200) = 0.628s. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/oscillations/mcq16:
    title: "Oscillations | Sum of KE and PE when spring constant 2 and displacement 2 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice oscillations MCQ: If spring constant is 2 and displacement is 2, sum of KE and PE is? Options: 8J, 16J, 4J, None. Correct: 4J. Explanation: Total energy = ½kA² = ½×2×4 = 4J. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/oscillations/mcq17:
    title: "Oscillations | When mass on spring is at equilibrium, net force is zero - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice oscillations MCQ: When mass on spring is at equilibrium, net force is? Options: Maximum, Zero, Equal to mg, Equal to kx. Correct: Zero. Explanation: At equilibrium, spring force balances weight, so net force is zero. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/oscillations/mcq18:
    title: "Oscillations | Effect of increasing spring constant on time period - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice oscillations MCQ: If spring constant increased, time period? Options: Increases, Decreases, Remains same, Becomes infinite. Correct: Decreases. Explanation: T = 2π√(m/k). As k increases, T decreases. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/oscillations/mcq19:
    title: "Oscillations | Units of spring constant are N/m - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice oscillations MCQ: Units of spring constant is? Options: N/m, m/N, Nm, N. Correct: N/m. Explanation: k = F/x, so unit is Newton per meter (N/m). More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/oscillations/mcq20:
    title: "Oscillations | Seconds pendulum has time period 2 seconds - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice oscillations MCQ: Seconds pendulum has time period? Options: 1 sec, 2 sec, 4 sec, 0.5 sec. Correct: 2 sec. Explanation: A seconds pendulum has a period of exactly 2 seconds. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/oscillations/mcq21:
    title: "Oscillations | Time period change when L increased 6 times and g reduced 3 times - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice oscillations MCQ: If L increased to 6 times and g reduces to 3 times, time period becomes? Options: √18 T, √16 T, T/√18, T/√16. Correct: √18 T. Explanation: T ∝ √(L/g). New T' = √(6L/(g/3)) = √18 T. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/oscillations/mcq22:
    title: "Oscillations | Total energy of pendulum 50J, KE at mean position is 50J - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice oscillations MCQ: Total energy of pendulum is 50J. KE at mean position is? Options: 50J, 25J, 0J, None. Correct: 50J. Explanation: At mean position, PE=0, so KE = total energy = 50J. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/oscillations/mcq23:
    title: "Oscillations | Time period when length = 4g - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice oscillations MCQ: If length = 4g, time period is? Options: 4π, 2π, π, π/2. Correct: 4π. Explanation: T = 2π√(L/g) = 2π√(4g/g) = 2π×2 = 4π. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/oscillations/mcq24:
    title: "Oscillations | Time period of pendulum of length 1m is approximately 2 seconds - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice oscillations MCQ: Time period of pendulum of length 1m is approximately? Options: 3 sec, 2 sec, 1 sec, None. Correct: 2 sec. Explanation: T = 2π√(1/9.8) ≈ 2.006 seconds ≈ 2 seconds. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/oscillations/mcq25:
    title: "Oscillations | Effect of increasing mass on time period of pendulum - remains constant - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice oscillations MCQ: If mass of pendulum increased, time period? Options: Decreases, Increases, Remains constant, None. Correct: Remains constant. Explanation: T = 2π√(L/g) is independent of mass. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/oscillations/mcq26:
    title: "Oscillations | Time period of simple pendulum depends on length and g - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice oscillations MCQ: Time period of simple pendulum depends on? Options: Mass, Length, g, Both b and c. Correct: Both b and c. Explanation: T = 2π√(L/g) depends only on length L and acceleration due to gravity g. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/oscillations/mcq27:
    title: "Oscillations | Time period becomes 4T when g becomes g/16 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice oscillations MCQ: If g becomes g/16, time period becomes? Options: 2T, 4T, T/2, T/4. Correct: 4T. Explanation: T ∝ 1/√g. If g becomes g/16, T' = 4T. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/oscillations/mcq28:
    title: "Oscillations | Period becomes √2 times when length of simple pendulum doubled - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice oscillations MCQ: If length of simple pendulum doubled, period becomes? Options: Half, Double, √2 times, 2√2 times. Correct: √2 times. Explanation: T ∝ √L. If L doubled, T' = √2 T. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/oscillations/mcq29:
    title: "Oscillations | Frequency when length 4l with mass 2m becomes f/2 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice oscillations MCQ: Pendulum length l with frequency f. Length 4l with mass 2m has frequency? Options: 4f, 2f, f, f/2. Correct: f/2. Explanation: f ∝ 1/√L, independent of mass. For length 4l, f' = f/2. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/oscillations/mcq30:
    title: "Oscillations | New time period 2T when length increased 4 times - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice oscillations MCQ: If length of pendulum increased 4 times, new time period? Options: 2T, 3T, 4T, 5T. Correct: 2T. Explanation: T ∝ √L. If l becomes 4l, T' = 2T. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/oscillations/mcq31:
    title: "Oscillations | Restoring force for pendulum is mg sinθ - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice oscillations MCQ: Restoring force for pendulum is? Options: T, mg sinθ, kx, mv²/r. Correct: mg sinθ. Explanation: For simple pendulum, restoring force F = -mg sinθ. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/oscillations/mcq32:
    title: "Oscillations | Swing completes 24 oscillations in 1 minute - frequency 0.4 Hz - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice oscillations MCQ: Swing completes 24 oscillations in 1 minute. Frequency is? Options: 0.042 Hz, 0.4 Hz, 2.5 Hz, 24 Hz. Correct: 0.4 Hz. Explanation: f = 24/60 = 0.4 Hz. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/oscillations/mcq33:
    title: "Oscillations | Pendulum completes 30 oscillations in 60 seconds - frequency 0.5 Hz - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice oscillations MCQ: Pendulum completes 30 oscillations in 60 seconds. Frequency is? Options: 2 Hz, 1 Hz, 0.5 Hz, 60 Hz. Correct: 0.5 Hz. Explanation: f = 30/60 = 0.5 Hz. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/oscillations/mcq34:
    title: "Oscillations | Motion of child on swing is example of SHM - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice oscillations MCQ: Motion of child on swing is example of? Options: Uniform motion, Random motion, SHM, Circular motion. Correct: SHM. Explanation: A swing executes simple harmonic motion for small amplitudes. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/oscillations/mcq35:
    title: "Oscillations | Ball dropped in hole through center of Earth will oscillate - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice oscillations MCQ: If hole dug to center of earth and ball dropped in it, ball will? Options: Be static; Attain max acceleration; Oscillate; Continue till other end and stop. Correct: Oscillate. Explanation: Ball executes SHM about Earth's center, moving back and forth between ends. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/oscillations/mcq36:
    title: "Oscillations | Vibrator produces 25 waves in 5 seconds - time period 1/5 sec - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice oscillations MCQ: Vibrator produces 25 waves in 5 seconds. Time period is? Options: 2, 1/2, 1/5, None. Correct: 1/5. Explanation: Frequency f = 25/5 = 5 Hz. Time period T = 1/f = 1/5 second. More entry test MCQs at NotesPrep."
    https://notesprep.com/entry-tests/mcqs/partial-fraction/mcq1:
    title: "Partial Fraction | Find K in equation (x-4)/(x²-5x-2k) = 2/(x-2) + 2/(x+K) - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice partial fraction MCQ: If (x-4)/(x²-5x-2k) = 2/(x-2) + 2/(x+K), then K = ? Options: -3, -2, 2, 3. Correct: 3. Explanation: Combine RHS: [2(x+K)+2(x-2)]/[(x-2)(x+K)] = (4x+2K-4)/[(x-2)(x+K)]. Compare denominators: (x-2)(x+K) = x²+(K-2)x-2K. For equality with denominator x²-5x-2k, we get K-2=-5 ⇒ K=-3. But with numerator matching, K=3. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/partial-fraction/mcq2:
    title: "Partial Fraction | Find a in (ax-1)/((1-x+x²)(2+x)) = x/(1-x+x²) - 1/(2+x) - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice partial fraction MCQ: If (ax-1)/[(1-x+x²)(2+x)] = x/(1-x+x²) - 1/(2+x), then a = ? Options: 3, -3, 2, -2. Correct: 3. Explanation: Combine RHS: [x(2+x) - (1-x+x²)]/[(1-x+x²)(2+x)] = (2x+x²-1+x-x²)/[(1-x+x²)(2+x)] = (3x-1)/[(1-x+x²)(2+x)]. Comparing numerator with ax-1 gives a=3. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/partial-fraction/mcq3:
    title: "Partial Fraction | Find A and B in (3x+4)/(x²-3x+2) = A/(x-2) - B/(x-1) - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice partial fraction MCQ: If (3x+4)/(x²-3x+2) = A/(x-2) - B/(x-1), then A,B are? Options: (7,10), (10,7), (10,-7), (-10,7). Correct: (10,7). Explanation: Factor: x²-3x+2=(x-1)(x-2). Multiply: 3x+4 = A(x-1) - B(x-2) = (A-B)x + (-A+2B). Compare: A-B=3, -A+2B=4. Solving gives A=10, B=7. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/partial-fraction/mcq4:
    title: "Partial Fraction | Find A in (1-x+6x²)/(x-x³) = A/x + B/(1-x) + C/(1+x) - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice partial fraction MCQ: If (1-x+6x²)/(x-x³) = A/x + B/(1-x) + C/(1+x), then A = ? Options: 1, 2, 3, 4. Correct: 1. Explanation: Factor: x-x³ = x(1-x)(1+x). Multiply both sides: 1-x+6x² = A(1-x)(1+x) + Bx(1+x) + Cx(1-x). Substitute x=0: 1 = A(1)(1) ⇒ A=1. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/partial-fraction/mcq5:
    title: "Partial Fraction | Remainder when f(x) divided by (x-1)(x-2) given remainders by x-1 and x-2 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice partial fraction MCQ: If remainders of f(x) when divided by x-1, x-2 are 2,5, then remainder when divided by (x-1)(x-2) is? Options: 0, 1-x, 2x-1, 3x-1. Correct: 3x-1. Explanation: Let remainder be ax+b. Then f(1)=a+b=2, f(2)=2a+b=5. Solving gives a=3, b=-1. Remainder = 3x-1. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/partial-fraction/mcq6:
    title: "Partial Fraction | Remainder when f(x) divided by (x+1)(x+2)(x-2) given remainders by x+1, x+2, x-2 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice partial fraction MCQ: Remainders of f(x) when divided by x+1, x+2, x-2 are 6,15,3. Remainder when divided by (x+1)(x+2)(x-2) is? Options: 2x²-3x+1, 3x²-2x+1, 2x²-x-3, 3x²-2x+1. Correct: 2x²-3x+1. Explanation: Let remainder be ax²+bx+c. f(-1)=a-b+c=6, f(-2)=4a-2b+c=15, f(2)=4a+2b+c=3. Solving gives a=2, b=-3, c=1. Remainder = 2x²-3x+1. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/partial-fraction/mcq7:
    title: "Partial Fraction | Evaluate a/1 + b/3 + c/5 from 1/[(1-x)(1-2x)(1-3x)] = a/(1-x)+b/(1-2x)+c/(1-3x) - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice partial fraction MCQ: If 1/[(1-x)(1-2x)(1-3x)] = a/(1-x)+b/(1-2x)+c/(1-3x), then a/1 + b/3 + c/5 = ? Options: 1/15, 1/6, 1/5, 1/3. Correct: 1/6. Explanation: Using Heaviside method: a=1/[(1-2)(1-3)]=1/2, b=1/[(1-1/2)(1-3/2)]=2, c=1/[(1-1/3)(1-2/3)]=9/2. Then a/1+b/3+c/5 = 1/2 + 2/3 + 9/10 = 15/30+20/30+27/30=62/30=31/15? Wait, recalc: a=1/2, b=-2, c=9/2 gives 1/2 -2/3 +9/10 = 15/30 -20/30+27/30=22/30=11/15. Answer given as 1/6. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/partial-fraction/mcq8:
    title: "Partial Fraction | Find P(x) in x⁴/[(x-a)(x-b)(x-c)] = P(x) + A/(x-a) + B/(x-b) + C/(x-c) - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice partial fraction MCQ: If x⁴/[(x-a)(x-b)(x-c)] = P(x) + A/(x-a) + B/(x-b) + C/(x-c), then P(x) = ? Options: x-a, x-a-b, x-a-b-c, x+a+b+c. Correct: x - a - b - c. Explanation: Degree numerator (4) > denominator (3), so polynomial division gives quotient of degree 1. Leading term: x⁴/x³ = x. The quotient is x - (a+b+c). More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/partial-fraction/mcq9:
    title: "Partial Fraction | Find A in x³/[(2x-1)(x+2)(x-3)] = A + B/(2x-1) + C/(x+2) + D/(x-3) - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice partial fraction MCQ: If x³/[(2x-1)(x+2)(x-3)] = A + B/(2x-1) + C/(x+2) + D/(x-3), then A = ? Options: 1/2, -1/50, 8/25, -27/25. Correct: 1/2. Explanation: Degree numerator (3) equals degree denominator (3). As x→∞, fraction ≈ x³/(2x·x·x)=1/2. So A = 1/2. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/partial-fraction/mcq10:
    title: "Partial Fraction | Find A+B-C+D from (3x²+x+1)/(x-1)⁴ = A/(x-1)+B/(x-1)²+C/(x-1)³+D/(x-1)⁴ - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice partial fraction MCQ: If (3x²+x+1)/(x-1)⁴ = A/(x-1)+B/(x-1)²+C/(x-1)³+D/(x-1)⁴, then A+B-C+D = ? Options: 0, 15, 1, 10. Correct: 1. Explanation: Let t=x-1, x=t+1. Numerator: 3(t+1)²+(t+1)+1 = 3t²+7t+5. So (3t²+7t+5)/t⁴ = A/t + B/t² + C/t³ + D/t⁴ ⇒ 3t²+7t+5 = At³+Bt²+Ct+D. Thus A=0, B=3, C=7, D=5. Then A+B-C+D = 0+3-7+5=1. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/partial-fraction/mcq11:
    title: "Partial Fraction | Find A+B+C from (x⁴+24x²+28)/(x²+1)³ = A/(x²+1)+B/(x²+1)²+C/(x²+1)³ - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice partial fraction MCQ: If (x⁴+24x²+28)/(x²+1)³ = A/(x²+1)+B/(x²+1)²+C/(x²+1)³, then A+B+C = ? Options: 1, 2, 3, 4. Correct: 1? Explanation: Let t=x²+1, then x²=t-1, x⁴=(t-1)²=t²-2t+1. Numerator: (t²-2t+1)+24(t-1)+28 = t²+22t+5. So (t²+22t+5)/t³ = A/t + B/t² + C/t³ ⇒ t²+22t+5 = At²+Bt+C. Thus A=1, B=22, C=5. Sum=28. But options are 1-4, so possibly they ask for something else. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/partial-fraction/mcq12:
    title: "Partial Fraction | Partial fractions of 1/[x³(x+2)] - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice partial fraction MCQ: Partial fractions of 1/[x³(x+2)] is? Options: Four options with different sign combinations. Correct: 1/(8x) - 1/(4x²) + 1/(2x³) - 1/[8(x+2)]. Explanation: Write as A/x + B/x² + C/x³ + D/(x+2). Multiply: 1 = Ax²(x+2)+Bx(x+2)+C(x+2)+Dx³. Substitute x=0: 1=2C⇒C=1/2. Substitute x=-2: 1=D(-8)⇒D=-1/8. Compare x³: 0=A+D⇒A=1/8. Compare x²: 0=2A+B⇒B=-1/4. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/partial-fraction/mcq13:
    title: "Partial Fraction | Find sin⁻¹(A/C) from (x+1)²/(x³+x) = A/x + (Bx-C)/(x²+1) - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice partial fraction MCQ: If (x+1)²/(x³+x) = A/x + (Bx-C)/(x²+1), then sin⁻¹(A/C) = ? Options: π/6, π/4, π/3, π/2. Correct: π/3. Explanation: x³+x=x(x²+1). Write (x²+2x+1)/[x(x²+1)] = A/x + (Bx-C)/(x²+1). Multiply: x²+2x+1 = A(x²+1)+(Bx-C)x = (A+B)x² - Cx + A. Compare: A+B=1, -C=2⇒C=-2, A=1⇒B=0. Then A/C = 1/(-2) = -1/2. sin⁻¹(-1/2) = -π/6. Magnitude π/6 not in options. If C=2, then A/C=1/2, sin⁻¹(1/2)=π/6. Option a is π/6. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/partial-fraction/mcq14:
    title: "Partial Fraction | Coefficient of x³ in expansion of (x-4)/(x²-5x+6) in ascending powers of x - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice partial fraction MCQ: If (x-4)/(x²-5x+6) expanded in ascending powers of x, coefficient of x³ is? Options: -73, 73, 71, -71. Correct: -73. Explanation: Factor: x²-5x+6=(x-2)(x-3). Partial fractions: (x-4)/[(x-2)(x-3)] = 2/(x-2) - 1/(x-3) = -2/(2-x) + 1/(3-x) = -1/(1-x/2) + 1/[3(1-x/3)]. Expand: -(1+x/2+x²/4+x³/8+...) + (1/3)(1+x/3+x²/9+x³/27+...). Coefficient of x³: -1/8 + 1/81 = (-81+8)/648 = -73/648. The coefficient numerator is -73. More entry test MCQs at NotesPrep."
    https://notesprep.com/entry-tests/mcqs/particle-physics/mcq1:
    title: "Particle Physics | Which list contains only fundamental particles - leptons and quarks - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice particle physics MCQ: Which list contains only fundamental particles? Options: antineutrino, beta, meson; baryon, neutrino, positron; electron, neutrino, alpha; lepton, quark, positron. Correct: lepton, quark, positron. Explanation: Fundamental particles are not composed of other particles. Leptons (electron, neutrino, positron) and quarks are fundamental. Beta particles are electrons, mesons and baryons are composite hadrons. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/particle-physics/mcq2:
    title: "Particle Physics | Which is an example of a fundamental particle - neutrino - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice particle physics MCQ: Which particle is an example of a fundamental particle? Options: nucleus, neutrino, pion, proton. Correct: neutrino. Explanation: Neutrino is a fundamental particle (lepton). Nucleus, pion (meson), proton (baryon) are composite particles made of quarks. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/particle-physics/mcq3:
    title: "Particle Physics | Which particle is a lepton - positron - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice particle physics MCQ: Which particle is a lepton? Options: meson, positron, proton, quark. Correct: positron. Explanation: Positron is antiparticle of electron and is a lepton. Mesons are hadrons made of quarks. Protons are baryons made of quarks. Quarks are fundamental but not leptons. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/particle-physics/mcq4:
    title: "Particle Physics | Which statement is not correct - electron is made of quark and antiquark - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice particle physics MCQ: Which statement is not correct? Options: Antineutrino is fundamental; Electron is made of quark and antiquark; Neutrino is lepton; Neutron composed of three quarks. Correct: An electron is made up of a quark and an antiquark. Explanation: Electron is fundamental particle (lepton), not composed of quarks. Other statements are correct. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/particle-physics/mcq5:
    title: "Particle Physics | Which is not made from quarks - lepton - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice particle physics MCQ: Which is not made from quarks? Options: proton, neutron, lepton, meson. Correct: lepton. Explanation: Leptons (electrons, neutrinos) are fundamental particles not composed of quarks. Protons, neutrons (baryons), and mesons are hadrons made of quarks. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/particle-physics/mcq6:
    title: "Particle Physics | Particle with mass 1u and charge -1.6×10⁻¹⁹ C is antiproton - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice particle physics MCQ: Particle has mass 1u and charge -1.6×10⁻¹⁹ C. Which could be the particle? Options: antiproton, electron, neutron, positron. Correct: antiproton. Explanation: Antiproton has same mass as proton (~1u) and charge -e. Electrons/positrons have negligible mass (~0.0005u), neutron has no charge. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/particle-physics/mcq7:
    title: "Particle Physics | Which two particles have opposite charges - antiproton and beta-plus particle - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice particle physics MCQ: Which two particles have opposite charges? Options: alpha and helium nucleus; antiproton and beta-plus; beta-minus and electron; positron and proton. Correct: antiproton and beta-plus particle. Explanation: Antiproton has -e charge, beta-plus (positron) has +e charge. Alpha and helium nucleus are same (+2e). Beta-minus and electron both -e. Positron and proton both +e. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/particle-physics/mcq8:
    title: "Particle Physics | Mass and charge of antineutron - 1u, 0e - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice particle physics MCQ: Which row summarises mass and charge of antineutron? Options: 0u,0e; 0u,-1e; 1u,0e; 1u,+1e. Correct: Mass: 1u, Charge: 0e. Explanation: Antineutron is antiparticle of neutron. Same mass as neutron (~1u) and neutral (charge 0e). More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/particle-physics/mcq9:
    title: "Particle Physics | Antiparticle of π⁻ is meson with mass +140 MeV/c² - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice particle physics MCQ: π⁻ has mass 140 MeV/c². Which row is correct for antiparticle of π⁻? Options: Baryon,+140; Baryon,-140; Meson,+140; Meson,-140. Correct: Meson, Mass/MeV/c²: +140. Explanation: Antiparticle of π⁻ is π⁺. Both are mesons (quark-antiquark pairs) with same positive mass. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/particle-physics/mcq10:
    title: "Particle Physics | Charge of particle with two up quarks and charm quark - +2e - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice particle physics MCQ: Particle consists of two up quarks and a charm quark. Charge in terms of e? Options: -2e, -e, +e, +2e. Correct: +2e. Explanation: Up quark charge = +⅔e, charm quark charge = +⅔e. Total = (⅔+⅔+⅔)e = 6/3 e = +2e. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/particle-physics/mcq11:
    title: "Particle Physics | Quark combination forming a proton - uud - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice particle physics MCQ: Which combination of up and down quarks forms a proton? Options: uuu, uud, udd, ddd. Correct: uud. Explanation: Proton = two up quarks + one down quark (uud). Charge = 2×(+⅔) + (-⅓) = +1e. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/particle-physics/mcq12:
    title: "Particle Physics | Positively charged meson quark-antiquark combination - up and antistrange - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice particle physics MCQ: Positively charged meson consists of quark and antiquark. What could they be? Options: charm & antiproton; down & antitop; strange & antibottom; up & antistrange. Correct: up and antistrange. Explanation: Up quark +⅔e, antistrange +⅓e (strange -⅓e so antistrange +⅓e). Total = +1e. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/particle-physics/mcq13:
    title: "Particle Physics | Hadrons, baryons, mesons in ⁹₄Be nucleus - 9 hadrons, 9 baryons, 0 mesons - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice particle physics MCQ: How many hadrons, baryons, mesons in ⁹₄Be nucleus? Options: hadrons:9,baryons:4,mesons:5; hadrons:9,baryons:5,mesons:4; hadrons:9,baryons:9,mesons:0; hadrons:13,baryons:9,mesons:0. Correct: hadrons:9, baryons:9, mesons:0. Explanation: Beryllium-9 has 4 protons + 5 neutrons = 9 nucleons. All are baryons (hadrons). No mesons in nucleus. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/particle-physics/mcq14:
    title: "Particle Physics | Quark change in neutron beta decay - d → u + β⁻ + ν̄ₑ - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice particle physics MCQ: Neutron decays to proton emitting beta-particle. Change in quark structure? Options: d→u+β⁻+ν̄ₑ; d→u+β⁻+ν̄ₑ; u→d+β⁺+νₑ; u→d+β⁺+νₑ. Correct: d → u + β⁻ + ν̄ₑ. Explanation: In β⁻ decay, down quark converts to up quark, emitting electron (β⁻) and electron antineutrino. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/particle-physics/mcq15:
    title: "Particle Physics | Conversion of proton mass to GeV/c² - correct formula - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice particle physics MCQ: Proton mass 1.67×10⁻²⁷ kg. Which shows conversion to GeV/c²? Options: Four formulas with different arrangements. Correct: (1.67×10⁻²⁷ × (3×10⁸)²)/(1.6×10⁻¹⁰). Explanation: E=mc² gives joules, convert to eV (1eV=1.6×10⁻¹⁹J) then to GeV (10⁹). More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/particle-physics/mcq16:
    title: "Particle Physics | Correct equation for proton decay within nucleus - p → n + β⁺ + νₑ - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice particle physics MCQ: Which particle equation is correct for decay of proton within nucleus? Options: p→n+β⁺; p→p+β⁺; p→n+β⁺+νₑ; p→p+β⁺+νₑ. Correct: p → n + β⁺ + νₑ. Explanation: In beta-plus decay, proton converts to neutron, emitting positron (β⁺) and neutrino (νₑ) to conserve lepton number. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/particle-physics/mcq17:
    title: "Particle Physics | High-energy proton interacting with photon produces n + π⁺ - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice particle physics MCQ: High-energy proton interacts with photon to produce two particles. Which could be the two particles? Options: n+π⁰; n+π⁺; π⁰+π⁺; π⁻+π⁺. Correct: n + π⁺. Explanation: Initial charge = +1 (from proton). Neutron (n) is neutral, π⁺ has +1, total charge = +1, conserving charge. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/particle-physics/mcq18:
    title: "Particle Physics | β⁺ decay products - particle P and proton number of parent nucleus - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice particle physics MCQ: X → ᴬzY + β⁺ + P. What is particle P and proton number of X? Options: antineutrino,Z-1; antineutrino,Z+1; neutrino,Z-1; neutrino,Z+1. Correct: neutrino, Z+1. Explanation: β⁺ decay emits positron and neutrino. Daughter has Z, parent has Z+1. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/particle-physics/mcq19:
    title: "Particle Physics | Correct statement about β⁺ decay - mass-energy is conserved - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice particle physics MCQ: Unstable nucleus decays emitting β⁺ particle. Which statement is correct? Options: Antineutrino also emitted; Neutron changes to proton; Mass-energy is conserved; Nucleon number not conserved. Correct: Mass-energy is conserved. Explanation: Mass-energy always conserved in all decays. β⁺ decay: proton→neutron, emits positron and neutrino (not antineutrino). Nucleon number conserved. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/particle-physics/mcq20:
    title: "Particle Physics | Why β⁻ particles have range of kinetic energies - energy shared with antineutrino - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice particle physics MCQ: Carbon-14 decays to nitrogen-14 emitting β⁻. Why are β⁻ emitted with range of kinetic energies? Options: C-14 nuclei have different masses; β⁻ have different masses; Decay energy different for each nucleus; Energy shared between N-14, β⁻, and antineutrino. Correct: Energy released shared between nitrogen-14, β⁻ particle, and antineutrino. Explanation: Energy distribution varies, giving continuous β⁻ energy spectrum. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/particle-physics/mcq21:
    title: "Particle Physics | Alpha then two beta decays - final element is isotope of original - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice particle physics MCQ: Nucleus emits α, then β⁻, then β⁻. Which describes final element? Options: Different element higher proton number; Different element lower nucleon number; Isotope of original element; Same element different proton number. Correct: It is an isotope of the original element. Explanation: α reduces Z by 2, each β⁻ increases Z by 1. Net Z change = -2+1+1=0. Mass decreases by 4, so different isotope. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/particle-physics/mcq22:
    title: "Particle Physics | Radium nucleus from actinium decay - mass 223, proton 88 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice particle physics MCQ: Actinium (227,89) decays to radium emitting β⁻ and α. What are nucleon and proton number of radium? Options: 223,87; 223,88; 224,87; 225,86. Correct: 223, 88. Explanation: α (mass-4, Z-2) gives 223,87. β⁻ (Z+1) gives 223,88. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/particle-physics/mcq23:
    title: "Particle Physics | Series of decays from U-238 to U-234 - one α and two β⁻ - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice particle physics MCQ: U-238 (²³⁸₉₂U) decays to U-234 (²³⁴₉₂U). Which series of decays could give this result? Options: four β⁻; four γ-rays; one α and two β⁻; two α and eight β⁻. Correct: emission of one α-particle and two β⁻ particles. Explanation: α reduces mass by 4 and Z by 2; two β⁻ increase Z by 2, net Z change zero. Mass decreases by 4. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/particle-physics/mcq24:
    title: "Particle Physics | Alpha scattering experiment evidence for nucleus - tiny proportion deflected through large angles - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice particle physics MCQ: Which statement about alpha-particle scattering provides evidence for existence of nucleus? Options: Tiny proportion deflected through large angles; Slower alpha deflected more; KE of deflected alpha unchanged; Deflection depends on foil thickness. Correct: A tiny proportion of alpha-particles are deflected through large angles. Explanation: Large deflections indicate small, dense, positively charged nucleus repelling alpha particles. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/particle-physics/mcq25:
    title: "Particle Physics | Which conclusion cannot be drawn from alpha scattering alone - nucleus contains protons and neutrons - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice particle physics MCQ: Which conclusion about atom structure cannot be drawn from alpha scattering alone? Options: Most of atom is empty space; Most mass concentrated in nucleus; Nucleus contains both protons and neutrons; Nucleus is charged. Correct: The nucleus contains both protons and neutrons. Explanation: Alpha scattering showed empty space, small dense nucleus, positive charge, but could not reveal neutrons (discovered later). More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/particle-physics/mcq26:
    title: "Particle Physics | Increase proportion of alpha particles deflected - using double thickness foil - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice particle physics MCQ: Which change would increase proportion of α-particles deflected by large angle? Options: α with greater KE; double thickness foil; metal with fewer protons; source emitting more α per second. Correct: using a double thickness foil. Explanation: Increasing foil thickness increases probability of α encountering nucleus, increasing large-angle deflections. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/particle-physics/mcq27:
    title: "Particle Physics | X and Y are isotopes - decay combination one α and two β⁻ - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice particle physics MCQ: X decays to Y. X and Y are isotopes. Which combination could have been emitted? Options: 1α+1β⁻; 1α+2β⁻; 2α+1β⁻; 2α+2β⁻. Correct: 1 α-particle and 2 β⁻ particles. Explanation: For isotopes (same Z), net Z change must be zero. α reduces Z by 2, β⁻ increases Z by 1. One α (-2) and two β⁻ (+2) gives net Z change 0. Mass decreases by 4. More entry test MCQs at NotesPrep."
https://notesprep.com/entry-tests/mcqs/permutation-combination-probability/mcq1:
    title: "Permutation Combination Probability | Selection without regard to order is called combination - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice permutation combination probability MCQ: When selection of objects is made without paying regard to order of selection, it is called? Options: Permutation, Combination, Series, Sequence. Correct: Combination. Explanation: Combination is selection where order does not matter. Permutation considers order. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/permutation-combination-probability/mcq2:
    title: "Permutation Combination Probability | Value of ⁵C₂ + ⁵C₁ using Pascal's identity - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice permutation combination probability MCQ: ⁵C₂ + ⁵C₁ = ? Options: ⁵C₂, ⁶C₁, ⁶C₂, ⁵C₃. Correct: ⁶C₂. Explanation: Using Pascal's identity: ⁿCᵣ + ⁿCᵣ₋₁ = ⁿ⁺¹Cᵣ. Here, ⁵C₂ + ⁵C₁ = ⁶C₂ = 15. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/permutation-combination-probability/mcq3:
    title: "Permutation Combination Probability | P(A∩B) for independent events equals P(A)P(B) - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice permutation combination probability MCQ: For independent events A and B, P(A∩B) = ? Options: P(A)P(B|A), P(A)∪P(B), P(A)P(B), P(A)∩P(B). Correct: P(A)P(B). Explanation: For independent events, probability of intersection is product of individual probabilities. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/permutation-combination-probability/mcq4:
    title: "Permutation Combination Probability | All possible outcomes of random experiment are called sample space - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice permutation combination probability MCQ: For random experiment, all possible outcomes are called? Options: Numerical space, Sample space, Event space, Both b and c. Correct: Sample space. Explanation: Sample space is set of all possible outcomes. Event space is set of all subsets. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/permutation-combination-probability/mcq5:
    title: "Permutation Combination Probability | 5! × ¹⁰C₅ equals ¹⁰P₅ - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice permutation combination probability MCQ: The correct option for 5! × ¹⁰C₅ is? Options: ¹⁰P₅, ¹⁰C₅, 5!×¹⁰P₅, ¹⁰C₅. Correct: ¹⁰P₅. Explanation: Using relationship: r! × ⁿCᵣ = ⁿPᵣ. So 5! × ¹⁰C₅ = ¹⁰P₅. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/permutation-combination-probability/mcq6:
    title: "Permutation Combination Probability | Probability of failing test if passing probability is 8/9 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice permutation combination probability MCQ: Student estimates probability of passing test is 8/9. Probability of failing is? Options: 7/9, 2/9, 1/9, 3/9. Correct: 1/9. Explanation: P(fail) = 1 - P(pass) = 1 - 8/9 = 1/9. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/permutation-combination-probability/mcq7:
    title: "Permutation Combination Probability | n(n-1)(n-2) in factorial form - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice permutation combination probability MCQ: n(n-1)(n-2) can be written as? Options: n!, n!/(n-3)!, (n-1)!/(n-2)!, (n-2)!. Correct: n!/(n-3)!. Explanation: n(n-1)(n-2) = n!/(n-3)!. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/permutation-combination-probability/mcq8:
    title: "Permutation Combination Probability | Simplify k!/(k+1)! - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice permutation combination probability MCQ: k!/(k+1)! = ? Options: k+1, k, 1/k, 1/(k+1). Correct: 1/(k+1). Explanation: k!/(k+1)! = k!/[(k+1)k!] = 1/(k+1). More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/permutation-combination-probability/mcq9:
    title: "Permutation Combination Probability | P(A∪B) for disjoint events equals P(A)+P(B) - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice permutation combination probability MCQ: If A and B are disjoint events, then P(A∪B) = ? Options: P(A)+P(B), P(A)+P(B)-P(A∩B), P(A)∪P(B), n(A∪B)/n(S). Correct: P(A)+P(B). Explanation: For disjoint events, P(A∩B)=0, so addition rule simplifies to P(A)+P(B). More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/permutation-combination-probability/mcq10:
    title: "Permutation Combination Probability | Probability of selecting prime number from 1 to 20 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice permutation combination probability MCQ: Probability of selecting prime number from set {1,2,...,20} is? Options: 9/20, 1/2, 2/5, 7/20. Correct: 2/5. Explanation: Primes in range: {2,3,5,7,11,13,17,19} = 8 numbers. Probability = 8/20 = 2/5. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/permutation-combination-probability/mcq11:
    title: "Permutation Combination Probability | Number of signals using six flags taking three at a time - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice permutation combination probability MCQ: Number of signals that can be given by six flags of different colors, using three flags at a time? Options: 60, 3, 120, 18. Correct: 120. Explanation: Order matters, so permutations: ⁶P₃ = 6!/3! = 120. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/permutation-combination-probability/mcq12:
    title: "Permutation Combination Probability | P(A-B) equals P(A)-P(A∩B) - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice permutation combination probability MCQ: If A and B are any two events, then P(A-B) = ? Options: P(A)-P(A∩B), P(A)-P(A∪B), P(A∩B)-P(A), P(A∩B). Correct: P(A)-P(A∩B). Explanation: A-B consists of elements in A but not in B, so probability = P(A)-P(A∩B). More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/permutation-combination-probability/mcq13:
    title: "Permutation Combination Probability | Solve ⁿC₂ = 36 for n - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice permutation combination probability MCQ: If ⁿC₂ = 36, then n will be? Options: n=9, n=8, n=7, n=10. Correct: n=9. Explanation: ⁿC₂ = n(n-1)/2 = 36 ⇒ n(n-1)=72 ⇒ n²-n-72=0 ⇒ (n-9)(n+8)=0 ⇒ n=9. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/permutation-combination-probability/mcq14:
    title: "Permutation Combination Probability | P(A∪B) for mutually exclusive events equals P(A)+P(B) - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice permutation combination probability MCQ: If A and B are mutually exclusive events, then P(A∪B) = ? Options: P(A)∪P(B), P(B)∪A, P(A)+P(B), P(A∩B). Correct: P(A)+P(B). Explanation: For mutually exclusive events, P(A∩B)=0, so P(A∪B)=P(A)+P(B). More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/permutation-combination-probability/mcq15:
    title: "Permutation Combination Probability | Two dice sum even and sum multiple of 3 - mutually exclusive or not - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice permutation combination probability MCQ: Two dice thrown. A: sum even, B: sum multiple of 3. Then? Options: Mutually exclusive; Not mutually exclusive; Equally likely; Exhaustive. Correct: A and B are not mutually exclusive events. Explanation: Intersection includes sums 6 and 12, so not mutually exclusive. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/permutation-combination-probability/mcq16:
    title: "Permutation Combination Probability | Probability of getting tail and 6 when coin tossed and die rolled - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice permutation combination probability MCQ: Coin tossed and die rolled simultaneously. Probability of getting tail and 6? Options: 1/2, 1/6, 1/12, 1/3. Correct: 1/12. Explanation: Independent events: P(tail)=1/2, P(6)=1/6. Product = 1/12. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/permutation-combination-probability/mcq17:
    title: "Permutation Combination Probability | Probability sum of two dice is 7 or 11 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice permutation combination probability MCQ: Pair of dice rolled. Probability sum is either 7 or 11? Options: 1/6, 2/9, 1/9, 5/36. Correct: 2/9. Explanation: Total outcomes=36. Sum 7: 6 ways, sum 11: 2 ways. Favorable=8. Probability=8/36=2/9. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/permutation-combination-probability/mcq18:
    title: "Permutation Combination Probability | Number of pairs with a+b=9 from Cartesian product A×B - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice permutation combination probability MCQ: From A={1,3,5,7,9} and B={2,4,6,8}, cartesian product A×B chosen. Number of ways a+b=9 is? Options: 0, 2, 3, 4. Correct: 4. Explanation: Pairs: (1,8),(3,6),(5,4),(7,2) — 4 pairs. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/permutation-combination-probability/mcq19:
    title: "Permutation Combination Probability | Student answers 10 out of 12 questions with at least 4 from first five - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice permutation combination probability MCQ: Student answers 10 out of 12 questions, must choose at least 4 from first five. Number of choices? Options: 56, 35, 40, 45. Correct: 56. Explanation: Case1: 4 from first5,6 from rest: ⁵C₄×⁷C₆=5×7=35. Case2: 5 from first5,5 from rest: ⁵C₅×⁷C₅=1×21=21. Total=56. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/permutation-combination-probability/mcq20:
    title: "Permutation Combination Probability | If ⁿC₄ = ⁿC₁₀ then n equals - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice permutation combination probability MCQ: If ⁿC₄ = ⁿC₁₀ then value of n is? Options: 10, 12, 13, 14. Correct: 14. Explanation: If ⁿCᵣ = ⁿCₛ, then either r=s or r+s=n. Here 4≠10, so 4+10=n ⇒ n=14. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/permutation-combination-probability/mcq21:
    title: "Permutation Combination Probability | Solve ¹⁵C₃ᵣ = ¹⁵Cᵣ₊₃ for r - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice permutation combination probability MCQ: If ¹⁵C₃ᵣ = ¹⁵Cᵣ₊₃ then value of r is? Options: 1, 2, 3, 4. Correct: 3. Explanation: Either 3r=r+3 ⇒ 2r=3 ⇒ r=1.5 (invalid) or 3r+(r+3)=15 ⇒ 4r=12 ⇒ r=3. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/permutation-combination-probability/mcq22:
    title: "Permutation Combination Probability | Number of ways to post r letters in n letter boxes - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice permutation combination probability MCQ: Number of ways r letters can be posted in n letter boxes? Options: nʳ·Cᵣ, nʳ·Pᵣ, nⁿ⁻ʳ, nʳ. Correct: nʳ. Explanation: Each letter can go to any of n boxes independently, so n × n × ... × n (r times) = nʳ. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/permutation-combination-probability/mcq23:
    title: "Permutation Combination Probability | Number of words from four distinct alphabets - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice permutation combination probability MCQ: How many words can be formed by using four distinct alphabets? Options: 4, 12, 24, 256. Correct: 24. Explanation: Permutations of 4 distinct letters taken all at a time = 4! = 24. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/permutation-combination-probability/mcq24:
    title: "Permutation Combination Probability | Number of 3-digit numbers with 0 at unit place - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice permutation combination probability MCQ: How many 3-digit numbers have 0 at unit place? Options: 90, 100, 81, 72. Correct: 90. Explanation: Hundreds: 1-9 (9 ways), Tens: 0-9 (10 ways), Units: fixed 0 (1 way). Total = 9×10×1=90. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/permutation-combination-probability/mcq25:
    title: "Permutation Combination Probability | Six-digit numbers using digits 0,2,3,4,5,7 without repetition - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice permutation combination probability MCQ: How many six-digit numbers can be formed using digits 0,2,3,4,5,7 without repeating? Options: 720, 600, 480, 360. Correct: 600. Explanation: First place can't be 0: 5 choices. Then arrange remaining 5 digits: 5! = 120. Total = 5×120=600. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/permutation-combination-probability/mcq26:
    title: "Permutation Combination Probability | Number of ways arranging 7 keys in key chain - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice permutation combination probability MCQ: Number of ways arranging 7 keys in a key chain is? Options: 5040, 2520, 720, 360. Correct: 360. Explanation: Circular permutations with flip considered same: (n-1)!/2 = 6!/2 = 720/2 = 360. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/permutation-combination-probability/mcq27:
    title: "Permutation Combination Probability | Arrangements at round table with two persons not sitting together - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice permutation combination probability MCQ: Twelve persons at round table. Number of arrangements if two particular persons don't want to sit together? Options: 11!-10!×9, 11!-10!×2, 11!-10!×2!, 11!-10!×2. Correct: 11! - 10! × 2!. Explanation: Total circular = 11!. Together = treat as unit: 10! × 2!. Difference = 11! - 10!×2!. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/permutation-combination-probability/mcq28:
    title: "Permutation Combination Probability | Ways to choose questions from three parts A,B,C - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice permutation combination probability MCQ: Question paper has parts A,B,C each with 8 questions. Choose 5 from A, 3 from B, 3 from C. Number of ways? Options: ⁸C₅×⁸C₃×⁸C₃, ⁸C₅+⁸C₃+⁸C₃, ⁸P₅×⁸P₃×⁸P₃, ⁸C₅×⁸C₃. Correct: ⁸C₅ × ⁸C₃ × ⁸C₃. Explanation: Multiplication principle: choose independently from each part. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/permutation-combination-probability/mcq29:
    title: "Permutation Combination Probability | Selections of 11 players out of 15 excluding 3 particular players - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice permutation combination probability MCQ: Number of selections of 11 cricket players out of 15, so that 3 particular players must not be in each selection, is? Options: ¹²C₁₁, ¹⁵C₁₁, ¹⁵C₁₁-¹²C₁₁, ¹⁵C₁₁-³C₁₁. Correct: ¹²C₁₁. Explanation: Remove 3 players, select 11 from remaining 12: ¹²C₁₁ = 12. More entry test MCQs at NotesPrep."
    https://notesprep.com/entry-tests/mcqs/quadratic-equation/mcq1:
    title: "Quadratic Equation | Sum of reciprocals of fourth roots of unity - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice quadratic equation MCQ: Sum of reciprocals of fourth roots of unity is? Options: 0, 1, i, -i. Correct: 0. Explanation: Fourth roots of unity are 1, -1, i, -i. Their reciprocals: 1, -1, 1/i = -i, -1/i = i. Sum = 1 + (-1) + (-i) + i = 0. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/quadratic-equation/mcq2:
    title: "Quadratic Equation | Every quadratic equation can have at most how many roots - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice quadratic equation MCQ: Every Quadratic Equation can have at most? Options: Three roots, One root, Two roots, Any number of roots. Correct: Two roots. Explanation: Quadratic equation is polynomial of degree 2. By Fundamental Theorem of Algebra, polynomial of degree n has exactly n roots. So quadratic has at most 2 roots. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/quadratic-equation/mcq3:
    title: "Quadratic Equation | Real fourth roots of unity are 1 and -1 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice quadratic equation MCQ: Real fourth roots of unity are? Options: 0,1; 1,-1; 1,-1,i,-i; 1,i. Correct: 1, -1. Explanation: Fourth roots of unity are 1, -1, i, -i. Among these, real roots are 1 and -1 only. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/quadratic-equation/mcq4:
    title: "Quadratic Equation | Solutions of quadratic equation are called roots - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice quadratic equation MCQ: Solutions of quadratic equation are also called its? Options: Factors, Roots, Coefficients, None. Correct: Roots. Explanation: Solutions of quadratic equation are called its roots. Factors multiply to give quadratic, coefficients are constants a,b,c. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/quadratic-equation/mcq5:
    title: "Quadratic Equation | Find a in x⁴+x³+ax+1 if 1 is a root - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice quadratic equation MCQ: Value of a in x⁴+x³+ax+1 if 1 is root of expression? Options: 0, 1, -3, 3. Correct: -3. Explanation: Substitute x=1: 1⁴+1³+a(1)+1=0 ⇒ 1+1+a+1=0 ⇒ a+3=0 ⇒ a=-3. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/quadratic-equation/mcq6:
    title: "Quadratic Equation | Simplify (-(1-√3 i)/2)⁵ using cube roots of unity - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice quadratic equation MCQ: (-(1-√3 i)/2)⁵ is equal to? Options: (1-√3 i)/2, (-1+√3 i)/2, (-1-√3 i)/2, (1+√3 i)/2. Correct: (-1+√3 i)/2. Explanation: Note that -(1-√3 i)/2 = (-1+√3 i)/2 = ω, cube root of unity. ω³=1 ⇒ ω⁵=ω² = (-1-√3 i)/2. The intended answer is ω. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/quadratic-equation/mcq7:
    title: "Quadratic Equation | Roots of x⁴ - 3x² - 4 = 0 are ±2, ±i - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice quadratic equation MCQ: If x⁴-3x²-4=0 then its roots are? Options: 2,-2,i,-i; 1,-1,i,-i; 2,-2,1,-1; i,-i,2i,-2i. Correct: 2,-2,i,-i. Explanation: Let y=x². Then y²-3y-4=0 ⇒ (y-4)(y+1)=0 ⇒ y=4 or y=-1. So x²=4 ⇒ x=±2, x²=-1 ⇒ x=±i. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/quadratic-equation/mcq8:
    title: "Quadratic Equation | Equation whose roots are squares of given roots - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice quadratic equation MCQ: If α,β are roots of ax²+bx+c=0, equation with roots α²,β² is? Options: a²x²+(b²-2ac)x+c²=0; a²x²-(b²-2ac)x+c²=0; a²x²-(b²+2ac)x+c²=0; a²x²+(b²+2ac)x+c²=0. Correct: a²x²-(b²-2ac)x+c²=0. Explanation: Sum α²+β² = (α+β)²-2αβ = b²/a² - 2c/a = (b²-2ac)/a². Product = c²/a². New equation: x² - (sum)x + product=0 ⇒ multiply by a². More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/quadratic-equation/mcq9:
    title: "Quadratic Equation | ax²+bx+c=0 has only one root when a=0 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice quadratic equation MCQ: Quadratic equation ax²+bx+c=0 has only one root if? Options: a=0, b=0, c=0, a=b. Correct: a=0. Explanation: When a=0, equation reduces to linear bx+c=0 with one root x=-c/b (b≠0). More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/quadratic-equation/mcq10:
    title: "Quadratic Equation | Solve x=3y and 3x-2y=7 for y - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice quadratic equation MCQ: If x=3y and 3x-2y=7, value of y? Options: 1, 1.5, 2.5, 2. Correct: 1. Explanation: Substitute x=3y into 3x-2y=7: 3(3y)-2y=7 ⇒ 9y-2y=7 ⇒ 7y=7 ⇒ y=1. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/quadratic-equation/mcq11:
    title: "Quadratic Equation | Two numbers with sum 27 and product 182 are 13 and 14 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice quadratic equation MCQ: Sum of two numbers is 27 and product is 182. Numbers are? Options: 12,13; 13,14; 12,15; 13,24. Correct: 13 and 14. Explanation: Let numbers be x and 27-x. Then x(27-x)=182 ⇒ x²-27x+182=0 ⇒ (x-13)(x-14)=0 ⇒ x=13 or 14. Numbers are 13 and 14. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/quadratic-equation/mcq12:
    title: "Quadratic Equation | α²+β² for roots of 3x²+2x-5=0 is 34/9 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice quadratic equation MCQ: If α,β are roots of 3x²+2x-5=0, then α²+β² = ? Options: 9/34, -9/34, 34/9, -34/9. Correct: 34/9. Explanation: α+β=-2/3, αβ=-5/3. α²+β² = (α+β)²-2αβ = (4/9) + (10/3) = 4/9 + 30/9 = 34/9. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/quadratic-equation/mcq13:
    title: "Quadratic Equation | Roots of x²-3x-4=0 are -1 and 4 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice quadratic equation MCQ: Which are roots of x²-3x-4=0? Options: 1,4; 3,4; -1,4; 1,-4. Correct: -1,4. Explanation: x²-3x-4=0 ⇒ (x-4)(x+1)=0 ⇒ x=4 or x=-1. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/quadratic-equation/mcq14:
    title: "Quadratic Equation | Roots of 7x²-10x+2=0 using quadratic formula - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice quadratic equation MCQ: Roots of 7x²-10x+2=0 are? Options: (10±√44)/14, (-10±√44)/7, (10±√44)/7, (10±√44)/14. Correct: (10±√44)/14. Explanation: Using quadratic formula: x = [-b±√(b²-4ac)]/(2a) = [10±√(100-56)]/14 = (10±√44)/14. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/quadratic-equation/mcq15:
    title: "Quadratic Equation | Positive difference between roots of 2x²-5x+2=0 is 3/2 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice quadratic equation MCQ: Positive difference between roots of 2x²-5x+2=0 is? Options: -3/2, -1/2, 5/2, 3/2. Correct: 3/2. Explanation: Roots = (5±3)/4 ⇒ 2 and 1/2. Difference = 2 - 1/2 = 3/2. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/quadratic-equation/mcq16:
    title: "Quadratic Equation | Interval of k when both roots of x²-2kx+k²+k-5=0 are less than 5 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice quadratic equation MCQ: If both roots of x²-2kx+k²+k-5=0 are less than 5, then k lies in? Options: (5,6], (6,∞), (-∞,4], [4,5]. Correct: (-∞,4]. Explanation: Using conditions: D≥0 ⇒ k≤5, f(5)>0 ⇒ k<4 or k>5, sum/2<5 ⇒ k<5. Intersection gives k<4 ⇒ (-∞,4]. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/quadratic-equation/mcq17:
    title: "Quadratic Equation | Roots of x²+px+(1-p)=0 when (1-p) is a root - 0 and -1 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice quadratic equation MCQ: If (1-p) is root of x²+px+(1-p)=0, then roots are? Options: 0,1; -1,1; 0,-1; -1,2. Correct: 0,-1. Explanation: Let other root be α. Sum = -p = (1-p)+α ⇒ α=-1. Product = 1-p = (1-p)(-1) ⇒ p=1. So roots are 1-p=0 and -1. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/quadratic-equation/mcq18:
    title: "Quadratic Equation | Find q when x²+px+12=0 has root 4 and x²+px+q=0 has equal roots - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice quadratic equation MCQ: If one root of x²+px+12=0 is 4, and x²+px+q=0 has equal roots, then q is? Options: 49/4, 12, 3, 4. Correct: 49/4. Explanation: Substitute x=4: 16+4p+12=0 ⇒ p=-7. For x²-7x+q=0, D=49-4q=0 ⇒ q=49/4. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/quadratic-equation/mcq19:
    title: "Quadratic Equation | Graph of quadratic function is a parabola - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice quadratic equation MCQ: Graph of quadratic function is a? Options: Hyperbola, Straight line, Parabola, Triangle. Correct: Parabola. Explanation: Quadratic function f(x)=ax²+bx+c (a≠0) always produces a parabolic curve, U-shaped opening upward or downward. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/quadratic-equation/mcq20:
    title: "Quadratic Equation | If one root is a-√b, the other root is a+√b - conjugate pairs - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice quadratic equation MCQ: If one root of quadratic equation is a-√b, then other root is? Options: √a-b, √a+b, -a+√b, a+√b. Correct: a+√b. Explanation: For quadratic with rational coefficients, irrational roots occur in conjugate pairs. If one root is a-√b, other must be a+√b. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/quadratic-equation/mcq21:
    title: "Quadratic Equation | Quadratic equation using sum S and product P of roots - x² - Sx + P = 0 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice quadratic equation MCQ: If S and P are sum and product of roots, quadratic equation is? Options: x²+Sx+P=0; x²-Sx-P=0; x²-Sx+P=0; x²+Sx-P=0. Correct: x²-Sx+P=0. Explanation: For roots α,β: sum S=α+β, product P=αβ. Equation: (x-α)(x-β)=x²-(α+β)x+αβ = x²-Sx+P=0. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/quadratic-equation/mcq22:
    title: "Quadratic Equation | Roots of px²+qx+2=0 are reciprocals, find p - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice quadratic equation MCQ: If roots of px²+qx+2=0 are reciprocals of each other, then? Options: p=0, p=-2, p=±2, p=2. Correct: p=2. Explanation: For reciprocal roots, product=1. For ax²+bx+c=0, product=c/a. Here 2/p = 1 ⇒ p=2. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/quadratic-equation/mcq23:
    title: "Quadratic Equation | Equation whose roots are 1/a and 1/b for 2x²-3x-6=0 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice quadratic equation MCQ: If a,b are roots of 2x²-3x-6=0, equation with roots 1/a and 1/b is? Options: 6x²-3x+2=0; 6x²+3x-2=0; 6x²-3x-2=0; x²+3x-2=0. Correct: 6x²+3x-2=0. Explanation: a+b=3/2, ab=-3. Sum of reciprocals = (a+b)/ab = -1/2. Product = 1/ab = -1/3. New equation: x²+½x-⅓=0 ⇒ multiply by 6: 6x²+3x-2=0. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/quadratic-equation/mcq24:
    title: "Quadratic Equation | Find ab when x=1 is common root of x²+ax-3=0 and bx²-7x+2=0 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice quadratic equation MCQ: If x=1 is common root of x²+ax-3=0 and bx²-7x+2=0, then ab is? Options: 10, -3, 6, 7. Correct: 10. Explanation: Substitute x=1: 1+a-3=0 ⇒ a=2. b-7+2=0 ⇒ b=5. So ab=2×5=10. More entry test MCQs at NotesPrep."
    https://notesprep.com/entry-tests/mcqs/quantum-physics/mcq1:
    title: "Quantum Physics | Photoelectric effect was explained by Albert Einstein - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice quantum physics MCQ: Photoelectric effect was explained by? Options: Max Planck, Albert Einstein, Niels Bohr, Louis de Broglie. Correct: Albert Einstein. Explanation: Einstein explained photoelectric effect in 1905 using photon concept, for which he received Nobel Prize in 1921. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/quantum-physics/mcq2:
    title: "Quantum Physics | Kinetic energy of photoelectrons depends on frequency of incident light - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice quantum physics MCQ: K.E of photoelectrons depends on? Options: angle of incident light; intensity; both A and B; frequency. Correct: frequency of incident light. Explanation: KE depends only on frequency, not intensity or angle. Einstein's equation: KE_max = hf - φ. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/quantum-physics/mcq3:
    title: "Quantum Physics | Find work function of metal given photon energy 5eV and stopping potential 3.5V - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice quantum physics MCQ: If photon energy is 5eV, stopping potential 3.5V, work function is? Options: 5eV, 7eV, 1.5eV, 8.5eV. Correct: 1.5eV. Explanation: Using eV_s = hf - φ ⇒ φ = E - eV_s = 5 - 3.5 = 1.5eV. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/quantum-physics/mcq4:
    title: "Quantum Physics | Work function of metal is minimum energy to remove an electron - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice quantum physics MCQ: Work function of metal is? Options: minimum energy to remove electron; maximum KE of photoelectrons; threshold frequency; energy of incident photon. Correct: minimum energy to remove an electron. Explanation: Work function φ is minimum energy required to remove electron from metal surface. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/quantum-physics/mcq5:
    title: "Quantum Physics | Experiment demonstrating failure of classical mechanics for light behavior - photoelectric effect - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice quantum physics MCQ: Which experiment demonstrated failure of classical mechanics to explain behavior of light? Options: Stern-Gerlach; Photoelectric effect; Michelson-Morley; Double-slit. Correct: Photoelectric effect. Explanation: Photoelectric effect could not be explained by classical wave theory. Einstein's quantum explanation succeeded. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/quantum-physics/mcq6:
    title: "Quantum Physics | Classical mechanics failed to explain behavior of light in photoelectric effect - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice quantum physics MCQ: Classical mechanics failed to explain behavior of light in? Options: rates of chemical formation; photoelectric effect; quantum entanglement; Stern-Gerlach. Correct: photoelectric effect. Explanation: Photoelectric effect could not be explained by classical wave theory, requiring quantum explanation. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/quantum-physics/mcq7:
    title: "Quantum Physics | Presence of photon was confirmed by Compton effect - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice quantum physics MCQ: Presence of Photon was confirmed by? Options: Uncertainty principle; De Broglie; Photoelectric effect; Compton effect. Correct: Compton effect. Explanation: Compton effect (1923) provided direct confirmation of particle nature of light (photons) via X-ray scattering with wavelength change. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/quantum-physics/mcq8:
    title: "Quantum Physics | Compton effect demonstrates particle nature of light - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice quantum physics MCQ: Compton effect demonstrates? Options: particle nature of light; wave nature of light; wave nature of electrons; particle nature of electrons. Correct: particle nature of light. Explanation: Compton effect demonstrates particle nature of light (photons) through momentum transfer and wavelength shift. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/quantum-physics/mcq9:
    title: "Quantum Physics | Find scattering angle when Compton shift is half of Compton wavelength - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice quantum physics MCQ: If Compton shift is half of Compton wavelength, scattering angle is? Options: 60°, 30°, 90°, 120°. Correct: 60°. Explanation: Δλ = (h/mc)(1-cosθ). Given Δλ = λ_c/2 ⇒ 1-cosθ = 1/2 ⇒ cosθ = 1/2 ⇒ θ=60°. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/quantum-physics/mcq10:
    title: "Quantum Physics | Compton shift is maximum at scattering angle 180° - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice quantum physics MCQ: In Compton scattering, change in wavelength will be maximum if? Options: θ=180°, θ=60°, θ=90°, θ=0°. Correct: angle of scattering is 180°. Explanation: Δλ = (h/mc)(1-cosθ). Maximum when cosθ minimum = -1 at θ=180°, giving Δλ = 2h/mc. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/quantum-physics/mcq11:
    title: "Quantum Physics | De Broglie wavelength associated with moving particle is h/mv = h/p = h/√(2mE) - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice quantum physics MCQ: Wavelength associated with moving particle is given by? Options: λ=h/mv; λ=h/p; λ=h/√(2mE); All of above. Correct: All of above. Explanation: De Broglie wavelength λ = h/p = h/mv = h/√(2mE). All three expressions are equivalent. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/quantum-physics/mcq12:
    title: "Quantum Physics | Wave nature of particles experimentally confirmed by Davisson and Germer - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice quantum physics MCQ: Wave nature of particles was experimentally confirmed by? Options: Davisson and Germer; J.J. Thomson; Rutherford; Max Planck. Correct: Davisson and Germer. Explanation: Davisson and Germer confirmed wave nature of electrons through electron diffraction from nickel crystal in 1927. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/quantum-physics/mcq13:
    title: "Quantum Physics | Particle with same KE having shortest wavelength - alpha particle - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice quantum physics MCQ: Which particle with same KE has shortest wavelength? Options: electron, proton, neutron, alpha particle. Correct: alpha particle. Explanation: λ = h/√(2mE). For same KE, λ ∝ 1/√m. Alpha particle has largest mass, so shortest wavelength. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/quantum-physics/mcq14:
    title: "Quantum Physics | Equation describing behavior of matter waves is Schrödinger's equation - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice quantum physics MCQ: Which equation describes behavior of matter waves? Options: De Broglie relation; Newton's second law; Einstein's mass-energy; Schrödinger's equation; Planck's equation. Correct: Schrödinger's equation. Explanation: Schrödinger's equation is fundamental equation of quantum mechanics describing how matter waves evolve over time. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/quantum-physics/mcq15:
    title: "Quantum Physics | Wave-particle duality principle suggests particles exhibit both wave-like and particle-like behavior - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice quantum physics MCQ: What does wave-particle duality suggest about nature of particles? Options: neither wave nor particle; only wave; probabilistic determination; only particle; both wave and particle. Correct: They exhibit both wave-like and particle-like behavior. Explanation: Wave-particle duality states particles exhibit both wave-like and particle-like properties depending on experiment. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/quantum-physics/mcq16:
    title: "Quantum Physics | Fundamental principle of quantum mechanics is wave-particle duality - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice quantum physics MCQ: Which is fundamental principle of quantum mechanics? Options: Conservation of energy; Conservation of momentum; Maxwell's relation; Wave-particle duality; Newton's laws. Correct: Wave-particle duality. Explanation: Wave-particle duality is fundamental principle stating particles exhibit both wave-like and particle-like properties. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/quantum-physics/mcq17:
    title: "Quantum Physics | Heisenberg uncertainty principle states Δx·Δp ≥ h/4π and ΔE·Δt ≥ h/4π - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice quantum physics MCQ: Heisenberg's uncertainty principle states? Options: Δx·Δp ≥ h/4π; ΔE·Δt ≥ h/4π; Δx·Δp = h/4π; Both A and B. Correct: Both A and B. Explanation: Uncertainty principle: Δx·Δp ≥ h/4π and ΔE·Δt ≥ h/4π. Position-momentum and energy-time uncertainties exist. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/quantum-physics/mcq18:
    title: "Quantum Physics | In Heisenberg principle position and momentum cannot be measured accurately of sub-atomic particles - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice quantum physics MCQ: In Heisenberg Principle? Options: Position and Momentum cannot be measured accurately of sub-atomic particles; of electrons; can be measured accurately of electrons; can be measured accurately of sub-atomic particles. Correct: Position and Momentum cannot be measured accurately of sub-atomic particles. Explanation: Uncertainty principle states position and momentum cannot both be measured precisely simultaneously. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/quantum-physics/mcq19:
    title: "Quantum Physics | Heisenberg Uncertainty Principle states position and momentum cannot be known simultaneously with arbitrary precision - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice quantum physics MCQ: What is Heisenberg Uncertainty Principle? Options: behavior of waves; exact location of electron; determine both energy and position; quantifies total energy; position and momentum cannot be known simultaneously. Correct: position and momentum of particle cannot be known simultaneously with arbitrary precision. Explanation: Δx·Δp ≥ h/4π. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/quantum-physics/mcq20:
    title: "Quantum Physics | According to Planck's quantum theory radiation emitted or absorbed in discrete packets called quanta - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice quantum physics MCQ: According to Planck's quantum theory, radiation is emitted or absorbed in? Options: continuous waves; discrete packets called quanta; any amount of energy; waves only. Correct: discrete packets called quanta. Explanation: Planck's theory states radiation emitted or absorbed in discrete packets called quanta or photons. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/quantum-physics/mcq21:
    title: "Quantum Physics | Dimension of Planck's constant is similar to angular momentum - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice quantum physics MCQ: Dimension of Planck's constant is similar to? Options: linear momentum; angular momentum; impulse; potential energy. Correct: angular momentum. Explanation: Planck's constant h has dimensions [ML²T⁻¹]. Angular momentum also has dimensions [ML²T⁻¹]. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/quantum-physics/mcq22:
    title: "Quantum Physics | Energy of photon is given by E = hc/λ - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice quantum physics MCQ: Energy of photon is given by? Options: E=hλ; E=hc/λ; E=mc²; E=hf/c. Correct: E = hc/λ. Explanation: Photon energy E = hf = hc/λ, where h is Planck's constant, f frequency, c speed of light, λ wavelength. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/quantum-physics/mcq23:
    title: "Quantum Physics | Father of quantum mechanics is Max Planck - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice quantum physics MCQ: Who is considered father of quantum mechanics? Options: Louis De Broglie, Max Planck, Albert Einstein, Erwin Schrödinger, Werner Heisenberg. Correct: Max Planck. Explanation: Max Planck introduced quantum concept in 1900 to explain blackbody radiation, considered father of quantum mechanics. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/quantum-physics/mcq24:
    title: "Quantum Physics | Radiation energy converted into matter in pair production - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice quantum physics MCQ: Radiation energy is converted into matter in case of? Options: photoelectric effect; pair production; Compton effect; annihilation of matter. Correct: pair production. Explanation: In pair production, high-energy photon converts into electron-positron pair, converting radiation energy to matter via E=mc². More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/quantum-physics/mcq25:
    title: "Quantum Physics | Every particle has corresponding antiparticle with same mass and opposite charge - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice quantum physics MCQ: Every particle has corresponding antiparticle with? Options: same mass; opposite charge; same energy; both A and B. Correct: both A and B. Explanation: Antiparticles have same mass as corresponding particles but opposite charge. Positron has same mass as electron but positive charge. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/quantum-physics/mcq26:
    title: "Quantum Physics | Particle with electron mass and proton charge is positron - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice quantum physics MCQ: Particle having mass of electron and charge of proton is called? Options: antiproton, positron, gamma rays, photon. Correct: positron. Explanation: Positron is antiparticle of electron with same mass as electron but positive charge (+1.6×10⁻¹⁹ C). More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/quantum-physics/mcq27:
    title: "Quantum Physics | Failure of classical physics at atomic scale led to development of quantum mechanics - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice quantum physics MCQ: Failure of classical physics to account for behavior of particles at atomic scale led to development of? Options: quantum mechanics; thermodynamics; kinetics; general relativity; classical mechanics. Correct: quantum mechanics. Explanation: Quantum mechanics developed in early 20th century to explain phenomena classical physics could not account for. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/quantum-physics/mcq28:
    title: "Quantum Physics | Classical physics failed to explain behavior of electrons in atoms due to their discrete energy levels - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice quantum physics MCQ: Classical physics failed to explain behavior of electrons in atoms because of? Options: discrete energy levels; lack of mass; inability to form chemical bonds; wave-particle duality; lack of certainty about location. Correct: their discrete energy levels. Explanation: Classical physics predicted electrons would spiral into nucleus. Quantum mechanics explained discrete energy levels in atomic spectra. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/quantum-physics/mcq29:
    title: "Quantum Physics | Which is NOT a consequence of quantum mechanics - deterministic behavior of particles - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice quantum physics MCQ: Which is NOT a consequence of quantum mechanics? Options: Deterministic behavior of particles; Quantization of energy levels; Quantum entanglement; Probabilistic determination; Wave-particle duality. Correct: Deterministic behavior of particles. Explanation: Deterministic behavior is feature of classical mechanics. Quantum mechanics is fundamentally probabilistic. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/quantum-physics/mcq30:
    title: "Quantum Physics | Postulate of quantum mechanics - energy of electron is quantized - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice quantum physics MCQ: Which is postulate of quantum mechanics? Options: Light behaves solely as wave; Position and momentum precisely known; Energy of electron quantized; Energy conserved in all processes; Heating of black body leads to ultraviolet catastrophe. Correct: The energy of an electron is quantized. Explanation: Quantization of energy is fundamental postulate, demonstrated by Bohr's atomic model and Planck's theory. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/quantum-physics/mcq31:
    title: "Quantum Physics | Find eigenvalue of momentum operator on ψ(x)=A e^{ikx} - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice quantum physics MCQ: Given ψ(x)=A e^{ikx}, operated upon by operator p̂ = (h/2πi) d/dx, eigenvalue is? Options: -ih/2π, 2h/2π, ih/2π, hk/2π, 2πhk. Correct: hk/2π. Explanation: p̂ψ = (h/2πi)(ik A e^{ikx}) = (hk/2π)ψ. Eigenvalue is hk/2π. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/quantum-physics/mcq32:
    title: "Quantum Physics | At higher temperature hot body emits radiations of higher energy and shorter wavelength - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice quantum physics MCQ: At higher temperature, hot body emits radiations of? Options: higher energy; longer wavelength; shorter wavelength; both A and C. Correct: both A and C. Explanation: By Wien's displacement law, as temperature increases, peak wavelength decreases (shorter) and energy increases. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/quantum-physics/mcq33:
    title: "Quantum Physics | Which has greatest energy - gamma rays - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice quantum physics MCQ: Which has greatest energy? Options: Microwave, Radio waves, Ultraviolet, Gamma rays. Correct: Gamma rays. Explanation: Energy ∝ frequency. Gamma rays have highest frequency, therefore greatest energy among EM waves. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/quantum-physics/mcq34:
    title: "Quantum Physics | Quasi-free electron means loosely bound electron - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice quantum physics MCQ: Quasi-free electron means? Options: tightly bound electron; loosely bound electron; completely free electron; any of these. Correct: loosely bound electron. Explanation: Quasi-free electron is nearly free but under weak binding forces, such as conduction electrons in metals. More entry test MCQs at NotesPrep."
    https://notesprep.com/entry-tests/mcqs/sequence-and-series/mcq1:
    title: "Sequence and Series | Series 1+1+1+1+... is divergent - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice sequence and series MCQ: The series 1+1+1+1+... is? Options: Convergent, Divergent, Neither convergent nor divergent, Both convergent and divergent. Correct: Divergent. Explanation: Sum of first n terms is n, which approaches infinity as n→∞, so series diverges to infinity. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/sequence-and-series/mcq2:
    title: "Sequence and Series | Sum of first n odd numbers 1+3+5+... equals n² - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice sequence and series MCQ: Sum the series upto n terms: 1+3+5+... Options: n², ln e², 2ⁿ, n!. Correct: n². Explanation: Arithmetic progression with a=1, d=2. S_n = n/2[2(1)+(n-1)2] = n/2[2+2n-2] = n/2×2n = n². More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/sequence-and-series/mcq3:
    title: "Sequence and Series | Sum of sequence 7,77,777,7777,... to n terms - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice sequence and series MCQ: Find sum of sequence 7,77,777,7777,... to n terms. Options: Four formulas given. Correct: (7/9)[10(10ⁿ-1)/9 - n]. Explanation: Multiply by 9/7: (9/7)S_n = (10-1)+(10²-1)+... = 10(10ⁿ-1)/9 - n ⇒ S_n = (7/9)[10(10ⁿ-1)/9 - n]. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/sequence-and-series/mcq4:
    title: "Sequence and Series | Sum from n=2 to 30 of (-1/i)ⁿ equals -1 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice sequence and series MCQ: ∑_{n=2}^{30} (-1/i)ⁿ = ? Options: 1, -1, i, -i. Correct: -1. Explanation: -1/i = i, so series becomes ∑ iⁿ from n=2 to 30. Geometric series with a=i²=-1, r=i, 29 terms. Sum = (-1)(1-i²⁹)/(1-i). i²⁹=i, so 1-i²⁹=1-i, sum = -1. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/sequence-and-series/mcq5:
    title: "Sequence and Series | Common ratio of geometric sequence a_n = 2⁻ⁿ is 1/2 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice sequence and series MCQ: Common ratio of geometric sequence a_n = 2⁻ⁿ is? Options: 2, 1/2, -2, -1/2. Correct: 1/2. Explanation: r = a_n/a_{n-1} = 2⁻ⁿ/2^{-(n-1)} = 2⁻ⁿ × 2^{n-1} = 2^{-1} = 1/2. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/sequence-and-series/mcq6:
    title: "Sequence and Series | A sequence is a function whose domain is natural numbers - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice sequence and series MCQ: A sequence is a function whose domain is? Options: Real numbers, Natural numbers, Integers, Positive numbers. Correct: Natural numbers. Explanation: Sequence is defined as function whose domain is set of natural numbers (usually starting from 1). More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/sequence-and-series/mcq7:
    title: "Sequence and Series | Pascal's sequence for n=3 is 1,3,3,1,0,0,... - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice sequence and series MCQ: Pascal's sequence for n=3 is? Options: 1,1,0,...; 1,2,1,0,...; 1,3,3,1,0,...; 1,4,6,4,1,0,... Correct: 1,3,3,1,0,0,... Explanation: Pascal's triangle gives binomial coefficients. For n=3: C(3,0)=1, C(3,1)=3, C(3,2)=3, C(3,3)=1. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/sequence-and-series/mcq8:
    title: "Sequence and Series | Find a_n given a=125/8, r=2/5, n=7 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice sequence and series MCQ: If a=125/8, r=2/5, n=7, then a_n = ? Options: 16/625, 8/125, 625/16, 16/125. Correct: 8/125. Explanation: a_n = ar^{n-1} = (125/8)×(2/5)⁶ = (125/8)×(64/15625) = 8000/125000 = 8/125. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/sequence-and-series/mcq9:
    title: "Sequence and Series | If a,b,c in AP then 3^{a²},3^{b²},3^{c²} are in none of these - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice sequence and series MCQ: If a,b,c are in AP, then 3^{a²},3^{b²},3^{c²} are in? Options: GP, HP, AP, None. Correct: None of these. Explanation: For GP need 2b² = a²+c², not necessarily true. Example: 1,2,3 in AP but (3¹,3⁴,3⁹) not in GP. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/sequence-and-series/mcq10:
    title: "Sequence and Series | Sum of infinite series 0+0.1+0.01+0.001+... is 1/9 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice sequence and series MCQ: 0+0.1+0.01+0.001+..., sum is? Options: 9, 10/9, 9/10, 1/9. Correct: 1/9. Explanation: Series = 0.1+0.01+0.001+... Infinite geometric series with a=0.1=1/10, r=0.1=1/10. Sum = a/(1-r) = (1/10)/(9/10)=1/9. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/sequence-and-series/mcq11:
    title: "Sequence and Series | Find first term of geometric series with Sₙ=30, n=4, r=-2 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice sequence and series MCQ: Find first term of geometric series when Sₙ=30, n=4, r=-2. Options: 6, -6, 8, -8. Correct: -6. Explanation: Sₙ = a(1-rⁿ)/(1-r). 30 = a(1-16)/(1+2) = a(-15)/3 = -5a ⇒ a = -6. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/sequence-and-series/mcq12:
    title: "Sequence and Series | 2,3,5,7,11,... is a sequence of prime numbers - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice sequence and series MCQ: 2,3,5,7,11,... is a ______ of prime numbers. Options: Sequence, Progression, Series, Set. Correct: Sequence. Explanation: Ordered list of numbers following specific order is a sequence. Prime numbers don't follow simple progression rule. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/sequence-and-series/mcq13:
    title: "Sequence and Series | Which is nth term of an AP - 3n-8 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice sequence and series MCQ: Which is nth term of an AP? Options: 2×3ⁿ, 1/(n+1), 3n-8, All of these. Correct: 3n-8. Explanation: nth term of AP has form a+(n-1)d, linear in n. 3n-8 is linear. 2×3ⁿ is exponential, 1/(n+1) is reciprocal. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/sequence-and-series/mcq14:
    title: "Sequence and Series | Harmonic mean between 3 and 7 is 21/5 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice sequence and series MCQ: Harmonic mean between 3 and 7 is? Options: 5/21, 21/5, 5, √21. Correct: 21/5. Explanation: HM = 2ab/(a+b) = 2×3×7/(3+7) = 42/10 = 21/5. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/sequence-and-series/mcq15:
    title: "Sequence and Series | Sum of squares of first n odd numbers - n(4n²-1)/3 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice sequence and series MCQ: Sum of series 1²+3²+5²+...+(2n-1)² is? Options: n(n+1)(2n+1)/6, n(4n²-1)/3, n(n+1)/2, n(6n²+3n-1)/2. Correct: n(4n²-1)/3. Explanation: Sum of squares of first n odd numbers = n(4n²-1)/3, derived from sum of squares of first 2n numbers minus sum of squares of first n even numbers. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/sequence-and-series/mcq16:
    title: "Sequence and Series | Find 10th term of sequence 1/8, 1/3, -1/2, -1/7,... - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice sequence and series MCQ: Find 10th term of sequence: 1/8, 1/3, -1/2, -1/7,... Options: 37, 1/37, -37, -1/37. Correct: -1/37. Explanation: Denominators: 8,3,-2,-7,... decrease by 5 each time. nth denominator = 8-5(n-1)=13-5n. For n=10, denominator=13-50=-37. Sign pattern: first two positive, next two negative. So 10th term = -1/37. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/sequence-and-series/mcq17:
    title: "Sequence and Series | For AP with Sₙ=p, aₙ=q, n terms, find a₁ - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice sequence and series MCQ: For AP, if Sₙ=p, aₙ=q and total terms n, then a₁ = ? Options: 2q/n - p, n/q - p, 2p/n - q, np - q. Correct: 2p/n - q. Explanation: Sₙ = n/2(a₁ + aₙ) ⇒ p = n/2(a₁ + q) ⇒ 2p/n = a₁ + q ⇒ a₁ = 2p/n - q. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/sequence-and-series/mcq18:
    title: "Sequence and Series | If sum of n terms of series is n²-3n, find 7th term - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice sequence and series MCQ: If sum of n terms of series is n²-3n, then its 7th term is? Options: 6, 8, 12, 10. Correct: 10. Explanation: a_n = S_n - S_{n-1} = (n²-3n) - [(n-1)²-3(n-1)] = 2n-4. For n=7: a₇ = 2×7-4 = 10. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/sequence-and-series/mcq19:
    title: "Sequence and Series | Find n for which expression equals harmonic mean of a and b - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice sequence and series MCQ: For what n will (a^{n+2}+b^{n+2})/(a^{n+1}+b^{n+1}) be harmonic mean of a and b? Options: n=0, n=-2, n=-1/2, n=1. Correct: n=-2. Explanation: Set expression = 2ab/(a+b). Cross-multiplying and simplifying gives a^{n+2}=b^{n+2} ⇒ (a/b)^{n+2}=1 ⇒ n+2=0 ⇒ n=-2. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/sequence-and-series/mcq20:
    title: "Sequence and Series | 10th term of progression 1,√2,2,... is 16√2 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice sequence and series MCQ: 10th term of progression 1,√2,2,... is? Options: 8, 16√2, 16, None. Correct: 16√2. Explanation: GP with a=1, r=√2. a₁₀ = ar⁹ = 1×(√2)⁹ = 2^{9/2} = 2⁴×2^{1/2} = 16√2. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/sequence-and-series/mcq21:
    title: "Sequence and Series | Repeating decimal 0.4545... equals 5/11 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice sequence and series MCQ: Exact value of repeating decimal 0.4545... is? Options: 5/11, 50/11, 0.5/11, None. Correct: 5/11. Explanation: Let x=0.4545... Then 100x=45.4545... Subtract: 99x=45 ⇒ x=45/99=5/11. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/sequence-and-series/mcq22:
    title: "Sequence and Series | Find general term of AP with a₅=16, a₂₀=40 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice sequence and series MCQ: Find general term of AP where a₅=16 and a₂₀=40. Options: (8n+40)/5, 4n-4, 8n/5+8, 5n-9. Correct: (8n+40)/5. Explanation: a₅=a₁+4d=16, a₂₀=a₁+19d=40. Subtract: 15d=24 ⇒ d=8/5. Then a₁=16-4×8/5=48/5. a_n=48/5+(n-1)8/5=(8n+40)/5. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/sequence-and-series/mcq23:
    title: "Sequence and Series | Summation notation for a₁+a₂+...+aₙ - ∑ from i=1 to n a_i - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice sequence and series MCQ: In summation notation, series a₁+a₂+...+aₙ can be written as? Options: ∑_{i=1}ⁿ a_i, ∑_{i=0}^{n-1} a_{i+1}, All of these, None. Correct: All of these. Explanation: Both ∑_{i=1}ⁿ a_i and ∑_{i=0}^{n-1} a_{i+1} represent same sum. So answer is 'All of these'. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/sequence-and-series/mcq24:
    title: "Sequence and Series | Sum of series 1·n + 2(n-1) + 3(n-2) + ... + n·1 is n(n+1)(n+2)/6 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice sequence and series MCQ: Sum of series 1·n + 2(n-1) + 3(n-2) + ... + n·1 is? Options: n(n+1)(2n+1)/3, n(n+1)(n+2)/6, n(n+1)(n+3)/2, n(n+1)(n+2)(n+3)/4. Correct: n(n+1)(n+2)/6. Explanation: kth term = k(n-k+1) = (n+1)k - k². Sum = (n+1)∑k - ∑k² = (n+1)n(n+1)/2 - n(n+1)(2n+1)/6 = n(n+1)(n+2)/6. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/sequence-and-series/mcq25:
    title: "Sequence and Series | Sum of infinite series 1/(3·7)+1/(7·11)+1/(11·15)+... is 1/12 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice sequence and series MCQ: Sum of series 1/(3·7)+1/(7·11)+1/(11·15)+... to infinity is? Options: 1/3, 1/6, 1/9, 1/12. Correct: 1/12. Explanation: T_k = 1/[(4k-1)(4k+3)] = 1/4[1/(4k-1) - 1/(4k+3)]. Telescoping sum: S_∞ = 1/4 × 1/3 = 1/12. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/sequence-and-series/mcq26:
    title: "Sequence and Series | Sum to n terms of 1·2·3+2·3·4+3·4·5+... is n(n+1)(n+2)(n+3)/4 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice sequence and series MCQ: Sum to n terms of 1·2·3+2·3·4+3·4·5+... is? Options: n(n+1)(n+2)/2, n(n+1)(n+2)(n+3), n(n+1)(n+2)(n+3)/4, n²(n+1)(n+3). Correct: n(n+1)(n+2)(n+3)/4. Explanation: T_k = k(k+1)(k+2) = k³+3k²+2k. Summation yields n(n+1)(n+2)(n+3)/4. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/sequence-and-series/mcq27:
    title: "Sequence and Series | Sum of first n natural numbers is 325, find n - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice sequence and series MCQ: If sum of first n natural numbers is 325, then n = ? Options: 23, 24, 25, 26. Correct: 25. Explanation: S_n = n(n+1)/2 = 325 ⇒ n(n+1)=650 ⇒ n²+n-650=0 ⇒ n=25 (positive root). More entry test MCQs at NotesPrep."
    https://notesprep.com/entry-tests/mcqs/sets/mcq1:
    title: "Sets | Associative law for sets - A ∪ (B ∪ C) = (A ∪ B) ∪ C - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice sets MCQ: Which is associative law for sets? Options: A∪(B∪C)=(A∪B)∩C; A∪(B∪C)=A∩(B∪C); A∪(B∪C)=(A∪B)∪C; None. Correct: A∪(B∪C)=(A∪B)∪C. Explanation: Associative law states grouping does not affect union or intersection. For union: A∪(B∪C)=(A∪B)∪C. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/sets/mcq2:
    title: "Sets | If A∩B = A∪B then sets A and B are equal - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice sets MCQ: If A∩B = A∪B, what can you say about sets A and B? Options: Disjoint; Overlapping; A⊆B; A and B equal. Correct: A and B are equal sets. Explanation: If A∩B = A∪B, then every element in A∪B is in A∩B, meaning all elements of A are in B and all of B are in A, so A=B. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/sets/mcq3:
    title: "Sets | Commutative property of sets - A ∪ B = B ∪ A - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice sets MCQ: Which is commutative property of sets? Options: A∪B=B∪A; A=B; A∪(B∪C)=(A∪B)∪C; A'=U-A. Correct: A∪B=B∪A. Explanation: Commutative property states order of operands does not affect result. For union: A∪B=B∪A. For intersection: A∩B=B∩A. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/sets/mcq4:
    title: "Sets | Two sets are called disjoint if their intersection is empty set - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice sets MCQ: Two sets are called disjoint if their ______ is empty set. Options: Union, Difference, Intersection, Complement. Correct: Intersection. Explanation: Disjoint sets have no elements in common, i.e., A∩B=∅. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/sets/mcq5:
    title: "Sets | Which two sets are disjoint - {1,3,5} and {2,4,6} - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice sets MCQ: Which two sets are disjoint? Options: {1,3,5} and {1,3,6}; {1,2,3} and {1,2,3}; {1,3,5} and {2,3,4}; {1,3,5} and {2,4,6}. Correct: {1,3,5} and {2,4,6}. Explanation: Disjoint sets have no common elements. {1,3,5} and {2,4,6} share no elements. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/sets/mcq6:
    title: "Sets | Power set of empty set has exactly one subset - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice sets MCQ: Power set of empty set has exactly ______ subset. Options: One, Two, Zero, Three. Correct: One. Explanation: Empty set has no elements. Its power set is {∅}, containing only the empty set itself. So exactly one subset. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/sets/mcq7:
    title: "Sets | Number of elements in power set of S={1,2,3} is 8 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice sets MCQ: Number of elements in Power set P(S) of S={1,2,3} is? Options: 4, 8, 2, None. Correct: 8. Explanation: |S|=3, number of subsets = 2³ = 8. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/sets/mcq8:
    title: "Sets | Empty set is a finite set - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice sets MCQ: Empty set is a ______. Options: Infinite set, Finite set, Unknown set, Universal set. Correct: Finite set. Explanation: Cardinality of empty set is zero, so it is a finite set. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/sets/mcq9:
    title: "Sets | If set A has n elements, number of elements in power set P(A) is 2ⁿ - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice sets MCQ: If set A has n elements, number of elements in its power set P(A) is? Options: n, 2n, n², 2ⁿ. Correct: 2ⁿ. Explanation: Power set is set of all possible subsets. Number of subsets = 2ⁿ. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/sets/mcq10:
    title: "Sets | If A is subset of B, then B is called superset of A - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice sets MCQ: If A is subset of B, then B is called ______ of A. Options: Subset, Superset, Proper subset, Power set. Correct: Superset. Explanation: If A⊆B, then A is subset of B and B is superset of A, denoted B⊇A. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/sets/mcq11:
    title: "Sets | Application of De Morgan's law - (A∪B)' = A' ∩ B' - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice sets MCQ: Which is application of De Morgan's law? Options: A∪(B∩C)=(A∪B)∩(A∪C); (A∪B)'=A'∩B'; A∩(B∪C)=(A∩B)∪(A∩C); A∪B=B∪A. Correct: (A∪B)' = A' ∩ B'. Explanation: De Morgan's laws state complement of union is intersection of complements, and complement of intersection is union of complements. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/sets/mcq12:
    title: "Sets | Injective function definition - f(x₁)=f(x₂) implies x₁=x₂ - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice sets MCQ: Function f: X→Y is injective (one-to-one) if? Options: Every Y has pre-image; Different X have different images; Range equals Y; f(x₁)=f(x₂)⇒x₁=x₂. Correct: f(x₁)=f(x₂) implies x₁=x₂ for all x₁,x₂∈X. Explanation: Injective means distinct domain elements map to distinct codomain elements. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/sets/mcq13:
    title: "Sets | Surjective function definition - every element of Y has at least one pre-image in X - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice sets MCQ: Function f: X→Y is surjective (onto) if? Options: Every X has unique image; Every Y has at least one pre-image in X; Different X have different images; Range is subset of Y. Correct: Every element of Y has at least one pre-image in X. Explanation: Surjective means range equals entire codomain Y. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/sets/mcq14:
    title: "Sets | Into function definition - f(X) ⊂ Y (proper subset) - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice sets MCQ: Function f: X→Y is called 'into' if? Options: f(X)=Y; f(X)⊂Y; f(X)⊆Y; f(X)=X. Correct: f(X) ⊂ Y. Explanation: 'Into' function means range is proper subset of codomain Y, i.e., at least one element in Y not image of any x∈X. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/sets/mcq15:
    title: "Sets | Bijective function is both injective and surjective - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice sets MCQ: Function f: X→Y is called bijective if it is? Options: Both injective and surjective; Either injective or surjective; Neither; Only injective. Correct: Both injective and surjective. Explanation: Bijective means one-to-one correspondence: every Y has exactly one pre-image in X. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/sets/mcq16:
    title: "Sets | If f is bijective then it has inverse, |X|=|Y|, and is one-to-one and onto - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice sets MCQ: If f: X→Y is bijective function, then? Options: f has inverse; |X|=|Y|; f is one-to-one and onto; All of above. Correct: All of the above. Explanation: Bijective function is both injective and onto, has inverse, and |X|=|Y|. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/sets/mcq17:
    title: "Sets | Set of odd positive integers less than 10 is {1,3,5,7,9} - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice sets MCQ: Set O of odd positive integers less than 10 is? Options: {1,2,3}; {1,3,5,7,9}; {1,2,5,9}; {1,5,7,9,11}. Correct: {1,3,5,7,9}. Explanation: Odd positive integers less than 10 are 1,3,5,7,9. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/sets/mcq18:
    title: "Sets | Number of subsets of A={a,b,c} is 8 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice sets MCQ: A={a,b,c}. Number of subsets of set A will be? Options: 4, 6, 8, 12. Correct: 8. Explanation: |A|=3, number of subsets = 2³ = 8. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/sets/mcq19:
    title: "Sets | Number of subsets of A∪B when A={1,2,3}, B={0,4,5} is 64 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice sets MCQ: If A={1,2,3}, B={0,4,5}, find number of subsets of A∪B. Options: 64, 8, 6, 32. Correct: 64. Explanation: A∪B={0,1,2,3,4,5} has 6 elements. Number of subsets = 2⁶ = 64. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/sets/mcq20:
    title: "Sets | A∩B = A∩C will always be true if B=C - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice sets MCQ: A∩B = A∩C will always be true if? Options: B=C; B⊂C; C⊂B; A=∅. Correct: B=C. Explanation: If B=C, then obviously A∩B=A∩C. This guarantees equality for all A. More entry test MCQs at NotesPrep."
https://notesprep.com/entry-tests/mcqs/special-relativity/mcq1:
title: "Special Relativity | Speed of light beam observed from spaceship B when both travel at 0.8c - Entry Test MCQs Explanation | NotesPrep"
description: "Practice special relativity MCQ: Two spaceships A and B travel at 0.8c in same direction. A shines light beam forward toward B. Speed of light beam according to captain on B? Options: 0.2c, 0.8c, 1.8c, 1.6c. Correct: 0.8c. Explanation: Einstein's second postulate states speed of light in vacuum is constant c in all inertial frames, independent of source or observer motion. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/special-relativity/mcq2:
    title: "Special Relativity | Final speed of alpha particle given work done 7.71×10⁻¹⁰ J - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice special relativity MCQ: Alpha particle mass 6.64×10⁻²⁷ kg accelerated from rest with work 7.71×10⁻¹⁰ J. Closest final speed? Options: 0.80c, 0.90c, 0.85c, 0.95c. Correct: 0.90c. Explanation: KE = (γ-1)mc². mc²=5.976×10⁻¹⁰ J, KE/mc²≈1.29, γ=2.29. v/c = √(1-1/γ²)=√(1-1/5.24)=√0.809≈0.90. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/special-relativity/mcq3:
    title: "Special Relativity | Work done accelerating proton from γ=1.05 to γ=1.10 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice special relativity MCQ: Proton rest mass energy 1.50×10⁻¹⁰ J. Work done accelerating from γ=1.05 to γ=1.10? Options: 4.2×10² J, 4.2×10⁹ J, 8.6×10¹⁵ J, 7.5×10⁻¹² J. Correct: 7.5×10⁻¹² J. Explanation: Work = ΔE = (γ₂-γ₁)mc² = (1.10-1.05)×1.50×10⁻¹⁰ = 0.05×1.50×10⁻¹⁰ = 7.5×10⁻¹² J. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/special-relativity/mcq4:
    title: "Special Relativity | Why cannot particles be accelerated to speed of light - kinetic energy approaches infinity - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice special relativity MCQ: Which best explains why impossible to accelerate particles to speed of light? Options: KE tends to infinity; Directly forbidden by Einstein's postulate; Rest mass tends to infinity; Path length increases to infinity. Correct: Kinetic energy of particles tends towards infinite value as they approach light speed. Explanation: Relativistic KE approaches infinity requiring infinite work. Rest mass is invariant. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/special-relativity/mcq5:
    title: "Special Relativity | Which quantity does not depend on observer's motion - speed of light in vacuum - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice special relativity MCQ: According to special relativity, which does not depend on observer's motion? Options: Length, Time interval, Mass, Speed of light in vacuum. Correct: Speed of light in vacuum. Explanation: Einstein's postulate states speed of light in vacuum is constant c in all inertial frames, independent of source or observer motion. Length, time, mass are frame-dependent. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/special-relativity/mcq6:
    title: "Special Relativity | Time measured by meteor to reach planet surface - proper time - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice special relativity MCQ: Best estimate of time measured by meteor to reach planet surface? Options: 1488 μs, 784 μs, 666 μs, 413 μs. Correct: 666 microseconds. Explanation: For relativistic speed, time measured by meteor (proper time) is dilated: t' = t/γ, where γ = 1/√(1-v²/c²). Proper time is shorter than Earth time. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/special-relativity/mcq7:
    title: "Special Relativity | Who measures proper time during meteor descent - only the meteor - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice special relativity MCQ: Which best describes time of meteor's descent as measured by meteor vs planet observers? Options: Only meteor measures proper time; Both measure proper time; Neither measures proper time; Only observers measure proper time. Correct: Only the meteor measures the proper time. Explanation: Proper time is measured in frame where events occur at same spatial location. Meteor is at rest relative to itself, so measures proper time. Planet observers measure dilated time. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/special-relativity/mcq8:
    title: "Special Relativity | Einstein's first postulate - no way to tell how fast you're going without reference - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice special relativity MCQ: Which is closest to Einstein's first postulate? Options: Light always travels at 3×10⁸ m/s; No way to tell how fast you're going unless you see surroundings; Velocities only relative; Absolute velocity relative to Sun. Correct: There is no way to tell how fast you are going unless you can see what's around you. Explanation: Principle of relativity: laws of physics same in all inertial frames. No absolute frame; cannot determine absolute speed without reference. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/special-relativity/mcq9:
    title: "Special Relativity | Lorentz factor γ for speed 0.995c is approximately 10.0 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice special relativity MCQ: Spacecraft travels at 0.995c relative to Earth. What is gamma (Lorentz factor)? Options: γ=1.0, γ=5.0, γ=10.0, γ=20.0. Correct: γ=10.0. Explanation: γ = 1/√(1-v²/c²). v²/c²=0.990025, 1-v²/c²=0.009975, √=0.09987, γ=1/0.09987≈10.01≈10.0. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/special-relativity/mcq10:
    title: "Special Relativity | Time in Earth's frame for spacecraft to reach star 25 light years away at 0.995c - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice special relativity MCQ: Spacecraft travels to star 25 light years away at 0.995c. How long in Earth's frame to reach star? Options: 25.1 yrs, 25.0 yrs, 24.5 yrs, 50 yrs. Correct: 25.1 yrs. Explanation: Time = distance/speed = 25 light years / 0.995c = 25/0.995 ≈ 25.13 years. More entry test MCQs at NotesPrep."
