    description: "Practice synonyms and antonyms MCQ: What is synonym of 'Sonorous'? Options: Quiet, Resonant, Silent, Muffled. Correct: Resonant. Explanation: Sonorous means having full, deep, rich sound. 'Resonant' is synonym. Others are antonyms. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/synonyms-and-antonyms/mcq104:
    title: "Synonyms and Antonyms | Synonym of Epitome - Essence - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice synonyms and antonyms MCQ: What is synonym of 'Epitome'? Options: Essence, Opposite, Contradiction, Antithesis. Correct: Essence. Explanation: Epitome is perfect example of quality. 'Essence' is synonym. Others are antonyms. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/synonyms-and-antonyms/mcq105:
    title: "Synonyms and Antonyms | Synonym of Canny - Astute - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice synonyms and antonyms MCQ: What is synonym of 'Canny'? Options: Foolish, Naive, Astute, Gullible. Correct: Astute. Explanation: Canny means shrewdness and good judgment. 'Astute' is synonym. Others are antonyms. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/synonyms-and-antonyms/mcq106:
    title: "Synonyms and Antonyms | Synonym of Prodigious - Phenomenal - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice synonyms and antonyms MCQ: What is synonym of 'Prodigious'? Options: Ordinary, Average, Unremarkable, Phenomenal. Correct: Phenomenal. Explanation: Prodigious means impressively great. 'Phenomenal' is synonym. Others are antonyms. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/synonyms-and-antonyms/mcq107:
    title: "Synonyms and Antonyms | Synonym of Proletariat - Working class - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice synonyms and antonyms MCQ: What is synonym of 'Proletariat'? Options: Upper class, Working class, Aristocracy, Elite. Correct: Working class. Explanation: Proletariat refers to workers or working-class people. Others refer to wealthy classes. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/synonyms-and-antonyms/mcq108:
    title: "Synonyms and Antonyms | Synonym of Tirade - Rant - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice synonyms and antonyms MCQ: What is synonym of 'Tirade'? Options: Praise, Rant, Compliment, Acclaim. Correct: Rant. Explanation: Tirade is long angry speech of criticism. 'Rant' is synonym. Others are antonyms. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/synonyms-and-antonyms/mcq109:
    title: "Synonyms and Antonyms | Synonym of Ludicrous - Absurd - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice synonyms and antonyms MCQ: What is synonym of 'Ludicrous'? Options: Sensible, Reasonable, Absurd, Logical. Correct: Absurd. Explanation: Ludicrous means so foolish as to be amusing. 'Absurd' is synonym. Others are antonyms. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/synonyms-and-antonyms/mcq110:
    title: "Synonyms and Antonyms | Synonym of Vilify - Defame - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice synonyms and antonyms MCQ: What is synonym of 'Vilify'? Options: Praise, Defame, Commend, Laud. Correct: Defame. Explanation: Vilify means to speak abusively. 'Defame' is synonym. Others are antonyms. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/synonyms-and-antonyms/mcq111:
    title: "Synonyms and Antonyms | Antonym of Resolute - Indecisive - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice synonyms and antonyms MCQ: What is antonym of 'Resolute'? Options: Firm, Determined, Indecisive, Steadfast. Correct: Indecisive. Explanation: Resolute means purposeful and determined. Antonym is 'indecisive' (unable to decide). More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/synonyms-and-antonyms/mcq112:
    title: "Synonyms and Antonyms | Antonym of Incur - Avoid - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice synonyms and antonyms MCQ: What is antonym of 'Incur'? Options: Attract, Avoid, Invite, Experience. Correct: Avoid. Explanation: Incur means to become subject to something unwelcome. Antonym is 'avoid' (keep away from). More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/synonyms-and-antonyms/mcq113:
    title: "Synonyms and Antonyms | Antonym of Cajole - Bully - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice synonyms and antonyms MCQ: What is antonym of 'Cajole'? Options: Coax, Persuade, Wheedle, Bully. Correct: Bully. Explanation: Cajole means to persuade by coaxing or flattery. Antonym is 'bully' (use strength to intimidate). More entry test MCQs at NotesPrep."
    https://notesprep.com/entry-tests/mcqs/trigonometric-functions/mcq1:
    title: "Trigonometric Functions | If sinθ and cosθ are roots of ax²-bx+c=0, relation between a,b,c - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice trigonometric functions MCQ: If sinθ and cosθ are roots of ax²-bx+c=0, relation between a,b,c is? Options: a²+b²+2ac=0; a²-b²+2ac=0; a²+c²+2ab=0; a²-b²-2ac=0. Correct: a²-b²+2ac=0. Explanation: sinθ+cosθ=b/a, sinθcosθ=c/a. (sinθ+cosθ)²=1+2c/a ⇒ b²/a²=1+2c/a ⇒ b²=a²+2ac ⇒ a²-b²+2ac=0. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/trigonometric-functions/mcq2:
    title: "Trigonometric Functions | tan(π/6 + π/4) equals (√3+1)/(√3-1) - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice trigonometric functions MCQ: tan(π/6 + π/4) is equal to? Options: (√3-1)/(√3+1); (√3+1)/(√3-1); (√3+1)/(-√3+1); (√3+1)/(-√3-1). Correct: (√3+1)/(√3-1). Explanation: tan75° = tan(45°+30°) = (1+1/√3)/(1-1/√3) = (√3+1)/(√3-1). More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/trigonometric-functions/mcq3:
    title: "Trigonometric Functions | cos(π-θ) equals -cosθ - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice trigonometric functions MCQ: cos(π-θ) = ? Options: secθ, ±cosθ, cosθ, -cosθ. Correct: -cosθ. Explanation: cos(π-θ) = cosπ cosθ + sinπ sinθ = (-1)cosθ + 0 = -cosθ. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/trigonometric-functions/mcq4:
    title: "Trigonometric Functions | tan(π/2 + θ) equals -cotθ - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice trigonometric functions MCQ: tan(π/2 + θ) = ? Options: cotθ, -cotθ, tanθ, -tanθ. Correct: -cotθ. Explanation: tan(π/2 + θ) = sin(π/2+θ)/cos(π/2+θ) = cosθ/(-sinθ) = -cotθ. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/trigonometric-functions/mcq5:
    title: "Trigonometric Functions | If sinβ=3/5, then cos2β = 7/25 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice trigonometric functions MCQ: If sinβ=3/5, then cos2β = ? Options: -7/5, 7/5, -7/25, 7/25. Correct: 7/25. Explanation: cos2β = 1 - 2sin²β = 1 - 2(9/25) = 1 - 18/25 = 7/25. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/trigonometric-functions/mcq6:
    title: "Trigonometric Functions | cos²3x - sin²3x equals cos6x - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice trigonometric functions MCQ: cos²3x - sin²3x = ? Options: sin6x, cos6x, -sin6x, -cos6x. Correct: cos6x. Explanation: Using double angle identity: cos²A - sin²A = cos2A. Here A=3x, so = cos6x. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/trigonometric-functions/mcq7:
    title: "Trigonometric Functions | (sinx - cosx)² equals 1 - sin2x - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice trigonometric functions MCQ: (sinx - cosx)² = ? Options: 1+sin2x, 1-cos2x, 1-sin2x, 1+cos2x. Correct: 1 - sin2x. Explanation: sin²x + cos²x - 2sinx cosx = 1 - sin2x. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/trigonometric-functions/mcq8:
    title: "Trigonometric Functions | Period of y = sin(4x) is π/2 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice trigonometric functions MCQ: What is period of y = sin(4x)? Options: π/2, π/4, 2π, 4π. Correct: π/2. Explanation: Period of sin(ax) is 2π/|a|. Here a=4, so period = 2π/4 = π/2. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/trigonometric-functions/mcq9:
    title: "Trigonometric Functions | Period of y = tan(x/3) is 3π - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice trigonometric functions MCQ: What is period of y = tan(x/3)? Options: π/3, π, 3π, 6π. Correct: 3π. Explanation: Period of tan(ax) is π/|a|. Here a=1/3, so period = π/(1/3) = 3π. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/trigonometric-functions/mcq10:
    title: "Trigonometric Functions | Period of f(x)=sin x + tan(x/2) is 2π - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice trigonometric functions MCQ: Function f(x)=sin x + tan(x/2) has period? Options: π, 2π, 4π, 6π. Correct: 2π. Explanation: sin x has period 2π, tan(x/2) has period 2π. LCM of periods is 2π. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/trigonometric-functions/mcq11:
    title: "Trigonometric Functions | Exact value of cos15° is (√6+√2)/4 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice trigonometric functions MCQ: Exact value of cos15° without calculator? Options: (√6-√2)/4; (√6+√2)/4; (√3+1)/(2√2); (√3-1)/(2√2). Correct: (√6+√2)/4. Explanation: cos15° = cos(45°-30°) = cos45°cos30°+sin45°sin30° = (√2/2)(√3/2)+(√2/2)(1/2) = (√6+√2)/4. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/trigonometric-functions/mcq12:
    title: "Trigonometric Functions | sin(α + π/2) equals cosα - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice trigonometric functions MCQ: sin(α + π/2) = ? Options: sinα, -sinα, cosα, -cosα. Correct: cosα. Explanation: sin(α+π/2) = sinα cos(π/2) + cosα sin(π/2) = sinα(0) + cosα(1) = cosα. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/trigonometric-functions/mcq13:
    title: "Trigonometric Functions | π radians equals 180° - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice trigonometric functions MCQ: π radians = ? Options: 60°, 90°, 360°, 180°. Correct: 180°. Explanation: By definition, π radians equals 180 degrees. Fundamental conversion between radians and degrees. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/trigonometric-functions/mcq14:
    title: "Trigonometric Functions | Even function among options - x²+5 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice trigonometric functions MCQ: Which function is even? Options: x³, sin x, x²+5, x³+1. Correct: x²+5. Explanation: Even function satisfies f(-x)=f(x). (-x)²+5 = x²+5. Others fail: (-x)³ = -x³, sin(-x) = -sin x, (-x)³+1 = -x³+1. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/trigonometric-functions/mcq15:
    title: "Trigonometric Functions | Odd function among options - x³+x - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice trigonometric functions MCQ: Which function is odd? Options: x³+x, cos x, x², 5. Correct: x³+x. Explanation: Odd function satisfies f(-x) = -f(x). (-x)³+(-x) = -x³-x = -(x³+x). Others fail: cos(-x)=cos x, (-x)²=x², constant is even. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/trigonometric-functions/mcq16:
    title: "Trigonometric Functions | f(x)=x/(x²+1) is odd function - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice trigonometric functions MCQ: Determine if f(x)=x/(x²+1) is odd, even, or neither. Options: Even, Odd, Neither, Both. Correct: Odd. Explanation: f(-x)=(-x)/((-x)²+1) = -x/(x²+1) = -f(x). Since f(-x)=-f(x), function is odd. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/trigonometric-functions/mcq17:
    title: "Trigonometric Functions | Odd function graph has origin symmetry - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice trigonometric functions MCQ: If function is odd, what type of symmetry does its graph have? Options: y-axis, x-axis, Origin, Line y=x. Correct: Origin. Explanation: Odd functions have symmetry about origin: if (a,b) on graph, then (-a,-b) also on graph. Even functions have y-axis symmetry. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/trigonometric-functions/mcq18:
    title: "Trigonometric Functions | f(x)=x³-4x²+5 is neither even nor odd - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice trigonometric functions MCQ: f(x)=x³-4x²+5 is? Options: Even, Odd, Neither, Both. Correct: Neither. Explanation: f(-x) = -x³-4x²+5. Not equal to f(x) (not even) and not equal to -f(x) = -x³+4x²-5 (not odd). So neither. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/trigonometric-functions/mcq19:
    title: "Trigonometric Functions | Express 3sinθ+4cosθ as 5sin(θ+tan⁻¹(4/3)) - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice trigonometric functions MCQ: Express 3sinθ+4cosθ in form r sin(θ+φ). Options: 5sin(θ+tan⁻¹(4/3)); 5sin(θ+tan⁻¹(3/4)); 5sin(θ+sin⁻¹(4/5)); 5sin(θ+cos⁻¹(3/5)). Correct: 5sin(θ+tan⁻¹(4/3)). Explanation: r=√(3²+4²)=5, φ=tan⁻¹(b/a)=tan⁻¹(4/3). So =5sin(θ+tan⁻¹(4/3)). More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/trigonometric-functions/mcq20:
    title: "Trigonometric Functions | cos105° + sin105° equals 1/√2 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice trigonometric functions MCQ: cos105° + sin105° = ? Options: 1/2, 1, √2, 1/√2. Correct: 1/√2. Explanation: cos105° = (1-√3)/(2√2), sin105° = (√3+1)/(2√2). Sum = 2/(2√2)=1/√2. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/trigonometric-functions/mcq21:
    title: "Trigonometric Functions | Reference angle of θ in 4th quadrant is 2π-θ - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice trigonometric functions MCQ: If θ lies in 4th quadrant, reference angle of θ is? Options: 2π+θ, 2π-θ, θ-π, π/2-θ. Correct: 2π - θ. Explanation: In 4th quadrant, reference angle is difference between full rotation and angle: 2π-θ. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/trigonometric-functions/mcq22:
    title: "Trigonometric Functions | sin75° equals (√3+1)/(2√2) - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice trigonometric functions MCQ: sin75° = ? Options: (√3+1)/√8, (√3+1)/(2√2), √2/(√3+1), Impossible. Correct: (√3+1)/(2√2). Explanation: sin75° = sin(45°+30°) = sin45cos30+cos45sin30 = (1/√2)(√3/2)+(1/√2)(1/2) = (√3+1)/(2√2). More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/trigonometric-functions/mcq23:
    title: "Trigonometric Functions | √[(1-sinθ)/(1+sinθ)] equals secθ - tanθ - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice trigonometric functions MCQ: Value of √[(1-sinθ)/(1+sinθ)] is? Options: secθ-tanθ, secθ+tanθ, cscθ-cotθ, cscθ+cotθ. Correct: secθ - tanθ. Explanation: √[(1-sinθ)²/(1-sin²θ)] = (1-sinθ)/cosθ = secθ - tanθ. More entry test MCQs at NotesPrep."
    https://notesprep.com/entry-tests/mcqs/understanding-the-context/mcq1:
    title: "Understanding the Context | Amazon rainforest oxygen production - net contribution near zero due to nighttime respiration - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice understanding the context MCQ: Amazon rainforest produces 20% of world's oxygen. Which statement best summarizes? Options include correct nuance about net contribution near zero due to nighttime respiration. Correct: The Amazon produces 20% of world's oxygen, but recent studies show its net contribution may be near zero due to nighttime respiration. Explanation: Option 1 omits net contribution detail. Option 3 incorrectly places Amazon in Africa. Option 4 contradicts paragraph. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/understanding-the-context/mcq2:
    title: "Understanding the Context | Treaty of Versailles ended WWI in 1919, imposed reparations, signed at Palace of Versailles - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice understanding the context MCQ: Treaty of Versailles ended WWI in 1919, imposed heavy reparations on Germany, and was signed at Palace of Versailles. Which statement best summarizes? Correct: Treaty ended WWI in 1919, imposed heavy reparations on Germany, and was signed at Palace of Versailles. Explanation: Option 1 says all historians agree prevented future wars (false). Option 3 says signed in Berlin (false). Option 4 uses 'unanimously' (paragraph says 'many historians'). More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/understanding-the-context/mcq3:
    title: "Understanding the Context | Blockchain technology - decentralized ledger where recorded data cannot be altered without changing subsequent blocks - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice understanding the context MCQ: Blockchain is decentralized digital ledger that records transactions across many computers. Recorded data cannot be altered without changing subsequent blocks. Which statement best summarizes? Correct: Blockchain is decentralized ledger where recorded data cannot be altered without changing subsequent blocks, first implemented by Bitcoin in 2009. Explanation: Option 1 says centralized and easily altered (contradicts). Option 2 says exclusively for cryptocurrency (paragraph says applications extend beyond). Option 3 says only for supply chain (paragraph mentions multiple applications). More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/understanding-the-context/mcq4:
    title: "Understanding the Context | Human brain - 86 billion neurons, neuroplasticity allows reorganization throughout life - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice understanding the context MCQ: Human brain has 86 billion neurons, each forming thousands of connections. Neuroplasticity allows brain to reorganize throughout life. Which statement best summarizes? Correct: Human brain has 86 billion neurons that form connections, and neuroplasticity allows reorganization throughout life. Explanation: Option 1 says brain stops generating new neurons after childhood (contradicts neurogenesis). Option 2 incorrectly places neurogenesis in cerebellum (paragraph says hippocampus). Option 3 contradicts neuroplasticity. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/understanding-the-context/mcq5:
    title: "Understanding the Context | Doppler effect - change in wave frequency due to relative motion, applies to sound and light - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice understanding the context MCQ: Doppler effect describes change in frequency of wave relative to observer moving relative to wave source. Applies to all waves including sound and light. Which statement best summarizes? Correct: Doppler effect is change in wave frequency due to relative motion, applying to sound and light, with redshift showing universal expansion. Explanation: Options 1 and 3 incorrectly limit to sound only. Option 2 reverses pitch change. Option 0 is accurate. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/understanding-the-context/mcq6:
    title: "Understanding the Context | Leonardo da Vinci - painted Mona Lisa and Last Supper, dissected over 30 corpses, many scientific works unpublished - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice understanding the context MCQ: Leonardo da Vinci painted Mona Lisa and The Last Supper, dissected over 30 human corpses for anatomical studies, but many scientific works remained unpublished. Which statement best summarizes? Correct: Leonardo da Vinci painted Mona Lisa and The Last Supper, dissected over 30 corpses for anatomical studies, but many scientific works remained unpublished. Explanation: Option 1 says primarily scientist with minor paintings (contradicts). Option 3 says never conducted scientific research (contradicts). Option 2 says all works published immediately (contradicts). More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/understanding-the-context/mcq7:
    title: "Understanding the Context | Plate tectonics - explains geological activity, accepted in 1960s after seafloor spreading evidence - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice understanding the context MCQ: Plate tectonics explains Earth's lithosphere divided into plates that move, causing earthquakes, volcanic eruptions. Theory accepted in 1960s after seafloor spreading evidence confirmed Wegener's earlier hypothesis. Which statement best summarizes? Correct: Plate tectonics explains geological activity and was accepted in 1960s after seafloor spreading evidence confirmed Wegener's earlier continental drift hypothesis. Explanation: Option 1 incorrectly says Wegener proposed theory in 1960s. Option 2 says plates never cause earthquakes (contradicts). Option 3 says theory rejected and unproven (contradicts). More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/understanding-the-context/mcq8:
    title: "Understanding the Context | Osmosis - solvent moves from lower to higher solute concentration, reverse osmosis requires pressure for water purification - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice understanding the context MCQ: Osmosis is movement of solvent from area of lower solute concentration to higher solute concentration until equilibrium. Reverse osmosis applies pressure to force solvent from high to low concentration for water purification. Which statement best summarizes? Correct: Osmosis moves solvent from lower to higher solute concentration, and reverse osmosis uses pressure to purify water. Explanation: Option 1 incorrectly says higher to lower solute. Option 2 incorrectly says reverse osmosis needs no pressure. Option 3 contradicts that osmosis is critical for plants. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/understanding-the-context/mcq9:
    title: "Understanding the Context | Artificial intelligence - mimics human cognition, machine learning improves from experience, deep learning uses neural networks - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice understanding the context MCQ: AI refers to machines designed to mimic human cognitive functions. Machine learning enables systems to improve from experience without explicit programming. Deep learning uses neural networks with multiple layers. Critics cite ethical concerns. Which statement best summarizes? Correct: AI mimics human cognition; machine learning improves from experience; deep learning uses neural networks; critics cite ethical concerns and job displacement. Explanation: Option 1 says AI fully replicates consciousness (contradicts). Option 2 says AI only capable of image recognition (contradicts). Option 3 says machine learning requires explicit programming (contradicts definition). More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/understanding-the-context/mcq10:
    title: "Understanding the Context | French Revolution - began 1789 with Bastille, led to Reign of Terror, ended with Napoleon seizing power in 1799 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice understanding the context MCQ: French Revolution began in 1789 with storming of Bastille. Abolished monarchy, established republic, led to Reign of Terror under Robespierre. Napoleon seized power in 1799. Which statement best summarizes? Correct: French Revolution began with storming of Bastille in 1789, led to Reign of Terror, and ended with Napoleon seizing power in 1799. Explanation: Option 1 says immediately created stable institutions (contradicts political instability). Option 2 says ended immediately without violence (contradicts Reign of Terror). Option 3 incorrectly dates Napoleon's rise to 1789. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/understanding-the-context/mcq11:
    title: "Understanding the Context | Heisenberg uncertainty principle - position and momentum cannot both be precisely known, fundamental quantum property formulated in 1927 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice understanding the context MCQ: Heisenberg uncertainty principle states more precisely position determined, less precisely momentum known, vice versa. This is fundamental property, not measurement limitation. Formulated in 1927. Which statement best summarizes? Correct: Uncertainty principle states that position and momentum cannot both be precisely known simultaneously, formulated by Heisenberg in 1927 as a fundamental quantum property. Explanation: Option 1 says technological limitation (contradicts). Option 2 says applies only to position/momentum (contradicts energy/time application). Option 3 says proves classical determinism correct (contradicts challenging determinism). More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/understanding-the-context/mcq12:
    title: "Understanding the Context | Photosynthesis - two stages: light reactions in thylakoids produce ATP/NADPH, Calvin cycle in stroma fixes CO₂ into glucose - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice understanding the context MCQ: Photosynthesis occurs in chloroplasts with two main stages: light-dependent reactions in thylakoid membranes produce ATP and NADPH while releasing oxygen; Calvin cycle in stroma uses ATP and NADPH to fix CO₂ into glucose. Which statement best summarizes? Correct: Photosynthesis has two stages: light reactions in thylakoids producing ATP/NADPH, and Calvin cycle in stroma fixing CO₂ into glucose. Explanation: Option 1 says only occurs in C4 plants (contradicts). Option 2 reverses stages. Option 3 says C4 less efficient in all conditions (contradicts efficiency in hot, dry conditions). More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/understanding-the-context/mcq13:
    title: "Understanding the Context | Cold War - period of tension 1947-1991 between US and Soviet Union, characterized by proxy wars and arms races - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice understanding the context MCQ: Cold War was period of geopolitical tension between US and Soviet Union from 1947 to 1991. Characterized by ideological conflict, nuclear arms races, proxy wars in Korea and Vietnam, space competition. Ended with dissolution of Soviet Union in 1991. Which statement best summarizes? Correct: Cold War was period of tension from 1947-1991 between US and Soviet Union, characterized by proxy wars and arms races, ending with Soviet dissolution. Explanation: Option 1 says historians agree no new tensions (contradicts 'new Cold War' debate). Option 2 says direct military conflict occurred (contradicts no direct conflict). Option 3 limits to space exploration with wrong end date. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/understanding-the-context/mcq14:
    title: "Understanding the Context | Climate change - human activities dominant driver since Industrial Revolution, 45% emission reduction by 2030 needed - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice understanding the context MCQ: Climate change refers to long-term shifts in temperatures. Scientific consensus confirms human activities since Industrial Revolution are dominant driver. IPCC reports limiting warming to 1.5°C requires 45% emission reduction by 2030 and net zero by 2050. Which statement best summarizes? Correct: Human activities are dominant driver of climate change since Industrial Revolution, requiring 45% emission reduction by 2030 to limit warming to 1.5°C. Explanation: Option 1 says caused entirely by natural processes (contradicts consensus). Option 2 says increase emissions (contradicts reduction). Option 3 says effects limited to melting ice caps (contradicts extreme weather and ocean acidification). More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/understanding-the-context/mcq15:
    title: "Understanding the Context | Scientific method - involves observation, hypothesis, experimentation, conclusion; reproducibility and peer review important - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice understanding the context MCQ: Scientific method is empirical process involving observation, hypothesis formation, experimentation, and conclusion. Reproducibility and peer review are important. Recent replication crisis has prompted reforms. Which statement best summarizes? Correct: Scientific method involves observation, hypothesis, experimentation, and conclusion; reproducibility and peer review are important, but replication failures have prompted reforms. Explanation: Option 1 says strictly linear never revisiting steps (contradicts non-linear nature). Option 2 says peer review guarantees reproducibility (contradicts replication crisis). Option 3 says requires no experimentation (contradicts). More entry test MCQs at NotesPrep."
    https://notesprep.com/entry-tests/mcqs/vectors/mcq1:
    title: "Vectors | If x²/|x|² + y²/|y|² + z²/|z|² = 1 then cos²α+cos²β+cos²γ = 1 and sin²α+sin²β+sin²γ = 2 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice vectors MCQ: If x²/|x|² + y²/|y|² + z²/|z|² = 1, which is true? Options include cos²α+cos²β+cos²γ=1 and sin²α+sin²β+sin²γ=2. Correct: Both (a) and (b). Explanation: x²/|x|² = cos²α etc., so cos²α+cos²β+cos²γ=1. Using identity gives sin²α+sin²β+sin²γ=2. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/vectors/mcq2:
    title: "Vectors | Unit vector coplanar with i-j and i+2j perpendicular to first is ±(i+j)/√2 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice vectors MCQ: Given vectors i-j and i+2j, unit vector coplanar with them and perpendicular to first is? Options: ±(i-j)/√2, ±(2i+j)/√5, ±(i+j)/√2, ±(i+2j)/√5. Correct: ±(i+j)/√2. Explanation: Let v=xi+yj. v·(i-j)=0 ⇒ x=y. Unit vector ⇒ 2x²=1 ⇒ x=±1/√2, y=±1/√2 ⇒ v=±(i+j)/√2. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/vectors/mcq3:
    title: "Vectors | i·(j×k) equals 1 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice vectors MCQ: Value of i·(j×k) is? Options: 0, 1, -1, i. Correct: 1. Explanation: j×k = i, so i·(j×k) = i·i = |i|² = 1. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/vectors/mcq4:
    title: "Vectors | Area of triangle formed by vectors a and b is ½|a×b| - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice vectors MCQ: Area of triangle formed by vectors a and b is given by? Options: ½|a×b|, |a×b|, ½(a·b), ½|a||b|. Correct: ½|a×b|. Explanation: Area of triangle = ½ × base × height = ½|a||b|sinθ = ½|a×b|. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/vectors/mcq5:
    title: "Vectors | Find vector b given a×b=c and a·b=3 with a=i-2j+3k, c=i+j-k - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice vectors MCQ: Find b such that a×b=c and a·b=3, where a=i-2j+3k, c=i+j-k. Options: (5i+10j+5k)/7, (5i+10j-5k)/7, (5i-10j+5k)/7, (-5i+10j+5k)/7. Correct: (5i+10j+5k)/7. Explanation: Let b=xi+yj+zk. a·b=x-2y+3z=3. a×b gives three equations. Solving yields x=5/7, y=10/7, z=5/7. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/vectors/mcq6:
    title: "Vectors | i×(j×k) equals 0 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice vectors MCQ: Compute i×(j×k). Options: 1, -1, 0, None. Correct: 0. Explanation: j×k = i, then i×i = 0. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/vectors/mcq7:
    title: "Vectors | If |a|=2, |b|=5, |a×b|=8 then a·b = 6 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice vectors MCQ: If |a|=2, |b|=5 and |a×b|=8, then a·b is? Options: 6, 8, 10, 12. Correct: 6. Explanation: Using Lagrange's identity: |a×b|² = |a|²|b|² - (a·b)² ⇒ 64 = 100 - (a·b)² ⇒ (a·b)² = 36 ⇒ a·b = ±6. Taking positive gives 6. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/vectors/mcq8:
    title: "Vectors | If a·b=0 and a×b=0 then a=0 or b=0 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice vectors MCQ: If a·b=0 and a×b=0, then? Options: a,b perpendicular; a,b parallel; a=0 or b=0; a,b unit vectors. Correct: a=0 or b=0. Explanation: a·b=0 means either perpendicular or one zero. a×b=0 means either parallel or one zero. Both conditions simultaneously imply a=0 or b=0. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/vectors/mcq9:
    title: "Vectors | Direction angles 60°,60°,45° satisfy cos²α+cos²β+cos²γ=1 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice vectors MCQ: Which set can be direction angles of a vector? Options: 60°,45°,90°; 45°,45°,45°; 60°,30°,30°; 60°,60°,45°. Correct: 60°,60°,45°. Explanation: For direction angles, cos²α+cos²β+cos²γ=1. Check: cos²60°=1/4, cos²45°=1/2. Sum=1/4+1/4+1/2=1. Only option D satisfies. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/vectors/mcq10:
    title: "Vectors | Angle between a=2i-j+k and b=-i+j is 5π/6 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice vectors MCQ: Find angle between a=2i-j+k and b=-i+j. Options: 2π/3, 3π/4, 5π/6, π/2. Correct: 5π/6. Explanation: a·b=-3, |a|=√6, |b|=√2. cosθ = -3/√12 = -√3/2 ⇒ θ=5π/6. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/vectors/mcq11:
    title: "Vectors | Find |u| if v is unit vector and (u-v)·(u+v)=18 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice vectors MCQ: Find |u| if v is unit vector and (u-v)·(u+v)=18. Options: √17, √18, √19, √20. Correct: √19. Explanation: (u-v)·(u+v) = |u|² - |v|² = 18. |v|²=1 ⇒ |u|²=19 ⇒ |u|=√19. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/vectors/mcq12:
    title: "Vectors | Two equal vectors are always collinear - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice vectors MCQ: Which statement is true? Options: Two equal vectors always collinear; Two collinear vectors always equal magnitude; Two collinear vectors same magnitude are equal; Two vectors same magnitude are collinear. Correct: Two equal vectors are always collinear. Explanation: Equal vectors have same magnitude and direction, so they are collinear. Other statements are false. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/vectors/mcq13:
    title: "Vectors | i·(j×k) + j·(i×k) + k·(i×j) equals 1 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice vectors MCQ: Value of i·(j×k) + j·(i×k) + k·(i×j) is? Options: 0, -1, 1, 3. Correct: 1. Explanation: j×k=i, i×k=-j, i×j=k. So = i·i + j·(-j) + k·k = 1 -1 + 1 = 1. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/vectors/mcq14:
    title: "Vectors | a+b is unit vector if angle between unit vectors a,b is 2π/3 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice vectors MCQ: Let a,b be unit vectors with angle θ. a+b is unit vector if? Options: θ=π/4, π/3, π/2, 2π/3. Correct: θ=2π/3. Explanation: |a+b|²=2+2cosθ=1 ⇒ cosθ=-1/2 ⇒ θ=2π/3. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/vectors/mcq15:
    title: "Vectors | a+b and a-b are perpendicular for a=i+j-k, b=i-j+k - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice vectors MCQ: If a=i+j-k and b=i-j+k, then a+b and a-b are? Options: Parallel, Perpendicular, Equal, None. Correct: Perpendicular. Explanation: a+b=2i, a-b=2j-2k. Dot product = 0, so perpendicular. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/vectors/mcq16:
    title: "Vectors | |a+b| when |a|=2, |b|=3, a·b=4 equals √21 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice vectors MCQ: |a|=2, |b|=3, a·b=4, then |a+b| = ? Options: 1, √13, √21, Not possible. Correct: √21. Explanation: |a+b|² = 4+9+2(4)=21 ⇒ |a+b|=√21. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/vectors/mcq17:
    title: "Vectors | Three non-zero vectors a,b,c are coplanar iff scalar triple product = 0 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice vectors MCQ: Three non-zero vectors a,b,c are coplanar iff? Options: a·(b×c)=0; b·(c×a)=0; c·(a×b)=0; All of these. Correct: All of these. Explanation: Scalar triple product is zero iff vectors coplanar. Due to cyclic property, all three are equal. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/vectors/mcq18:
    title: "Vectors | Volume of tetrahedron = 1/6 × volume of parallelepiped - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice vectors MCQ: Volume of tetrahedron = (1/6)(---). Options: Volume of cylinder, Volume of parallelepiped, Volume of cube, Volume of sphere. Correct: Volume of parallelepiped. Explanation: V_tetra = 1/6 |a·(b×c)| = 1/6 (Volume of parallelepiped). More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/vectors/mcq19:
    title: "Vectors | Scalar triple product of vectors a,b,c is a·(b×c) - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice vectors MCQ: Which is scalar triple product of vectors a,b,c? Options: a·(b·c); a×(b·c); a·(b×c); a×(b×c). Correct: a·(b×c). Explanation: Scalar triple product is defined as a·(b×c), yielding a scalar representing volume of parallelepiped. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/vectors/mcq20:
    title: "Vectors | If scalar product of two non-zero vectors is zero, magnitude of vector product is AB - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice vectors MCQ: If scalar product of non-zero vectors A,B is zero, magnitude of vector product is? Options: AB, Zero, AB sinθ, AB cosθ. Correct: AB. Explanation: A·B=0 ⇒ θ=90°. Then |A×B| = AB sin90° = AB. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/vectors/mcq21:
    title: "Vectors | If m+n and p+q are parallel then m/p = n/q - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice vectors MCQ: If vectors m+n and p+q are parallel then? Options: m=p,n=q; m+n=p+q; m/p=n/q; None. Correct: m/p = n/q. Explanation: m+n = k(p+q) implies m=kp and n=kq, so m/p=n/q=k. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/vectors/mcq22:
    title: "Vectors | Projection of a=i+3j-k on b=-i+2j+k is 4/√6 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice vectors MCQ: Projection of a=i+3j-k on b=-i+2j+k is? Options: 4/√6, 1/√6, 2/√6, None. Correct: 4/√6. Explanation: Projection = (a·b)/|b| = [ -1+6-1 ]/√6 = 4/√6. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/vectors/mcq23:
    title: "Vectors | Angle θ between non-zero vectors a,b is obtuse if a·b < 0 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice vectors MCQ: Angle θ between non-zero vectors a,b is obtuse if? Options: a·b>0, a·b<0, a·b=0, None. Correct: a·b<0. Explanation: cosθ = (a·b)/(|a||b|). Obtuse angle ⇒ cosθ<0 ⇒ a·b<0. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/vectors/mcq24:
    title: "Vectors | Speed of vector function v=2i-3j+4k is √29 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice vectors MCQ: Speed of vector function v=2i-3j+4k is? Options: 5, 29, 1, √29. Correct: √29. Explanation: Speed = magnitude = √(2²+(-3)²+4²) = √(4+9+16) = √29. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/vectors/mcq25:
    title: "Vectors | Unit vector orthogonal to both a and b is (a×b)/|a×b| - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice vectors MCQ: Let n be unit vector orthogonal to both a and b, then n = ? Options: a×b; a·b; (a×b)/|a×b|; (a·b)/|a·b|. Correct: (a×b)/|a×b|. Explanation: Cross product gives vector orthogonal to both. Divide by magnitude for unit vector. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/vectors/mcq26:
    title: "Vectors | Find m such that angle between a=mi+j-k and b=i+mj-k is π/3 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice vectors MCQ: For what m is angle between a=mi+j-k and b=i+mj-k equal to π/3? Options: 1, 1/4, 0, 2. Correct: 0. Explanation: cosθ=1/2 = (a·b)/(|a||b|) = (2m+1)/(m²+2). Solve: 4m+2=m²+2 ⇒ m²-4m=0 ⇒ m=0 or 4. Since 0 is option, answer is 0. More entry test MCQs at NotesPrep."
    https://notesprep.com/entry-tests/mcqs/vectors-and-equilibrium/mcq1:
    title: "Vectors and Equilibrium | Maximum resultant of two forces 10N and 7N is 17N - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice vectors and equilibrium MCQ: Two forces of 10N and 7N applied to object. Maximum value of their resultant is? Options: 17N, 10N, 70N, 7N. Correct: 17N. Explanation: Maximum resultant occurs when forces act in same direction: R_max = F₁+F₂ = 10+7=17N. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/vectors-and-equilibrium/mcq2:
    title: "Vectors and Equilibrium | Scalar product of two vectors is negative when they are anti-parallel - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice vectors and equilibrium MCQ: Scalar product of two vectors is negative when? Options: They are parallel; They are anti-parallel; They are perpendicular; They are rotated through 180°. Correct: They are anti-parallel. Explanation: A·B = |A||B|cosθ. For anti-parallel (θ=180°), cos180°=-1, so dot product negative. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/vectors-and-equilibrium/mcq3:
    title: "Vectors and Equilibrium | Resultant of two equal forces F and F is F when angle between them is 120° - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice vectors and equilibrium MCQ: Magnitude of resultant of two equal forces F and F is F when inclined at angle? Options: 0°, 120°, 90°, 180°. Correct: 120°. Explanation: R = 2F|cos(θ/2)|. Set R=F ⇒ |cos(θ/2)|=1/2 ⇒ θ/2=60° ⇒ θ=120°. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/vectors-and-equilibrium/mcq4:
    title: "Vectors and Equilibrium | Multiplying vector by negative number greater than one changes magnitude and direction - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice vectors and equilibrium MCQ: When vector multiplied by negative number greater than one, change in? Options: Magnitude only; Direction only; Magnitude and direction; None. Correct: Its magnitude and direction. Explanation: Magnitude increases (|k|>1) and direction reverses (negative sign). Both change. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/vectors-and-equilibrium/mcq5:
    title: "Vectors and Equilibrium | Dot product of force and velocity equals power - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice vectors and equilibrium MCQ: Dot product of force and velocity vectors equals? Options: Work done, Potential energy, Power, All of these. Correct: Power. Explanation: Power = F·v = Fv cosθ. Instantaneous power is dot product of force and velocity. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/vectors-and-equilibrium/mcq6:
    title: "Vectors and Equilibrium | Torque is cross product of force and moment arm - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice vectors and equilibrium MCQ: Torque is cross product of? Options: Force and Velocity; Force and moment arm; mass and acceleration; Power and time. Correct: Force and moment arm. Explanation: Torque τ = r × F, where r is position vector (moment arm) from axis to point of force application. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/vectors-and-equilibrium/mcq7:
    title: "Vectors and Equilibrium | Magnitude of cross product equals area of parallelogram - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice vectors and equilibrium MCQ: Magnitude of cross product of two vectors equals? Options: Area of triangle; Area of square; Area of parallelogram; Perimeter of rectangle. Correct: Area of parallelogram. Explanation: |A×B| = |A||B|sinθ, which represents area of parallelogram formed by vectors A and B. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/vectors-and-equilibrium/mcq8:
    title: "Vectors and Equilibrium | Which is vector quantity - displacement - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice vectors and equilibrium MCQ: Which is vector quantity? Options: Energy, Time, Displacement, Distance. Correct: Displacement. Explanation: Displacement has both magnitude and direction. Energy, time, distance are scalars. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/vectors-and-equilibrium/mcq9:
    title: "Vectors and Equilibrium | j × i equals -k - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice vectors and equilibrium MCQ: j × i = ? Options: 1, 0, k, -k. Correct: -k. Explanation: Using right-hand rule cyclic order: j × i = -(i × j) = -k. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/vectors-and-equilibrium/mcq10:
    title: "Vectors and Equilibrium | i · i equals 1 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice vectors and equilibrium MCQ: If i is unit vector along x-axis, then i·i = ? Options: 0, 1, -1, j. Correct: 1. Explanation: Dot product of unit vector with itself = 1 (since cos0°=1, magnitude=1). More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/vectors-and-equilibrium/mcq11:
    title: "Vectors and Equilibrium | Position vector of point (2,-1,3) is 2i - j + 3k - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice vectors and equilibrium MCQ: Position of point is (2,-1,3), position vector is? Options: 2i+j+3k; 2j-i+3k; 2k-j+3i; 2i-j+3k. Correct: 2i - j + 3k. Explanation: Position vector = xi + yj + zk = 2i - j + 3k. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/vectors-and-equilibrium/mcq12:
    title: "Vectors and Equilibrium | Cross product obeys anti-commutative law of multiplication - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice vectors and equilibrium MCQ: Cross product obeys? Options: Commutative law of addition; Anti-commutative law of addition; Commutative law of multiplication; Anti-commutative law of multiplication. Correct: Anti-commutative law of multiplication. Explanation: A × B = -(B × A), so anti-commutative. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/vectors-and-equilibrium/mcq13:
    title: "Vectors and Equilibrium | Self product A·A equals |A|² - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice vectors and equilibrium MCQ: For self product A·A = ? Options: 0, 1, -1, |A|². Correct: |A|². Explanation: A·A = |A||A|cos0° = |A|². More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/vectors-and-equilibrium/mcq14:
    title: "Vectors and Equilibrium | Vector with magnitude zero is called null vector - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice vectors and equilibrium MCQ: Vector whose magnitude is zero is called? Options: Position vector, Free Vector, Null vector, Unit vector. Correct: Null vector. Explanation: Null vector (zero vector) has magnitude zero and no specific direction. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/vectors-and-equilibrium/mcq15:
    title: "Vectors and Equilibrium | If vector of 10N is along x-axis, y component is 0N - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice vectors and equilibrium MCQ: If vector of 10N is along x-axis, its y component will be? Options: 10N, 0N, 100N, 5N. Correct: 0N. Explanation: Vector along x-axis has no component along y-axis, so y-component=0N. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/vectors-and-equilibrium/mcq16:
    title: "Vectors and Equilibrium | Work done by F=2i-3j+4k and r=i+4j+5k is 10J - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice vectors and equilibrium MCQ: F=2i-3j+4k, r=i+4j+5k, work done is? Options: 22J, 10J, 12J, 0J. Correct: 10J. Explanation: W = F·r = (2)(1)+(-3)(4)+(4)(5)=2-12+20=10J. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/vectors-and-equilibrium/mcq17:
    title: "Vectors and Equilibrium | If A·B=0 then vectors are perpendicular - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice vectors and equilibrium MCQ: If A·B=0, then vectors A and B are? Options: Parallel; Anti-parallel; Perpendicular; None. Correct: Perpendicular to each other. Explanation: A·B = |A||B|cosθ=0 ⇒ cosθ=0 ⇒ θ=90°. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/vectors-and-equilibrium/mcq18:
    title: "Vectors and Equilibrium | Resultant of 3N and 4N at right angles is 5N - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice vectors and equilibrium MCQ: Resultant of 3N and 4N forces acting at right angles? Options: 90N, 5N, 7N, 1N. Correct: 5N. Explanation: For perpendicular vectors, R = √(F₁²+F₂²)=√(9+16)=5N. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/vectors-and-equilibrium/mcq19:
    title: "Vectors and Equilibrium | If A×B is along z-axis then vectors A and B lie in xy plane - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice vectors and equilibrium MCQ: If A×B is along z-axis then vectors A and B will lie in? Options: xz plane, xy plane, yz plane, none. Correct: xy plane. Explanation: Cross product perpendicular to both vectors. If along z-axis, both vectors must lie in xy-plane. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/vectors-and-equilibrium/mcq20:
    title: "Vectors and Equilibrium | Parallel vectors of same magnitude are equal - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice vectors and equilibrium MCQ: Parallel vectors of same magnitude? Options: equal; unequal; when added give sum zero; when multiplied give sum zero. Correct: equal. Explanation: Parallel vectors with same magnitude and same direction are equal vectors. If anti-parallel, they are negatives. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/vectors-and-equilibrium/mcq21:
    title: "Vectors and Equilibrium | Angle between components when magnitude of two components equals resultant is 120° - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice vectors and equilibrium MCQ: When magnitude of two components equal to that of resultant, angle between components is? Options: 60°, 90°, 120°, none. Correct: 120°. Explanation: R²=2F²(1+cosθ). Set R=F ⇒ 1=2(1+cosθ) ⇒ cosθ=-1/2 ⇒ θ=120°. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/vectors-and-equilibrium/mcq22:
    title: "Vectors and Equilibrium | Resultant of two unit vectors at 90° is √2 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice vectors and equilibrium MCQ: Two unit vectors inclined at 90°, magnitude of resultant is? Options: 2, √2, √3, 0. Correct: √2. Explanation: R = √(1+1+2·1·1·cos90°) = √2. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/vectors-and-equilibrium/mcq23:
    title: "Vectors and Equilibrium | Position vector of point (3,2,5) is 3i+2j+5k - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice vectors and equilibrium MCQ: Position of particle in rectangular coordinate system is (3,2,5). Position vector is? Options: 3i+2j+5k; 3i-2j-5k; 5i+2j+3k; 2i+5j+3k. Correct: 3i+2j+5k. Explanation: Position vector = xi + yj + zk = 3i+2j+5k. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/vectors-and-equilibrium/mcq24:
    title: "Vectors and Equilibrium | Displacement from P(2,3,5) to Q(3,4,5) is i+j - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice vectors and equilibrium MCQ: Displacement vector from P(2,3,5) to Q(3,4,5) is? Options: i+j+5k; 2i+4j+6k; i+j; i+j+10k. Correct: i+j. Explanation: Displacement = Q-P = (3-2)i+(4-3)j+(5-5)k = i+j. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/vectors-and-equilibrium/mcq25:
    title: "Vectors and Equilibrium | Vertical component of 5N force at 60° with horizontal is 4.33N - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice vectors and equilibrium MCQ: Vertical component of force 5N acting along direction making 60° with horizontal is? Options: 3N, 2.5N, 0N, 4N. Correct: 2.5N. Explanation: If angle with vertical, vertical component = Fcos60°=5×0.5=2.5N. With horizontal: Fsin60°≈4.33N. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/vectors-and-equilibrium/mcq26:
    title: "Vectors and Equilibrium | Direction cosines of A=2i+4j-5k are 2/√45,4/√45,-5/√45 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice vectors and equilibrium MCQ: Direction cosines of A=2i+4j-5k are? Options: (2/√45,4/√45,-5/√45); (4/√45,0,-4/√45); (-3/√45,2/√45,5/√45); (1/√45,2/√45,5/√45). Correct: 2/√45,4/√45,-5/√45. Explanation: |A|=√(4+16+25)=√45. Direction cosines = (2/√45,4/√45,-5/√45). More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/vectors-and-equilibrium/mcq27:
    title: "Vectors and Equilibrium | Magnitude of flight from one corner to opposite corner of 10×12×14m hall is 21m - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice vectors and equilibrium MCQ: Fly in hall of dimensions 10m×12m×14m starts from one corner to diametrically opposite corner. Magnitude of flight? Options: 17m, 21m, 26m, 36m. Correct: 21m. Explanation: Space diagonal = √(100+144+196)=√440≈20.98m≈21m. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/vectors-and-equilibrium/mcq28:
    title: "Vectors and Equilibrium | Five equal forces of 10N applied at point with equal angles give resultant 0N - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice vectors and equilibrium MCQ: Five equal forces of 10N applied at point with equal angles between them. Resultant force? Options: 10N, 10√2N, 20N, 0N. Correct: 0N. Explanation: Symmetric system of equal forces equally spaced results in zero resultant. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/vectors-and-equilibrium/mcq29:
    title: "Vectors and Equilibrium | Any vector can be replaced by two or three arbitrary vectors with original as resultant - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice vectors and equilibrium MCQ: Any vector in arbitrary direction can be replaced by two or three vectors? Options: perpendicular with original as resultant; parallel with original as resultant; arbitrary vectors with original as resultant; impossible. Correct: arbitrary vectors which have original vectors as their resultant. Explanation: Vector can be resolved into components in any chosen directions; need not be perpendicular. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/vectors-and-equilibrium/mcq30:
    title: "Vectors and Equilibrium | Angular momentum is an axial vector - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice vectors and equilibrium MCQ: Angular momentum is? Options: Scalar vector; Axial-vector; Polar vector; Displacement vector. Correct: An axial-vector. Explanation: L = r × p is axial vector (pseudovector) that does not change sign under coordinate inversion. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/vectors-and-equilibrium/mcq31:
    title: "Vectors and Equilibrium | Which is vector - none of surface tension, moment of inertia, pressure - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice vectors and equilibrium MCQ: Which is vector? Options: Surface Tension, Moment of inertia, Pressure, None. Correct: None of the above. Explanation: Surface tension, moment of inertia, pressure are all scalar quantities. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/vectors-and-equilibrium/mcq32:
    title: "Vectors and Equilibrium | Adding two vectors gives a vector - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice vectors and equilibrium MCQ: On adding two vectors we get? Options: A vector, A scalar, A number, An operation. Correct: A vector. Explanation: Vector addition follows parallelogram law and results in resultant vector. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/vectors-and-equilibrium/mcq33:
    title: "Vectors and Equilibrium | Adding 2i+7j and i+j gives 3i+8j - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice vectors and equilibrium MCQ: Adding 2i+7j and i+j gives? Options: 3i+8j; i+35j; i+8j; 2i+7j. Correct: 3i+8j. Explanation: (2i+7j)+(i+j) = (2+1)i+(7+1)j = 3i+8j. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/vectors-and-equilibrium/mcq34:
    title: "Vectors and Equilibrium | Subtracting 2i+7j from i+j gives -i-6j - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice vectors and equilibrium MCQ: Subtracting 2i+7j from i+j gives? Options: -i-6j; 3i+8j; i+6j; 7j. Correct: -i-6j. Explanation: (i+j)-(2i+7j) = (1-2)i+(1-7)j = -i-6j. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/vectors-and-equilibrium/mcq35:
    title: "Vectors and Equilibrium | Adding i+7j and 7i+j gives 8i+8j - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice vectors and equilibrium MCQ: Adding i+7j and 7i+j gives? Options: 8i+8j; 0i+76j; i+74j; 78i+8j. Correct: 8i+8j. Explanation: (i+7j)+(7i+j) = (1+7)i+(7+1)j = 8i+8j. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/vectors-and-equilibrium/mcq36:
    title: "Vectors and Equilibrium | Stationary body means combination of forces balance each other - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice vectors and equilibrium MCQ: Which is true when body is stationary? Options: Force not in contact; Body in vacuum; No force acting; Combination of forces balance each other. Correct: The combination of forces acting on it balance each other. Explanation: Stationary body is in equilibrium, net force zero. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/vectors-and-equilibrium/mcq37:
    title: "Vectors and Equilibrium | Two forces with equal magnitude F have resultant F when angle is 120° - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice vectors and equilibrium MCQ: Two forces with magnitude F have resultant same magnitude F. Angle between forces? Options: 45°, 60°, 120°, 150°. Correct: 120°. Explanation: R²=2F²(1+cosθ). Set R=F ⇒ 1=2(1+cosθ) ⇒ cosθ=-1/2 ⇒ θ=120°. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/vectors-and-equilibrium/mcq38:
    title: "Vectors and Equilibrium | Angle between forces when resultant is F/3 with equal magnitudes F is cos⁻¹(-17/18) - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice vectors and equilibrium MCQ: Two equal magnitudes F act, resultant is F/3. Angle between forces? Options: cos⁻¹(-17/18); cos⁻¹(8/19); cos⁻¹(-1/3); cos⁻¹(-1/2). Correct: cos⁻¹(-17/18). Explanation: (F/3)²=2F²(1+cosθ) ⇒ 1/9=2(1+cosθ) ⇒ 1+cosθ=1/18 ⇒ cosθ=-17/18. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/vectors-and-equilibrium/mcq39:
    title: "Vectors and Equilibrium | Force to balance North-East direction is South-West - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice vectors and equilibrium MCQ: Direction to apply force to balance force in North-East direction? Options: South, West, South-West, North-East. Correct: South-West. Explanation: Balancing force must be equal magnitude and opposite direction. Opposite of North-East is South-West. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/vectors-and-equilibrium/mcq40:
    title: "Vectors and Equilibrium | Which cannot be resultant of 5N and 10N - 4N - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice vectors and equilibrium MCQ: Among following which cannot be resultant of 5N and 10N? Options: 4N, 5N, 8N, 12N. Correct: 4N. Explanation: Resultant lies between |F₁-F₂|=5N and F₁+F₂=15N. Minimum resultant is 5N, so 4N impossible. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/vectors-and-equilibrium/mcq41:
    title: "Vectors and Equilibrium | Resultant perpendicular to smaller force with one force double other gives angle 120° - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice vectors and equilibrium MCQ: Resultant of two forces perpendicular to smaller force. One force double other. Angle between forces? Options: 60°, 90°, 120°, 150°. Correct: 120°. Explanation: Let smaller=F, larger=2F. R perpendicular to F ⇒ component along F: F+2Fcosθ=0 ⇒ cosθ=-1/2 ⇒ θ=120°. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/vectors-and-equilibrium/mcq42:
    title: "Vectors and Equilibrium | Concurrent forces in equilibrium satisfy triangle inequality - 3,5,6N - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice vectors and equilibrium MCQ: Which set of concurrent forces are in equilibrium? Options: 3,5,1N; 3,5,6N; 3,5,9N; 3,5,15N. Correct: 3,5,6N. Explanation: For equilibrium, largest force ≤ sum of other two. 6 < 3+5=8, so possible. Others fail triangle inequality. More entry test MCQs at NotesPrep."
    https://notesprep.com/entry-tests/mcqs/waves/mcq1:
    title: "Waves | Waves transmit energy from one place to another - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice waves MCQ: Waves transmit ______ from one place to another. Options: energy, mass, both, none. Correct: energy. Explanation: Waves transfer energy without transferring matter. Particles oscillate but do not travel with wave. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/waves/mcq2:
    title: "Waves | Waves requiring material medium are called mechanical waves - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice waves MCQ: Waves that require material medium for propagation are called? Options: matter waves, electromagnetic waves, carrier waves, mechanical waves. Correct: mechanical waves. Explanation: Mechanical waves (sound, water waves) require medium. Electromagnetic waves do not. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/waves/mcq3:
    title: "Waves | Particles displaced perpendicular to wave direction gives transverse waves - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice waves MCQ: If particles displaced perpendicular to waves then waves are? Options: Longitudinal, Transverse, Stationary, All. Correct: Transverse Waves. Explanation: In transverse waves, particle displacement perpendicular to wave propagation direction. Longitudinal waves have parallel displacement. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/waves/mcq4:
    title: "Waves | Distance between consecutive crests or troughs is called wavelength - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice waves MCQ: Distance between any two consecutive crests or troughs is called? Options: frequency, period, wavelength, phase difference. Correct: wavelength. Explanation: Wavelength λ is distance between two consecutive points in phase, such as crest to crest. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/waves/mcq5:
    title: "Waves | Points where amplitude is maximum in vibrating cord are called antinodes - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice waves MCQ: In vibrating cord, points where amplitude is maximum are called? Options: antinodes, nodes, troughs, crests. Correct: antinodes. Explanation: In standing wave, antinodes are points of maximum amplitude, nodes are zero amplitude. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/waves/mcq6:
    title: "Waves | Node is point where destructive interference occurs - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice waves MCQ: A node is a point located along medium where there is always _____. Options: double crest, constructive interference, destructive interference, double rarefaction. Correct: destructive interference. Explanation: Node is point of zero displacement in standing wave, caused by destructive interference of incident and reflected waves. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/waves/mcq7:
    title: "Waves | Distance between two consecutive nodes is λ/2 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice waves MCQ: Distance between two consecutive nodes is? Options: λ/2, λ/4, λ, 2λ. Correct: λ/2. Explanation: In standing wave, distance between consecutive nodes is λ/2. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/waves/mcq8:
    title: "Waves | Distance between consecutive node and antinode is λ/4 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice waves MCQ: Distance between consecutive node and antinode is? Options: λ, λ/2, 2λ, λ/4. Correct: λ/4. Explanation: In standing wave, distance between node and nearest antinode is λ/4. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/waves/mcq9:
    title: "Waves | Velocity of resultant wave when identical traveling waves superimpose remains unchanged - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice waves MCQ: When two identical traveling waves are superimposed, velocity of resultant wave? Options: decreases, increases, remains unchanged, becomes zero. Correct: remains unchanged. Explanation: Wave speed depends on medium, not on superposition. Resultant wave travels at same speed. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/waves/mcq10:
    title: "Waves | Phenomenon when two or more waves meet is called interference - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice waves MCQ: Which phenomenon is produced when two or more waves passing simultaneously through same medium meet? Options: refraction, diffraction, interference, reflection. Correct: interference. Explanation: Interference is superposition of waves to form resultant wave of greater, lower, or same amplitude. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/waves/mcq11:
    title: "Waves | Doubling amplitude increases intensity by 4 times - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice waves MCQ: On doubling amplitude of wave, intensity is increased? Options: 1/2 times, 2 times, 4 times, 3 times. Correct: 4 times. Explanation: Intensity I ∝ A². If A→2A, I ∝ 4A², so intensity increases by factor of 4. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/waves/mcq12:
    title: "Waves | Resultant amplitude of two in-phase waves with amplitude 0.5m each is 1m - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice waves MCQ: Two waves each with amplitude 0.5m superimposed with constructive interference (in phase). Resultant amplitude? Options: 0.25m, 0.5m, 0m, 1m. Correct: 1m. Explanation: Constructive interference: A_resultant = A₁+A₂ = 0.5+0.5=1m. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/waves/mcq13:
    title: "Waves | Intensity through polarizer is decreased - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice waves MCQ: Intensity of beam observed through polarizer? Options: increased, decreased, always zero, remains unchanged. Correct: is decreased. Explanation: Unpolarized light through polarizer reduces intensity by half (Malus's law). So intensity decreased. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/waves/mcq14:
    title: "Waves | Loudness of sound is directly related to intensity - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice waves MCQ: Loudness of sound is directly related to? Options: Intensity, Wavelength, Frequency, Pitch. Correct: Intensity of Sound. Explanation: Loudness is perception of sound intensity. Higher intensity = louder sound. Frequency determines pitch. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/waves/mcq15:
    title: "Waves | Speed of sound is greatest in glass (solid) - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice waves MCQ: Speed of sound is greatest in? Options: Glass, Water, Methanol, Helium. Correct: Glass. Explanation: Speed of sound greatest in solids due to closer particle spacing. Glass has higher speed than liquids or gases. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/waves/mcq16:
    title: "Waves | Speed of sound in vacuum is zero - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice waves MCQ: Speed of sound in vacuum is? Options: 340 m/s, 3×10⁸ m/s, 4000 ft/s, None. Correct: None of these. Explanation: Sound requires material medium to propagate. In vacuum, speed is zero. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/waves/mcq17:
    title: "Waves | Ratio of velocity of sound in oxygen to hydrogen is 1:4 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice waves MCQ: Ratio of velocity of sound in oxygen as compared to hydrogen is? Options: 4:1, 16:1, 1:4, 1:16. Correct: 1:4. Explanation: Speed ∝ 1/√(molar mass). O₂=32 g/mol, H₂=2 g/mol. v_O₂/v_H₂ = √(2/32)=√(1/16)=1/4. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/waves/mcq18:
    title: "Waves | Speed of sound increases by 0.61 m/s per °C rise - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice waves MCQ: To increase speed of sound in air to reach rise above 0°C? Options: 0.41 m/s, 0.51 m/s, 0.81 m/s, 0.61 m/s. Correct: 0.61 m/sec. Explanation: Speed of sound increases by approximately 0.61 m/s for every 1°C rise: v = v₀ + 0.61t. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/waves/mcq19:
    title: "Waves | Speed of sound at 22°C from 332 m/s at 0°C is 345 m/s - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice waves MCQ: Speed of sound in air at 332 m/s at 0°C. Speed at 22°C will be? Options: 345 m/s, 340 m/s, 350 m/s, 330 m/s. Correct: 345 m/s. Explanation: v = 332 + 0.61×22 = 332 + 13.42 = 345.42 ≈ 345 m/s. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/waves/mcq20:
    title: "Waves | Frequency increases as source approaches observer - Doppler effect - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice waves MCQ: Frequency of wave as source approaches observer with speed v? Options: Increases, Decreases, First increases then decreases, Remains same. Correct: Increases. Explanation: Doppler effect: when source moves toward observer, observed frequency increases due to wavefront compression. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/waves/mcq21:
    title: "Waves | Blue colored source seen red when source moves away from observer - redshift - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice waves MCQ: Blue colored source is seen Red if? Options: Source moving away; Observer moving away; Gamma rays' effect; None. Correct: Source is moving away from observer. Explanation: When source moves away, wavelength increases (redshift). Blue light shifts toward red. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/waves/mcq22:
    title: "Waves | Apparent frequency when source moves toward observer at v/3 with 100Hz is 150Hz - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice waves MCQ: Source of sound moves toward stationary observer with speed one-third of speed of sound. Source frequency 100Hz. Apparent frequency? Options: 60Hz, 100Hz, 200Hz, 150Hz. Correct: 150Hz. Explanation: f' = f × v/(v - v_s) = 100 × v/(v - v/3) = 100 × 3/2 = 150Hz. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/waves/mcq23:
    title: "Waves | Percentage increase in apparent frequency when observer moves toward source at v/5 is 20% - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice waves MCQ: Observer moves toward stationary source with velocity one-fifth of sound velocity. Percentage increase in apparent frequency? Options: 0.5%, zero, 20%, 5%. Correct: 20%. Explanation: f' = f(v+v₀)/v = f(1+1/5)=1.2f ⇒ 20% increase. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/waves/mcq24:
    title: "Waves | Ratio of velocity of train B to train A from Doppler effect is 2 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice waves MCQ: Siren at platform emits 5kHz. Train A records 5.5kHz approaching. Train B records 6.0kHz approaching. Ratio of velocity of train B to train A is? Options: 242/252, 2, 5/6, 11/6. Correct: 2. Explanation: v_A=0.1v, v_B=0.2v ⇒ v_B/v_A=2. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/waves/mcq25:
    title: "Waves | Frequency of light from receding star is 4.37×10¹⁴ Hz - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice waves MCQ: Star receding at 1.40×10⁷ m/s emits 4.57×10¹⁴ Hz. Speed of light 3×10⁸ m/s. Frequency detected on Earth? Options: 2.04×10¹³, 4.37×10¹⁴, 4.57×10¹⁴, 7.9×10¹⁴ Hz. Correct: 4.37×10¹⁴ Hz. Explanation: f' ≈ f(1 - v/c) = 4.57×10¹⁴ × 0.9533 ≈ 4.36×10¹⁴ Hz. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/waves/mcq26:
    title: "Waves | When frequency difference exceeds 10Hz, beats cannot be heard by human ear - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice waves MCQ: What happens when two sound waves of frequencies differing by more than 10Hz reach ear simultaneously? Options: beats not produced; waves destroy each other; interference does not occur; beats produced but cannot be heard. Correct: beats are produced but cannot be heard by human ear. Explanation: Beats require frequency difference less than ~10Hz for perception. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/waves/mcq27:
    title: "Waves | Beat frequency of 199Hz and 203Hz horns is 4Hz - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice waves MCQ: Car has horns emitting 199Hz and 203Hz. Beat frequency? Options: 4Hz, 199Hz, 201Hz, 203Hz. Correct: 4Hz. Explanation: Beat frequency = |f₁ - f₂| = |199 - 203| = 4Hz. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/waves/mcq28:
    title: "Waves | Original frequency of fork 2 with 200Hz fork giving 4 beats then 6 beats after adding tape is 196Hz - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice waves MCQ: Fork 1 (200Hz) and fork 2 produce 4 beats/s. Tape added to fork 2 increases beats to 6/s. Original frequency of fork 2? Options: 202Hz, 200Hz, 204Hz, 196Hz. Correct: 196Hz. Explanation: If f₂=196Hz, adding tape decreases frequency, increasing beats. If f₂=204Hz, beats would decrease. So f₂=196Hz. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/waves/mcq29:
    title: "Waves | Piano string frequency before increasing tension was 254Hz (256-2) - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice waves MCQ: Tuning fork 256Hz makes beats with piano string. Beat frequency decreases to 2 when tension increased. Original string frequency? Options: 256+2Hz, 256Hz, 256-2Hz, 256-5Hz. Correct: 256 - 2 Hz. Explanation: Tension increase raises frequency. If beats decrease, string was initially lower, so 256-2=254Hz. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/waves/mcq30:
    title: "Waves | Closed organ pipe produces only odd harmonics - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice waves MCQ: In organ pipe with one side closed, harmonics released will be? Options: Even numbers, Odd numbers, Odd and even both, Fractional numbers. Correct: Odd numbers. Explanation: Closed organ pipe produces only odd harmonics: f₁, 3f₁, 5f₁,... (closed end = node, open end = antinode). More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/waves/mcq31:
    title: "Waves | Wavelength of third harmonic on string of length 3m fixed at both ends is 2m - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice waves MCQ: Wavelength of third harmonic (n=3) of standing wave on string of length 3m fixed at both ends? Options: 1m, 1.5m, 2m, 3m. Correct: 2m. Explanation: For string fixed at both ends, λ = 2L/n = 2×3/3 = 2m. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/waves/mcq32:
    title: "Waves | Higher harmonics of string with fundamental 150Hz are 300Hz and 600Hz - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice waves MCQ: Which frequencies are higher harmonics of string with fundamental 150Hz? Options: 200Hz,300Hz; 300Hz,600Hz; 250Hz,450Hz; 250Hz,500Hz. Correct: 300Hz, 600Hz. Explanation: Harmonics are integer multiples: 150×2=300Hz, 150×4=600Hz. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/waves/mcq33:
    title: "Waves | Distance between nodes for wave of frequency 256Hz and speed 128m/s is 0.250m - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice waves MCQ: Standing wave by waves of frequency 256Hz, speed 128m/s. Distance between nodes? Options: 2.00m, 1.00m, 0.500m, 0.250m. Correct: 0.250m. Explanation: λ = v/f = 128/256 = 0.5m. Node spacing = λ/2 = 0.25m. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/waves/mcq34:
    title: "Waves | Speed of sound from closed tube resonance at 329.6Hz with length 25cm is 330 m/s - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice waves MCQ: Closed tube, tuning fork 329.6Hz, shortest resonance length 25.0cm. Speed of sound? Options: 380.6, 282.4, 3.30×10², 3.50×10² m/s. Correct: 3.30×10² m/s. Explanation: λ/4 = L ⇒ λ=1.0m. v = fλ = 329.6 ≈ 330 m/s. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/waves/mcq35:
    title: "Waves | Maximum possible error in calculating velocity of sound from resonance tube is 102.4 cm/s - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice waves MCQ: Tuning fork 512Hz, first resonance 30.7cm, second 63.2cm. Maximum possible error in velocity? Options: 204.8, 102.4, 51.2, 153.60 cm/s. Correct: 102.4 cm/s. Explanation: Error in λ = 0.4cm, error in v = f × 0.4 = 204.8 cm/s? The problem asks for maximum possible error. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/waves/mcq36:
    title: "Waves | End correction from resonance tube experiment is 0.025m - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice waves MCQ: Lengths resonating in fundamental mode (0.1m) and first overtone (0.35m). End correction? Options: 0.012m, 0.025m, 0.05m, 0.024m. Correct: 0.025m. Explanation: λ/2 = L₂-L₁ = 0.25m ⇒ λ=0.5m. λ/4 = 0.125 = L₁+e ⇒ e=0.025m. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/waves/mcq37:
    title: "Waves | Wave speed from equation y = 10⁻⁶ sin(100t + 20x + π/4) is 5 m/s - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice waves MCQ: Displacement y = 10⁻⁶ sin(100t + 20x + π/4) m. Speed of wave? Options: 200, 5, 20, 5 m/s. Correct: 5 m/s. Explanation: ω=100 rad/s, k=20 rad/m. v = ω/k = 100/20 = 5 m/s. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/waves/mcq38:
    title: "Waves | Path difference for 60° phase difference at 360m/s, 500Hz is 12cm - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice waves MCQ: Phase difference 60° on wave of velocity 360m/s, frequency 500Hz. Path difference? Options: 1cm, 6cm, 12cm, 24cm. Correct: 12cm. Explanation: λ = v/f = 0.72m = 72cm. Path difference = (φ/2π)λ = (π/3)/(2π)×72 = 12cm. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/waves/mcq39:
    title: "Waves | Object moving faster than speed of sound is called supersonic - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice waves MCQ: Object moves faster than speed of sound is called? Options: Sonic, Hypersonic, Infrasonic, Supersonic, Ultra Sonic. Correct: Supersonic. Explanation: Supersonic = speeds greater than speed of sound. Hypersonic = Mach 5+. Infrasonic/ultrasonic refer to frequencies. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/waves/mcq40:
    title: "Waves | Earthquake shock wave making building move in direction of wave is longitudinal wave - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice waves MCQ: Shock wave from earthquake makes building move in direction of shock wave. Which progressive wave? Options: Longitudinal, Transverse, Material, Particle. Correct: Longitudinal wave. Explanation: P-waves are longitudinal, compressing and expanding ground in direction of propagation. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/waves/mcq41:
    title: "Waves | Frequency of sound remains unchanged when traveling from one medium to another - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice waves MCQ: Sound wave travels from one medium to another. Which characteristic remains unchanged? Options: Amplitude, Velocity, Frequency, Quality, Wavelength. Correct: Frequency. Explanation: Frequency depends on source, not medium. Velocity and wavelength change. Amplitude may change due to energy loss. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/waves/mcq42:
    title: "Waves | Frequency recorded in air from source in water of 600Hz is 600Hz - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice waves MCQ: Source of sound of frequency 600Hz in water. Speed in water 1500m/s, air 300m/s. Frequency recorded by observer in air? Options: 200Hz, 300Hz, 20Hz, 600Hz. Correct: 600Hz. Explanation: Frequency depends on source, not medium. Observer in air hears same frequency: 600Hz. More entry test MCQs at NotesPrep."
    https://notesprep.com/entry-tests/mcqs/electrostatics/mcq1:
    title: "Electrostatics | Charge is a fundamental property of a material body - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electrostatics MCQ: Charge is a ______ property of a material body. Options: fundamental, basic, advanced, necessary. Correct: fundamental. Explanation: Electric charge is a fundamental property of matter, along with mass. It gives rise to electromagnetic interactions. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electrostatics/mcq2:
    title: "Electrostatics | Electric charge cannot be created or destroyed - conservation of charge - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electrostatics MCQ: Electric charge exists in discrete natural units and? Options: can be created or destroyed; cannot be created or destroyed; can be created but cannot be destroyed; cannot be created but can be destroyed. Correct: cannot be created or destroyed. Explanation: Electric charge is conserved. It can only be transferred from one body to another. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electrostatics/mcq3:
    title: "Electrostatics | Charge of electron is equivalent to charge of proton in magnitude - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electrostatics MCQ: Charge of electron is ______ charge of proton. Options: greater than, lesser than, equivalent to, zero. Correct: equivalent to. Explanation: Magnitude of charge on electron equals magnitude on proton (1.6×10⁻¹⁹ C). Electron negative, proton positive. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electrostatics/mcq4:
    title: "Electrostatics | Number of natural units of charge in one coulomb is 6.24×10¹⁸ - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electrostatics MCQ: A coulomb is made up of ______ natural units of electric charge. Options: 6.21×10⁻⁸, 6.24×10¹⁸, 6.24×10¹², 6.24×10²⁰. Correct: 6.24×10¹⁸. Explanation: 1 coulomb contains approximately 6.24×10¹⁸ elementary charges. e=1.6×10⁻¹⁹C ⇒ 1C = 1/(1.6×10⁻¹⁹)=6.25×10¹⁸ electrons. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electrostatics/mcq5:
    title: "Electrostatics | Electron has negative charge of 1.6021×10⁻¹⁹ C - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electrostatics MCQ: According to definition of ampere, electron has negative charge of? Options: 1.6021×10¹⁹C, 1.6021×10⁻¹⁹C, 1.6021×10⁻¹⁸C, 1.6021×10¹⁸C. Correct: 1.6021×10⁻¹⁹C. Explanation: Elementary charge of electron is e = 1.6021×10⁻¹⁹C, smallest natural unit of electric charge. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electrostatics/mcq6:
    title: "Electrostatics | Three methods of charge formation - friction, conduction, induction - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electrostatics MCQ: Methods of charge formation on a body are? Options: three, four, five, six. Correct: three. Explanation: Three main methods: (1) Charging by friction, (2) Charging by conduction, (3) Charging by induction. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electrostatics/mcq7:
    title: "Electrostatics | Charging by induction - neutral object charged without touching - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electrostatics MCQ: Charging method where neutral object is charged without touching another charged object. Options: Induction, Conduction, Radiation, Friction. Correct: Induction. Explanation: Charging by induction occurs when charged object brought near neutral conductor, causing charge redistribution without direct contact. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electrostatics/mcq8:
    title: "Electrostatics | Charging by conduction - charge transferred by contact - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electrostatics MCQ: It is charging by contact where charge is transferred to object. Options: Induction, Conduction, Radiation, Friction. Correct: Conduction. Explanation: Charging by conduction occurs when charged object touches neutral object, allowing charge transfer directly. Both objects end with same charge type. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electrostatics/mcq9:
    title: "Electrostatics | Glass rod rubbed with silk becomes positively charged, silk negatively charged - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electrostatics MCQ: When we rub glass rod with silk cloth then? Options: glass negative, silk positive; glass positive, silk negative; both negative; both positive. Correct: glass rod acquires positive charge while silk acquires negative charges. Explanation: Electrons transfer from glass to silk. Glass becomes positive, silk negative. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electrostatics/mcq10:
    title: "Electrostatics | Electrostatic force is independent of temperature of charges - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electrostatics MCQ: Electrostatic force between two-point charges is independent of? Options: Magnitude of charges; Temperature of charges; Distance between charges; Medium between charges. Correct: Temperature of charges. Explanation: Coulomb's law F = kq₁q₂/(ε_r r²) depends on charge magnitude, distance, and medium, not on temperature. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electrostatics/mcq11:
    title: "Electrostatics | Force remains same when distance halved and charges halved - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electrostatics MCQ: If distance between two equal charges reduced to half and magnitude of charges decreased to half, force will be? Options: Remain same, Decreased to half, Increased to double, Becomes four times. Correct: Remain same. Explanation: F = kq²/r². New force F' = k(q/2)²/(r/2)² = kq²/r² = F. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electrostatics/mcq12:
    title: "Electrostatics | Force remains same when charges and distance both doubled - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electrostatics MCQ: If both magnitude of charges and distance between them doubled, Coulomb's force will be? Options: Doubled, Half, Remain same, One fourth. Correct: Remain same. Explanation: F' = k(2q₁)(2q₂)/(2r)² = 4kq₁q₂/(4r²)= kq₁q₂/r² = F. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electrostatics/mcq13:
    title: "Electrostatics | Force becomes 16 times when charges doubled and distance halved - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electrostatics MCQ: If magnitude of charges doubled and distance between them halved, force becomes? Options: F, 4F, 8F, 16F. Correct: 16F. Explanation: F' = k(2q₁)(2q₂)/(r/2)² = 4kq₁q₂/(r²/4)= 16F. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electrostatics/mcq14:
    title: "Electrostatics | Force remains same when distance doubled and individual charges doubled - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electrostatics MCQ: Let F be force between two equal point charges. If distance doubled and individual charges doubled, new force? Options: F, 2F, 4F, F/2. Correct: F. Explanation: F' = k(2q)²/(2r)² = 4kq²/(4r²)= kq²/r² = F. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electrostatics/mcq15:
    title: "Electrostatics | Force becomes four times when distance becomes half - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electrostatics MCQ: If distance between two point charges becomes half then force becomes? Options: double, half, four times, remains same. Correct: four times. Explanation: F ∝ 1/r². If r → r/2, F' = 4F. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electrostatics/mcq16:
    title: "Electrostatics | Force of repulsion is considered positive - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electrostatics MCQ: Force of repulsion between two charges is considered as? Options: negative, positive, may be positive or negative, cannot be predicted. Correct: positive. Explanation: In Coulomb's law, for like charges product q₁q₂ positive, so force positive, indicating repulsion. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electrostatics/mcq17:
    title: "Electrostatics | Force of attraction is considered negative - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electrostatics MCQ: Force of attraction between two charges is considered as? Options: negative, positive, may be positive or negative, cannot be predicted. Correct: negative. Explanation: For opposite charges, product q₁q₂ negative, so force negative, indicating attraction. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electrostatics/mcq18:
    title: "Electrostatics | Force between charges in vacuum 42N becomes 20N with dielectric ε_r=2.1 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electrostatics MCQ: Electrostatic force between charges in vacuum is 42N. If dielectric of ε_r=2.1 placed between charges, force becomes? Options: 42N, 83.2N, 20N, 2N. Correct: 20N. Explanation: F' = F/ε_r = 42/2.1 = 20N. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electrostatics/mcq19:
    title: "Electrostatics | Dielectric reduces electrostatic force - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electrostatics MCQ: Presence of dielectric between two charges always? Options: Increases force; Reduces force; Does not affect; Doubles force. Correct: Reduces the electrostatic force. Explanation: Dielectric reduces force by factor ε_r (>1). F = F₀/ε_r. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electrostatics/mcq20:
    title: "Electrostatics | Relative permittivity of dielectrics is always greater than unity - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electrostatics MCQ: Value of relative permittivity for all dielectrics other than air or vacuum is always? Options: Less than unity, Greater than unity, Equal to unity, Zero. Correct: Greater than unity. Explanation: Relative permittivity ε_r of all dielectrics > 1. For air and vacuum, ε_r ≈ 1. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electrostatics/mcq21:
    title: "Electrostatics | Forces on alpha particle and electron are equal in magnitude - Newton's third law - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electrostatics MCQ: If F₁ and F₂ are forces on α-particle and electron respectively then? Options: F₁=F₂, F₁>F₂, F₁<F₂, F₁=4F₂. Correct: F₁=F₂. Explanation: By Newton's third law, force between two charges is equal and opposite. Force on each is same in magnitude. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electrostatics/mcq22:
    title: "Electrostatics | Coulomb's constant K depends on system of units and nature of medium - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electrostatics MCQ: Constant K depends upon? Options: Distance between charges; System of units and nature of medium; Nature of charge bodies; Magnitude of charges. Correct: System of units and nature of medium between charges. Explanation: K = 1/(4πε₀ε_r) depends on units and medium. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electrostatics/mcq23:
    title: "Electrostatics | Value of Coulomb's constant K in SI units is 9×10⁹ N·m²/C² - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electrostatics MCQ: Which is value of Coulomb's constant K in SI units? Options: 9×10⁹ N·m²/C², 9×10⁹ N⁻¹C²/m², 9×10⁹ N⁻¹C⁻²/m², 9×10⁹ N⁻²/C²/m². Correct: 9×10⁹ N·m²/C². Explanation: Coulomb's constant K = 9×10⁹ N·m²/C². More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electrostatics/mcq24:
    title: "Electrostatics | Value of permittivity of free space ε₀ is 8.85×10⁻¹² C²N⁻¹m⁻² - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electrostatics MCQ: Which is value of permittivity of free space ε₀ in SI units? Options: 8.85×10⁻¹² C²N⁻¹m⁻², 8.85×10⁻¹² N·m⁻²C⁻², 8.85×10⁻¹² N·m⁻¹C⁻², 8.85×10⁻¹² N·m⁻²C⁻². Correct: 8.85×10⁻¹² C²N⁻¹m⁻². Explanation: ε₀ = 8.85×10⁻¹² C²N⁻¹m⁻². Related to K by K = 1/(4πε₀). More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electrostatics/mcq25:
    title: "Electrostatics | Ratio of forces on 1µC and 5µC charges is 1:1 - Newton's third law - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electrostatics MCQ: Two charges 1µC and 5µC separated by 20cm, ratio of electrical forces acting on them will be? Options: 1:2, 1:5, 1:1, 5:1. Correct: 1:1. Explanation: By Newton's third law, force on first due to second equals force on second due to first in magnitude. Ratio always 1:1. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electrostatics/mcq26:
    title: "Electrostatics | Relative permittivity has no unit - dimensionless quantity - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electrostatics MCQ: SI unit of relative permittivity is? Options: C²/N·m², C⁻²/N·m², N·m⁻²C⁻¹, No unit. Correct: No unit. Explanation: Relative permittivity ε_r = ε/ε₀ is dimensionless ratio, so no units. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electrostatics/mcq27:
    title: "Electrostatics | Test charge Q in E=F/Q can be positive or negative - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electrostatics MCQ: In E = F/Q, the charge is? Options: Always positive, Always negative, Can be positive or negative, Charge less. Correct: Can be positive or negative. Explanation: Electric field intensity E = F/Q, where Q is test charge. Test charge can be positive or negative. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electrostatics/mcq28:
    title: "Electrostatics | Electric intensity between capacitor plates is σ/ε₀ - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electrostatics MCQ: Electric intensity between two plates of capacitor equals? Options: σ/ε₀, σε₀, ε₀/σ, None. Correct: σ/ε₀. Explanation: For parallel plate capacitor, E = σ/ε₀, where σ is surface charge density. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electrostatics/mcq29:
    title: "Electrostatics | Electric field around charge is intrinsic property of nature - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electrostatics MCQ: Fact that Electric Field exists in space around electric charge is? Options: Magnetic property; Gravitational Field; Intrinsic property of nature; All of these. Correct: Intrinsic property of nature. Explanation: Electric field around charge is intrinsic property of nature, fundamental concept in electromagnetism. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electrostatics/mcq30:
    title: "Electrostatics | Electric field of positive charge is radially outward - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electrostatics MCQ: Electric field created by positive charge is? Options: Radially inward, Zero, Circular, Radially outward. Correct: Radially outward. Explanation: Electric field lines radiate outward from positive charge, inward toward negative charge. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electrostatics/mcq31:
    title: "Electrostatics | Other unit of electric intensity is V/m - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electrostatics MCQ: SI unit of Electric intensity is N/C. Its other unit is? Options: V/A, V/m, V/C, N/V. Correct: V/m. Explanation: Electric field intensity also expressed in volts per meter (V/m). 1 V/m = 1 N/C. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electrostatics/mcq32:
    title: "Electrostatics | Electric field at 20cm from 2µC charge is 4.5×10⁵ N/C - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electrostatics MCQ: Electric field at distance 20cm from 2µC charge is? Options: 4.5×10⁵ N/C, 3×10³ N/C, 9×10³ N/C, 9×10⁵ N/C. Correct: 4.5×10⁵ N/C. Explanation: E = kq/r² = (9×10⁹)×(2×10⁻⁶)/(0.2)² = 4.5×10⁵ N/C. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electrostatics/mcq33:
    title: "Electrostatics | Negatively charged particle moves South in field from South to North - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electrostatics MCQ: Negatively charged particle in uniform electric field from South to North. Direction of particle? Options: East, South, North, North-west. Correct: South. Explanation: Negative charge experiences force opposite to field direction. Field South to North, force North to South, particle moves South. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electrostatics/mcq34:
    title: "Electrostatics | Electric field is zero halfway between two equal positive charges - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electrostatics MCQ: Two positive charges on screen. Which describes electric field? Options: Constant everywhere; Zero near each charge; Zero halfway between charges; Strongest halfway between charges. Correct: It is zero halfway between charges. Explanation: For two equal positive charges, electric fields cancel at midpoint (equal magnitude, opposite directions). More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electrostatics/mcq35:
    title: "Electrostatics | Electrostatic potential = Work done / charge - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electrostatics MCQ: Formula for electrostatic potential is? Options: Work done × charge; Work done / charge; Work done + charge; Work done - charge. Correct: Work done / charge. Explanation: Electrostatic potential V = W/q, work done per unit charge. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electrostatics/mcq36:
    title: "Electrostatics | 1 Volt = 1 Joule / 1 Coulomb - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electrostatics MCQ: 1 Volt = ______. Options: 1 Coulomb, 1 Newton/1 Coulomb, 1 Joule/1 Coulomb, 1 Newton/1 meter. Correct: 1 Joule / 1 Coulomb. Explanation: Voltage defined as energy per unit charge: 1V = 1J/C. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electrostatics/mcq37:
    title: "Electrostatics | Work done over closed path in electric field is zero - conservative force - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electrostatics MCQ: Work done moving unit positive test charge over closed path in electric field is? Options: Always 1, Infinite, Zero, Negative. Correct: Zero. Explanation: Electrostatic forces are conservative. Work done over closed path is zero. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electrostatics/mcq38:
    title: "Electrostatics | Electrostatic potential on perpendicular bisector of dipole is zero - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electrostatics MCQ: Electrostatic potential on perpendicular bisector due to electric dipole is? Options: Zero, 1, Infinite, Negative. Correct: Zero. Explanation: At any point on perpendicular bisector, distances to two charges equal, so potentials cancel, resulting in zero. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electrostatics/mcq39:
    title: "Electrostatics | No electric field lines connect points at same potential - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electrostatics MCQ: If two points at same potential, are there electric field lines connecting them? Options: yes, no, may or may not, insufficient information. Correct: no. Explanation: Electric field lines always point from higher to lower potential. No net work moving charge between same potential points. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electrostatics/mcq40:
    title: "Electrostatics | 1 volt is equivalent to joule/coulomb - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electrostatics MCQ: Which is equivalent to 1 volt? Options: newton/second, joule/second, joule/coulomb, coulomb/joule. Correct: joule/coulomb. Explanation: Voltage defined as work done per unit charge: 1V = 1J/C. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electrostatics/mcq41:
    title: "Electrostatics | Electron volt is unit of energy - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electrostatics MCQ: Electron volt is unit of? Options: Potential difference, Capacitance, Energy, Electric flux. Correct: Energy. Explanation: Electron volt (eV) is unit of energy. 1eV = 1.6×10⁻¹⁹J. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electrostatics/mcq42:
    title: "Electrostatics | Change in potential energy when electron moves 4.5m in 325 N/C field is 2.3×10⁻¹⁶J - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electrostatics MCQ: Change in potential energy if electron moves 4.5m in direction of electric field 325 N/C? Options: 5.3×10⁻¹⁶J, 2.3×10⁻¹⁶J, 0, 10. Correct: 2.3×10⁻¹⁶J. Explanation: ΔU = qEd = (1.6×10⁻¹⁹)(325)(4.5) = 2.34×10⁻¹⁶J ≈ 2.3×10⁻¹⁶J. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electrostatics/mcq43:
    title: "Electrostatics | Proton accelerated by 1kV gains 1 keV kinetic energy - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electrostatics MCQ: Proton 1840 times heavier than electron. Accelerated by 1kV, its kinetic energy? Options: 1840 keV, 1/1840 keV, 1 keV, 980 keV. Correct: 1 keV. Explanation: KE = qV. For proton, q=e, KE = e×1000 = 1keV. Mass does not affect KE gained. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electrostatics/mcq44:
    title: "Electrostatics | Charge on capacitor with 4V is 4C - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electrostatics MCQ: If potential difference between plates of capacitor with capacitance C is 4V, charge on each plate? Options: 4C, 2C, 0, 8C. Correct: 4C. Explanation: Q = CV. With V=4V, Q = 4C. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electrostatics/mcq45:
    title: "Electrostatics | Product RC has dimension of time - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electrostatics MCQ: Product of R and C is? Options: Time, Mass, Current, Unit less. Correct: Time. Explanation: RC time constant τ = RC has dimension of time, measured in seconds. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electrostatics/mcq46:
    title: "Electrostatics | Energy stored in capacitor is ½QV - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electrostatics MCQ: Energy stored in capacitor is represented by? Options: ½QV, ⅓QV, ¼QV, ½VQ². Correct: ½QV. Explanation: Energy U = ½QV = ½CV² = ½Q²/C. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electrostatics/mcq47:
    title: "Electrostatics | Surface density triples when electric intensity triples - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electrostatics MCQ: New Surface Density if Electric Intensity increased to 3 times? Options: 9σ, σ/3, 3σ, σ/27. Correct: 3σ. Explanation: E = σ/ε₀, so σ ∝ E. If E tripled, σ' = 3σ. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electrostatics/mcq48:
    title: "Electrostatics | Unit of permittivity of free space is F/m - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electrostatics MCQ: Unit of permittivity in free space is? Options: F/m, F, Fm, C/sec. Correct: F/m. Explanation: Permittivity of free space ε₀ = 8.85×10⁻¹² F/m. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electrostatics/mcq49:
    title: "Electrostatics | Unit of electric field is N/C - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electrostatics MCQ: Unit of electric field is? Options: N/C, Weber/sec, Volt/C, Joule/sec. Correct: N/C. Explanation: Electric field defined as force per unit charge, so unit is Newton per Coulomb (N/C). Also V/m. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electrostatics/mcq50:
    title: "Electrostatics | Capacitance depends on area, distance, and dielectric constant - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electrostatics MCQ: Capacitance depends on? Options: area of plate; distance between plates; dielectric constant; All of them. Correct: All of them. Explanation: C = ε₀ε_r A/d. Depends on area A, distance d, and dielectric constant ε_r. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electrostatics/mcq51:
    title: "Electrostatics | Capacitance increases with high dielectric constant - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electrostatics MCQ: Capacitance increases if insulating medium of ______ dielectric constant is used. Options: zero, low, medium, high. Correct: high. Explanation: Capacitance directly proportional to dielectric constant. Higher ε_r increases capacitance. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electrostatics/mcq52:
    title: "Electrostatics | Total capacitance of three capacitors in parallel is C₁+C₂+C₃ - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electrostatics MCQ: Three capacitors C₁,C₂,C₃ connected in parallel, total capacitance will be? Options: C=C₁+C₂+C₃; C=1/C₁+1/C₂+1/C₃; 1/C=1/C₁+1/C₂+1/C₃; C=C₁×C₂×C₃. Correct: C = C₁+C₂+C₃. Explanation: For capacitors in parallel, total capacitance is sum of individual capacitances. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electrostatics/mcq53:
    title: "Electrostatics | Total capacitance of three capacitors in series is given by 1/C = 1/C₁+1/C₂+1/C₃ - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electrostatics MCQ: In series circuit, total capacitance of three capacitors will be? Options: C=C₁+C₂+C₃; C=1/C₁+1/C₂+1/C₃; 1/C=1/C₁+1/C₂+1/C₃; C=C₁×C₂×C₃. Correct: 1/C = 1/C₁+1/C₂+1/C₃. Explanation: For capacitors in series, reciprocal of total capacitance equals sum of reciprocals. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electrostatics/mcq54:
    title: "Electrostatics | Phenomenon of making region free from electric field is electrostatic shielding - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electrostatics MCQ: 'X' is phenomenon of making region free from electric field. Identify X. Options: Faraday's cage, Electrostatic shielding, Gauss theorem, Corona discharge. Correct: Electrostatic shielding. Explanation: Electrostatic shielding makes region free from external electric fields by surrounding with conducting material. Faraday cage is application. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electrostatics/mcq55:
    title: "Electrostatics | Sitting inside car is safer than near tree during thunderstorm - Faraday cage - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electrostatics MCQ: In thunderstorm with lightning, safest to run near tree or open ground rather than sitting inside car. Options: True, False. Correct: False. Explanation: Safer to sit inside car during thunderstorm because metal body acts as Faraday cage, protecting occupants from lightning. Trees and open ground are more dangerous. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electrostatics/mcq56:
    title: "Electrostatics | Ampulla of Lorenzini sensitive to electric field found in sharks - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electrostatics MCQ: Special organ called Ampulla of Lorenzini sensitive to electric field found in? Options: Bats, Cats, Dogs, Sharks. Correct: Sharks. Explanation: Sharks have electroreceptor organs called ampullae of Lorenzini that detect electric fields produced by other marine animals. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electrostatics/mcq57:
    title: "Electrostatics | Repulsion is sure test for electrification - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electrostatics MCQ: Which is used to test electrification (two bodies charged)? Options: Friction, Induction, Attraction, Repulsion. Correct: Repulsion. Explanation: Repulsion is sure test for electrification because attraction can occur between charged and uncharged body, but repulsion only between like-charged bodies. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electrostatics/mcq58:
    title: "Electrostatics | Negatively charged soap bubble expands in size - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electrostatics MCQ: Soap bubble given negative charge, radius or size or volume? Options: Decreases, Increases, Remaining unchanged, Nothing can be predicted. Correct: Increases. Explanation: When soap bubble given negative charge, charges repel each other, causing bubble to expand. So radius and volume increase. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electrostatics/mcq59:
    title: "Electrostatics | When two suspended objects attract electrically, either one is charged - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electrostatics MCQ: When two suspended objects attract each other electrically? Options: Both charged; Both uncharged; Either of them is charged; Both A and C. Correct: Either of them is charged. Explanation: Attraction can occur between two oppositely charged objects, or between charged object and neutral object (by induction). More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electrostatics/mcq60:
    title: "Electrostatics | Charge on C after sequential touching A then B then C is q/4 - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electrostatics MCQ: Body A charged with q, touched with neutral B then with neutral C. Charge on C after contact? Options: q, q/2, q/3, q/4. Correct: q/4. Explanation: A touches B: q/2 each. Then A (with q/2) touches C: q/4 each. So C gets q/4. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electrostatics/mcq61:
    title: "Electrostatics | Charge on sphere when 10¹⁴ electrons removed is 16 µC positive - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electrostatics MCQ: When 10¹⁴ electrons removed from neutral metal sphere, charge on sphere? Options: 16 µC, -16 µC, 32 µC, -32 µC. Correct: 16 µC. Explanation: Charge = (1.6×10⁻¹⁹)×(10¹⁴)=1.6×10⁻⁵C=16µC. Electrons removed → positively charged. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electrostatics/mcq62:
    title: "Electrostatics | Tension in pendulum with charge q in horizontal electric field E is √((mg)²+(qE)²) - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electrostatics MCQ: Bob of pendulum mass m, charge q in rest position in uniform horizontal electric field E. Tension in string? Options: mg, qE, √((mg)²+(qE)²), √((mg)²+(qE)²)/2. Correct: √((mg)²+(qE)²). Explanation: Bob experiences weight mg downward and electric force qE horizontally. Tension is vector sum: T = √((mg)²+(qE)²). More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electrostatics/mcq63:
    title: "Electrostatics | Force on positive charge at center of square with equal charges at corners is zero - symmetry - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electrostatics MCQ: Four charges at corners of square. Force on positive charge at center? Options: zero, along diagonal AC, along diagonal BD, perpendicular to side AB. Correct: zero. Explanation: If four charges equal and symmetric, net electric field at center is zero due to symmetry. Forces from opposite corners cancel. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electrostatics/mcq64:
    title: "Electrostatics | For charges +Q,-Q,+Q,-Q at square corners - E≠0, V=0 at center - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electrostatics MCQ: Four charges +Q,-Q,+Q,-Q at corners of square taken in order. At center? Options: E=0,V≠0; E≠0,V=0; E≠0,V≠0; E=0,V=0. Correct: E≠0, V=0. Explanation: Electric fields from opposite charges are in same direction → net field non-zero. Potential scalar sums to zero because positive and negative cancel. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electrostatics/mcq65:
    title: "Electrostatics | Coulomb's law is applied in electrostatics - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electrostatics MCQ: Coulomb's law is usually applied in area of? Options: electromagnetism, electrostatics, magnetism, gravitation. Correct: electrostatics. Explanation: Coulomb's law describes electrostatic force between stationary charges. It is fundamental law of electrostatics. More entry test MCQs at NotesPrep."

https://notesprep.com/entry-tests/mcqs/electrostatics/mcq66:
    title: "Electrostatics | Kinetic energy of +2e ion accelerated through 4N/C field over 8cm is 64eV - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electrostatics MCQ: Two parallel plates 8.00cm apart, uniform field 4.00 N/C. Ion of charge +2e released at left plate. KE when it reaches right plate? Options: 4 eV, 64 eV, 32 eV, 16 eV. Correct: 64 eV. Explanation: KE = qV, V=Ed=4×8=32V, KE=(2e)(32)=64eV. More entry test MCQs at NotesPrep."
https://notesprep.com/entry-tests/mcqs/electrostatics/mcq67:
    title: "Electrostatics | Kinetic energy of +2e ion accelerated through 4 N/C field over 8 cm is 64 eV - Entry Test MCQs Explanation | NotesPrep"
    description: "Practice electrostatics MCQ: Two parallel metal plates 8.00 cm apart, uniform electric field 4.00 N/C directed right. Ion of charge +2e released at rest at left plate. Kinetic energy when it reaches right plate? Options: 4 eV, 64 eV, 32 eV, 16 eV. Correct: 64 eV. Explanation: KE = qV, where V = Ed. If distance interpreted as 8 m, V = 4×8 = 32 V, KE = (2e)(32) = 64 eV. More entry test MCQs at NotesPrep."
    
    
    
    
